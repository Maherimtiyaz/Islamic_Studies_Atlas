rt essay showing how al-Shāṭibī's inductive method turns them into a certain principle."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"usul"},{"id":"qawaid","title":"Legal maxims (al-qawāʿid al-fiqhiyyah)","short":"Legal maxims","level":"Advanced","why":"Maxims compress hundreds of rulings into short principles, so they help you see the coherence of fiqh and reason about new cases.","mins":1200,"pre":["maqasid","madhhab"],"ideas":["The five major maxims are: matters are judged by their purposes; certainty is not removed by doubt; hardship brings ease; harm is to be removed; and custom is authoritative. Most others branch from these.","A legal maxim (qāʿidah fiqhiyyah) spans many chapters of fiqh; a ḍābiṭ governs one chapter only; an uṣūl rule concerns how evidence is read. Mixing these levels leads to errors.","Maxims are mostly general rules with exceptions (aghlabiyyah), not absolute laws. For this reason many jurists would not issue a ruling from a maxim alone without a supporting text or school precedent.","Key works include al-Karkhī's Uṣūl, al-Qarāfī's al-Furūq, Ibn Rajab's Taqrīr al-Qawāʿid (Ḥanbalī), and al-Ashbāh wa al-Naẓāʾir by al-Suyūṭī (Shāfiʿī) and Ibn Nujaym (Ḥanafī). The Ottoman Mecelle (1869–1876) opens with ninety-nine maxims."],"callout":["Method","Memorise the five major maxims in Arabic, then collect three rulings from your madhhab manual under each and note one exception."],"lectures":[{"t":"The Coherence of Sharia: Legal Maxims (playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqSVx7VjquRMwMM_jZ9nsDcD","by":"Hatem al-Haj"},{"t":"C4-1: Islamic Legal Maxims (al-Qawāʿid al-Fiqhiyyah)","u":"https://www.youtube.com/watch?v=6vJd_hd1dME","by":"IIIT Online Classes"}],"papers":[{"t":"The Mejelle: English translation of the Majallat al-Aḥkām al-ʿAdliyyah (library loan)","u":"https://archive.org/details/mejellebeingengl0000turk","by":"Ottoman jurists (tr. C. R. Tyser et al.)"},{"t":"al-Ashbāh wa al-Naẓāʾir (Arabic, University of Toronto copy)","u":"https://archive.org/details/ashbahwanazairli00unse","by":"Ibn Nujaym al-Ḥanafī"}],"reads":[{"t":"The Golden Collection of the Law's Maxims","u":"https://islamiclaw.blog/2018/10/02/the-golden-collection-of-the-laws-maxims/","by":"Mariam Sheibani / Islamic Law Blog, Harvard Law School"},{"t":"Principles of Islamic Jurisprudence, chapter on legal maxims (library loan)","u":"https://archive.org/details/principlesofisla0000kama","by":"Mohammad Hashim Kamali"}],"projects":[{"n":"Maxim notebook","l":"Intermediate","d":"Build a notebook page for each major maxim: Arabic text, translation, proof-texts, three branch rulings and one exception."},{"n":"Mecelle reading","l":"Advanced","d":"Read Mecelle articles 2 to 100 and group them under the five major maxims, noting any that fit none."}],"repos":[{"r":"al-Maktaba al-Shamela","u":"https://shamela.ws/","d":"Search Arabic maxims works such as Ibn Rajab's Qawāʿid and al-Suyūṭī's Ashbāh."}],"section":"usul"},{"id":"fatwa","title":"Fatwa, changing rulings and necessity","short":"Fatwa & necessity","level":"Advanced","why":"Knowing how a fatwa differs from a court ruling, and when rulings may change, protects you from both rigidity and careless permissiveness.","mins":1200,"pre":["qawaid","taqlid","maqasid"],"ideas":["A fatwa is a non-binding answer by a qualified muftī to a question; a judge's ruling (qaḍāʾ) binds the parties. Al-Qarāfī's al-Iḥkām is the classic Mālikī treatment of this distinction.","Ibn al-Qayyim in Iʿlām al-Muwaqqiʿīn has a chapter on the change of fatwas with time, place, circumstance, intention and custom. What changes is the application of fixed principles to new facts, not the texts or settled obligations.","Necessity rules include: necessities make prohibited things permissible; necessity is measured by its extent; and a general need can be treated like a necessity. Jurists set conditions so these are not stretched to everyday preference.","Al-Qarāfī taught that rulings based on custom change when the custom changes, and that applying an old custom to a new society is an error. A muftī must therefore know both the law and the questioner's situation."],"callout":["Pitfall","A fatwa answers one questioner in one setting. Do not apply an online fatwa to your case without checking that the facts and context match."],"lectures":[{"t":"How are Fatwas Misunderstood?","u":"https://www.youtube.com/watch?v=_0Van4ISFFI","by":"Sherman Jackson / Bayan Graduate School"},{"t":"What is Sharia? Part 1 of 3: The Ethical Structure","u":"https://www.youtube.com/watch?v=EGAxA7qqsSM","by":"Wael Hallaq / College of Islamic Studies, HBKU"}],"papers":[{"t":"Iʿlām al-Muwaqqiʿīn ʿan Rabb al-ʿĀlamīn (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%A5%D8%B9%D9%84%D8%A7%D9%85_%D8%A7%D9%84%D9%85%D9%88%D9%82%D8%B9%D9%8A%D9%86_%D8%B9%D9%86_%D8%B1%D8%A8_%D8%A7%D9%84%D8%B9%D8%A7%D9%84%D9%85%D9%8A%D9%86","by":"Ibn Qayyim al-Jawziyyah"},{"t":"The Mejelle, articles 17–33 on hardship and necessity (library loan)","u":"https://archive.org/details/mejellebeingengl0000turk","by":"Ottoman jurists (tr. C. R. Tyser et al.)"}],"reads":[{"t":"Islamic Legal Interpretation: Muftis and Their Fatwas (library loan)","u":"https://archive.org/details/islamiclegalinte0000unse","by":"Muhammad Khalid Masud, Brinkley Messick & David Powers (eds.)"},{"t":"Fatwa","u":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/fatwa","by":"Encyclopedia.com"}],"projects":[{"n":"Fatwa anatomy","l":"Intermediate","d":"Take three fatwas from established sites and mark the question, the facts assumed, the evidence, the maxim used and the limits stated."},{"n":"Necessity case study","l":"Advanced","d":"Write 700 words on one modern necessity case (for example, a medicine with a prohibited ingredient), applying the necessity maxims and their conditions."}],"repos":[{"r":"IslamQA.org","u":"https://islamqa.org/","d":"Collected fatwas from recognised muftīs by madhhab, for the anatomy exercise."}],"section":"usul"}]},{"id":"y2fiqh","title":"Applied fiqh","level":"Intermediate","intro":"This chapter applies what you learned about the madhhabs and legal theory to the main chapters of substantive law. Each topic reads a classical manual alongside a comparative work and one modern study.","phase":12,"optional":false,"topics":[{"id":"f_ibadat","title":"Worship in depth: zakāh, fasting and ḥajj","short":"Zakāh, fast, ḥajj","section":"fiqh","level":"Intermediate","why":"These three pillars carry the most detailed rulings in the books of worship, and studying them in depth shows how the schools reason from the same texts to different practical results.","mins":900,"pre":["b_pillars","madhhab"],"ideas":["Zakāh is due on wealth that reaches a minimum (niṣāb). Wealth such as cash and trade goods must be held for a lunar year (ḥawl); crops are due at harvest. On gold, silver, cash and trade goods the rate is one-fortieth (2.5%); crops pay a tenth or a twentieth depending on irrigation, and livestock follow fixed tables. The eight categories of recipients are named in Qurʾān 9:60.","The schools differ on several practical questions in zakāh: the Ḥanafīs require zakāh on women's gold jewellery while the majority exempt jewellery worn in normal use, and they also differ on whether zakāh is owed on the wealth of minors. Knowing the evidence on both sides is the point of studying these cases.","A fast is an abstention from food, drink and intercourse from true dawn to sunset with an intention. The Ḥanafīs allow the intention for a Ramaḍān fast to be made during the day, before the midpoint of the legal day (al-ḍaḥwah al-kubrā, halfway between true dawn and sunset), while the other schools require it from the night. Expiation (kaffārah) for deliberately breaking a Ramaḍān fast is agreed for intercourse; the Ḥanafīs and Mālikīs also extend it to deliberate eating and drinking.","Ḥajj distinguishes pillars (arkān), without which it is invalid, from obligations (wājibāt), whose omission is made up with an animal sacrifice (dam). Standing at ʿArafah and the ṭawāf al-ifāḍah are pillars in all four schools; the majority add iḥrām and saʿy, which the Ḥanafīs class as a condition and an obligation (wājib) respectively. A pilgrim chooses one of three modes: ifrād (ḥajj alone), qirān (ḥajj and ʿumrah in one iḥrām) or tamattuʿ (ʿumrah, then a separate iḥrām for ḥajj)."],"callout":["Method","Study each act of worship twice: first through one school's manual, then through Ibn Rushd's Bidāyat al-Mujtahid, where each disagreement is traced to its cause. Note the cause in a margin column."],"lectures":[{"t":"Fiqh of Zakat (Ibn Qudāmah's ʿUmdat al-Fiqh, playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqThNkVmPsyeoWw4cuJ3t6G7","by":"Hatem al-Haj"},{"t":"FQW43 Fiqh of Worship: Book of Fasting","u":"https://www.youtube.com/watch?v=k5RqZoMgz-I","by":"Hatem al-Haj"},{"t":"The Fiqh of Hajj and Practical Advice for Hajj, part 1 of 9","u":"https://www.youtube.com/watch?v=TD9FHmBCz5k","by":"Yasir Qadhi / Memphis Islamic Center"}],"papers":[{"t":"ʿUmdat al-Fiqh (Arabic)","u":"https://shamela.ws/book/11315","by":"Ibn Qudāmah al-Maqdisī, al-Maktabah al-Shāmilah"},{"t":"Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid (Arabic, by chapter)","u":"https://ar.wikisource.org/wiki/%D8%AA%D8%B5%D9%86%D9%8A%D9%81%3A%D8%A8%D8%AF%D8%A7%D9%8A%D8%A9_%D8%A7%D9%84%D9%85%D8%AC%D8%AA%D9%87%D8%AF_%D9%88%D9%86%D9%87%D8%A7%D9%8A%D8%A9_%D8%A7%D9%84%D9%85%D9%82%D8%AA%D8%B5%D8%AF","by":"Ibn Rushd al-Ḥafīd (Arabic Wikisource; English: Nyazee, The Distinguished Jurist's Primer, Garnet, print)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Zakāh","u":"https://sunnah.com/bukhari/24","by":"al-Bukhārī (sunnah.com)"},{"t":"Qurʾān 9:60 with Tafsīr Ibn Kathīr (the eight recipients of zakāh)","u":"https://quran.com/9:60/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"}],"reads":[{"t":"Fiqh al-Zakah, vol. 1: A Comparative Study of Zakah (free PDF)","u":"http://monzer.kahf.com/books/english/fiqhalzakah_vol1.pdf","by":"Yusuf al-Qaradawi (tr. Monzer Kahf), King Abdulaziz University"},{"t":"Ten Good Manners for Hajj (from al-Ghazālī's Iḥyāʾ)","u":"https://www.masud.co.uk/ISLAM/ahm/AHM-Ghazali_on_haj.htm","by":"Abdal Hakim Murad"}],"projects":[{"n":"Zakāh worksheet","l":"Intermediate","d":"Build a one-page zakāh calculation for a sample household with cash, gold jewellery, shares and a business inventory. Show the niṣāb test and the rate, and note where the Ḥanafī and Shāfiʿī answers differ."},{"n":"Ḥajj rites table","l":"Beginner","d":"Make a table of every rite of ḥajj, marking each as pillar, obligation or sunnah in two schools, with the consequence of omitting it."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth chapters cited here in Arabic and English, with grading notes."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Search the Arabic texts of the classical fiqh works cited here."}]},{"id":"f_muamalat","title":"Transactions and Islamic finance","short":"Transactions","section":"fiqh","level":"Intermediate","why":"The law of sale, ribā and partnership governs everyday commerce, and modern Islamic finance is an attempt to rebuild banking on these classical contracts.","mins":900,"pre":["madhhab","qawaid"],"ideas":["The default rule in transactions is permissibility: a contract is valid unless it contains a prohibited element. The main prohibited elements are ribā (unjustified increase), gharar (excessive uncertainty about the object or price) and gambling (maysir), together with the sale of things that are themselves unlawful.","Ribā has two forms. Ribā al-nasīʾah is increase charged for deferment, which covers interest on loans. Ribā al-faḍl is unequal exchange of the same kind among the six items named in the ḥadīth of ʿUbādah ibn al-Ṣāmit (gold, silver, wheat, barley, dates and salt), which must be exchanged like for like and hand to hand.","The schools extend the six items by analogy using different effective causes. Ḥanafīs (and the main Ḥanbalī report): measure by volume or weight together with same genus. Shāfiʿīs: monetary value (thamaniyyah) for gold and silver, edibility for the foods. Mālikīs: monetary value for gold and silver, being a storable staple (iqtiyāt and iddikhār) for the foods. This explains why they disagree about later items such as paper money.","Islamic banks use classical contracts: murābaḥah (cost-plus sale), ijārah (lease), mushārakah and muḍārabah (partnerships sharing profit and loss) and sukūk (certificates of ownership in assets). Critics such as Mahmoud El-Gamal argue that much of the industry reproduces conventional products in legal form ('Sharīʿah arbitrage'), and Taqi Usmani stated in 2007 that most sukūk then issued did not meet Sharīʿah requirements."],"callout":["Pitfall","Do not judge a product by its Arabic name. Read the actual contract chain and ask who owns the asset, who bears the risk, and when ownership passes."],"lectures":[{"t":"Fiqh of Transactions (Ibn Qudāmah's ʿUmdat al-Fiqh, playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqTS0dYgVeoslet3Bb-JxDk-","by":"Hatem al-Haj"},{"t":"Islamic Finance","u":"https://www.youtube.com/watch?v=ZKCCWh6DZzg","by":"Muhammad Taqi Usmani (DarulIftaaUK)"},{"t":"Mahmoud El-Gamal at the LARIBA Symposium 2001","u":"https://www.youtube.com/watch?v=hKUPWerktUQ","by":"Mahmoud El-Gamal / American Finance House LARIBA"}],"papers":[{"t":"Ṣaḥīḥ Muslim 1587: gold for gold, silver for silver (the six items of ribā)","u":"https://sunnah.com/muslim:1587","by":"Muslim (sunnah.com)"},{"t":"Qurʾān 2:275 with Tafsīr Ibn Kathīr (Allah has permitted trade and forbidden ribā)","u":"https://quran.com/2:275/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"The Mejelle: English translation of the Majallat al-Aḥkām al-ʿAdliyyah (library loan)","u":"https://archive.org/details/mejellebeingengl0000turk","by":"Ottoman jurists (tr. C. R. Tyser et al.)"},{"t":"Bidāyat al-Mujtahid, Book of Sales (Arabic, by chapter)","u":"https://ar.wikisource.org/wiki/%D8%AA%D8%B5%D9%86%D9%8A%D9%81%3A%D8%A8%D8%AF%D8%A7%D9%8A%D8%A9_%D8%A7%D9%84%D9%85%D8%AC%D8%AA%D9%87%D8%AF_%D9%88%D9%86%D9%87%D8%A7%D9%8A%D8%A9_%D8%A7%D9%84%D9%85%D9%82%D8%AA%D8%B5%D8%AF","by":"Ibn Rushd al-Ḥafīd (Arabic Wikisource)"}],"reads":[{"t":"A Basic Guide to Contemporary Islamic Banking and Finance (free PDF)","u":"https://www.ruf.rice.edu/~elgamal/files/primer.pdf","by":"Mahmoud A. El-Gamal, Rice University"},{"t":"Islamic Finance: Law, Economics, and Practice (library loan)","u":"https://archive.org/details/islamicfinancela0000elga","by":"Mahmoud A. El-Gamal"},{"t":"AAOIFI Issued Standards (Sharīʿah Standards, free online access)","u":"https://aaoifi.com/issued-standards-2/?lang=en","by":"AAOIFI"}],"projects":[{"n":"Contract map","l":"Intermediate","d":"Take one Islamic home-finance product and draw its contract chain step by step. Mark where ownership and risk sit at each step and compare it with the relevant AAOIFI standard."},{"n":"Ribā cases","l":"Beginner","d":"Write ten short exchange scenarios (gold for gold on credit, dates for dates unequally, currency exchange, and so on) and solve each under the Ḥanafī, Shāfiʿī and Mālikī effective causes."}],"repos":[{"r":"AAOIFI Sharīʿah Standards","u":"https://aaoifi.com/issued-standards-2/?lang=en","d":"Read the industry's standards on murābaḥah, ijārah, sukūk and other contracts."},{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth chapters cited here in Arabic and English, with grading notes."}]},{"id":"f_family","title":"Family law: marriage, divorce and custody","short":"Family law","section":"fiqh","level":"Intermediate","why":"Family law is the part of the Sharīʿah most widely applied by Muslims and courts today, so it needs to be understood accurately from the classical sources and the modern codes.","mins":840,"pre":["madhhab"],"ideas":["A valid marriage requires offer and acceptance between eligible parties. The majority also require witnesses at the contract, while the Mālikīs require publicity and witnessing before consummation. A dower (mahr) is owed to the wife by the contract itself: if none is named, the customary dower (mahr al-mithl) is due (Q 2:236), though the Mālikīs invalidate a contract that expressly excludes mahr. The majority require the bride's guardian (walī) to conclude the contract, while the Ḥanafīs allow an adult woman to contract her own marriage, with her guardian able to object if the match is not suitable (kafāʾah).","Ṭalāq is the husband's unilateral repudiation. A first or second ṭalāq is revocable during the waiting period (ʿiddah), and a third makes the divorce final. Khulʿ is a divorce initiated by the wife in return for compensation, and judicial separation (tafrīq) lets a judge dissolve the marriage for causes such as harm or non-support; the Mālikīs recognise the widest grounds.","Classical law separates custody (ḥaḍānah), the daily care of a young child, from guardianship (wilāyah) over the child's person and property. The mother has first right to custody of young children, while guardianship stays with the father; the schools differ on the age at which custody ends and whether the child chooses.","Modern Muslim states codified family law, often choosing rules from several schools (takhayyur). The Ottoman Law of Family Rights of 1917 adopted non-Ḥanafī rules to widen women's access to divorce, and many later codes followed this method. Historians such as Judith Tucker and Kecia Ali study how these rules worked in practice."],"callout":["Method","Keep three columns as you read: the classical rule, the evidence and school, and how one modern code (for example, Morocco's 2004 Mudawwana or Egypt's laws) treats it."],"lectures":[{"t":"Fiqh of Family (Ibn Qudāmah's ʿUmdat al-Fiqh, playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqRK2uKergkRt_9hV2S-d1Y2","by":"Hatem al-Haj"},{"t":"How to Understand the Fiqh of Divorce, Specially the Ruling on Three Divorces?","u":"https://www.youtube.com/watch?v=du17EIM7_Ug","by":"Irshaad Sedick / SeekersGuidance"},{"t":"Sexual Ethics and Islam with Kecia Ali (interview)","u":"https://www.youtube.com/watch?v=8uaxZhBpnSA","by":"Kecia Ali / Religious Studies Project"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Marriage (al-Nikāḥ)","u":"https://sunnah.com/bukhari/67","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Divorce (al-Ṭalāq)","u":"https://sunnah.com/bukhari/68","by":"al-Bukhārī (sunnah.com)"},{"t":"Qurʾān 2:229 with Tafsīr Ibn Kathīr (divorce is twice; the basis of khulʿ)","u":"https://quran.com/2:229/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Kitāb al-Umm (Arabic)","u":"https://ar.wikisource.org/wiki/%D9%83%D8%AA%D8%A7%D8%A8_%D8%A7%D9%84%D8%A3%D9%85","by":"al-Shāfiʿī (Arabic Wikisource)"}],"reads":[{"t":"Women in Islamic Law: Examining Five Prevalent Myths","u":"https://yaqeeninstitute.org/read/paper/women-in-islamic-law-examining-five-prevalent-myths","by":"Nazir Khan et al., Yaqeen Institute"},{"t":"Marriage and Gender Roles in Islam: Beyond Rights and Duties","u":"https://yaqeeninstitute.org/read/paper/marriage-and-gender-roles-in-islam-beyond-rights-and-duties","by":"Tesneem Alkiek, Yaqeen Institute"},{"t":"An Introduction to Islamic Law, chapters on family law and modern codes (library loan)","u":"https://archive.org/details/introductiontois0000hall","by":"Wael B. Hallaq"}],"projects":[{"n":"Divorce flowchart","l":"Intermediate","d":"Draw a flowchart of the ways a marriage ends (revocable and final ṭalāq, khulʿ, judicial separation, death) with the waiting period and financial consequences of each."},{"n":"Code comparison","l":"Advanced","d":"Pick one issue, such as the walī or the age at which custody ends, and write 800 words comparing the four schools with one modern family code."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth chapters cited here in Arabic and English, with grading notes."},{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."}]},{"id":"f_faraid","title":"Inheritance (ʿilm al-farāʾiḍ)","short":"Inheritance","section":"fiqh","level":"Intermediate","why":"Inheritance is the most precisely specified area of Qurʾānic law, and it is a practical science: every estate has to be calculated and divided correctly.","mins":780,"pre":["madhhab"],"ideas":["Before division, the estate pays in order: funeral expenses, debts, and bequests (waṣiyyah) up to one-third. A bequest to an heir, or above one-third, needs the consent of the other heirs. What remains passes to the heirs by fixed rules.","Heirs fall into two main groups. Sharers (aṣḥāb al-furūḍ) receive one of six fixed fractions named in Qurʾān 4:11, 4:12 and 4:176: one-half, one-quarter, one-eighth, two-thirds, one-third and one-sixth. Residuaries (ʿaṣabah), mainly male agnates, take what is left.","Some heirs exclude others entirely or reduce their share (ḥajb): a son excludes brothers, and the presence of children reduces a spouse's share. Three impediments prevent inheritance altogether: killing the deceased, difference of religion, and slavery.","When fixed shares add up to more than the estate, every share is reduced proportionally (ʿawl), a solution attributed to ʿUmar. When they add up to less and there is no residuary, the surplus is returned to the sharers other than the spouses (radd) in the Ḥanafī and Ḥanbalī schools; early Mālikīs and Shāfiʿīs gave it to the public treasury."],"callout":["Method","Learn by calculating. After each rule, solve three estates by hand using the lowest common denominator, then check every answer with a second method or a teacher."],"lectures":[{"t":"Fiqh of Inheritance (Ibn Qudāmah's ʿUmdat al-Fiqh, playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqSrfgqfEuRpMtieee7jln37","by":"Hatem al-Haj"},{"t":"Mawārīth: Introduction to Islamic Inheritance (AMJA 2021)","u":"https://www.youtube.com/watch?v=ofM6UmsGtxg","by":"Hatem al-Haj & Yaser Ali"},{"t":"Why Do Sons Inherit More Than Daughters?","u":"https://www.youtube.com/watch?v=5WM5mkv0pdc","by":"Tesneem Alkiek / Yaqeen Institute"}],"papers":[{"t":"Qurʾān 4:11 with Tafsīr Ibn Kathīr (the shares of children and parents)","u":"https://quran.com/4:11/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Laws of Inheritance (al-Farāʾiḍ)","u":"https://sunnah.com/bukhari/85","by":"al-Bukhārī (sunnah.com)"},{"t":"Al-Sirājiyyah, or the Mohammedan Law of Inheritance, with a Commentary (1792)","u":"https://archive.org/details/alsirjiyyahormo00jonegoog","by":"Sirāj al-Dīn al-Sajāwandī (tr. William Jones)"}],"reads":[{"t":"Studies in Qurʾan and Ḥadīth: The Formation of the Islamic Law of Inheritance (library loan)","u":"https://archive.org/details/studiesinquranad0000powe","by":"David S. Powers"},{"t":"An Introduction to Islamic Law, chapter on succession (library loan)","u":"https://archive.org/details/introductiontois0000hall","by":"Wael B. Hallaq"}],"projects":[{"n":"Ten estates","l":"Intermediate","d":"Solve ten estates by hand, including one ʿawl case, one radd case and the two ʿUmariyyah cases (a spouse with both parents). Show the base number and each heir's fraction."},{"n":"Rules sheet","l":"Beginner","d":"Write a two-page reference sheet listing every sharer, their possible shares and the conditions that change them, with the Qurʾānic verse for each."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."},{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth chapters cited here in Arabic and English, with grading notes."}]},{"id":"f_siyasa","title":"Governance, the judiciary and criminal law (al-siyāsah al-sharʿiyyah)","short":"Governance & law","section":"fiqh","level":"Advanced","why":"Classical jurists wrote at length on the caliphate, judges and penalties, and these texts are often cited today without being read, so careful study prevents serious misunderstanding.","mins":960,"pre":["madhhab","maqasid"],"ideas":["Al-Māwardī's al-Aḥkām al-Sulṭāniyyah (5th/11th century) set out the conditions of the imām (justice, knowledge sufficient for ijtihād, sound judgement and others), the ways he is appointed (selection by 'those who loosen and bind' or designation by his predecessor), and the offices beneath him such as ministers, governors and judges.","Al-siyāsah al-sharʿiyyah is governance by the ruler within the limits of the Sharīʿah for the public good (maṣlaḥah). Ibn Taymiyyah's treatise of that name builds it on Qurʾān 4:58: entrusting offices to those most fit for them and judging with justice. Ibn al-Qayyim extended the idea to the judge's use of evidence.","Criminal law has three parts. Ḥudūd are fixed penalties for a few offences; qiṣāṣ is retaliation for homicide and injury, which the victim's family may waive for blood-money (diyah) or pardon; and taʿzīr is discretionary punishment for all other offences. Ḥudūd are averted by doubt (shubhah), and the standards of proof are very strict.","Modern scholars debate how this tradition relates to the modern state. Wael Hallaq argues in The Impossible State that the modern nation-state cannot house the Sharīʿah, while Ovamir Anjum and others reconstruct classical political ideas for the present. Reading the classical texts first is the basis for judging these arguments."],"callout":["Pitfall","Do not read a single penalty in isolation. For any ḥadd, list the conditions of liability, the evidence required and the doubts that avert it before discussing the penalty itself."],"lectures":[{"t":"Fiqh of the Judiciary and Testimonies (Ibn Qudāmah's ʿUmdat al-Fiqh, playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqQki_RH1Hr8A1kMbzD4Bt20","by":"Hatem al-Haj"},{"t":"The \"Political\" in Islamic Tradition (Aafaq Academic Conclave)","u":"https://www.youtube.com/watch?v=DaaLobwIDzc","by":"Ovamir Anjum / SIO Al Jamia"},{"t":"Modernist Islamic Political Thought (Nathanson Centre Seminar, 2012)","u":"https://www.youtube.com/watch?v=uvC44NgVK-Q","by":"Mohammad Fadel / Nathanson Centre, York University"}],"papers":[{"t":"al-Aḥkām al-Sulṭāniyyah (Arabic)","u":"https://shamela.ws/book/22881","by":"al-Māwardī, al-Maktabah al-Shāmilah"},{"t":"The Ordinances of Government (print)","u":"https://garnetpublishing.co.uk/product/the-ordinances-of-government-al-ahkam-as-sultaniyyah-wat-wilayat-al-dinniyya","by":"al-Māwardī (tr. Wafaa H. Wahba), Garnet"},{"t":"al-Siyāsah al-Sharʿiyyah fī Iṣlāḥ al-Rāʿī wa al-Raʿiyyah (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9_%D8%A7%D9%84%D8%B4%D8%B1%D8%B9%D9%8A%D8%A9_%D9%81%D9%8A_%D8%A5%D8%B5%D9%84%D8%A7%D8%AD_%D8%A7%D9%84%D8%B1%D8%A7%D8%B9%D9%8A_%D9%88%D8%A7%D9%84%D8%B1%D8%B9%D9%8A%D8%A9","by":"Ibn Taymiyyah (Arabic Wikisource)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Judgments (al-Aḥkām)","u":"https://sunnah.com/bukhari/93","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"Stoning and Hand Cutting: Understanding the Hudud and the Shariah in Islam","u":"https://yaqeeninstitute.org/read/paper/stoning-and-hand-cutting-understanding-the-hudud-and-the-shariah-in-islam","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"Who Wants the Caliphate?","u":"https://yaqeeninstitute.org/read/paper/who-wants-the-caliphate","by":"Ovamir Anjum, Yaqeen Institute"},{"t":"The Impossible State: Islam, Politics, and Modernity's Moral Predicament (print)","u":"https://cup.columbia.edu/book/the-impossible-state/9780231162562","by":"Wael B. Hallaq, Columbia University Press"}],"projects":[{"n":"Offices chart","l":"Intermediate","d":"From al-Māwardī, draw an organisational chart of the offices of state with the qualifications and powers he gives for each, citing the chapter."},{"n":"Ḥadd case study","l":"Advanced","d":"Choose one ḥadd offence and write 1,000 words on its conditions, evidentiary standard and averting doubts, using Ibn Qudāmah and one modern study."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Search the Arabic texts of the classical fiqh works cited here."},{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth chapters cited here in Arabic and English, with grading notes."}]},{"id":"f_siyar","title":"Fiqh of war and peace (siyar): jihad, treaties and its misuse","short":"Siyar: war & peace","level":"Intermediate","section":"fiqh","why":"The law of war and peace is one of the most misrepresented areas of Islamic law, so a student needs its classical rules and the scholarly response to their misuse.","mins":1800,"pre":["f_siyasa","aq_iman_kufr","maqasid"],"ideas":["Siyar is the chapter of fiqh on relations with non-Muslim states in war and peace. Its founding text is the Siyar of Muḥammad ibn al-Ḥasan al-Shaybānī (d. 189 AH), student of Abū Ḥanīfah, translated by Majid Khadduri as The Islamic Law of Nations. The word jihad means striving; in fiqh the chapter of jihad concerns armed conflict, while the wider moral sense of striving against the self is treated in ethics and tazkiyah.","In all four madhhabs, armed jihad is normally a collective duty (farḍ kifāyah), and the decision to wage war, make peace and command armies belongs to the legitimate ruler (imām), not to individuals or private groups. It becomes an individual duty for those directly attacked. Jurists set conditions such as capacity, permission of parents for a collective duty, and a just cause, and discussed whether the cause of fighting is aggression (the view of most Ḥanafīs, Mālikīs and Ḥanbalīs) or unbelief (the view associated with al-Shāfiʿī).","Non-combatants are protected. The Prophet ﷺ forbade killing women and children (al-Bukhārī 3015), and Abū Bakr instructed his commanders not to kill the elderly, monks or children, nor to cut down fruit trees or destroy buildings. Any adult Muslim may grant safe conduct (amān) to an enemy person, and treaties (ṣulḥ, hudnah, ʿahd) must be honoured; the Treaty of al-Ḥudaybiyah is the model, and jurists differed on whether a truce may exceed ten years.","Mainstream scholarship has rejected extremist readings of these rules. The 2010 Mardin conference reviewed Ibn Taymiyyah's fatwa on Mardin, noted that his 'composite abode' was neither dār al-islām nor dār al-ḥarb, and stated it cannot justify takfīr or killing. The 2014 Open Letter to al-Baghdadi, signed by over 120 scholars, set out 24 points against ISIS, including the ban on killing emissaries, aid workers and non-combatants. Muhammad Tahir-ul-Qadri's 2010 Fatwa on Terrorism and Suicide Bombings and Shaykh Abdullah bin Bayyah's work make the same case at length, often comparing such groups to the Khawārij."],"callout":["Pitfall","Do not read a single verse or a medieval fatwa apart from the legal system around it. The classical rules are tied to a ruler's authority, treaties and protections for non-combatants, and extremist groups typically cut verses and fatwas away from these conditions."],"lectures":[{"t":"The Islamic Laws of War","u":"https://www.youtube.com/watch?v=zpaTvrAptqQ","by":"Ahmed Al-Dawoody (Research Society of International Law)"},{"t":"Islamic Law and International Humanitarian Law","u":"https://www.youtube.com/watch?v=3kuAG7lU-as","by":"International Committee of the Red Cross (ICRC)"},{"t":"Countering Violent Extremism","u":"https://www.youtube.com/watch?v=OXyLca22x1o","by":"Abdullah bin Bayyah with Hamza Yusuf"}],"papers":[{"t":"The Islamic Law of Nations: Shaybānī's Siyar (library loan)","u":"https://archive.org/details/islamiclawofnati00shay","by":"Muḥammad ibn al-Ḥasan al-Shaybānī (tr. Majid Khadduri, Johns Hopkins Press, 1966)"},{"t":"Ṣaḥīḥ al-Bukhārī 3015: the prohibition of killing women and children","u":"https://sunnah.com/bukhari:3015","by":"al-Bukhārī (sunnah.com)"},{"t":"Open Letter to Dr. Ibrahim Awwad al-Badri ('Abu Bakr al-Baghdadi'), English, 2014 (PDF mirror)","u":"https://web.archive.org/web/20260720181752/http://www.lettertobaghdadi.com/14/english-v14.pdf","by":"Over 120 Muslim scholars (archived original, lettertobaghdadi.com)"},{"t":"Fatwa on Terrorism and Suicide Bombings (print)","u":"https://www.minhajbooks.com/english/book/376/Fatwa-on-Terrorism-and-Suicide-Bombings/","by":"Muhammad Tahir-ul-Qadri, Minhaj-ul-Quran Publications"}],"reads":[{"t":"Islamic law and international humanitarian law: An introduction to the main principles","u":"https://doi.org/10.1017/s1816383118000310","by":"Ahmed Al-Dawoody, International Review of the Red Cross 99 (2017)"},{"t":"The Mardin Declaration (2010)","u":"https://www.alhabibali.com/?p=1250","by":"Mardin Peace Summit conference (text hosted by Habib Ali al-Jifri's site)"},{"t":"Strategy of Tolerance in Face of Terrorism","u":"https://islamqa.org/maliki/binbayyah/29905/strategy-of-tolerance-in-face-of-terrorism/","by":"Abdullah bin Bayyah (binbayyah.net via IslamQA.org)"}],"projects":[{"n":"Rules of conduct table","l":"Intermediate","d":"Build a table of the classical rules on who may declare war, who may not be targeted, amān and treaties, giving for each the evidence and the position of each of the four madhhabs as reported in al-Shaybānī and Al-Dawoody."},{"n":"Anatomy of a refutation","l":"Intermediate","d":"Choose five of the 24 points in the Open Letter to al-Baghdadi and, for each, write a short paragraph stating the extremist claim, the classical rule it ignores, and the texts the scholars cite."}],"repos":[]}]},{"id":"y2hadith","title":"Year 2 · Q3 Advanced ḥadīth","level":"Advanced","intro":"This quarter moves from the basic grading of ḥadīth to the work of the specialist critics: hidden defects, broken chains, apparent contradictions and fabrication. It ends with the legal use of ḥadīth and with modern academic debates about their history.","phase":13,"optional":false,"topics":[{"id":"ilal","title":"ʿIlal: hidden defects","short":"ʿIlal","level":"Advanced","why":"ʿIlal is the science of finding hidden flaws in reports that look sound, and it is where the great critics showed their real skill.","mins":1500,"pre":["hterms","isnad","collections"],"ideas":["A muʿallal ḥadīth has a chain that appears connected and made of reliable narrators, yet the critics find a hidden defect (ʿillah) that undermines it. The defect is discovered by comparison, not by looking at a single chain on its own.","The main tool is gathering every route of a report (jamʿ al-ṭuruq). ʿAlī ibn al-Madīnī is reported to have said that if the routes of a chapter are not gathered, its error does not become clear.","Typical defects include a report narrated as connected (mawṣūl) when the stronger narrators sent it as mursal, a Companion's statement raised to the Prophet ﷺ (rafʿ instead of waqf), an inserted phrase (idrāj), or names that have been swapped.","The masters of this field were Ibn al-Madīnī, Aḥmad ibn Ḥanbal, al-Bukhārī, Abū Ḥātim, Abū Zurʿah and al-Dāraquṭnī. Their verdicts survive in ʿilal books such as Ibn Abī Ḥātim's ʿIlal al-Ḥadīth, which records the judgements of his father and Abū Zurʿah, and al-Dāraquṭnī's al-ʿIlal al-Wāridah. Al-Tirmidhī's short al-ʿIlal al-Ṣaghīr received a major commentary from Ibn Rajab (d. 795/1393) that sets out the principles of the early critics."],"callout":["Method","Take one ḥadīth discussed in Ibn Abī Ḥātim's ʿIlal or al-Dāraquṭnī's al-ʿIlal and draw every chain as a tree. Seeing the divergence point on paper is the only way the idea of an ʿillah becomes concrete."],"lectures":[{"t":"Nukhbat al-Fikar: Ibn Ḥajar al-ʿAsqalānī on the science of ḥadīth (seminar)","u":"https://www.youtube.com/watch?v=EYdJJ7MtXo0","by":"Mohammad Akram Nadwi, Cambridge Islamic College"},{"t":"Sunan al-Tirmidhī: Muḥammad ibn ʿĪsā al-Tirmidhī","u":"https://www.youtube.com/watch?v=51_Au1ZFxis","by":"Cambridge Islamic College"},{"t":"Ulum al-Hadith: Nuzhat al-Nazar (class series)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQFcB1_Ly4sCYlTupsuq9Xho","by":"Dr Muhammad Mansur Ali, WISE English Academy"}],"papers":[{"t":"Sharḥ ʿIlal al-Tirmidhī (Arabic)","u":"https://shamela.ws/book/9552","by":"Ibn Rajab al-Ḥanbalī (ed. Hammām ʿAbd al-Raḥīm Saʿīd), al-Maktabah al-Shāmilah"},{"t":"ʿIlal al-Ḥadīth (Arabic)","u":"https://shamela.ws/book/1350","by":"Ibn Abī Ḥātim al-Rāzī (ed. Saʿd al-Ḥumayyid and Khālid al-Juraysī), al-Maktabah al-Shāmilah"},{"t":"al-ʿIlal al-Wāridah fī al-Aḥādīth al-Nabawiyyah (Arabic)","u":"https://shamela.ws/book/9082","by":"al-Dāraquṭnī (Dār Ṭaybah ed.), al-Maktabah al-Shāmilah"},{"t":"The Nuzhah of Ibn Ḥajar al-ʿAsqalānī: a translation and critical commentary (PhD thesis)","u":"https://etheses.bham.ac.uk/id/eprint/3405/","by":"Ibn Ḥajar al-ʿAsqalānī (trans. Ather Shahbaz Hussain, University of Birmingham)"}],"reads":[{"t":"Critical Rigor vs. Juridical Pragmatism: How Legal Theorists and Hadith Scholars Approached the Backgrowth of Isnāds in the Genre of ʿIlal al-Ḥadīth","u":"https://drjonathanbrown.com/2011/critical-rigor-vs-juridical-pragmatism-how-legal-theorists-and-hadith-scholars-approached-the-backgrowth-of-isn257ds-in-the-genre-of-ilal-al-%e1%b8%a5adith/","by":"Jonathan A.C. Brown"},{"t":"Criticism of the Proto-Hadith Canon: al-Dāraquṭnī's Adjustment of the Ṣaḥīḥayn","u":"https://drjonathanbrown.com/2011/criticism-of-the-proto-hadith-canon-al-daraqu%e1%b9%adnis-adjustment-of-the-%e1%b9%a3a%e1%b8%a5i%e1%b8%a5ayn/","by":"Jonathan A.C. Brown"},{"t":"Authenticating Hadith and the History of Hadith Criticism","u":"https://yaqeeninstitute.org/read/paper/authenticating-hadith-and-the-history-of-hadith-criticism","by":"Jonathan A.C. Brown, Yaqeen Institute"}],"projects":[{"n":"Isnād tree of a defect","l":"Advanced","d":"Choose one report discussed in Ibn Abī Ḥātim's ʿIlal or al-Dāraquṭnī's al-ʿIlal, draw all its chains as a diagram, and mark where the narrators diverge. Write one paragraph stating the ʿillah and which version the critic preferred, quoting his verdict."},{"n":"Glossary of defect types","l":"Intermediate","d":"Build a notebook table of ten defect types (e.g. irsāl, waqf, idrāj, qalb, shudhūdh) with an Arabic term, a one-line definition and one example from your reading."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read the canonical collections in Arabic and English and compare chapter placements and gradings."}],"section":"hadith"},{"id":"tadlis","title":"Tadlīs, mursal and broken chains","short":"Tadlīs & mursal","level":"Advanced","why":"Whether a chain is truly connected decides whether a report can be used at all, and tadlīs and irsāl are the most common hidden breaks.","mins":1200,"pre":["isnad","hterms"],"ideas":["Tadlīs al-isnād is when a narrator reports from a teacher he did meet something he did not hear from him, using an ambiguous word such as ʿan or qāla. Tadlīs al-taswiyah drops a weak narrator between two reliable ones, and tadlīs al-shuyūkh hides a teacher behind an unfamiliar name.","A known mudallis's report is normally accepted only where he states direct hearing (ḥaddathanā, samiʿtu). Ibn Ḥajar ranked mudallisūn in five levels, from those whose tadlīs is rare and tolerated to those whose ʿanʿanah is rejected.","A mursal is a report in which a Successor attributes words directly to the Prophet ﷺ without naming the Companion. Most ḥadīth critics treat it as weak; Mālik and Abū Ḥanīfah generally accepted it, and al-Shāfiʿī in al-Risālah accepted the mursal of senior Successors when it was supported by other evidence.","Other breaks are named by where the gap falls: muʿallaq (dropped at the compiler's end), munqaṭiʿ (one narrator missing), muʿḍal (two or more consecutive narrators missing) and mursal khafī (a contemporary who never actually met the person he narrates from)."],"callout":["Pitfall","Do not treat every ʿan in a chain as a break. ʿAnʿanah is a problem only for a known mudallis or where meeting between the two narrators is doubtful."],"lectures":[{"t":"Nukhbat al-Fikr by Ibn Ḥajar: a concise guide for beginners in ḥadīth sciences (complete)","u":"https://www.youtube.com/playlist?list=PLxXcotHiyGwVUqBEyAnvYdbVwhQfMseq8","by":"Abu Ayoub Daud Burke"},{"t":"Ulum al-Hadith: Nuzhat al-Nazar (class series)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQFcB1_Ly4sCYlTupsuq9Xho","by":"Dr Muhammad Mansur Ali, WISE English Academy"}],"papers":[{"t":"The Nuzhah of Ibn Ḥajar al-ʿAsqalānī: a translation and critical commentary (PhD thesis)","u":"https://etheses.bham.ac.uk/id/eprint/3405/","by":"Ibn Ḥajar al-ʿAsqalānī (trans. Ather Shahbaz Hussain, University of Birmingham)"},{"t":"Tahdhīb al-Tahdhīb (Arabic, Hyderabad edition)","u":"https://shamela.ws/book/3310","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"},{"t":"Sharḥ ʿIlal al-Tirmidhī (Arabic)","u":"https://shamela.ws/book/9552","by":"Ibn Rajab al-Ḥanbalī (ed. Hammām ʿAbd al-Raḥīm Saʿīd), al-Maktabah al-Shāmilah"}],"reads":[{"t":"Critical Rigor vs. Juridical Pragmatism: How Legal Theorists and Hadith Scholars Approached the Backgrowth of Isnāds in the Genre of ʿIlal al-Ḥadīth","u":"https://drjonathanbrown.com/2011/critical-rigor-vs-juridical-pragmatism-how-legal-theorists-and-hadith-scholars-approached-the-backgrowth-of-isn257ds-in-the-genre-of-ilal-al-%e1%b8%a5adith/","by":"Jonathan A.C. Brown"},{"t":"Authenticating Hadith and the History of Hadith Criticism","u":"https://yaqeeninstitute.org/read/paper/authenticating-hadith-and-the-history-of-hadith-criticism","by":"Jonathan A.C. Brown, Yaqeen Institute"}],"projects":[{"n":"Mudallis case file","l":"Advanced","d":"Pick a well-known mudallis (for example Qatādah or al-Aʿmash), read his entry in Tahdhīb al-Tahdhīb, and write a one-page note on how critics handled his ʿanʿanah, citing two of their statements."},{"n":"Broken-chain chart","l":"Intermediate","d":"Draw a single chain from compiler to the Prophet ﷺ and show, with labelled gaps, what makes it muʿallaq, munqaṭiʿ, muʿḍal and mursal. Add the ruling on each beside the diagram."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"hadith"},{"id":"mukhtalif","title":"Conflicting ḥadīth: jamʿ, tarjīḥ, naskh","short":"Mukhtalif","level":"Advanced","why":"Mukhtalif al-ḥadīth teaches how scholars handle reports that seem to contradict each other, which is central to both law and creed.","mins":1200,"pre":["sunnah","hterms","ikhtilaf"],"ideas":["Mukhtalif al-ḥadīth concerns two acceptable reports whose meanings appear to clash. Al-Shāfiʿī wrote the first work on it, Ikhtilāf al-Ḥadīth, and Ibn Qutaybah (d. 276/889) wrote Taʾwīl Mukhtalif al-Ḥadīth to answer theologians who used such clashes to reject ḥadīth.","The first step is reconciliation (jamʿ): reading each report in its own context so both are acted on. Ibn Ḥajar's classic example is \"there is no contagion\" alongside \"flee from the leper\", which scholars reconciled in several ways without discarding either.","If reconciliation fails and the dates are known, the later report abrogates the earlier (naskh). If neither works, one is preferred (tarjīḥ) by criteria such as a stronger chain or more narrators, and if no preference is possible the scholar suspends judgement (tawaqquf).","Ibn Ḥajar's order in Nuzhat al-Naẓar is jamʿ, then naskh, then tarjīḥ, then tawaqquf; many Ḥanafī jurists list naskh before tarjīḥ and jamʿ. Ibn Khuzaymah is reported to have said he knew of no two sound ḥadīths that truly contradict, and offered to reconcile any pair brought to him."],"callout":["Method","When you meet an apparent clash, first check that both reports are actually sound. Many famous \"contradictions\" disappear once one version is found to be weak."],"lectures":[{"t":"Verifying and Understanding Hadith","u":"https://www.youtube.com/watch?v=heitI0S9BCo","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"Kitāb al-Risālah fī Uṣūl al-Fiqh: Muḥammad ibn Idrīs al-Shāfiʿī","u":"https://www.youtube.com/watch?v=4BXfg9kq_Xs","by":"Cambridge Islamic College"}],"papers":[{"t":"Ikhtilāf al-Ḥadīth (Arabic)","u":"https://shamela.ws/book/1021","by":"al-Shāfiʿī, al-Maktabah al-Shāmilah"},{"t":"Taʾwīl Mukhtalif al-Ḥadīth (Arabic)","u":"https://shamela.ws/book/7292","by":"Ibn Qutaybah al-Dīnawarī, al-Maktabah al-Shāmilah"},{"t":"The Nuzhah of Ibn Ḥajar al-ʿAsqalānī: a translation and critical commentary (PhD thesis)","u":"https://etheses.bham.ac.uk/id/eprint/3405/","by":"Ibn Ḥajar al-ʿAsqalānī (trans. Ather Shahbaz Hussain, University of Birmingham)"}],"reads":[{"t":"Dealing with Apparently Problematic Hadiths","u":"https://yaqeeninstitute.org/read/paper/dealing-with-apparently-problematic-hadiths","by":"Mufti Muntasir Zaman, Yaqeen Institute"},{"t":"The Rules of Matn Criticism: There Are No Rules","u":"https://drjonathanbrown.com/2014/the-rules-of-matn-criticism-there-are-no-rules/","by":"Jonathan A.C. Brown"}],"projects":[{"n":"Five-case resolution table","l":"Advanced","d":"Collect five pairs of apparently conflicting reports from al-Shāfiʿī or Ibn Qutaybah and tabulate each: the two texts, the method used (jamʿ, naskh, tarjīḥ) and the reasoning in two sentences."},{"n":"Contagion ḥadīth essay","l":"Intermediate","d":"Write a 600-word note on \"no contagion\" and \"flee from the leper\", setting out at least three reconciliations given by classical scholars and which one you find strongest."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read the canonical collections in Arabic and English and compare chapter placements and gradings."}],"section":"hadith"},{"id":"hfiqh","title":"Ḥadīth and fiqh: Bulūgh al-Marām","short":"Bulūgh al-Marām","level":"Advanced","why":"Bulūgh al-Marām shows how the legal ḥadīth behind each chapter of fiqh are collected, graded and argued over by the schools.","mins":1800,"pre":["madhhab","sources","hterms"],"ideas":["Ibn Ḥajar al-ʿAsqalānī (d. 852/1449) compiled Bulūgh al-Marām as a compact handbook of legal ḥadīth arranged by the chapters of fiqh, from purification to transactions and penalties, ending with a section on manners. He names the source of each report and often notes its grade.","Al-Ṣanʿānī's (d. 1182/1768) Subul al-Salām, drawn from an earlier commentary by al-Maghribī, explains each ḥadīth's wording, grading and legal points and summarises the positions of the schools with their evidence.","The schools sometimes reach different rulings from the same ḥadīth. Common reasons are that a report did not reach a jurist, that it was graded differently, that it was understood differently, or that it was judged abrogated or outweighed by other evidence.","Reading Bulūgh al-Marām beside your own madhhab's manual shows how a school's ruling is tied to texts. It also guards against the mistake of thinking that a ruling which differs from one ḥadīth must have no basis."],"callout":["Method","For each ḥadīth, note three things in a fixed order: grade, the ruling drawn from it, and which schools differ and why. Keeping the same order makes later comparison easy."],"lectures":[{"t":"Bulūgh al-Marām (lesson series)","u":"https://www.youtube.com/playlist?list=PLo8-JRSO3j92z_TfuF1UwYMqrMB731DJY","by":"Muhammad Tim Humble, KALEMAH"},{"t":"Explanation of Bulūgh al-Marām","u":"https://www.youtube.com/playlist?list=PLqhOQ66VUPp3sdwBzHKW_OWF0-WZvjdld","by":"Shaykh Dr Abdur-Rahman Al-Omaisan, Masjid As-Salaamah"}],"papers":[{"t":"Bulūgh al-Marām min Adillat al-Aḥkām","u":"https://sunnah.com/bulugh","by":"Ibn Ḥajar al-ʿAsqalānī (Arabic and English on sunnah.com)"},{"t":"Subul al-Salām Sharḥ Bulūgh al-Marām (Arabic)","u":"https://shamela.ws/book/21590","by":"Muḥammad ibn Ismāʿīl al-Ṣanʿānī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Difference of Opinion: Where Do We Draw the Line?","u":"https://yaqeeninstitute.org/read/paper/difference-of-opinion-where-do-we-draw-the-line","by":"Nazir Khan, Yaqeen Institute"},{"t":"Differences over the Authenticity of a Hadith","u":"https://fiqh.islamonline.net/en/differences-over-authenticity-of-a-hadith","by":"IslamOnline Fiqh"}],"projects":[{"n":"Chapter of purification study","l":"Advanced","d":"Work through the chapter on water in Bulūgh al-Marām with Subul al-Salām. Produce a table listing each ḥadīth, its grade, the ruling and the position of your madhhab with its evidence."},{"n":"Why the schools differ","l":"Intermediate","d":"Choose one ḥadīth where the schools reach different rulings and write a one-page note classifying the cause of disagreement (authenticity, meaning, abrogation or competing evidence)."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read the canonical collections in Arabic and English and compare chapter placements and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"hadith"},{"id":"mawdu","title":"Fabricated ḥadīth (mawḍūʿāt)","short":"Fabrication","level":"Advanced","why":"Knowing why and how ḥadīth were forged, and how scholars caught them, protects the learner from spreading false words about the Prophet ﷺ.","mins":1000,"pre":["happly","isnad"],"ideas":["A mawḍūʿ ḥadīth is a report invented and falsely attributed to the Prophet ﷺ. The mutawātir warning \"whoever lies about me deliberately, let him take his seat in the Fire\" is why scholars forbade narrating a known fabrication except to expose it.","Motives for forgery included sectarian and political partisanship, heretics seeking to corrupt the religion, storytellers chasing an audience, and misguided pious people inventing reports to encourage good deeds, such as the forged ḥadīth on the virtues of each sūrah.","Critics detected fabrication through the chain (a known liar or forger, or a narrator who confessed) and through the text: clash with the Qurʾān or established Sunnah, historical impossibility, crude wording, or absurdly large rewards for small acts.","Ibn al-Jawzī (d. 597/1201) gathered fabrications in al-Mawḍūʿāt but was criticised for including some reports that are only weak. Al-Suyūṭī's al-Laʾālī al-Maṣnūʿah reviewed his judgements, which shows that 'weak' and 'fabricated' must be kept distinct."],"callout":["Pitfall","Do not call a report fabricated just because it is weak or unfamiliar. Check a specialist's verdict, and note the difference between a weak chain and a forged text."],"lectures":[{"t":"Verifying and Understanding Hadith","u":"https://www.youtube.com/watch?v=heitI0S9BCo","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"\"Misquoting Muhammad\"","u":"https://www.youtube.com/watch?v=3t_q4laqua8","by":"Jonathan A.C. Brown, Institute of Knowledge"}],"papers":[{"t":"Ṣaḥīḥ Muslim: the Introduction (Muqaddimah)","u":"https://sunnah.com/muslim/introduction","by":"Imam Muslim (English on sunnah.com)"},{"t":"al-Mawḍūʿāt (Arabic)","u":"https://shamela.ws/book/882","by":"Ibn al-Jawzī (ed. ʿAbd al-Raḥmān Muḥammad ʿUthmān), al-Maktabah al-Shāmilah"},{"t":"al-Laʾālī al-Maṣnūʿah fī al-Aḥādīth al-Mawḍūʿah (Arabic)","u":"https://shamela.ws/book/6062","by":"Jalāl al-Dīn al-Suyūṭī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Even If It's Not True It's True: Using Unreliable Ḥadīths in Sunni Islam","u":"https://drjonathanbrown.com/2011/even-if-its-not-true-its-true-using-unreliable-%e1%b8%a5adiths-in-sunni-islam/","by":"Jonathan A.C. Brown"},{"t":"Report on the study \"The Danger of Equating Weak (Ḍaʿīf) Hadith with Fabricated (Mawḍūʿ) Hadith\"","u":"https://www.aliftaa.jo/article-en/5991/Articles.aspx","by":"General Iftaa' Department, Jordan"},{"t":"Did the Prophet Say It or Not? The Literal, Historical, and Effective Truth of Ḥadīths in Early Sunnism","u":"https://drjonathanbrown.com/2011/did-the-prophet-say-it-or-not-the-literal-historical-and-effective-truth-of-hadiths-in-early-sunnism/","by":"Jonathan A.C. Brown"}],"projects":[{"n":"Popular-sayings audit","l":"Intermediate","d":"List ten sayings often quoted as ḥadīth in sermons or online. For each, record a classical verdict (with source) and label it ṣaḥīḥ, ḍaʿīf or mawḍūʿ."},{"n":"Ibn al-Jawzī vs al-Suyūṭī","l":"Advanced","d":"Take three reports Ibn al-Jawzī judged fabricated and al-Suyūṭī defended in al-Laʾālī. Write a short note on each explaining the disagreement and whose argument is stronger."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read the canonical collections in Arabic and English and compare chapter placements and gradings."}],"section":"hadith"},{"id":"critiques","title":"Modern and orientalist critiques of ḥadīth","short":"Modern critiques","level":"Advanced","why":"Academic debates since Goldziher and Schacht shape how ḥadīth are discussed today, and a serious student needs to know the arguments and the responses fairly.","mins":1400,"pre":["hterms","isnad","sunnah"],"ideas":["Ignaz Goldziher (1890) argued that much ḥadīth reflects the debates of later generations rather than the Prophet's time. Joseph Schacht's Origins of Muhammadan Jurisprudence (1950) went further, proposing that legal ḥadīth emerged in the second century AH and that isnāds 'grew backwards' to reach the Prophet ﷺ.","Schacht's 'common link' idea, later developed by G.H.A. Juynboll, holds that the point where many chains converge marks when a report began circulating. Critics reply that a common link can equally be a major teacher who spread a genuinely older report.","M.M. Azami answered Schacht with evidence of early writing and checked many of his examples, while Harald Motzki's isnād-cum-matn analysis of the Muṣannaf of ʿAbd al-Razzāq dated much material to the first century AH. The debate is ongoing, and some recent scholars remain sceptical.","Jonathan Brown argues that early Muslim critics did examine texts as well as chains, and that Western historical-critical method rests on its own assumptions. Learning to separate evidence from assumptions on both sides is the main skill this topic teaches."],"callout":["Method","Read each critique in its own words before reading a response. Summarise its claim and its evidence separately, then ask what the reply actually disproves."],"lectures":[{"t":"Hadith: what orientalists and modernists get wrong","u":"https://www.youtube.com/watch?v=jXosLGQ0rIo","by":"Jonathan A.C. Brown, The Thinking Muslim"},{"t":"Hadith and the Development of the Western Historical Critical Method (2012)","u":"https://www.youtube.com/watch?v=OprswYwKnFs","by":"Jonathan A.C. Brown (lecture recording)"},{"t":"Contemporary arguments against Hadith","u":"https://www.youtube.com/watch?v=LPjzterQ1Wk","by":"Jonathan A.C. Brown, The Thinking Muslim"}],"papers":[{"t":"On Schacht's Origins of Muhammadan Jurisprudence","u":"https://its.org.uk/catalogue/on-schachts-origins-of-muhammadan-jurisprudence-paperback/","by":"M.M. al-Azami, Islamic Texts Society (print)"},{"t":"The Muṣannaf of ʿAbd al-Razzāq al-Ṣanʿānī as a Source of Authentic Aḥādīth of the First Century A.H.","u":"https://doi.org/10.1086/373461","by":"Harald Motzki, Journal of Near Eastern Studies 50 (1991)"},{"t":"Ṣaḥīḥ Muslim: the Introduction (Muqaddimah)","u":"https://sunnah.com/muslim/introduction","by":"Imam Muslim (English on sunnah.com)"}],"reads":[{"t":"Blind Spots: The Origins of the Western Method of Critiquing Hadith","u":"https://yaqeeninstitute.org/read/paper/blind-spots-the-origins-of-the-western-method-of-critiquing-hadith","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"How We Know Early Ḥadīth Critics Did Matn Criticism and Why It's So Hard to Find","u":"https://drjonathanbrown.com/2011/how-we-know-early-%e1%b8%a5adith-critics-did-matn-criticism-and-why-its-so-hard-to-find/","by":"Jonathan A.C. Brown (Islamic Law and Society, 2008)"},{"t":"The Rules of Matn Criticism: There Are No Rules","u":"https://drjonathanbrown.com/2014/the-rules-of-matn-criticism-there-are-no-rules/","by":"Jonathan A.C. Brown"}],"projects":[{"n":"Argument map","l":"Advanced","d":"Produce a one-page map of Schacht's three main claims (backwards growth, common link, argument from silence) with the strongest response to each from Azami, Motzki or Brown."},{"n":"Fair summary exercise","l":"Intermediate","d":"Write two 300-word summaries, one of Goldziher's or Schacht's position and one of a Muslim response, each in terms its author would accept."}],"repos":[],"section":"hadith"}]},{"id":"y2quran","title":"Advanced Qurʾān and tazkiyah","level":"Advanced","intro":"Legal verses, iʿjāz and the qirāʾāt, the stations of the path, and today's questions.","phase":14,"optional":false,"topics":[{"id":"ahkam","title":"Legal verses (āyāt al-aḥkām)","short":"Āyāt al-aḥkām","level":"Advanced","why":"The legal commentaries show how each school derived rulings from the Qurʾān, joining tafsīr, uṣūl and fiqh in one place.","mins":1600,"pre":["tmethod","context","sources"],"ideas":["Āyāt al-aḥkām are the verses from which legal rulings are drawn. Classical writers often cite about five hundred, though the count depends on how strictly 'legal' is defined.","Each major school produced a legal tafsīr: al-Jaṣṣāṣ (d. 370/981) for the Ḥanafīs, al-Kiyā al-Harrāsī (d. 504/1110) for the Shāfiʿīs, and Ibn al-ʿArabī (d. 543/1148) for the Mālikīs. Al-Qurṭubī's (d. 671/1273) al-Jāmiʿ li-Aḥkām al-Qurʾān is Mālikī in leaning but surveys all the schools.","Different rulings often come from the language itself. In the wuḍūʾ verse (5:6) the reading of 'your feet' and the meaning of 'wipe your heads' shaped debates on washing the feet and how much of the head to wipe. In 2:228 the word qurūʾ is read as menstrual periods by Ḥanafīs and Ḥanbalīs and as periods of purity by Mālikīs and Shāfiʿīs.","These works also apply uṣūl principles to the verses: general and specific (ʿāmm and khāṣṣ), absolute and qualified, abrogation, and the role of Sunnah in explaining the Qurʾān."],"callout":["Method","Study one verse at a time across two or three legal tafsīrs. Note the linguistic point, the uṣūl principle and the resulting ruling in separate columns."],"lectures":[{"t":"Advanced Qurʾānic Studies (tafsīr of Sūrat al-Baqarah)","u":"https://www.youtube.com/playlist?list=PLnMdQLpR-VxzB84ZbhXEXaETFU4tpnOcW","by":"Cambridge Islamic College"},{"t":"Direction of the Qiblah: Advanced Qurʾānic Studies (preview)","u":"https://www.youtube.com/watch?v=DljpBGehlYc","by":"Cambridge Islamic College"}],"papers":[{"t":"Aḥkām al-Qurʾān (Arabic)","u":"https://shamela.ws/book/23579","by":"al-Jaṣṣāṣ (ed. Muḥammad Ṣādiq al-Qamḥāwī), al-Maktabah al-Shāmilah"},{"t":"Aḥkām al-Qurʾān (Arabic)","u":"https://shamela.ws/book/1464","by":"Abū Bakr ibn al-ʿArabī, al-Maktabah al-Shāmilah"},{"t":"al-Jāmiʿ li-Aḥkām al-Qurʾān on the wuḍūʾ verse (5:6)","u":"https://quran.com/5:6/tafsirs/ar-tafseer-al-qurtubi","by":"al-Qurṭubī (Arabic, Quran.com)"},{"t":"Tafsīr Ibn Kathīr on the wuḍūʾ verse (5:6)","u":"https://quran.com/5:6/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"}],"reads":[{"t":"How Do We Study the Verses of Rulings (Ahkam al-Quran)?","u":"https://seekersguidance.org/answers/quran/how-do-we-study-the-verses-of-rulings-ahkam-al-quran/","by":"SeekersGuidance"},{"t":"Tafsir (survey of exegetical genres, including legal commentary)","u":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/tafsir","by":"Encyclopedia of Islam and the Muslim World (Macmillan), via Encyclopedia.com"}],"projects":[{"n":"Wuḍūʾ verse comparison","l":"Advanced","d":"Read 5:6 in al-Jaṣṣāṣ, Ibn al-ʿArabī and al-Qurṭubī. Produce a table of each legal question in the verse, each author's ruling and the linguistic or uṣūl reason given."},{"n":"Qurūʾ dossier","l":"Intermediate","d":"Write a 500-word note on 2:228 setting out both readings of qurūʾ, the Arabic usage and ḥadīth each side cites, and the practical effect on the waiting period."}],"repos":[{"r":"Quran.com","u":"https://quran.com","d":"Verse-by-verse text with al-Ṭabarī, Ibn Kathīr, al-Qurṭubī and al-Saʿdī side by side."},{"r":"altafsir.com","u":"https://www.altafsir.com","d":"Free library of classical tafsīrs in Arabic, with several English translations."}],"section":"quran"},{"id":"q_ijaz","title":"The inimitability and rhetoric of the Qurʾān (iʿjāz)","short":"Iʿjāz","section":"quran","level":"Intermediate","why":"Muslim theologians present the Qurʾān as the Prophet's ﷺ central miracle, and the theory of iʿjāz shaped both theology and the Arabic science of rhetoric.","mins":720,"pre":["ulum","ar_nahw"],"ideas":["The Qurʾān challenges its hearers (taḥaddī) to produce something like it: the whole (17:88, 52:34), ten sūrahs (11:13), then a single sūrah (10:38, 2:23). Muslim scholars took the failure of the eloquent Arabs of the time to meet this challenge as proof of its divine origin.","Scholars disagreed on what the miracle consists in. The Muʿtazilī al-Naẓẓām held the theory of ṣarfah, that God prevented people from imitating it. The majority held that the text is inimitable in itself, and many added its reports of the unseen and its effect on listeners.","Al-Bāqillānī's Iʿjāz al-Qurʾān argued that the Qurʾān's composition (naẓm) belongs to none of the known genres of Arabic speech: it is neither poetry, nor rhymed prose (sajʿ), nor ordinary prose, and it keeps the same level of eloquence throughout.","ʿAbd al-Qāhir al-Jurjānī's Dalāʾil al-Iʿjāz located eloquence in naẓm, the arrangement of words according to the meanings of grammar, rather than in single words or sounds. His work founded the science of maʿānī within balāghah and still guides how word order, ellipsis and emphasis are read."],"callout":["Method","Take one short passage and ask al-Jurjānī's questions of it: why this word order, why this definite or indefinite noun, why this omission. Then compare your answer with a classical tafsīr."],"lectures":[{"t":"Al-Shifāʾ, section 3, chapter 4: The inimitable nature of the Qurʾān","u":"https://www.youtube.com/watch?v=aneB_u1S33c","by":"Islamic Centre Nottingham"},{"t":"Ep. 27: Why the Qurʾān Can't Be Imitated","u":"https://www.youtube.com/watch?v=BPHX2hn3OAQ","by":"Mohammad Elshinawy / Yaqeen Institute"},{"t":"The Qurʾān and its Translations","u":"https://www.youtube.com/watch?v=AwTzZze5T3U","by":"Muhammad Abdel Haleem / The Islamic College"}],"papers":[{"t":"Dalāʾil al-Iʿjāz (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%AF%D9%84%D8%A7%D8%A6%D9%84_%D8%A7%D9%84%D8%A5%D8%B9%D8%AC%D8%A7%D8%B2","by":"ʿAbd al-Qāhir al-Jurjānī (Arabic Wikisource)"},{"t":"Iʿjāz al-Qurʾān (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%A5%D8%B9%D8%AC%D8%A7%D8%B2_%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86","by":"Abū Bakr al-Bāqillānī (Arabic Wikisource)"},{"t":"Qurʾān 2:23 with Tafsīr Ibn Kathīr (the challenge to produce a sūrah)","u":"https://quran.com/2:23/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"}],"reads":[{"t":"Introduction to Iʿjāz al-Qurʾān: The Miraculous Nature of the Qurʾān","u":"https://yaqeeninstitute.org/read/paper/introduction-to-ijaz-al-quran-the-miraculous-nature-of-the-quran","by":"Suleiman Hani, Yaqeen Institute"},{"t":"The Inimitable Qurʾān: The Revelation to Prophet Muhammad","u":"https://yaqeeninstitute.org/read/paper/the-inimitable-quran-the-revelation-to-prophet-muhammad","by":"Mohammad Elshinawy, Yaqeen Institute"}],"projects":[{"n":"Naẓm notebook","l":"Intermediate","d":"Choose five verses and, for each, note one feature of word order, definiteness or ellipsis, explain its effect, and cite where al-Jurjānī or a tafsīr discusses a similar case."},{"n":"Theories essay","l":"Advanced","d":"Write 900 words comparing ṣarfah, al-Bāqillānī's genre argument and al-Jurjānī's naẓm theory, quoting each source."}],"repos":[{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Check the grammar and word order of the verses you analyse."},{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."}]},{"id":"q_qiraat","title":"The ten qirāʾāt and their transmission","short":"Ten qirāʾāt","section":"quran","level":"Advanced","why":"The Qurʾān is recited in several canonical readings that were carefully transmitted, and understanding them clarifies both its preservation and many points of tafsīr and law.","mins":780,"pre":["ulum","b_tajweed"],"ideas":["The seven aḥruf mentioned in the ḥadīth (Bukhārī 4992) are not the same as the seven or ten qirāʾāt. The aḥruf are the modes in which the Qurʾān was revealed; the qirāʾāt are later named readings, each attributed to an imām and transmitted by chains of reciters, and scholars differ on how much of the aḥruf they preserve.","Ibn Mujāhid (d. 324/936) limited the canon to seven readers in his Kitāb al-Sabʿah. Al-Dānī's al-Taysīr (d. 444/1053), and al-Shāṭibī's versification of it (al-Shāṭibiyyah), made two transmitters per reader the standard, such as Ḥafṣ and Shuʿbah from ʿĀṣim, or Qālūn and Warsh from Nāfiʿ. Earlier scholars such as Ibn Mihrān (d. 381/991) already counted Abū Jaʿfar, Yaʿqūb and Khalaf among ten readers, and Ibn al-Jazarī (d. 833/1429), in al-Durrah al-Muḍiyyah and al-Nashr, established these three as canonical and fixed their transmitters.","In al-Nashr fī al-Qirāʾāt al-ʿAshr, Ibn al-Jazarī gave three conditions for an accepted reading: a sound chain of transmission, agreement with Arabic grammar even in one valid way, and agreement with one of the ʿUthmānic codices even if only possibly. A reading that fails them is shādhdh (irregular) and is not recited in prayer.","Variant readings often affect meaning, as in māliki and maliki in 1:4 ('Master' and 'King'), and jurists used them in law, as with the two readings of 'your feet' in the wuḍūʾ verse (5:6). Shady Nasser's academic study argues that the canonical readings were not all transmitted by tawātur in the strict sense defined by legal theorists."],"callout":["Method","Do not try to memorise the variants. Learn the ten readers and their twenty transmitters first, then follow one sūrah in a qirāʾāt reference and note each difference and its effect on meaning."],"lectures":[{"t":"The Seven Aḥruf and the Ten Qirāʾāt of the Qurʾān Explained","u":"https://www.youtube.com/watch?v=8hj7u0F3yEg","by":"Arabic 101"},{"t":"Introduction to the Shāṭibiyyah, session 1","u":"https://www.youtube.com/watch?v=HuBKDVWBXJw","by":"Moaaz Safwat / Dar al-Burhan"},{"t":"The Transmission of the Qurʾān, Variant Readings, and Qurʾānic Grammar","u":"https://www.youtube.com/watch?v=9hrcd6K0RDM","by":"Shady Nasser / Exploring the Quran and the Bible"}],"papers":[{"t":"al-Nashr fī al-Qirāʾāt al-ʿAshr (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D9%86%D8%B4%D8%B1_%D9%81%D9%8A_%D8%A7%D9%84%D9%82%D8%B1%D8%A7%D8%A1%D8%A7%D8%AA_%D8%A7%D9%84%D8%B9%D8%B4%D8%B1","by":"Ibn al-Jazarī (Arabic Wikisource)"},{"t":"Matn Ṭayyibat al-Nashr fī al-Qirāʾāt al-ʿAshr (Arabic, CC BY-NC-SA)","u":"https://archive.org/details/wuquf-openiti-0833ibnjazari.matntayyibatnashr-9562262a9cd5","by":"Ibn al-Jazarī (OpenITI)"},{"t":"Ṣaḥīḥ al-Bukhārī 4992: the Qurʾān revealed in seven aḥruf","u":"https://sunnah.com/bukhari:4992","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"Can the Qurʾān Be Recited in Different Ways? The Meaning and Wisdom of Qirāʾāt","u":"https://yaqeeninstitute.org/read/paper/can-the-quran-be-recited-in-different-ways-the-meaning-and-wisdom-of-qiraat","by":"Yousef Wahb, Yaqeen Institute"},{"t":"The Transmission of the Variant Readings of the Qurʾān: The Problem of Tawātur and the Emergence of Shawādhdh (Brill, 2013; library catalogue record)","u":"https://library.arce.org/portal/Record/40805","by":"Shady Hekmat Nasser"}],"projects":[{"n":"Readers chart","l":"Beginner","d":"Make a chart of the ten readers, their cities, dates and two transmitters each, with the reading most widely recited in each region today."},{"n":"Variant study","l":"Advanced","d":"Pick ten variants from one sūrah, list the readers on each side, and write a short note on the change in meaning or legal ruling for each, citing a tafsīr."}],"repos":[{"r":"Nquran (موقع ن للقرآن وعلومه)","u":"https://www.nquran.com/","d":"Arabic portal for learning the ten readings, with variants listed verse by verse."},{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."}]},{"id":"madarij","title":"Advanced tazkiyah: Madārij al-Sālikīn","short":"Madārij","level":"Advanced","why":"Madārij al-Sālikīn is a detailed map of the inner life, grounding the stations of the spiritual path in the Qurʾān and Sunnah.","mins":1800,"pre":["tazkiyah","b_heart"],"ideas":["Ibn Qayyim al-Jawziyyah (d. 751/1350) wrote Madārij al-Sālikīn as a commentary on Manāzil al-Sāʾirīn by the Ḥanbalī Sufi Abū Ismāʿīl al-Harawī (d. 481/1089). He organised it around the verse \"You alone we worship and You alone we ask for help\" (1:5).","The work opens with a long study of al-Fātiḥah and then explains the stations (manāzil) of the path, beginning with awakening (yaqaẓah), repentance and self-accounting, and moving through stations such as reliance, patience, gratitude and love.","Ibn al-Qayyim respects al-Harawī deeply but corrects him where he thinks he goes beyond the texts, especially on annihilation (fanāʾ). He is reported to have written that the Shaykh al-Islām is dear to us, but the truth is dearer.","Ibn Rajab's Laṭāʾif al-Maʿārif is a useful companion: a set of sermons on the months and seasons of the Islamic year that applies the same inner themes to the believer's calendar."],"callout":["Method","Read one station at a time and write it up in your own words before moving on. The book is meant to be practised, so add one concrete step for each station."],"lectures":[{"t":"Explanation of Madārij al-Sālikīn","u":"https://www.youtube.com/playlist?list=PLFDIvyl7LzuYFjSJ6zPxpGNmOuXhfZnsl","by":"Sheikh Abu Adnan"},{"t":"Climbing to Closeness: the spiritual psychology of Ibn al-Qayyim","u":"https://www.youtube.com/playlist?list=PL2qvMCjB_IjaKTTeG-Va-1NOwAi9eKvS_","by":"Ustadh Hisham Abu Yusuf"},{"t":"Laṭāʾif al-Maʿārif: Imam Ibn Rajab","u":"https://www.youtube.com/playlist?list=PL_BsY303SrQKeDIUXYL_NA64Aox3R1aHQ","by":"Hasib Noor, The Legacy Institute"}],"papers":[{"t":"Madārij al-Sālikīn (Arabic)","u":"https://shamela.ws/book/8370","by":"Ibn Qayyim al-Jawziyyah, al-Maktabah al-Shāmilah"},{"t":"Ranks of the Divine Seekers: A Parallel English-Arabic Text, Vol. 1","u":"https://doi.org/10.1163/9789004413412","by":"Ibn Qayyim al-Jawziyyah (trans. Ovamir Anjum), Brill (print)"},{"t":"Laṭāʾif al-Maʿārif (Arabic)","u":"https://shamela.ws/book/11363","by":"Ibn Rajab al-Ḥanbalī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Review of Ranks of the Divine Seekers, Vol. 1","u":"https://ajis.org/index.php/ajiss/article/download/1706/1554/3813","by":"American Journal of Islam and Society"}],"projects":[{"n":"Station journal","l":"Intermediate","d":"For ten stations, write a half-page entry: the definition, the key verse or ḥadīth Ibn al-Qayyim cites, and one practical step you will take that week."},{"n":"Commentary comparison","l":"Advanced","d":"Choose one station and compare al-Harawī's brief text with Ibn al-Qayyim's commentary. Write 600 words on where he agrees, where he corrects, and why."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"tazkiyah"}]},{"id":"y2contemp","title":"Society and contemporary questions","level":"Intermediate","intro":"Legal verses, iʿjāz and the qirāʾāt, the stations of the path, and today's questions.","phase":14,"optional":false,"topics":[{"id":"c_modern","title":"Islam and modernity: reform movements and contemporary thought","short":"Islam & modernity","section":"thought","level":"Intermediate","why":"The last two centuries reshaped Muslim law, education and politics, and most debates Muslims have today began with the reformers and their critics.","mins":720,"pre":["h_rashidun","h_modern"],"ideas":["Eighteenth-century revival movements, such as those of Shāh Walī Allāh in India and Muḥammad ibn ʿAbd al-Wahhāb in Arabia, called for a return to the Qurʾān and Sunnah before European colonial rule was a major factor. Later reform responded directly to colonial power and Western science.","Jamāl al-Dīn al-Afghānī, Muḥammad ʿAbduh and Rashīd Riḍā led the modernist reform of the late nineteenth and early twentieth centuries, often (and debatably) labelled 'Salafiyyah'; Henri Lauzière shows that the label was largely applied to them later and should not be confused with later purist Salafism. ʿAbduh's Risālat al-Tawḥīd argued that Islam is in harmony with reason, and they criticised blind imitation (taqlīd) while drawing freely on all the schools. Traditionalist critics answered them, notably the last Ottoman Shaykh al-Islām Muṣṭafā Ṣabrī (d. 1954), whose Mawqif al-ʿAql defended Ashʿarī-Māturīdī theology and the madhhabs against ʿAbduh's school.","The state changed how Sharīʿah worked. The Ottoman Mecelle (1869–1876) codified Ḥanafī contract law, colonial and national governments replaced most Sharīʿah courts with state law, and family law became the main area where Islamic law was still applied.","Contemporary Muslim thinkers answer modernity in different ways. Muhammad Iqbal called for a reconstruction of religious thought; Abdal Hakim Murad defends traditional Sunni scholarship as a critique of modernity; Sherman Jackson writes on the 'Islamic secular'; and Wael Hallaq argues that the modern state is incompatible with Sharīʿah governance."],"callout":["Pitfall","Avoid treating 'reform' and 'tradition' as two simple camps. For each thinker, note what they kept from the classical tradition, what they rejected and why."],"lectures":[{"t":"Riding the Tiger of Modernity","u":"https://www.youtube.com/watch?v=07Ien1qo_qI","by":"Abdal Hakim Murad / Cambridge Muslim College"},{"t":"Sherman Jackson on Islam and Liberal Democracy","u":"https://www.youtube.com/watch?v=0w7g4FD-BhQ","by":"Sherman Jackson / Berkley Center, Georgetown University"},{"t":"A Critique of Modernity: The State and its Forms of Knowledge (playlist)","u":"https://www.youtube.com/playlist?list=PLg_sc8wcf6k8maFgdDbKZy8QFU2Dsbxyn","by":"Wael B. Hallaq & Ovamir Anjum / American Islamic College"}],"papers":[{"t":"Risālat al-Tawḥīd (Arabic, Cairo 1906)","u":"https://archive.org/details/risalataltawhid00muamuoft","by":"Muḥammad ʿAbduh (University of Toronto copy)"},{"t":"The Reconstruction of Religious Thought in Islam (1934)","u":"https://archive.org/details/dli.csl.5272","by":"Muhammad Iqbal (Digital Library of India)"},{"t":"Mawqif al-ʿAql wa al-ʿIlm wa al-ʿĀlam min Rabb al-ʿĀlamīn wa ʿIbādihi al-Mursalīn (Arabic, 4 vols.)","u":"https://archive.org/details/mawkef-elakl-walelm-walaalam-men-rab-elalamin","by":"Muṣṭafā Ṣabrī, Internet Archive"}],"reads":[{"t":"Faith in the Future: Islam after the Enlightenment","u":"https://www.masud.co.uk/ISLAM/ahm/postEnlight.htm","by":"Abdal Hakim Murad"},{"t":"Shariah: From Diverse Legal Discourse to Colonial Misrepresentation","u":"https://yaqeeninstitute.org/read/paper/shariah-from-diverse-legal-discourse-to-colonial-misrepresentation","by":"Tesneem Alkiek, Yaqeen Institute"},{"t":"The Making of Salafism: Islamic Reform in the Twentieth Century (print)","u":"https://cup.columbia.edu/book/the-making-of-salafism/9780231175500","by":"Henri Lauzière, Columbia University Press"}],"projects":[{"n":"Thinkers timeline","l":"Beginner","d":"Build a timeline from 1700 to today of ten reformers and traditionalist scholars, with one key work and one sentence on their position for each."},{"n":"Position paper","l":"Advanced","d":"Write 1,000 words comparing how ʿAbduh (Risālat al-Tawḥīd) and Muṣṭafā Ṣabrī (Mawqif al-ʿAql) answer the same question, such as taqlīd or the role of reason, quoting both."}],"repos":[]},{"id":"c_doubts","title":"Faith and modern doubts: atheism, science and morality","short":"Modern doubts","section":"aqidah","level":"Intermediate","why":"Many Muslims today meet arguments from atheism, science and secular ethics, and the classical tradition has strong resources for thinking about them carefully.","mins":660,"pre":["tawhid","reason"],"ideas":["Classical theologians argued for God from the contingency and origination of the world: whatever begins to exist or could have been otherwise needs a cause outside itself. Qurʾān 52:35 states the core of this argument, and scholars also appealed to the innate disposition (fiṭrah) to recognise the Creator.","Science and scripture are best compared by separating empirical data from interpretation. Theologians such as David Solomon Jalajel argue for suspending judgement (tawaqquf) where revelation is silent, as on non-human evolution, while affirming what revelation states explicitly, such as the special creation of Ādam.","On morality, Ashʿarī theologians hold that the moral status of acts is known through revelation, while Māturīdīs and many Ḥanbalīs hold that reason can recognise good and evil in principle. Both tie moral obligation to God's command, but they explain the role of reason differently.","Survey research by the Yaqeen Institute suggests that doubt among Muslims is often tied to moral and personal concerns and to experiences within communities, as well as to intellectual arguments. A good response deals with the person as well as the argument."],"callout":["Method","For each doubt, write it in its strongest form first, then the classical response, then what remains open. This keeps the study honest and avoids answering a weaker argument than the one actually raised."],"lectures":[{"t":"Ideological Analysis of Atheism","u":"https://www.youtube.com/watch?v=U2E3WxkkTZg","by":"Nazir Khan / Yaqeen Institute"},{"t":"Classical Islamic Theology and the Question of Biological Evolution (part 1)","u":"https://www.youtube.com/watch?v=JniMGZ7Z_UI","by":"David Solomon Jalajel & Yasir Qadhi / Güncel Kelam"}],"papers":[{"t":"Qurʾān 52:35 with Tafsīr Ibn Kathīr (were they created by nothing?)","u":"https://quran.com/52:35/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Deliverance from Error (al-Munqidh min al-Ḍalāl)","u":"http://www.ghazali.org/works/watt3.htm","by":"al-Ghazālī (tr. W. Montgomery Watt)"}],"reads":[{"t":"Atheism and Radical Skepticism: Ibn Taymiyyah's Epistemic Critique","u":"https://yaqeeninstitute.org/read/paper/atheism-and-radical-skepticism-ibn-taymiyyahs-epistemic-critique","by":"Nazir Khan, Yaqeen Institute"},{"t":"Facts vs. Interpretations: Understanding Islam and Evolution","u":"https://yaqeeninstitute.org/read/paper/facts-vs-interpretations-understanding-islam-evolution","by":"Yamina Bouguenaya, Yaqeen Institute"},{"t":"Modern Pathways to Doubt in Islam","u":"https://yaqeeninstitute.org/read/paper/modern-pathways-to-doubt-in-islam","by":"Youssef Chouhoud, Yaqeen Institute"}],"projects":[{"n":"Doubt journal","l":"Intermediate","d":"Choose three common objections (from atheism, science and morality). For each, write the strongest version, the classical response with a source, and one question that stays open."},{"n":"Argument map","l":"Beginner","d":"Draw th
