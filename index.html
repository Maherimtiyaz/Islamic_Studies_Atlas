 general basis in the texts must be weighed. Real disagreement remains on specific practices, such as celebrating the mawlid or set forms of group dhikr, and classical usage reserved the label 'people of bidʿah' mainly for doctrinal sects such as the Khawārij and Qadariyyah."],"callout":["Method","Before judging any practice, ask which definition of bidʿah the speaker is using and whether the practice has a general or specific basis in the texts. Then present each side in its own terms."],"lectures":[{"t":"Defining Bidʿa: Between Blind Emotionalism & Balanced Rituals","u":"https://www.youtube.com/watch?v=lbsjI8CJ6cA","by":"Yasir Qadhi"},{"t":"Mafhūm al-bidʿah fī al-Islām (Arabic)","u":"https://www.youtube.com/watch?v=HbRvGKuuHWI","by":"ʿAlī Jumʿah (al-Nas TV)"},{"t":"Sunnah, Shariʿah, Sectarianism & Ijtihad (Understanding Islam, session 2)","u":"https://www.youtube.com/watch?v=GmJgoGBQ0k8","by":"Abdal Hakim Murad (Islam On Demand)"}],"papers":[{"t":"al-Iʿtiṣām (Arabic, ed. Salīm al-Hilālī)","u":"https://shamela.ws/book/21720","by":"al-Shāṭibī (al-Maktabah al-Shāmilah)"},{"t":"Qawāʿid al-Aḥkām fī Maṣāliḥ al-Anām, section on bidʿah (Arabic)","u":"https://shamela.ws/book/8608/455","by":"al-ʿIzz ibn ʿAbd al-Salām (al-Maktabah al-Shāmilah)"},{"t":"Jāmiʿ al-ʿUlūm wa al-Ḥikam, commentary on ḥadīths 5 and 28 (Arabic)","u":"https://shamela.ws/book/10443","by":"Ibn Rajab al-Ḥanbalī (al-Maktabah al-Shāmilah)"},{"t":"Iqtiḍāʾ al-Ṣirāṭ al-Mustaqīm (Arabic)","u":"https://shamela.ws/book/11620","by":"Ibn Taymiyyah (al-Maktabah al-Shāmilah)"}],"reads":[{"t":"The Concept of Bidʿa in the Islamic Sharīʿa (1995 lecture text)","u":"https://www.masud.co.uk/ISLAM/nuh/bida.htm","by":"Nuh Ha Mim Keller"},{"t":"Beyond Polarization: An Attempt at Impartial Discussion on the Concept and Rulings of Religious Innovation","u":"https://muslimmatters.org/?p=91360","by":"Hatem al-Haj (MuslimMatters)"}],"projects":[{"n":"Definitions table","l":"Intermediate","d":"Quote the definitions or divisions of bidʿah given by al-Shāfiʿī, al-ʿIzz, al-Nawawī, al-Shāṭibī, Ibn Rajab and Ibn Taymiyyah with references. Mark on which points each pair agrees and disagrees."},{"n":"Neutral survey of one practice","l":"Intermediate","d":"Choose one disputed practice and write a survey of the arguments for and against it, citing sources for each side. A teacher reviews it; the survey reaches no ruling of its own."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read ḥadīths 5 and 28 of the Forty Ḥadīth and Muslim 1017 in full."}]}]},{"id":"hadith","title":"Ḥadīth sciences","level":"Beginner","intro":"The ḥadīth sciences are the methods Muslim scholars built to judge which reports from the Prophet ﷺ are reliable. This month covers the basic grades, how narrators and chains are assessed, the main collections, and how to use ḥadīth with care.","phase":7,"optional":false,"topics":[{"id":"h_bayquni","section":"hadith","title":"First muṣṭalaḥ text: al-Manẓūmah al-Bayqūniyyah","short":"al-Bayqūniyyah","level":"Beginner","why":"The Bayqūniyyah is the short poem through which generations of students first memorized the basic terms of ḥadīth criticism before moving on to Ibn Ḥajar's Nukhbat al-Fikar and Ibn al-Ṣalāḥ.","mins":800,"pre":["b_forty"],"ideas":["The poem is about thirty-four lines in rajaz metre by a Damascene scholar usually named Ṭāhā (or ʿUmar) ibn Muḥammad al-Bayqūnī, of the 11th/17th century, about whom little is known. It names around thirty-two categories of report, from ṣaḥīḥ to mawḍūʿ, and is short enough to memorize in a few weeks, which is why teachers use it as a frame for the whole subject.","It defines ṣaḥīḥ as a report with a connected chain, free of irregularity (shudhūdh) and hidden defect (ʿillah), narrated by upright (ʿadl) and precise (ḍābiṭ) narrators from others like them. Its definition of ḥasan follows the older wording of al-Khaṭṭābī, a report whose routes are known but whose men are less famous than those of the ṣaḥīḥ. Commentators note that this is vague, and later scholars such as Ibn Ḥajar defined ḥasan more exactly as like ṣaḥīḥ but with lighter precision.","Many terms describe the chain rather than the grade: marfūʿ (attributed to the Prophet ﷺ), mawqūf (stopping at a Companion), maqṭūʿ (stopping at a Successor), and the forms of breaks such as mursal, munqaṭiʿ and muʿḍal. Others describe the number of routes (ʿazīz, mashhūr, gharīb), the manner of narration (muʿanʿan, musalsal) or defects in the text (mudraj, maqlūb, muḍṭarib).","The poem ends with the severely weak categories: munkar, matrūk and finally mawḍūʿ, the fabricated report, which may not be narrated except to expose it. Because it is a summary, the Bayqūniyyah is studied with a commentary, classically al-Zurqānī's and in recent times Ibn ʿUthaymīn's, and then followed by a fuller text."],"callout":["Method","Memorize the poem a few lines at a time and, for each term, write a definition and one real example from sunnah.com. A term learned without an example is soon forgotten."],"lectures":[{"t":"al-Bayqūniyyah Explained: Introduction to Ḥadīth Sciences (22 lessons)","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpduOJHzqjPJV0zTxzEmUdFnG","by":"Mawlānā Hashim Mohamed (Al-Qalam Institute)"},{"t":"شرح المنظومة البيقونية (Arabic, 30 lessons)","u":"https://www.youtube.com/playlist?list=PLiTKQO5a7ZXnu-g2nW_bexxOVa0zoO5zF","by":"Shaykh Muḥammad ibn Ṣāliḥ al-ʿUthaymīn (official channel)"}],"papers":[{"t":"English Translation of the Ode of al-Bayqūniyyah","u":"https://archive.org/details/english-translation-of-the-ode-of-bayquniyyah","by":"al-Bayqūnī (trans. Muhammad Nabeel Musharraf, Australian Islamic Library)"},{"t":"Sharḥ al-Manẓūmah al-Bayqūniyyah fī Muṣṭalaḥ al-Ḥadīth (Arabic)","u":"https://shamela.ws/book/11254","by":"Muḥammad ibn Ṣāliḥ al-ʿUthaymīn"},{"t":"al-Kawākib al-Durriyyah ʿalā al-Manẓūmah al-Bayqūniyyah (Arabic)","u":"https://shamela.ws/book/126","by":"Sulaymān ibn Khālid al-Ḥarbī"},{"t":"Muqaddimat Ibn al-Ṣalāḥ (the next reference text, Arabic)","u":"https://shamela.ws/book/22870","by":"Ibn al-Ṣalāḥ (ed. Nūr al-Dīn ʿItr)"}],"reads":[{"t":"An Introduction to the Science of Hadith: classification according to the reference to a particular authority","u":"https://www.islamic-awareness.org/hadith/ulum/asb1.html","by":"Suhaib Hasan (Islamic Awareness)"},{"t":"An Introduction to the Science of Hadith: classification according to the links in the isnād","u":"https://www.islamic-awareness.org/hadith/ulum/asb2.html","by":"Suhaib Hasan (Islamic Awareness)"},{"t":"An Introduction to the Science of Hadith: classification according to the reliability and memory of reporters","u":"https://www.islamic-awareness.org/hadith/ulum/asb7.html","by":"Suhaib Hasan (Islamic Awareness)"}],"projects":[{"n":"Term cards","l":"Beginner","d":"Make one card for each of the categories in the poem with the Arabic line, an English definition and an example ḥadīth with its grading from sunnah.com, and test yourself weekly."},{"n":"Grouping chart","l":"Beginner","d":"Draw a chart sorting the poem's terms into four groups (grade, source of attribution, continuity of the chain, number of routes) and note where al-Bayqūnī's definitions differ from Ibn Ḥajar's in Nukhbat al-Fikar."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Find examples of each category and see how editors grade them."}]},{"id":"hterms","title":"Ḥadīth terminology: ṣaḥīḥ, ḥasan, ḍaʿīf","short":"Ḥadīth terms","level":"Beginner","why":"The grades ṣaḥīḥ, ḥasan and ḍaʿīf appear under nearly every ḥadīth you will read, so you need to know exactly what each one claims.","mins":480,"pre":["b_forty","sunnah"],"ideas":["Following Ibn al-Ṣalāḥ, a ṣaḥīḥ ḥadīth has five conditions: a connected chain (ittiṣāl), upright narrators (ʿadālah), precise narrators (ḍabṭ), no irregularity against stronger narrators (shudhūdh), and no hidden defect (ʿillah). Calling a report ṣaḥīḥ is a technical judgement that these conditions are met.","A ḥasan ḥadīth meets the same conditions except that a narrator's precision is somewhat lighter. A report that is weak on its own can rise to ḥasan li-ghayrihi, or ḥasan to ṣaḥīḥ li-ghayrihi, when supporting chains corroborate it.","A ḍaʿīf ḥadīth fails one or more conditions of the ḥasan, either because of a break in the chain (munqaṭiʿ, muʿḍal, muʿallaq) or because of criticism of a narrator. The mursal (a Successor attributing a report directly to the Prophet ﷺ) is weak in the view of most ḥadīth critics, but Abū Ḥanīfah and Mālik accepted the mursal of a reliable Successor and al-Shāfiʿī accepted it when corroborated, so its status is disputed among jurists. A fabricated report (mawḍūʿ) is a separate category: a lie attributed to the Prophet ﷺ, not merely a weak report.","Ibn Ḥajar's Nukhbat al-Fikar also classifies reports by the number of chains: mutawātir, transmitted by so many that error is ruled out, and āḥād, divided into mashhūr, ʿazīz and gharīb. A gharīb report can still be ṣaḥīḥ, as with \"Actions are only by intentions\", which has a single chain in its early generations."],"callout":["Method","Keep a running glossary: term in Arabic, a one-line definition from the Nukhbah, and one real example from sunnah.com. Do not move on from a term until you can explain how it differs from its neighbours."],"lectures":[{"t":"Nukhbat al-Fikr by Ibn Hajar: A Concise Guide for Beginners (complete playlist)","u":"https://www.youtube.com/playlist?list=PLxXcotHiyGwVUqBEyAnvYdbVwhQfMseq8","by":"Abu Ayoub Daud Burke"},{"t":"Nukhbatul Fikar (playlist)","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpduwvtyTwue74YzO2jX6xbOe","by":"Al-Qalam Institute"},{"t":"Mastering the Core Islamic Sciences: Hadith","u":"https://www.youtube.com/watch?v=2HA6-T9QAYk","by":"SeekersGuidance"}],"papers":[{"t":"Nukhbat al-Fikar with Nuzhat al-Naẓar (Arabic, Calcutta 1862)","u":"https://archive.org/details/nukhbatalfikarfm00ibna","by":"Ibn Ḥajar al-ʿAsqalānī (ed. W. Nassau Lees)"},{"t":"Nukhbat al-Fikar in English with the Tuḥfat al-Durar explanation","u":"https://archive.org/details/nukhbatul-fikar","by":"Ibn Ḥajar al-ʿAsqalānī (English, Australian Islamic Library)"},{"t":"An Introduction to the Science of the Ḥadīth (Kitāb Maʿrifat anwāʿ ʿilm al-ḥadīth)","u":"https://garnetpublishing.co.uk/product/an-introduction-to-the-science-of-hadith-kitab-marrifat-anwa-ilm-al-hadith","by":"Ibn al-Ṣalāḥ (trans. Eerik Dickinson), Garnet (print)"},{"t":"al-Taqrīb wa al-Taysīr (Arabic text, OpenITI)","u":"https://archive.org/details/wuquf-openiti-0676nawawi.taqrib-23ee3953191c","by":"al-Nawawī"}],"reads":[{"t":"An Introduction to the Science of Hadith","u":"https://www.islamic-awareness.org/hadith/ulum/","by":"Suhaib Hasan (hosted by Islamic Awareness)"},{"t":"Review of Ibn al-Ṣalāḥ, An Introduction to the Science of the Ḥadīth (trans. Dickinson)","u":"https://www.ajis.org/index.php/ajiss/article/view/1575","by":"American Journal of Islam and Society"}],"projects":[{"n":"Grading glossary","l":"Beginner","d":"Write a two-page glossary of 25 terms from the Nukhbah, each with a definition and one example ḥadīth reference from sunnah.com."},{"n":"Grade tracing","l":"Beginner","d":"Pick ten ḥadīths from al-Nawawī's Forty and record the grade given for each on sunnah.com, then explain in a sentence which conditions make it ṣaḥīḥ or ḥasan."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Look up ḥadīths with Arabic text, English translation and grading notes."}],"section":"hadith"},{"id":"isnad","title":"Isnād and narrator criticism","short":"Isnād & narrators","level":"Intermediate","why":"The chain of narrators is the main evidence scholars used to judge a report, and narrator criticism (al-jarḥ wa al-taʿdīl) is how each link was assessed.","mins":420,"pre":["hterms"],"ideas":["The isnād is the chain of narrators and the matn is the text it carries. ʿAbd Allāh ibn al-Mubārak's saying, recorded in the introduction to Ṣaḥīḥ Muslim, sums up the attitude: \"The isnād is part of the religion; were it not for the isnād, anyone could say whatever he wished.\"","A reliable narrator (thiqah) combines ʿadālah, meaning moral and religious integrity, with ḍabṭ, meaning precision, either by memory or by a carefully kept written record. A pious narrator with a poor memory is still weak in transmission.","Critics such as Yaḥyā ibn Maʿīn, Aḥmad ibn Ḥanbal and Abū Ḥātim al-Rāzī graded narrators with a scale of terms, from thiqah thabt down to ṣadūq, ḍaʿīf, matrūk and kadhdhāb. Their judgements are collected in works such as Ibn Abī Ḥātim's al-Jarḥ wa al-Taʿdīl and Ibn Ḥajar's Taqrīb al-Tahdhīb, and an explained criticism generally outweighs general praise.","Precision was tested by comparison: critics checked a narrator's reports against those of his peers, looking for corroborating chains (mutābaʿāt) and supporting reports (shawāhid). On connection, al-Bukhārī is reported to have required proof that narrators met, while Muslim argued in his introduction that being contemporaries with a possible meeting suffices."],"callout":["Method","Take one ḥadīth on sunnah.com, write out its chain name by name, and look up each narrator's grade in Ibn Ḥajar's Taqrīb or a narrator database. This turns the terminology into a skill."],"lectures":[{"t":"Al-Jarḥ wa-l-Taʿdīl, Lesson 1: Foundations","u":"https://www.youtube.com/watch?v=PbBe0X3JG-0","by":"Talweeh Academy"},{"t":"Verifying and Understanding Hadith","u":"https://www.youtube.com/watch?v=heitI0S9BCo","by":"Jonathan A.C. Brown / Yaqeen Institute"}],"papers":[{"t":"Introduction (Muqaddimah) to Ṣaḥīḥ Muslim","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com translation)"},{"t":"Nukhbat al-Fikar in English: final chapters on the ranks of jarḥ and taʿdīl","u":"https://archive.org/details/nukhbatul-fikar","by":"Ibn Ḥajar al-ʿAsqalānī (English, Australian Islamic Library)"}],"reads":[{"t":"Authenticating Hadith and the History of Hadith Criticism","u":"https://yaqeeninstitute.org/read/paper/authenticating-hadith-and-the-history-of-hadith-criticism","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"Rijāl al-Ḥadīth: the study of the reporters of ḥadīth","u":"https://www.islamic-awareness.org/hadith/ulum/asa3.html","by":"Suhaib Hasan (hosted by Islamic Awareness)"}],"projects":[{"n":"Chain diagram","l":"Intermediate","d":"Draw the full isnād of one ḥadīth narrated by several Companions or Successors, marking where the chains meet (madār) and the grade of each narrator."},{"n":"Critic profiles","l":"Intermediate","d":"Write a half-page profile each of Yaḥyā ibn Maʿīn, Aḥmad ibn Ḥanbal and Abū Ḥātim al-Rāzī, noting their era and their reputation for strict or lenient criticism."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Source chains and texts for practice."},{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up narrators, their teachers, students and dates."}],"section":"hadith"},{"id":"collections","title":"The canonical collections & the Muqaddimah of Ṣaḥīḥ Muslim","short":"Collections","level":"Beginner","why":"Knowing how the major collections differ in purpose and standard tells you how much weight a reference carries before you even read the grade.","mins":420,"pre":["hterms","isnad"],"ideas":["The Six Books are the Ṣaḥīḥs of al-Bukhārī (d. 256/870) and Muslim (d. 261/875) and the collections of Abū Dāwūd, al-Tirmidhī, al-Nasāʾī and Ibn Mājah; some scholars put Mālik's Muwaṭṭaʾ or al-Dārimī in the sixth place. Only the two Ṣaḥīḥs aimed to include authentic reports only.","Genre matters: a ṣaḥīḥ collects only reports meeting its author's standard, a sunan arranges legal ḥadīths by fiqh chapters, a jāmiʿ covers all subjects, and a musnad, such as Aḥmad's, arranges reports by Companion. Al-Tirmidhī is valued because he grades many ḥadīths and reports the jurists' positions.","Al-Bukhārī's chapter headings (tarājim) carry his own legal conclusions, and he often splits or repeats a ḥadīth under several headings. Muslim gathers the chains of one ḥadīth in one place with careful attention to wording, which makes comparing chains easier.","Muslim's introduction explains his method, divides narrators into tiers, forbids narrating from known liars, and argues against requiring proof of a meeting between contemporaries. Jonathan Brown has shown that the two Ṣaḥīḥs gained their canonical status gradually, through later scholars' study and use, while critics such as al-Dāraquṭnī raised technical objections to a small number of their chains."],"callout":["Method","Read the Muqaddimah of Ṣaḥīḥ Muslim in one sitting, then reread it marking every methodological claim. Compare each claim with the terminology you learned from the Nukhbah."],"lectures":[{"t":"Is Sahih Bukhari 100% Correct?","u":"https://www.youtube.com/watch?v=CJQkFNIf_Tw","by":"Jonathan A.C. Brown / Bayan Graduate School"},{"t":"Understanding the Genius of Imam Bukhari","u":"https://www.youtube.com/watch?v=VOL8dxLrTW8","by":"Mohammad Akram Nadwi / Al-Salam Institute"},{"t":"Introduction to Sahih Muslim","u":"https://www.youtube.com/watch?v=Q7oTeGPtntQ","by":"Ismail Kamdar"}],"papers":[{"t":"Introduction (Muqaddimah) to Ṣaḥīḥ Muslim","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com translation)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book 1: Revelation","u":"https://sunnah.com/bukhari/1","by":"al-Bukhārī (sunnah.com translation)"}],"reads":[{"t":"Can We Trust Hadith Literature? Understanding the Processes of Transmission and Preservation","u":"https://yaqeeninstitute.org/read/paper/can-we-trust-hadith-literature-understanding-the-process-of-transmission-and-preservation","by":"Muntasir Zaman, Yaqeen Institute"},{"t":"Review essay: Hadith: Muhammad's Legacy in the Medieval and Modern World (2nd ed.)","u":"https://www.ajis.org/index.php/ajiss/article/view/575","by":"American Journal of Islam and Society"},{"t":"Review of al-Aqṭash, Qiṣṣat ḥayāt al-Bukhārī","u":"https://www.ajis.org/index.php/ajiss/article/view/3737","by":"Muntasir Zaman, American Journal of Islam and Society"}],"projects":[{"n":"Collections chart","l":"Beginner","d":"Make a table of the Six Books plus the Muwaṭṭaʾ and Musnad Aḥmad: author, death date, genre, arrangement, and the author's stated standard."},{"n":"Muqaddimah summary","l":"Intermediate","d":"Write a 1,000-word summary of Muslim's introduction in numbered points, quoting the key statements on narrators and on connected chains."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Browse each collection's book and chapter structure."}],"section":"hadith"},{"id":"h_riyad","section":"hadith","title":"Reading a ḥadīth collection: Riyāḍ al-Ṣāliḥīn","short":"Riyāḍ al-Ṣāliḥīn","level":"Beginner","why":"Al-Nawawī's Riyāḍ al-Ṣāliḥīn is the most widely read ḥadīth book on character and devotion, and reading it chapter by chapter teaches both the Prophetic way of life and how a classical collection is built.","mins":1500,"pre":["b_forty"],"ideas":["Al-Nawawī (631–676 AH), the Shāfiʿī jurist and ḥadīth scholar of Damascus, arranged about 1,900 ḥadīth in 372 chapters. In his preface he says he will include only clear, authentic reports, drawn mostly from al-Bukhārī, Muslim and the Sunan. Later editors such as Shuʿayb al-Arnaʾūṭ and al-Albānī judged a small number of reports weaker than that, so read each ḥadīth with its grading.","Each chapter heading states a teaching and is followed first by Qurʾānic verses and then by ḥadīth. The headings are al-Nawawī's own understanding of the texts, so they work like a short commentary, much as al-Bukhārī's chapter titles do.","The long opening book covers the inner life (sincerity, repentance, patience, truthfulness, watchfulness, certainty and reliance on Allah) and social duties (rights of parents, kin, neighbours and orphans). Later books treat manners of eating, dress, sleep and greeting, visiting the sick and funerals, travel, the virtues of acts of worship, knowledge, remembrance and duʿāʾ, and finally prohibited matters and forgiveness.","Standard commentaries include Ibn ʿAllān's Dalīl al-Fāliḥīn, the modern Nuzhat al-Muttaqīn and Ibn ʿUthaymīn's Sharḥ Riyāḍ al-Ṣāliḥīn. A commentary explains vocabulary, links each report to related texts and draws out rulings and lessons, which protects the reader from taking a single report out of context."],"callout":["Method","Read one chapter at a sitting: first the heading, then the verses, then the ḥadīth, then a commentary. Note the source and grading of each report before drawing a lesson from it."],"lectures":[{"t":"The Explanation of Riyadh us-Saliheen (128 lessons)","u":"https://www.youtube.com/playlist?list=PLDIGeRnca9NwBCgKFPIUEcckma3Y9iI8c","by":"Ustadh Hisham Abouzeid"},{"t":"Riyad as-Salihin Explained (10 classes)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQHMKjx3JlrOPnQywsRG9scr","by":"Shaykh Dr Tarek Elgawhary (WISE English Academy)"},{"t":"شرح رياض الصالحين (Arabic, 438 lessons)","u":"https://www.youtube.com/playlist?list=PL92HwYx3aJluDh7aiuGMg-sXP3roOSRYV","by":"Shaykh Muṣṭafā al-ʿAdawī"}],"papers":[{"t":"Riyāḍ al-Ṣāliḥīn (Arabic and English, with gradings)","u":"https://sunnah.com/riyadussalihin","by":"al-Nawawī (sunnah.com)"},{"t":"Riyāḍ al-Ṣāliḥīn, the opening book (Kitāb al-Muqaddimāt)","u":"https://sunnah.com/riyadussalihin/introduction","by":"al-Nawawī (sunnah.com)"},{"t":"Riyāḍ al-Ṣāliḥīn (Arabic, al-Risālah edition)","u":"https://shamela.ws/book/12014","by":"al-Nawawī"},{"t":"Sharḥ Riyāḍ al-Ṣāliḥīn (Arabic commentary)","u":"https://shamela.ws/book/9260","by":"Muḥammad ibn Ṣāliḥ al-ʿUthaymīn"}],"reads":[{"t":"An Introduction to the Science of Hadith: classification according to the reliability and memory of reporters","u":"https://www.islamic-awareness.org/hadith/ulum/asb7.html","by":"Suhaib Hasan (Islamic Awareness)"},{"t":"Give It a Second Thought: Dealing with Apparently Problematic Hadiths","u":"https://yaqeeninstitute.org/read/paper/dealing-with-apparently-problematic-hadiths","by":"Mufti Muntasir Zaman (Yaqeen Institute)"}],"projects":[{"n":"Chapter digest","l":"Beginner","d":"For each of the first twenty chapters, write the heading, the key verse, one ḥadīth with its source and grading, and a two-sentence lesson drawn from a commentary."},{"n":"Source audit","l":"Intermediate","d":"Take one chapter and tabulate every report's source collection, Companion narrator and grading on sunnah.com, then write a paragraph on how al-Nawawī selected and ordered them."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read Riyāḍ al-Ṣāliḥīn with Arabic text, English translation, references and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic commentaries alongside the text."}]},{"id":"happly","title":"Using ḥadīth responsibly: weak vs fabricated","short":"Weak vs fabricated","level":"Beginner","why":"Most errors in everyday religious talk come from quoting reports without checking them, so this topic turns the theory into habits.","mins":300,"pre":["hterms","collections"],"ideas":["A weak (ḍaʿīf) report has a defect in its chain or narrators but is not shown to be false, and some weak reports are strengthened by others. A fabricated (mawḍūʿ) report is a forgery, and Muslim's introduction warns that whoever narrates something from the Prophet ﷺ knowing it to be false is one of the liars.","Many scholars allowed citing mildly weak reports for virtuous deeds and exhortation (faḍāʾil al-aʿmāl), but not for creed or for establishing rulings. Conditions reported from Ibn Ḥajar are that the weakness is not severe, the deed falls under an established general principle, and one does not believe it to be established; other scholars rejected the practice altogether.","Ibn al-Ṣalāḥ and al-Nawawī advise wording that matches the grade: use \"the Prophet ﷺ said\" for authentic reports and a passive form such as \"it is reported\" for weak ones. This keeps speech honest without discarding the scholarly tradition.","Gradings are scholarly judgements and can differ between critics such as Ibn Ḥajar, al-Haythamī, al-Albānī and Shuʿayb al-Arnaʾūṭ. A jurist's use of a report may rest on reasons beyond its isolated grade, so a layperson should cite the grader and avoid declaring a whole school wrong on the basis of one grading."],"callout":["Pitfall","Do not forward a ḥadīth you have not traced to a collection and a grade. \"It is in a book\" is not a grade, and many popular sayings attributed to the Prophet ﷺ have no chain at all."],"lectures":[{"t":"What is the ruling on using weak Hadiths? (Ask Shaykh YQ #5)","u":"https://www.youtube.com/watch?v=6eVjGNygUVY","by":"Yasir Qadhi"},{"t":"Why Do Scholars Include Weak Hadith in Their Collections?","u":"https://www.youtube.com/watch?v=2ygL450p2uQ","by":"Irshaad Sedick / SeekersGuidance"},{"t":"Acting on Weak Hadiths","u":"https://www.youtube.com/watch?v=-YfsZyCT08M","by":"Talweeh Academy"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī 107: the sin of lying about the Prophet ﷺ","u":"https://sunnah.com/bukhari:107","by":"al-Bukhārī (sunnah.com translation)"},{"t":"Introduction (Muqaddimah) to Ṣaḥīḥ Muslim: chapters on narrating from liars","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com translation)"}],"reads":[{"t":"Report on the Study: The Danger of Equating Weak (Ḍaʿīf) Hadith with Fabricated (Mawḍūʿ) Hadith","u":"https://aliftaa.jo/article-en/5991/Report-on-the-Study-The-Danger-of-Equating-Weak-af-Hadith-wi","by":"General Iftaa' Department of Jordan (on Khalil Mulla Khatir al-Azami)"},{"t":"Classification of ḥadīth according to the reliability and memory of reporters","u":"https://www.islamic-awareness.org/hadith/ulum/asb7.html","by":"Suhaib Hasan (hosted by Islamic Awareness)"}],"projects":[{"n":"Verification log","l":"Beginner","d":"Collect ten ḥadīths you have heard in talks or online and, for each, record the collection, number, grade and grader, or note that no source was found."},{"n":"Wording guide","l":"Beginner","d":"Write a one-page guide for a study circle on how to cite ḥadīths at each grade, with sample sentences for ṣaḥīḥ, ḥasan, ḍaʿīf and mawḍūʿ reports."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Check references and the grades given for Sunan collections."}],"section":"hadith"}]},{"id":"quran","title":"Qurʾānic sciences & tafsīr","level":"Beginner","intro":"ʿUlūm al-Qurʾān covers how the Qurʾān was revealed, written down and recited, and the tools needed to interpret it. This month moves from those foundations to the method and practice of tafsīr in three major commentaries.","phase":8,"optional":false,"topics":[{"id":"ulum","title":"ʿUlūm al-Qurʾān: revelation, compilation, qirāʾāt","short":"ʿUlūm al-Qurʾān","level":"Beginner","why":"Knowing how the Qurʾān was revealed, compiled and transmitted grounds your confidence in the text and explains features such as the variant readings.","mins":480,"pre":["b_tajweed","ar_alphabet"],"ideas":["The Qurʾān was revealed in parts over about twenty-three years, beginning with the opening verses of Sūrat al-ʿAlaq (96:1–5) in the cave of Ḥirāʾ. The Qurʾān itself explains that piecemeal revelation strengthened the Prophet's ﷺ heart (25:32).","In the Prophet's ﷺ lifetime the Qurʾān was memorised by many Companions and written on separate materials. After many memorisers died at the Battle of al-Yamāmah, Abū Bakr had Zayd ibn Thābit gather it into one set of sheets, which passed to ʿUmar and then to Ḥafṣah (Bukhārī 4986).","Under ʿUthmān, after Ḥudhayfah reported disputes over recitation, a committee led by Zayd made standard copies from Ḥafṣah's sheets and sent them to the main cities (Bukhārī 4987). The Prophet ﷺ had taught that the Qurʾān was revealed in seven aḥruf (Bukhārī 4992), and scholars hold many views on what the aḥruf were.","The canonical readings (qirāʾāt) are ten, seven of which were systematised by Ibn Mujāhid (d. 324/936). A reading is accepted when it has an authentic chain, fits the ʿUthmānic script and is valid Arabic. Each reading is transmitted through named narrators, such as Ḥafṣ from ʿĀṣim and Warsh from Nāfiʿ."],"callout":["Method","Read the compilation narrations in Bukhārī directly before reading any modern summary. Then build a timeline from the first revelation to the ʿUthmānic copies with the people involved at each stage."],"lectures":[{"t":"Sciences of the Qur'an, Lesson 6: The compilation of the Qur'an","u":"https://www.youtube.com/watch?v=cRfbqBCV54I","by":"Islamic Centre Nottingham"},{"t":"Sciences of the Qur'an, Lesson 5: Introduction to the Qira'at and the Qurra","u":"https://www.youtube.com/watch?v=FIWWE_Nzhx0","by":"Islamic Centre Nottingham"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī 4986: Abū Bakr's collection of the Qurʾān","u":"https://sunnah.com/bukhari:4986","by":"al-Bukhārī (sunnah.com translation)"},{"t":"Ṣaḥīḥ al-Bukhārī 4987: ʿUthmān's copies of the Qurʾān","u":"https://sunnah.com/bukhari:4987","by":"al-Bukhārī (sunnah.com translation)"},{"t":"Ṣaḥīḥ al-Bukhārī 4992: the Qurʾān revealed in seven aḥruf","u":"https://sunnah.com/bukhari:4992","by":"al-Bukhārī (sunnah.com translation)"}],"reads":[{"t":"How the Qur'an Was Preserved During the Prophet's ﷺ Time: Mechanisms of Oral and Written Transmission","u":"https://yaqeeninstitute.org/read/paper/how-the-quran-was-preserved-during-the-prophets-time-mechanisms-of-oral-and-written-transmission","by":"Yousef Wahb, Yaqeen Institute"},{"t":"The ʿUthmānic Codex: Understanding how the Qur'an was Preserved","u":"https://yaqeeninstitute.org/read/paper/the-uthmanic-codex-understanding-how-the-quran-was-preserved","by":"Ammar Khatib & Nazir Khan, Yaqeen Institute"},{"t":"Can the Qur'an Be Recited in Different Ways? The Meaning and Wisdom of Qira'at","u":"https://yaqeeninstitute.org/read/paper/can-the-quran-be-recited-in-different-ways-the-meaning-and-wisdom-of-qiraat","by":"Yousef Wahb, Yaqeen Institute"}],"projects":[{"n":"Compilation timeline","l":"Beginner","d":"Produce an annotated timeline from the first revelation to the ʿUthmānic copies, citing the ḥadīth number for each event."},{"n":"Qirāʾāt table","l":"Intermediate","d":"Make a table of the ten readers with their city, death date and two transmitters, and mark which reading is most common in which region today."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read and listen to the text with translation."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Check word-by-word grammar and morphology."}],"section":"quran"},{"id":"context","title":"Makkī/Madanī, asbāb al-nuzūl and naskh","short":"Context & naskh","level":"Intermediate","why":"When and why a verse was revealed, and whether its ruling still stands, shape how it is understood and applied.","mins":420,"pre":["ulum","sources"],"ideas":["Most scholars define Makkī as revealed before the Hijrah and Madanī as revealed after it, wherever the verse came down. Makkī passages focus on tawḥīd, the afterlife and the stories of earlier prophets, while Madanī passages add laws, community life and the hypocrites; this is known mainly from the Companions' reports.","Asbāb al-nuzūl are the events or questions that occasioned a revelation, and they are known only through transmitted reports that must be authenticated. The governing principle is that \"the lesson lies in the generality of the wording, not the specificity of the cause\", so a verse is not limited to its first occasion.","Naskh is the lifting of an earlier ruling by a later text. A standard example is the widow's waiting period of a year (2:240), which most exegetes hold was replaced by four months and ten days (2:234); the staged prohibition of wine (2:219, 4:43, 5:90) shows gradual legislation.","The early generations used \"naskh\" broadly, including the specification or qualification of a general ruling, as Ibn Taymiyyah and Ibn al-Qayyim observed. This is one reason lists of abrogated verses vary so much: some later works claimed hundreds, al-Suyūṭī accepted about twenty, and Shāh Walī Allāh reduced them to five."],"callout":["Pitfall","Do not accept a claim of abrogation or a story of revelation without a source and an authentic chain. Many popular asbāb reports are weak, and later writers often labelled reconcilable verses as abrogated."],"lectures":[{"t":"Sciences of the Qur'an, Lesson 3: Causes of Revelation (Asbab al-Nuzul)","u":"https://www.youtube.com/watch?v=nOD-5LBg1RU","by":"Islamic Centre Nottingham"},{"t":"Sciences of the Qur'an, Lesson 10: Nasikh and Mansukh in the Qur'an","u":"https://www.youtube.com/watch?v=-c48emHWsVg","by":"Islamic Centre Nottingham"},{"t":"Why are there abrogated verses in the Qur'an?","u":"https://www.youtube.com/watch?v=5cOldpKNFts","by":"Bayan Graduate School"}],"papers":[{"t":"Asbāb al-Nuzūl (English translation, free online)","u":"https://www.altafsir.com/WahidiAsbabAlnuzul.asp","by":"al-Wāḥidī (trans. Mokrane Guezzou), Royal Aal al-Bayt Institute"},{"t":"Qurʾān 2:106 with Tafsīr Ibn Kathīr (the verse on abrogation)","u":"https://quran.com/2:106/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Darussalam)"},{"t":"Qurʾān 2:240 with Tafsīr Ibn Kathīr (the waiting period example)","u":"https://quran.com/2:240/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Darussalam)"}],"reads":[{"t":"Abrogated Rulings in the Qur'an: Discerning their Divine Wisdom","u":"https://yaqeeninstitute.org/read/paper/abrogated-rulings-in-the-quran-discerning-their-divine-wisdom","by":"Yaqeen Institute"},{"t":"The Chronology and Background of Qur'anic Revelation","u":"https://www.ilmgate.org/the-chronology-and-background-of-quranic-revelation/","by":"Muhammad Taqi Usmani (trans. Swaleh Siddiqui), IlmGate"}],"projects":[{"n":"Asbāb case file","l":"Intermediate","d":"Choose five verses with reported occasions in al-Wāḥidī, find each report's source and grade, and write whether the general wording extends beyond the occasion."},{"n":"Naskh dossier","l":"Intermediate","d":"Compare 2:240 and 2:234 and the three wine verses using Ibn Kathīr, and write a two-page note on whether each case is abrogation, specification or gradual legislation."}],"repos":[{"r":"Altafsir.com","u":"https://www.altafsir.com/","d":"Read al-Wāḥidī's Asbāb al-Nuzūl and classical Arabic tafsīrs side by side."},{"r":"Quran.com","u":"https://quran.com/","d":"Read each verse in its passage with translation."}],"section":"quran"},{"id":"q_translation","section":"quran","title":"Choosing and using a Qurʾān translation; tadabbur","short":"Translations","level":"Beginner","why":"Most English-speaking learners first meet the Qurʾān through translation, so they need to know what a translation can and cannot do, how the main English versions differ, and how to reflect (tadabbur) responsibly.","mins":500,"pre":[],"ideas":["Muslim scholars define the Qurʾān as the Arabic speech of Allah revealed to the Prophet ﷺ, inimitable and recited in worship. A translation is a human rendering of its meanings (tarjamat al-maʿānī), so it is not itself the Qurʾān: it cannot be recited in ṣalāh in place of the Arabic according to the great majority of scholars, it carries the translator's interpretive choices, and rulings should never be drawn from a translation alone.","Older Muslim translations: Marmaduke Pickthall's The Meaning of the Glorious Koran (1930) stays close to the Arabic in archaic English. Abdullah Yusuf Ali's The Holy Qurʾān (1934–38) is more poetic and has extensive notes, some of which were revised in later Saudi-published editions. Saheeh International (1997) is clear and literal, uses brackets to show added words, and renders the divine attributes in line with Atharī theology.","Recent translations: M. A. S. Abdel Haleem (Oxford, 2004) uses idiomatic modern English and pays close attention to context, at times paraphrasing. The Study Quran (2015, ed. S. H. Nasr and others) adds a long commentary drawn from many Sunni, Shīʿī and Sufi tafsīrs, and some reviewers have questioned parts of its interpretive outlook. Mustafa Khattab's The Clear Quran (2016) uses plain contemporary English. Nuh Ha Mim Keller's The Quran Beheld (2022) aims at a literary English rendering.","Tadabbur is reflective reading aimed at understanding and action: 'a blessed Book We have sent down to you so that they may reflect on its verses' (Q 38:29). It is not tafsīr: tadabbur draws personal lessons, while tafsīr explains meaning by rules and sources. Good practice is to read the Arabic, compare two or three translations, and check an abridged classical tafsīr wherever they disagree."],"callout":["Method","Pick one literal translation and one idiomatic one and read them in parallel. Where they differ, treat that as a question to take to a tafsīr, not as a choice to settle by taste."],"lectures":[{"t":"The Qur'an and its Translations","u":"https://www.youtube.com/watch?v=AwTzZze5T3U","by":"Professor Muhammad Abdel Haleem (The Islamic College)"},{"t":"How the Qur'an has been Interpreted and Translated: Understanding the Tafsir Tradition","u":"https://www.youtube.com/watch?v=IrJWOpUxX6Y","by":"Johanna Pink (Exploring the Quran and the Bible)"},{"t":"Tafseer vs Tadabbur: Which One Does Nouman Ali Khan Do?","u":"https://www.youtube.com/watch?v=-bmB-6QKoo8","by":"Nouman Ali Khan (Bayyinah)"}],"papers":[{"t":"Compare translations verse by verse: Abdel Haleem, Saheeh International, Pickthall, Yusuf Ali","u":"https://quran.com/2:2?translations=85,20,19,22","by":"The Qurʾān (quran.com)"},{"t":"The Meaning of the Glorious Koran (1930 first edition)","u":"https://archive.org/details/in.ernet.dli.2015.216140","by":"Marmaduke Pickthall (Digital Library of India scan)"},{"t":"The Clear Quran, read online","u":"https://theclearquran.org/","by":"Mustafa Khattab"},{"t":"The Quran Beheld","u":"https://quranbeheld.com/","by":"Nuh Ha Mim Keller (print)"}],"reads":[{"t":"Qurʾān translation of the week #192: The 'Saheeh International': a 'Saudi' team translation into English","u":"https://gloqur.de/quran-translation-of-the-week-192-the-saheeh-international-a-saudi-team-translation-into-english/","by":"GloQur project, University of Freiburg"},{"t":"Qurʾān translation of the week #91: Abdullah Yusuf Ali and his afterlives","u":"https://gloqur.de/quran-translation-of-the-week-91-abdullah-yusuf-ali-and-his-afterlives/","by":"GloQur project, University of Freiburg"},{"t":"Qurʾān translation of the week #204: The Qurʾān, clear and easy: three recent English translations","u":"https://gloqur.de/quran-translation-of-the-week-204-the-quran-clear-and-easy-three-recent-english-translations/","by":"GloQur project, University of Freiburg"}],"projects":[{"n":"Five-verse comparison","l":"Beginner","d":"Choose five verses (for example Q 1:2, 2:2, 4:34, 20:5 and 112:2) and copy four translations of each into a table, marking where they differ and what interpretive choice each difference reflects; check one abridged tafsīr for each."},{"n":"Tadabbur notebook","l":"Beginner","d":"For one short sūrah, write the Arabic, two translations, a summary of a classical tafsīr, and then a separate section of personal reflections, keeping tafsīr and reflection clearly apart."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Show several English translations side by side with the Arabic and abridged tafsīr."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Check the word-by-word grammar behind a disputed translation choice."}]},{"id":"tmethod","title":"Tafsīr methodology: riwāyah and dirāyah","short":"Tafsīr method","level":"Intermediate","why":"Without a method, tafsīr becomes personal opinion; the classical hierarchy of sources tells you what counts as evidence for a meaning.","mins":420,"pre":["ulum","context","ar_vocab"],"ideas":["Ibn Taymiyyah's Muqaddimah fī Uṣūl al-Tafsīr sets out a method that Ibn Kathīr also follows: explain the Qurʾān by the Qurʾān, then by the Sunnah, then by the Companions, then by the major Successors such as Mujāhid, and then by the Arabic language. Other classical statements of method include al-Ṭabarī's and al-Qurṭubī's introductions, al-Zarkashī's al-Burhān and al-Suyūṭī's al-Itqān, which list the sciences a commentator needs.","Tafsīr bi al-riwāyah (or bi al-maʾthūr) relies on transmitted reports, while tafsīr bi al-dirāyah (or bi al-raʾy) relies on reasoned interpretation. Praiseworthy raʾy is grounded in language, context and sound principles; blameworthy raʾy is opinion without knowledge or interpretation bent to fit a doctrine.","Most madrasa tafsīr belongs to the Ashʿarī and Māturīdī dirāyah tradition, such as al-Rāzī's Mafātīḥ al-Ghayb, al-Bayḍāwī's Anwār al-Tanzīl and al-Nasafī's Madārik al-Tanzīl, which add language, kalām and uṣūl to the reports. Legal (aḥkām) tafsīr gathers the rulings of the verses: al-Jaṣṣāṣ (Ḥanafī), Ibn al-ʿArabī (Mālikī), al-Kiyā al-Harrāsī (Shāfiʿī) and al-Qurṭubī.","Transmitted tafsīr still needs checking: Aḥmad ibn Ḥanbal is reported to have said that tafsīr largely lacks sound chains, and Ibn Taymiyyah notes that most early disagreement is of variety (tanawwuʿ) rather than contradiction. Isrāʾīliyyāt, reports from Jewish and Christian sources, are accepted where our sources confirm them, rejected where they contradict them, and otherwise narrated without affirmation."],"callout":["Method","When you read any tafsīr, label each explanation by its source: Qurʾān, ḥadīth, Companion, Successor, language or the author's reasoning. This habit shows you quickly how strong each claim is."],"lectures":[{"t":"Shaykh Akram on Usul al-Tafsir (How to interpret the Quran)","u":"https://www.youtube.com/watch?v=1S_oi-jR7sI","by":"Mohammad Akram Nadwi / Al-Salam Institute"},{"t":"Muqaddimah fi Usool at-Tafseer (playlist)","u":"https://www.youtube.com/playlist?list=PLRZgTut7FeLIbfY4NJ6UchV7dYkLBLJby","by":"Muallaq"},{"t":"Sciences of the Qur'an, Lesson 12: Tafsir in the time of the Sahaba and Tabi'in","u":"https://www.youtube.com/watch?v=XW16oohFysA","by":"Islamic Centre Nottingham"}],"papers":[{"t":"How Tafsir is Performed? (chapter from An Introduction to the Principles of Tafsir)","u":"https://islamcontent.com/en/content/70350","by":"Ibn Taymiyyah (English, IslamContent)"},{"t":"Muqaddimah fī Uṣūl al-Tafsīr (Arabic text)","u":"https://archive.org/details/muqaddimah-fi-usul-al-tafsir-by-ibn-taymiyyah","by":"Ibn Taymiyyah"},{"t":"al-Jāmiʿ li-Aḥkām al-Qurʾān: introduction, on the conditions of tafsīr and tafsīr by opinion (Arabic)","u":"https://shamela.ws/book/20855","by":"al-Qurṭubī (al-Maktabah al-Shāmilah)"}],"reads":[{"t":"Tafsīr, taʾwīl, and tadabbur","u":"https://www.akramnadwi.com/?p=4986","by":"Mohammad Akram Nadwi"},{"t":"Methods of Tafseer - I","u":"https://islamweb.net/en/article/101597/methods-of-tafseer-i","by":"IslamWeb"}],"projects":[{"n":"Source-labelling exercise","l":"Intermediate","d":"Take the tafsīr of Sūrat al-Fātiḥah in Ibn Kathīr and tag every sentence by its source type, then write a paragraph on the balance of riwāyah and dirāyah."},{"n":"Method summary","l":"Intermediate","d":"Write a 1,000-word summary of Ibn Taymiyyah's Muqaddimah in numbered principles, each with one Qurʾānic example of your own."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read Ibn Kathīr's tafsīr verse by verse in English."},{"r":"Altafsir.com","u":"https://www.altafsir.com/","d":"Compare early and later Arabic tafsīrs on the same verse."}],"section":"quran"},{"id":"tcompare","title":"Comparing tafsīr: al-Ṭabarī, Ibn Kathīr, al-Qurṭubī, al-Jalālayn and al-Saʿdī","short":"Comparing tafsīr","level":"Intermediate","why":"Reading the same verse in commentaries from different eras and schools shows how the tafsīr tradition builds on itself, from transmitted reports to legal, Ashʿarī and later Ḥanbalī readings, and what each work is best used for.","mins":720,"pre":["tmethod","ar_dict"],"ideas":["Al-Ṭabarī (d. 310/923) wrote Jāmiʿ al-Bayān, the great early encyclopaedia of transmitted tafsīr. For each verse he lists the views of Companions and Successors with their chains, then states the view he judges most correct using language, context and consensus; giving a chain is not the same as authenticating it.","Ibn Kathīr (d. 774/1373) applies the method of his teacher Ibn Taymiyyah, explaining verses with other verses and with ḥadīth, often with comments on chains. He draws heavily on al-Ṭabarī and Ibn Abī Ḥātim and is cautious about isrāʾīliyyāt, though he does not exclude them entirely; the English version on quran.com is an abridgment, not the full work.","Al-Qurṭubī (d. 671/1273), a Mālikī jurist with Ashʿarī theology, divides each passage of al-Jāmiʿ li-Aḥkām al-Qurʾān into numbered issues (masāʾil) covering rulings of the schools, readings and grammar. Tafsīr al-Jalālayn of al-Maḥallī (d. 864/1459) and al-Suyūṭī (d. 911/1505) is a very short Shāfiʿī-Ashʿarī gloss and, with al-Bayḍāwī's Anwār al-Tanzīl at a higher level, a standard madrasa text.","Al-Saʿdī (d. 1376/1957), a Najdī Ḥanbalī scholar, wrote Taysīr al-Karīm al-Raḥmān, a concise commentary that omits chains and isrāʾīliyyāt and concentrates on the meaning, guidance and practical lessons of each passage. Compare commentaries verse by verse: note what each author adds, which sources he cites and where he chooses between views."],"callout":["Method","Choose one short passage, such as 2:143, and read it in all five commentaries before moving on. Record in columns the sources each uses, the rulings or doctrines each draws out, and the conclusion each reaches."],"lectures":[{"t":"Freiburg conversations on tafsir #06: Walid Saleh","u":"https://www.youtube.com/watch?v=BbwVpVFXEAc","by":"Walid Saleh / GloQur, University of Freiburg"},{"t":"The Advantages of Tafsir as-Saʿdi","u":"https://www.youtube.com/watch?v=pTWQMUH-P3A","by":"Muhammad Tim Humble"}],"papers":[{"t":"Tafsīr al-Ṭabarī on Qurʾān 2:143 (Arabic)","u":"https://quran.com/2:143/tafsirs/ar-tafsir-al-tabari","by":"al-Ṭabarī"},{"t":"Tafsīr Ibn Kathīr on Qurʾān 2:143 (abridged English)","u":"https://quran.com/2:143/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (Darussalam abridgment)"},{"t":"al-Jāmiʿ li-Aḥkām al-Qurʾān on Qurʾān 2:143 (Arabic)","u":"https://quran.com/2:143/tafsirs/ar-tafseer-al-qurtubi","by":"al-Qurṭubī (partial English: Aisha Bewley, Dar al-Taqwa, print)"},{"t":"Tafsīr al-Jalālayn on Qurʾān 2:143 (English)","u":"https://www.altafsir.com/Tafasir.asp?tMadhNo=0&tTafsirNo=74&tSoraNo=2&tAyahNo=143&tDisplay=yes&LanguageId=2","by":"al-Maḥallī and al-Suyūṭī (trans. Feras Hamza, Royal Aal al-Bayt Institute, altafsir.com)"}],"reads":[{"t":"Methodology of Tafseer al-Qurtubi: Sources, Styles and Manhaj","u":"https://journals2.ums.ac.id/index.php/qist/article/view/1451","by":"Abdul Rohman, Barikli Mubaroka & Qoree Butlam, QiST: Journal of Quran and Tafseer Studies 2:2 (2023)"},{"t":"Isrāʾiliyyāt Narratives in Ibn Kathīr's Tafsīr: Methodological Perspectives","u":"https://journal.sadra.ac.id/ojs/index.php/tanzil/article/view/563","by":"Supriyanto & El Hassen Sid Ahmed El Habib, Tanzil (2026)"},{"t":"Unveiling the Method of Interpretation by Abdurrahman bin Nasir as-Saʿdi in Taisir al-Karim al-Rahman","u":"https://journal.iaincurup.ac.id/index.php/alquds/article/download/5739/pdf","by":"Hamnah, Achmad Abu Bakar & Firdaus, Jurnal Studi Alquran dan Hadis (2023)"}],"projects":[{"n":"Five-column comparison","l":"Intermediate","d":"Compare the five commentaries on three verses of your choice in a table with columns for sources cited, views listed, rulings or doctrines drawn out, and final preference."},{"n":"Reviewer's note","l":"Advanced","d":"Write a 1,500-word essay on when a student should use each of these tafsīrs, with quoted examples showing the strengths and limits of the transmitted, legal and concise approaches."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Switch between al-Ṭabarī, Ibn Kathīr, al-Qurṭubī and al-Saʿdī on the same verse."},{"r":"Altafsir.com","u":"https://www.altafsir.com/","d":"Read al-Jalālayn in English and the full Arabic texts of al-Ṭabarī, al-Qurṭubī, al-Bayḍāwī and Ibn Kathīr."}],"section":"quran"}]},{"id":"y1m6","title":"Fiqh, akhlāq & tazkiyah","level":"Intermediate","intro":"One madhhab's manual, the rights of others, and the inner life.","phase":9,"optional":false,"topics":[{"id":"madhhab","title":"Studying one madhhab: the beginner manuals","short":"One madhhab","level":"Intermediate","why":"A short beginner text (matn) studied with a teacher gives you an ordered, reliable map of worship in one school before you compare schools.","mins":1500,"pre":["taqlid","b_worship"],"ideas":["Each school has standard starter texts: Nūr al-Īḍāḥ of al-Shurunbulālī (d. 1069/1659) for the Ḥanafīs, Mukhtaṣar al-Akhḍarī (10th/16th c.) for the Mālikīs, Safīnat al-Najā or Matn Abī Shujāʿ (al-Ghāyah wa al-Taqrīb) for the Shāfiʿīs, with ʿUmdat al-Sālik of Ibn al-Naqīb (d. 769/1368, translated as Reliance of the Traveller) as the next step, and ʿUmdat al-Fiqh of Ibn Qudāmah (d. 620/1223) or Akhṣar al-Mukhtaṣarāt for the Ḥanbalīs.","A matn is a compressed core text meant to be memorised or read closely; a sharḥ explains it; a ḥāshiyah comments on the sharḥ. Beginners read the matn with one sharḥ or a teacher, not the whole commentary tradition at once.","Each school distinguishes its relied-upon position (al-muʿtamad or al-muftā bihi) from minority views inside the school. Manuals for beginners usually give only the relied-upon position, which is why they rarely cite evidence.","Learning one school first is a teaching method, not a claim that other schools are wrong. Comparative fiqh with evidences (fiqh muqāran) comes later, once the student knows how one school's rulings fit together."],"callout":["Method","Choose the school of your local teachers, read the purification and prayer chapters slowly, and keep a glossary of technical terms (farḍ, wājib, sunnah, makrūh) as that school defines them."],"lectures":[{"t":"Introduction: Shurunbulālī's Nūr al-Īḍāḥ explained","u":"https://www.youtube.com/watch?v=fYg2K4LPdCs","by":"Faraz Rabbani / SeekersGuidance"},{"t":"Mālikī fiqh of al-Akhḍarī: full explanation of the beginner's text","u":"https://www.youtube.com/watch?v=bfQwoJYw4c8","by":"Rami Nsour / The Light Alliance"},{"t":"Fiqh of Worship: Ibn Qudāmah's ʿUmdat al-Fiqh (playlist)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqRZce0XPksZ3kvGGkUbsGFA","by":"Hatem al-Haj"}],"papers":[{"t":"Nūr al-Īḍāḥ (Arabic text, OpenITI)","u":"https://archive.org/details/wuquf-openiti-1069ibncammarshurunbulali.nuridah-8a131eceda3a","by":"Ḥasan al-Shurunbulālī (Ḥanafī)"},{"t":"The Abridgment of al-Akhḍarī: student workbook (CC BY-NC-ND)","u":"https://archive.org/details/alhamra-institute-the-abridgment-of-al-akhdari-student-workbook","by":"al-Akhḍarī (Mālikī; Alhamra Institute)"},{"t":"Matn Abī Shujāʿ (al-Ghāyah wa al-Taqrīb) (Arabic)","u":"https://shamela.ws/book/11370","by":"Abū Shujāʿ al-Iṣfahānī (Shāfiʿī; al-Maktabah al-Shāmilah; English: Musa Furber, The Ultimate Conspectus, print)"},{"t":"ʿUmdat al-Fiqh (Arabic)","u":"https://shamela.ws/book/11315","by":"Ibn Qudāmah (Ḥanbalī; al-Maktabah al-Shāmilah)"}],"reads":[{"t":"What is a Madhhab? Exploring the Role of Islamic Schools of Law","u":"https://yaqeeninstitute.org/read/paper/what-is-a-madhhab-exploring-the-role-of-islamic-schools-of-law","by":"Emad Hamdeh / Yaqeen Institute"},{"t":"The Schools of Law and Their Importance","u":"https://dar-alifta.org/en/article/details/5649/the-schools-of-law-and-their-importance","by":"Dar al-Iftaa al-Misriyyah"}],"projects":[{"n":"Chapter outline","l":"Beginner","d":"Outline the purification chapter of your chosen manual as a numbered tree (integrals, conditions, sunnahs, invalidators), one line per item with the Arabic term."},{"n":"Four-school table","l":"Intermediate","d":"For five issues in wuḍūʾ (e.g. intention, rubbing the head, order), record the position of each school from its beginner manual and note where they agree."}],"repos":[{"r":"IslamQA.org","u":"https://islamqa.org/","d":"Answers sorted by madhhab from established fatwa sites, useful for checking your school's view."}],"section":"fiqh"},{"id":"ak_rights","section":"tazkiyah","title":"Akhlāq and rights: parents, spouse, children and neighbours (al-Adab al-Mufrad)","short":"Rights & adab","level":"Beginner","why":"Al-Bukhārī's al-Adab al-Mufrad gathers the Prophetic teaching on how to treat the people closest to us, and these duties (ḥuqūq al-ʿibād) are where faith is most often tested in daily life.","mins":900,"pre":["b_forty","b_heart"],"ideas":["Al-Adab al-Mufrad is a separate work by al-Bukhārī (d. 256/870), not part of his Ṣaḥīḥ. It mixes Prophetic ḥadīth with reports from Companions and Successors, and not every report in it is ṣaḥīḥ: al-Albānī divided it into a Ṣaḥīḥ and a Ḍaʿīf volume, and sunnah.com shows a grading for each report, so check the grade before building on a narration.","The book opens with parents. The Qurʾān joins kindness to parents with the command to worship Allah alone (Q 17:23–24), and when asked who most deserves good companionship the Prophet ﷺ said 'your mother' three times, then 'your father' (al-Bukhārī 5971). Obedience has a limit, since no one is obeyed in disobedience to Allah, but kindness continues even to parents who are not Muslim (Q 31:15).","Marriage is described as tranquillity, love and mercy (Q 30:21), and husbands are told to live with their wives in kindness (Q 4:19). Wives have rights similar to their obligations (Q 2:228), and the Prophet ﷺ said 'the best of you is the best to his family' (al-Tirmidhī 3895). The detailed legal rights of spouses (mahr, maintenance, custody) are set out differently in the four madhhabs and belong to fiqh study; this topic covers the character that should shape them.","Children are owed mercy, education and fairness: the Prophet ﷺ kissed his grandson and said 'whoever does not show mercy will not be shown mercy' (al-Bukhārī 5997), and he told a father to fear Allah and be just between his children in gifts. Neighbours have a right so strong that Jibrīl kept urging it until the Prophet ﷺ thought a neighbour might inherit (al-Bukhārī 6014). The Qurʾān names both the near and the distant neighbour (Q 4:36), and early Muslims applied this to non-Muslim neighbours as well."],"callout":["Method","Read one short chapter of al-Adab al-Mufrad a day with its grading, then write down one concrete action toward a specific person. Wrongs against people are not erased by private repentance alone; they need restitution or the person's forgiveness."],"lectures":[{"t":"Al-Adab Al-Mufrad explained, ḥadīth by ḥadīth (88 lessons)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqQVqph9mLrmTpboxynfQ1mh","by":"Dr. Hatem al-Haj"},{"t":"Islamic Ethics and Behaviour: a study of al-Adab al-Mufrad (42 classes)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQHrgpQCeiRouKKOSmn4KLdW","by":"Mufti Numan Limbada (WISE English Academy)"}],"papers":[{"t":"al-Adab al-Mufrad, Book 1: Parents (Arabic and English, with gradings)","u":"https://sunnah.com/adab/1","by":"al-Bukhārī (sunnah.com)"},{"t":"al-Adab al-Mufrad, Book 6: The Neighbour","u":"https://sunnah.com/adab/6","by":"al-Bukhārī (sunnah.com)"},{"t":"al-Adab al-Mufrad, full text by chapter","u":"https://sunnah.com/adab","by":"al-Bukhārī (sunnah.com)"},{"t":"The Book on the Etiquette of Marriage (Iḥyāʾ ʿUlūm al-Dīn, Book 12)","u":"https://www.ghazali.org/works/marriage.htm","by":"al-Ghazālī (trans. Madelain Farah, ghazali.org)"}],"reads":[{"t":"Hadith #25: Justice Between Parents & Children","u":"https://yaqeeninstitute.org/read/post/hadith-25-justice-between-parents-children","by":"Omar Suleiman (Yaqeen Institute)"},{"t":"Marriage and Gender Roles in Islam: Beyond Rights and Duties","u":"https://yaqeeninstitute.org/read/paper/marriage-and-gender-roles-in-islam-beyond-rights-and-duties","by":"Tesneem Alkiek (Yaqeen Institute)"}],"projects":[{"n":"Rights map","l":"Beginner","d":"In your notebook make four columns (parents, spouse, children, neighbours). Under each, list five rights with the Qurʾānic verse or graded report from al-Adab al-Mufrad that supports it."},{"n":"Chapter journal","l":"Beginner","d":"For each chapter of Book 1 (Parents) write the main narration, its grading on sunnah.com and one practical change you will make that week, then review your entries after a month."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read al-Adab al-Mufrad and Riyāḍ al-Ṣāliḥīn in Arabic and English with gradings, and look up the ḥadīth numbers cited above."}]},{"id":"tz_tongue","title":"Guarding the tongue: backbiting, lying and slander (āfāt al-lisān)","short":"Guard the tongue","level":"Beginner","section":"tazkiyah","why":"Most daily sins are sins of speech, and the classical scholars wrote whole books defining them precisely so they can be avoided.","mins":1200,"pre":["b_heart","b_forty"],"ideas":["The Prophet ﷺ defined backbiting (ghībah) as mentioning your brother with what he would dislike; if it is true it is ghībah, and if it is false it is slander (buhtān) (Muslim 2589). Talebearing (namīmah) is carrying speech between people to cause harm, and the Prophet ﷺ said the talebearer will not enter Paradise. The Qurʾān likens backbiting to eating a dead brother's flesh (49:12).","al-Ghazālī's Book 24 of the Iḥyāʾ, Kitāb Āfāt al-Lisān, lists twenty banes of the tongue, from speaking about what does not concern you and excessive speech, through argument, cursing, mockery, lying, backbiting, talebearing and two-facedness, to careless praise and idle questions about Allah's attributes. He opens with the merit of silence, drawing on Ibn Abī al-Dunyā's earlier collection al-Ṣamt wa Ādāb al-Lisān.","Speaking about someone's faults is not always forbidden. al-Nawawī in Riyāḍ al-Ṣāliḥīn and al-Adhkār lists six recognised needs: complaining of injustice to someone who can help, seeking help to stop wrong, asking for a religious ruling, warning others (such as grading ḥadīth narrators or advising about a marriage or business partner), speaking of someone who sins openly about that sin, and identifying someone by a well-known nickname. Each is limited to what the need requires.","Lying is forbidden, but the ḥadīth allows saying what is not literally true in three settings: reconciling people, war, and between spouses to keep affection (Muslim 2605). Scholars restrict this narrowly, and many prefer indirect speech (taʿrīḍ) over open falsehood. Repentance from backbiting requires stopping, regret and resolve; scholars differ on whether one must seek the person's pardon or should instead pray for them and praise them where the harm would grow."],"callout":["Pitfall","Do not use the six exceptions as a loophole. al-Nawawī states that each permitted case is bounded by real need, and that saying more than the need requires returns to ghībah."],"lectures":[{"t":"On the Vices of the Tongue: A Study of Book 24 of the Iḥyāʾ ʿUlūm al-Dīn (10 sessions)","u":"https://www.youtube.com/playlist?list=PLMcp7trDZKJypTbmQ0N-GXOPJOtHXocTV","by":"Yahya Rhodus (Al-Maqasid)"},{"t":"Watching Our Words: The Fiqh of Guarding One's Tongue","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5H4knWY9YNBo2jMijDv-iuN","by":"Abdullah Misra (SeekersGuidance)"}],"papers":[{"t":"Riyāḍ al-Ṣāliḥīn, The Book of Prohibited Actions (chapters on backbiting, talebearing and lying)","u":"https://sunnah.com/riyadussalihin/17","by":"al-Nawawī (sunnah.com)"},{"t":"Ṣaḥīḥ Muslim 2589: the definition of backbiting","u":"https://sunnah.com/muslim:2589","by":"Muslim ibn al-Ḥajjāj (sunnah.com)"},{"t":"Iḥyāʾ ʿUlūm al-Dīn, Book 24: Kitāb Āfāt al-Lisān (Arabic; English: The Banes of the Tongue, Fons Vitae 2024, print)","u":"https://shamela.ws/book/9472","by":"al-Ghazālī (tr. Michael Abdurrahman Fitzgerald and Fouad Aresmouk)"},{"t":"al-Adhkār, chapters on the defects of the tongue (Arabic)","u":"https://shamela.ws/book/1956","by":"al-Nawawī (ed. ʿAbd al-Qādir al-Arnaʾūṭ), al-Maktabah al-Shāmilah"}],"reads":[{"t":"Qurʾān 49:12 with Tafsīr Ibn Kathīr (suspicion, spying and backbiting)","u":"https://quran.com/49:12/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Qurʾān 24:15 with Tafsīr Ibn Kathīr (spreading slander with the tongue)","u":"https://quran.com/24:15/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Iḥyāʾ ʿUlūm al-Dīn: overview of the forty books and their English translations","u":"https://www.ghazali.org/rrs-ovr/","by":"ghazali.org"}],"projects":[{"n":"Twenty banes chart","l":"Beginner","d":"Make a chart of al-Ghazālī's twenty banes of the tongue with a one-line definition, one supporting verse or ḥadīth, and his suggested remedy for each."},{"n":"Speech audit","l":"Beginner","d":"For one week, log at the end of each day any speech that fell under ghībah, namīmah, lying or mockery, without naming anyone, and write a short reflection on which al-Nawawī exception, if any, would have applied."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read Riyāḍ al-Ṣāliḥīn and the ḥadīth on speech in Arabic and English."}]},{"id":"tazkiyah","title":"Tazkiyah: the Iḥyāʾ and Jāmiʿ al-ʿUlūm wa al-Ḥikam","short":"Tazkiyah texts","level":"Intermediate","why":"These two classical works are the main bridge from basic heart-purification to a full scholarly ethics of intention, sincerity and the soul.","mins":1800,"pre":["b_heart","b_forty"],"ideas":["Al-Ghazālī's Iḥyāʾ ʿUlūm al-Dīn has forty books in four quarters: acts of worship, social customs, destructive vices (muhlikāt) and saving virtues (munjiyāt). It treats the inner meaning of each outward act.","In the Book of the Marvels of the Heart, al-Ghazālī explains four overlapping terms: heart (qalb), spirit (rūḥ), self (nafs) and intellect (ʿaql). Each can mean a physical organ or a subtle spiritual reality, and confusing the two senses causes misreading.","The Iḥyāʾ contains weak and some fabricated ḥadīth. Al-ʿIrāqī's takhrīj (al-Mughnī ʿan Ḥaml al-Asfār) grades them, and later scholars praised the work's ethics while warning against relying on those reports.","Ibn Rajab al-Ḥanbalī (d. 795/1393) wrote Jāmiʿ al-ʿUlūm wa al-Ḥikam on fifty ḥadīth: al-Nawawī's forty-two plus eight he added. He gathers early Muslim sayings on each ḥadīth, making it a ḥadīth-based manual of the inner life."],"callout":["Method","Read one book of the Iḥyāʾ at a time alongside the matching ḥadīth chapters in Ibn Rajab. Keep a practice journal; tazkiyah texts are meant to be lived, not only summarised."],"lectures":[{"t":"Al-Ghazālī's Iḥyāʾ ʿUlūm al-Dīn","u":"https://www.youtube.com/watch?v=TYcpl09uLDA","by":"Abdal Hakim Murad / Islam On Demand"},{"t":"The Marvels of the Heart (playlist)","u":"https://www.youtube.com/playlist?list=PLYhaCT6xCcql8TZed81cGqYvNaCHJqL_c","by":"Mustafa Abu Sway"}],"papers":[{"t":"The Book of Knowledge (Iḥyāʾ book 1)","u":"https://ghazali.org/books/knowledge.pdf","by":"al-Ghazālī (tr. Nabih Amin Faris)"},{"t":"The Marvels of the Heart (Iḥyāʾ book 21), thesis translation","u":"http://www.ghazali.org/books/skillie.pdf","by":"al-Ghazālī (tr. Walter J. Skellie)"},{"t":"Jāmiʿ al-ʿUlūm wa al-Ḥikam (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%AC%D8%A7%D9%85%D8%B9_%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85_%D9%88%D8%A7%D9%84%D8%AD%D9%83%D9%85","by":"Ibn Rajab al-Ḥanbalī"}],"reads":[{"t":"Al-Ghazali","u":"https://plato.stanford.edu/entries/al-ghazali/","by":"Frank Griffel / Stanford Encyclopedia of Philosophy"},{"t":"Iḥyāʾ ʿulūm al-dīn: overview of the forty books and translations","u":"https://ghazali.org/rrs-ovr/","by":"ghazali.org"}],"projects":[{"n":"Heart vocabulary","l":"Beginner","d":"Write a one-page glossary of qalb, rūḥ, nafs and ʿaql in al-Ghazālī's two senses, with a quoted line for each."},{"n":"Ḥadīth and practice","l":"Intermediate","d":"For the ḥadīth on intention and on leaving what does not concern you, summarise Ibn Rajab's commentary and record one week of applying each."}],"repos":[{"r":"ghazali.org","u":"https://www.ghazali.org/","d":"Index of al-Ghazālī's works with free translations and Arabic editions."}],"section":"tazkiyah"},{"id":"tz_sabr","section":"tazkiyah","title":"Patience, gratitude and repentance (ṣabr, shukr, tawbah)","short":"Patience & tawbah","level":"Beginner","why":"Every state a believer passes through calls for patience, gratitude or repentance, so the classical teachers treated these three as the backbone of the spiritual life.","mins":800,"pre":["b_heart"],"ideas":["Scholars such as Ibn al-Qayyim and Ibn Rajab divide ṣabr into three kinds: patience in carrying out obedience, patience in holding back from sin, and patience with painful decree. Patience is restraint of the heart from discontent, the tongue from complaint and the limbs from acts of despair. It does not mean passivity: seeking a cure, making duʿāʾ and complaining to Allah, as Yaʿqūb did (Q 12:86), are all compatible with it.","Al-Ghazālī describes shukr as three linked parts: knowing that a blessing comes from Allah, the heart's joy in the Giver, and action that uses the blessing in obedience. Gratitude is therefore shown by the heart, the tongue and the limbs, and Allah promises increase to those who are grateful (Q 14:7).","The Prophet ﷺ joined the two: 'How wonderful is the affair of the believer: if good befalls him he is grateful, and if harm befalls him he is patient, and both are good for him' (Muslim 2999). The saying that faith is half patience and half gratitude is reported from Ibn Masʿūd and developed at length by Ibn al-Qayyim in ʿUddat al-Ṣābirīn. Scholars also debated whether the grateful rich person or the patient poor person is better; al-Ghazālī and Ibn al-Qayyim both discuss it, and neither view is a settled consensus.","Tawbah is the return to Allah after sin. Al-Nawawī lists its conditions in Riyāḍ al-Ṣāliḥīn: leaving the sin, regret, and a firm resolve not to return, with a fourth condition when the sin wronged a person, namely restoring their right or seeking their pardon. Al-Ghazālī describes repentance as knowledge of the harm of sin producing the state of regret, which then produces action, and he treats it as the first station of the path."],"callout":["Pitfall","Do not read patience as accepting injustice or neglecting treatment. Patience governs the heart's response; it sits alongside taking the means, seeking help and standing up for rights."],"lectures":[{"t":"Ibn al-Qayyim's Excellence of Patience and Gratefulness, book reading (31 episodes)","u":"https://www.youtube.com/playlist?list=PLSAXs5_eRppvlQcHouI40EUEQFE4HKHen","by":"Sh. Waleed Basyouni"},{"t":"The Disease and the Cure (al-Dāʾ wa al-Dawāʾ of Ibn al-Qayyim) on sin and repentance","u":"https://www.youtube.com/playlist?list=PLlr5CtdoMSKmGAY3WF33DK-CKyzr6piUA","by":"Dr. Ali Albarghouthi"}],"papers":[{"t":"Al-Ghazālī on Repentance (Iḥyāʾ ʿUlūm al-Dīn, Book 31)","u":"https://www.ghazali.org/books/gz-repent.pdf","by":"al-Ghazālī (trans. M. S. Stern, ghazali.org)"},{"t":"Al-Ghazali on Patience and Thankfulness (Iḥyāʾ, Book 32)","u":"https://its.org.uk/catalogue/al-ghazali-on-patience-and-thankfulness-paperback/","by":"al-Ghazālī (trans. H. T. Littlejohn), Islamic Texts Society (print)"},{"t":"Riyāḍ al-Ṣāliḥīn, opening book: chapters on repentance (tawbah) and patience (ṣabr)","u":"https://sunnah.com/riyadussalihin/introduction","by":"al-Nawawī (sunnah.com)"}],"reads":[{"t":"Repentance as a Way of Life: Islam, Spirituality, & Practice","u":"https://yaqeeninstitute.org/read/paper/repentance-as-a-way-of-life-islam-spirituality-practice","by":"Roohi Tahir (Yaqeen Institute)"},{"t":"The Divine Gift of Gratitude: The Secret of Happiness in the Modern World","u":"https://yaqeeninstitute.org/read/paper/the-divine-gift-of-gratitude-the-secret-of-happiness-in-the-modern-world","by":"Roohi Tahir (Yaqeen Institute)"}],"projects":[{"n":"Three-column log","l":"Beginner","d":"For thirty days keep a notebook page with three columns (a blessing to thank Allah for, a difficulty to meet with patience, a fault to repent from) and note the verse or ḥadīth you relied on for each."},{"n":"Conditions of tawbah","l":"Beginner","d":"Summarise in one page al-Nawawī's conditions of repentance and al-Ghazālī's 'knowledge, state, action' model, then write a short private plan for repairing one wrong done to another person."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the chapters on patience, gratitude and repentance in Riyāḍ al-Ṣāliḥīn with Arabic text and gradings."}]}]},{"id":"hijri","title":"History through the Hijri centuries","level":"Intermediate","intro":"A walk through Islamic history from the Rightly Guided Caliphs to the modern era, with dates in AH and CE. Each period is linked to the scholars and books it produced.","phase":10,"optional":false,"topics":[{"id":"h_rashidun","title":"11–40 AH: the Rightly Guided Caliphs and the first fitnah","short":"Rāshidūn caliphs","level":"Intermediate","section":"history","why":"The thirty years after the Prophet ﷺ set the precedents of government, law and Qurʾān transmission that every later scholar refers to, and the civil wars that ended them explain the origins of the Khawārij and the Shīʿa and how Sunni scholars speak about the Companions.","mins":1500,"pre":["b_seerah"],"ideas":["Abū Bakr (r. 11–13/632–634) was chosen at the Saqīfah, fought the Riddah wars and, after many ḥuffāẓ died at al-Yamāmah (12/633), had Zayd ibn Thābit gather the Qurʾān into one written collection. ʿUmar (r. 13–23/634–644) oversaw al-Yarmūk, al-Qādisiyyah, Jerusalem (c. 16/637) and Egypt (20/641), and set up the dīwān, the Hijrī calendar and the garrison cities.","ʿUthmān (r. 23–35/644–656) sent standard copies of the Qurʾān to the main cities (c. 30/650) and was killed in Medina in 35/656. The first fitnah followed: ʿAlī's caliphate, the battles of the Camel (36/656) and Ṣiffīn (37/657), the arbitration, the Khawārij at Nahrawān (38/658), ʿAlī's assassination (40/661), al-Ḥasan's settlement with Muʿāwiyah (41/661) and, later, Karbalāʾ (61/680).","Sunni scholars hold that the Companions are upright (ʿudūl) as transmitters, that those who fought did so by ijtihād, and that believers refrain from disparaging them; this concerns how to speak of them, not a claim that no one erred. Ibn al-ʿArabī al-Mālikī (d. 543/1148) gave this view its classical form in al-ʿAwāṣim min al-Qawāṣim, sifting the reports of the fitnah; Shīʿī scholarship reads the same events differently.","Al-Ṭabarī's History collects reports with their chains, including many from akhbārī narrators such as Abū Mikhnaf and Sayf ibn ʿUmar, and he warns that he only passes on what he received. Modern historians (Madelung, Kennedy, Donner) read the same sources with different methods; Madelung's Succession to Muḥammad argues a contested pro-ʿAlid thesis critical of Abū Bakr, ʿUmar and Muʿāwiyah."],"callout":["Pitfall","Do not form views about Companions from popular videos or single reports. Read the narrative with dates, note which narrator each report in al-Ṭabarī comes from, and compare it with a classical Sunni framing such as al-ʿAwāṣim and with a modern historian."],"lectures":[{"t":"Lives of the Khulafaa (full series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctU9U9HX9ZGYJfisHy0E9pI8","by":"Yasir Qadhi"},{"t":"Lives of the Sahaba 35: ʿAlī pt. 6, the Battle of Ṣiffīn","u":"https://www.youtube.com/watch?v=Vtcdaiezv1M","by":"Yasir Qadhi / Memphis Islamic Center"},{"t":"How Islam Began (UnCommon Core lecture)","u":"https://www.youtube.com/watch?v=5RFK5u5lkhA","by":"Fred Donner / University of Chicago"}],"papers":[{"t":"al-ʿAwāṣim min al-Qawāṣim (Arabic, ed. Muḥibb al-Dīn al-Khaṭīb)","u":"https://shamela.ws/book/8314","by":"Abū Bakr ibn al-ʿArabī al-Mālikī (English: Aisha Bewley, Defence Against Disaster, Diwan Press, print)"},{"t":"History of the Caliphs (Taʾrīkh al-Khulafāʾ), 1881","u":"https://archive.org/details/cu31924023164654","by":"al-Suyūṭī (tr. H. S. Jarrett)"},{"t":"The History of al-Ṭabarī, vol. 15: The Crisis of the Early Caliphate (library loan)","u":"https://archive.org/details/crisisofearlycal0015abar","by":"al-Ṭabarī (tr. R. Stephen Humphreys)"},{"t":"The History of al-Ṭabarī, vol. 17: The First Civil War (library loan)","u":"https://archive.org/details/firstcivilwar0017abar","by":"al-Ṭabarī (tr. G. R. Hawting)"}],"reads":[{"t":"The Prophet and the Age of the Caliphates (library loan)","u":"https://archive.org/details/prophetageofcali0000kenn","by":"Hugh Kennedy"},{"t":"The Succession to Muḥammad: A Study of the Early Caliphate (library loan; argues a contested pro-ʿAlid thesis)","u":"https://archive.org/details/successiontomuam0000made","by":"Wilferd Madelung"},{"t":"Who Wants the Caliphate?","u":"https://yaqeeninstitute.org/read/paper/who-wants-the-caliphate","by":"Ovamir Anjum / Yaqeen Institute"}],"projects":[{"n":"Caliphs and fitnah timeline","l":"Beginner","d":"Build a dated timeline from 11/632 to 61/680 with one line per event, the main figures involved and the page of al-Suyūṭī or al-Ṭabarī you read it in."},{"n":"Two narrators, one event","l":"Intermediate","d":"Pick one event of the first fitnah in al-Ṭabarī and write a one-page note comparing the reports of two different narrators and how Ibn al-ʿArabī treats the event in al-ʿAwāṣim, without taking sides, listing what they agree on."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the Companions' merits and the reports on early caliphal decisions."},{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."}]},{"id":"h_umayyad","title":"41–132 AH: the Umayyads","short":"Umayyads","level":"Intermediate","section":"history","why":"The Umayyad century built the first Islamic empire and saw the rise of the Successors (tābiʿūn) who carried ḥadīth and fiqh to the next generations.","mins":750,"pre":["h_rashidun"],"ideas":["Muʿāwiyah ibn Abī Sufyān (r. 41–60/661–680) ruled from Damascus after al-Ḥasan's settlement in 41/661 (ʿām al-jamāʿah). His nomination of his son Yazīd made succession dynastic, and was followed by the killing of al-Ḥusayn at Karbalāʾ (10 Muḥarram 61/680) and the caliphate of ʿAbd Allāh ibn al-Zubayr in Mecca (64–73/683–692), known as the second fitnah.","ʿAbd al-Malik (r. 65–86/685–705) reunited the state, built the Dome of the Rock (completed 72/691–2), minted the first purely Arabic coinage (77/696–7) and made Arabic the language of administration. Under al-Walīd I (r. 86–96/705–715) armies reached Sind (92/711), al-Andalus (92/711) and Transoxiana.","ʿUmar ibn ʿAbd al-ʿAzīz (r. 99–101/717–720) is praised by Sunni scholars for justice, and reports say he ordered ḥadīth to be written down, a task linked to Ibn Shihāb al-Zuhrī (d. 124/742). This is the age of the tābiʿūn: Saʿīd ibn al-Musayyib (d. 94/713), al-Ḥasan al-Baṣrī (d. 110/728), and the generation that taught Abū Ḥanīfah and Mālik.","After the third fitnah (126/744 onward), the Hāshimiyyah movement in Khurāsān defeated Marwān II at the Zāb (132/750). The Umayyad prince ʿAbd al-Raḥmān escaped to al-Andalus. The period also shows the early tension between scholars and rulers, from which the Sunni position of patience with unjust rulers, while speaking the truth to them, took shape."],"callout":["Pitfall","Later ʿAbbāsid-era sources often wrote with hostility toward the Umayyads, while some modern writers idealize them. Separate what a report says from the agenda of the time it was written."],"lectures":[{"t":"Islamic history of the Umayyad caliphate","u":"https://www.youtube.com/watch?v=Z017QKEkxSs","by":"Hugh Kennedy (Islamic Circles)"},{"t":"Library Chat #17: Some historical incidents in the latter part of the first Hijrī century","u":"https://www.youtube.com/watch?v=eYLwayIR40E","by":"Yasir Qadhi"},{"t":"The Massacre of Karbala: a historical analysis","u":"https://www.youtube.com/watch?v=nm7mKOTZ0qQ","by":"Yasir Qadhi"}],"papers":[{"t":"The History of al-Ṭabarī, vol. 20: The Collapse of Sufyānid Authority and the Coming of the Marwānids (library loan)","u":"https://archive.org/details/collapseofsufyni0020abar","by":"al-Ṭabarī (tr. G. R. Hawting)"},{"t":"The History of al-Ṭabarī, vol. 26: The Waning of the Umayyad Caliphate (library loan)","u":"https://archive.org/details/waningofumayyadc0026abar","by":"al-Ṭabarī (tr. Carole Hillenbrand)"},{"t":"Muwaṭṭaʾ Mālik","u":"https://sunnah.com/malik","by":"Mālik ibn Anas (sunnah.com)"}],"reads":[{"t":"The First Dynasty of Islam: The Umayyad Caliphate AD 661–750 (library loan)","u":"https://archive.org/details/firstdynastyofis0000hawt","by":"G. R. Hawting"},{"t":"The Prophet and the Age of the Caliphates (library loan)","u":"https://archive.org/details/prophetageofcali0000kenn","by":"Hugh Kennedy"}],"projects":[{"n":"Scholars of the first century","l":"Beginner","d":"List ten tābiʿūn with death dates, city and one famous teacher among the Companions, using the Muslim Scholars Database, and mark them on a simple map."},{"n":"Muwaṭṭaʾ and the Umayyad era","l":"Intermediate","d":"Read one chapter of the Muwaṭṭaʾ and note every report that cites a ruling of ʿUmar ibn ʿAbd al-ʿAzīz or a Medinan Successor; write a paragraph on what this shows about early fiqh."}],"repos":[{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Arabic texts of the classical chronicles and biographical dictionaries, searchable by name and year."}]},{"id":"h_abbasid","title":"132–656 AH: the ʿAbbāsids and the age of scholarship","short":"ʿAbbāsids","level":"Intermediate","section":"history","why":"Almost every classical text a student reads, from the Risālah to the six ḥadīth books, was written under the ʿAbbāsid caliphate.","mins":900,"pre":["h_umayyad"],"ideas":["The early ʿAbbāsids were strong rulers: al-Manṣūr (r. 136–158/754–775) founded Baghdad (145/762), Hārūn al-Rashīd (r. 170–193/786–809) presided over a wealthy court, and the civil war between al-Amīn and al-Maʾmūn (193–198/809–813) ended with al-Maʾmūn's victory.","This is the age of the founders: Abū Yūsuf (d. 182/798) served as chief qāḍī, al-Shāfiʿī (d. 204/820) wrote the Risālah, Aḥmad ibn Ḥanbal (d. 241/855) resisted the Miḥnah (218–c. 234/833–848), and al-Bukhārī (d. 256/870), Muslim (d. 261/875) and al-Ṭabarī (d. 310/923) completed their works. The translation movement brought Greek philosophy and science into Arabic.","Real power slipped from the caliphs: the move to Sāmarrāʾ (221/836), the decade of anarchy there (247–256/861–870), the Būyid takeover of Baghdad (334/945), the rival Fāṭimid caliphate in Cairo (358/969) and the Seljuk sultanate (447/1055). Scholars like al-Māwardī (d. 450/1058) wrote theories of the caliphate that kept it as the source of legitimacy.","The Mongol Hülegü sacked Baghdad in Ṣafar 656/February 1258 and killed al-Mustaʿṣim. The Mamlūks revived a symbolic ʿAbbāsid caliphate in Cairo (659/1261). Seeing the five centuries as distinct phases explains why a scholar's context, patron and city matter for how his book should be read."],"callout":["Method","When you meet a classical author, place him on the ʿAbbāsid timeline: which caliph or sultan, which city, which school was dominant. Keep this as a running chart."],"lectures":[{"t":"The Splendor of the Abbasid Period (HIST 210, lecture 16)","u":"https://www.youtube.com/watch?v=ji8kKMSLEQo","by":"Paul Freedman / Yale Open Courses"},{"t":"The Globalisation of Baghdad","u":"https://www.youtube.com/watch?v=I4eJyWAcWrM","by":"Hugh Kennedy / British Institute for the Study of Iraq"}],"papers":[{"t":"The History of al-Ṭabarī, vol. 30: The ʿAbbāsid Caliphate in Equilibrium (library loan)","u":"https://archive.org/details/abbsidcaliphatei0030abar","by":"al-Ṭabarī (tr. C. E. Bosworth)"},{"t"
