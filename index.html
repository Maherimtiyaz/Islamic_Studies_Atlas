:"The History of al-Ṭabarī, vol. 31: The War between Brothers (library loan)","u":"https://archive.org/details/warbetweenbrothe0031abar","by":"al-Ṭabarī (tr. Michael Fishbein)"},{"t":"History of the Caliphs: the ʿAbbāsid section, 1881","u":"https://archive.org/details/cu31924023164654","by":"al-Suyūṭī (tr. H. S. Jarrett)"}],"reads":[{"t":"When Baghdad Ruled the Muslim World (library loan)","u":"https://archive.org/details/whenbaghdadruled0000kenn","by":"Hugh Kennedy"},{"t":"Islamic History: A Framework for Inquiry (library loan)","u":"https://archive.org/details/islamichistoryfr0000hump","by":"R. Stephen Humphreys"}],"projects":[{"n":"Authors on the timeline","l":"Beginner","d":"Draw a timeline of 132–656 AH with at least fifteen caliphs or sultans above the line and fifteen scholars below it, each with death date in AH and CE."},{"n":"One year in al-Ṭabarī","l":"Intermediate","d":"Read al-Ṭabarī's entries for one year of Hārūn al-Rashīd's reign and write a one-page summary of what a chronicle chooses to record and what it leaves out."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Arabic texts of the classical chronicles and biographical dictionaries, searchable by name and year."},{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."}]},{"id":"h_andalus","title":"92–897 AH: al-Andalus","short":"al-Andalus","level":"Intermediate","section":"history","why":"Muslim Iberia lasted almost eight centuries and produced scholars, from Ibn ʿAbd al-Barr to al-Shāṭibī, whose works are central to Mālikī fiqh and ḥadīth study, as well as the Ẓāhirī Ibn Ḥazm.","mins":700,"pre":["h_umayyad"],"ideas":["Ṭāriq ibn Ziyād crossed to Iberia in 92/711 under Mūsā ibn Nuṣayr. ʿAbd al-Raḥmān I founded an Umayyad emirate at Córdoba (138/756) and began its Great Mosque (169/785); ʿAbd al-Raḥmān III declared a caliphate in 316/929.","Al-Andalus became Mālikī: Yaḥyā ibn Yaḥyā al-Laythī (d. 234/848) brought the recension of the Muwaṭṭaʾ most read today, and Ibn ʿAbd al-Barr (d. 463/1071), Ibn Rushd (d. 595/1198), al-Qurṭubī (d. 671/1273) and al-Shāṭibī (d. 790/1388) wrote Mālikī works still studied. Andalus also produced ḥadīth-centred scholars such as Baqī ibn Makhlad (d. 276/889) and the Ẓāhirī Ibn Ḥazm (d. 456/1064), who clashed with the Mālikī establishment.","The caliphate broke up in the fitnah of Córdoba (399–422/1009–1031) into ṭāʾifa kingdoms. After Toledo fell (478/1085), the Almoravids (al-Zallāqah, 479/1086) and then the Almohads ruled; after Las Navas de Tolosa (609/1212), Córdoba (633/1236) and Seville (646/1248) fell.","The Naṣrid kingdom of Granada survived until its surrender in 897/1492. Muslims who remained (Mudéjars, then Moriscos) were forcibly converted and finally expelled in 1609–1614. Historians debate the idea of 'convivencia': coexistence was real but also included legal hierarchy and periods of conflict."],"callout":["Pitfall","Avoid the two myths of al-Andalus as either a perfect paradise of tolerance or a simple story of decline. Read a primary chronicle and a modern political history side by side."],"lectures":[{"t":"Al-Andalus and the present: history and emotions","u":"https://www.youtube.com/watch?v=b55UHCOMoyE","by":"Maribel Fierro / Tokat Institute"},{"t":"The intellectual crossroads of al-Andalus: how Andalusi scholars shaped global Islamic culture","u":"https://www.youtube.com/watch?v=WRzmdJ42PhY","by":"NYU Abu Dhabi Institute"},{"t":"Lessons from Andalusia","u":"https://www.youtube.com/watch?v=if2b1aDUHWw","by":"Yasir Qadhi"}],"papers":[{"t":"The History of the Mohammedan Dynasties in Spain, vol. 1 (1840)","u":"https://archive.org/details/bub_gb_Ie7TAAAAMAAJ","by":"al-Maqqarī, Nafḥ al-Ṭīb (tr. Pascual de Gayangos)"},{"t":"The History of the Mohammedan Dynasties in Spain, vol. 2 (1843)","u":"https://archive.org/details/historyofthemoha032395mbp","by":"al-Maqqarī (tr. Pascual de Gayangos)"}],"reads":[{"t":"Muslim Spain and Portugal: A Political History of al-Andalus (library loan)","u":"https://archive.org/details/muslimspainportu00unse","by":"Hugh Kennedy"},{"t":"Religious Minorities under Muslim Rule (PDF)","u":"https://yaqeeninstitute.org/wp-content/uploads/2017/05/Religious-Minorities-under-Muslim-Rule.pdf","by":"Tesneem Alkiek / Yaqeen Institute"}],"projects":[{"n":"Andalusi scholars map","l":"Beginner","d":"Make a table of eight Andalusi scholars (name, city, death date AH/CE, school, one major book) and group them by century."},{"n":"Reading al-Maqqarī","l":"Intermediate","d":"Read al-Maqqarī's account of the conquest of 92/711 and list which earlier authors he cites; write half a page on how a 17th-century compiler built his history."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Arabic texts of the classical chronicles and biographical dictionaries, searchable by name and year."}]},{"id":"h_crusades","title":"5th–7th centuries AH: Seljuks, Crusades, Ayyūbids and the Mongols","short":"Crusades & Mongols","level":"Intermediate","section":"history","why":"These centuries saw the Sunni revival, the madrasa network and two great outside invasions, and they formed the world of al-Ghazālī, Ibn Qudāmah and Ibn al-Ṣalāḥ.","mins":800,"pre":["h_abbasid"],"ideas":["The Seljuk Turks entered Baghdad in 447/1055 and defeated Byzantium at Manzikert (463/1071). Their vizier Niẓām al-Mulk (d. 485/1092) founded the Niẓāmiyyah madrasas (Baghdad, 459/1067; also Nishapur and elsewhere), where al-Juwaynī (d. 478/1085, Nishapur) and al-Ghazālī (d. 505/1111, Baghdad) taught Shāfiʿī law and Ashʿarī theology.","The First Crusade took Jerusalem in Shaʿbān 492/July 1099 while Muslim rulers were divided. Zengī retook Edessa (539/1144), and Nūr al-Dīn (d. 569/1174) united Syria, built madrasas and a dār al-ḥadīth in Damascus, and sponsored scholars such as the historian Ibn ʿAsākir (d. 571/1176).","Ṣalāḥ al-Dīn (d. 589/1193) ended the Fāṭimid caliphate (567/1171), won at Ḥaṭṭīn (583/1187) and recovered Jerusalem in Rajab 583/October 1187. Ayyūbid Damascus and Cairo were home to Ibn Qudāmah (d. 620/1223), Ibn al-Athīr (d. 630/1233), Ibn al-Ṣalāḥ (d. 643/1245) and al-ʿIzz ibn ʿAbd al-Salām (d. 660/1262).","The Mongols destroyed Khwārazm (616–618/1219–1221) and Baghdad (656/1258), until the Mamlūks stopped them at ʿAyn Jālūt (658/1260). Within a generation the Ilkhān Ghāzān converted to Islam (694/1295). Ibn al-Athīr called the invasion the greatest calamity of his age, and this experience shaped later political and legal writing."],"callout":["Method","Read at least one Muslim eyewitness (Usāmah ibn Munqidh or Bahāʾ al-Dīn) before modern summaries, and note how they describe the Franks, fellow Muslims and their own rulers."],"lectures":[{"t":"The hero that was human: Ṣalāḥ al-Dīn al-Ayyūbī","u":"https://www.youtube.com/watch?v=8yFcNlBTT7c","by":"Yasir Qadhi"},{"t":"The Mongol invasion: how the Ummah rose again","u":"https://www.youtube.com/watch?v=_mh49xAYf2I","by":"Yasir Qadhi"},{"t":"The Crusades: An Arab Perspective (documentary series)","u":"https://www.youtube.com/playlist?list=PLzGHKb8i9vTxlYWull0cmf3ovsMmIOyMC","by":"Al Jazeera English"}],"papers":[{"t":"An Arab-Syrian Gentleman and Warrior in the Period of the Crusades: Memoirs of Usāmah ibn Munqidh (1929)","u":"https://archive.org/details/arabsyriangentle00usma","by":"Usāmah ibn Munqidh (tr. Philip K. Hitti)"},{"t":"The Life of Saladin (1897)","u":"https://archive.org/details/lifesaladin00condgoog","by":"Bahāʾ al-Dīn ibn Shaddād (tr. C. R. Conder, Palestine Pilgrims' Text Society)"},{"t":"The Damascus Chronicle of the Crusades (library loan)","u":"https://archive.org/details/damascuschronicl00harg","by":"Ibn al-Qalānisī (tr. H. A. R. Gibb)"},{"t":"Arab Historians of the Crusades (library loan)","u":"https://archive.org/details/arabhistoriansof0000gabr","by":"Francesco Gabrieli (ed. and tr.)"}],"reads":[{"t":"The Crusades: Islamic Perspectives (library loan)","u":"https://archive.org/details/crusadesislamicp0000hill","by":"Carole Hillenbrand"},{"t":"The Prophet and the Age of the Caliphates (library loan)","u":"https://archive.org/details/prophetageofcali0000kenn","by":"Hugh Kennedy"}],"projects":[{"n":"Eyewitness notebook","l":"Beginner","d":"Read twenty pages of Usāmah's memoirs and write ten short entries, each quoting one line and noting what it shows about daily life, war or religion in the 6th/12th century."},{"n":"Madrasa and jihād under Nūr al-Dīn","l":"Intermediate","d":"Using Gabrieli and Hillenbrand, write a two-page essay on how Nūr al-Dīn and Ṣalāḥ al-Dīn used patronage of scholars and institutions alongside military campaigns."}],"repos":[{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."}]},{"id":"h_mamluk","title":"7th–10th centuries AH: the Mamlūks and the post-Mongol world","short":"Mamlūks","level":"Intermediate","section":"history","why":"The Mamlūk age produced the great reference works students still use, such as Fatḥ al-Bārī, Tahdhīb al-Kamāl and Ibn Kathīr's tafsīr and history.","mins":750,"pre":["h_crusades"],"ideas":["The Mamlūks were slave-soldiers, trained and freed, who seized power in Egypt in 648/1250. Baybars (r. 658–676/1260–1277) installed an ʿAbbāsid caliph in Cairo (659/1261), and the fall of Acre (690/1291) ended the Crusader states. The Turkish (Baḥrī) line was followed by the Circassian (Burjī) sultans from 784/1382.","In 663/1265 Baybars appointed four chief judges, one for each Sunni school, which fixed the four-madhhab order. Endowed madrasas, khānqāhs and dār al-ḥadīths filled Cairo and Damascus, home to al-Nawawī (d. 676/1277), Ibn Taymiyyah (d. 728/1328), al-Mizzī (d. 742/1341), al-Dhahabī (d. 748/1348), Ibn Kathīr (d. 774/1373), Ibn Ḥajar (d. 852/1449) and al-Suyūṭī (d. 911/1505).","Beyond Egypt the post-Mongol world included the Ilkhanids, the Delhi Sultanate, the Marīnids and the early Ottomans. The Black Death (749/1348) and Tīmūr's sack of Damascus (803/1401) struck hard. Ibn Baṭṭūṭah's travels (725–754/1325–1354) show one legal and scholarly culture shared from Morocco to Delhi, where he worked as a qāḍī.","The Ottoman Selim I defeated the Mamlūks at Marj Dābiq and al-Raydāniyyah (922/1516–17). The Mamlūk scholars' habit of collecting, verifying and summarizing earlier learning explains why so many standard handbooks and commentaries date from this period."],"callout":["Method","Whenever you use a Mamlūk-era reference (a rijāl book, a sharḥ, a ṭabaqāt), note the author's death date and city. It tells you which earlier sources he could see."],"lectures":[{"t":"The not so mad Mamluks","u":"https://www.youtube.com/watch?v=3PvrWmHQprc","by":"Firas Alkhateeb / Darul Qasim College"},{"t":"Mamluk Cairo through the life of Ibn al-Ḥājj","u":"https://www.youtube.com/watch?v=2I5rFIo6WEc","by":"Darul Qasim College"},{"t":"Ibn Taymiyya: a summary of a Yale dissertation","u":"https://www.youtube.com/watch?v=hn0QbNUbh7I","by":"Yasir Qadhi"}],"papers":[{"t":"Travels in Asia and Africa, 1325–1354 (1929)","u":"https://archive.org/details/travelsinasiaafr0000ibnb","by":"Ibn Baṭṭūṭah (tr. H. A. R. Gibb)"},{"t":"al-Bidāyah wa al-Nihāyah (Arabic)","u":"https://shamela.ws/book/4445","by":"Ibn Kathīr (ed. al-Turkī), al-Maktabah al-Shāmilah"},{"t":"Siyar Aʿlām al-Nubalāʾ (Arabic)","u":"https://shamela.ws/book/10906","by":"al-Dhahabī (Muʾassasat al-Risālah ed.), al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Middle East in the Middle Ages: The Early Mamluk Sultanate, 1250–1382 (library loan)","u":"https://archive.org/details/middleeastinmidd0000irwi","by":"Robert Irwin"},{"t":"We've Been Here Before: Plague and Pestilence in Pre-Modern Islamic History","u":"https://yaqeeninstitute.org/read/paper/weve-been-here-before-plague-and-pestilence-in-pre-modern-islamic-history","by":"Abdul Rahman Latif / Yaqeen Institute"},{"t":"The Formation of Islam: Religion and Society in the Near East, 600–1800 (library loan)","u":"https://archive.org/details/formationofislam0000berk_i3a0","by":"Jonathan P. Berkey"}],"projects":[{"n":"Who taught whom","l":"Beginner","d":"Draw a teacher-student chart linking al-Mizzī, Ibn Taymiyyah, al-Dhahabī, Ibn Kathīr and Ibn al-Qayyim, with death dates and one book each."},{"n":"Ibn Baṭṭūṭah as qāḍī","l":"Intermediate","d":"Read Ibn Baṭṭūṭah's chapters on Delhi or the Maldives and write a page on how he applied Mālikī law in a non-Mālikī land."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Arabic texts of the classical chronicles and biographical dictionaries, searchable by name and year."},{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."}]},{"id":"h_empires","title":"10th–13th centuries AH: Ottomans, Safavids and Mughals","short":"Gunpowder empires","level":"Intermediate","section":"history","why":"Three early-modern empires shaped the law codes, madrasa curricula and manuscripts that most Muslims inherited before the colonial era.","mins":700,"pre":["h_mamluk"],"ideas":["The Ottomans took Constantinople under Meḥmed II (857/1453) and Egypt and the Ḥijāz under Selim I (922–923/1516–17). Under Süleymān (r. 926–974/1520–1566) the Shaykh al-Islām Ebüssuʿūd Efendi (d. 982/1574) harmonized sultanic law (qānūn) with the Ḥanafī fiqh that was already the empire's official school.","Shāh Ismāʿīl I took Tabriz (907/1501) and made Twelver Shīʿism the religion of the Safavid state, a policy that over two centuries turned a mostly Sunni Iran into a Shīʿī one. The Ottoman victory at Chāldirān (920/1514) fixed a long frontier, and Isfahan under ʿAbbās I (r. 996–1038/1588–1629) became a centre of philosophy (Mullā Ṣadrā, d. 1050/1640).","Bābur founded the Mughal empire after Pānīpat (932/1526). Akbar (r. 963–1014/1556–1605) ruled a Hindu-majority land with broad tolerance; Aurangzeb (r. 1068–1118/1658–1707) commissioned the Ḥanafī compendium al-Fatāwā al-Hindiyyah. Scholars such as Aḥmad Sirhindī (d. 1034/1624) and Shāh Walī Allāh (d. 1176/1762) shaped South Asian Islam.","Hodgson called them 'gunpowder empires', a label now debated. They shared Persianate court culture, Sufi orders, and scholarly travel to the Ḥaramayn. The Ottoman Mecelle (1869–1876) later codified Ḥanafī contract law, a bridge between classical fiqh and modern state law."],"callout":["Pitfall","Do not read this era only as 'decline'. Scholarship continued in logic, ḥadīth and fiqh (see El-Rouayheb's work), even as military and economic balances shifted."],"lectures":[{"t":"Ottoman, Safavid and Mughal empires","u":"https://www.youtube.com/watch?v=hNpcQEGw3S4","by":"Khan Academy"},{"t":"The Islamic foundations of the Ottoman Empire (session 4)","u":"https://www.youtube.com/watch?v=GEaNCMvFzYw","by":"Firas Alkhateeb / Darul Qasim College"},{"t":"A discourse on method: dialectics in the Ottoman Empire in the 17th century","u":"https://www.youtube.com/watch?v=y2TjEhsRsDA","by":"Khaled El-Rouayheb / CRASSH Cambridge"}],"papers":[{"t":"The Bābur-nāma in English (Memoirs of Babur), vol. 2 (1922)","u":"https://archive.org/details/baburnamainengli02babuuoft","by":"Bābur (tr. Annette S. Beveridge)"},{"t":"Narrative of Travels in Europe, Asia and Africa in the Seventeenth Century, vol. 1 (1834)","u":"https://archive.org/details/narrativeoftrave01evli","by":"Evliya Çelebi (tr. Joseph von Hammer)"},{"t":"The Mejelle: an English translation of Majallat al-Aḥkām al-ʿAdliyyah (library loan)","u":"https://archive.org/details/mejellebeingengl0000turk","by":"Ottoman legal commission (tr. C. R. Tyser et al.)"}],"reads":[{"t":"Islamic Gunpowder Empires: Ottomans, Safavids, and Mughals (library loan)","u":"https://archive.org/details/islamicgunpowder0000stre","by":"Douglas E. Streusand"},{"t":"The Ottoman Empire: The Classical Age, 1300–1600 (library loan)","u":"https://archive.org/details/ottomanempirecla0000inal","by":"Halil İnalcık"},{"t":"The Venture of Islam: Conscience and History in a World Civilization (3 vols., library loan; see vol. 3)","u":"https://archive.org/details/ventureofislamco0000hodg","by":"Marshall G. S. Hodgson"}],"projects":[{"n":"Three-empire comparison","l":"Beginner","d":"Fill a table comparing the three empires on capital, dates AH/CE, official madhhab or creed, one major scholar and one major legal work."},{"n":"Mecelle close reading","l":"Advanced","d":"Read the 99 general maxims at the start of the Mecelle and match ten of them with the classical legal maxims (qawāʿid) you have studied, noting their Ḥanafī sources."}],"repos":[]},{"id":"h_southasia","section":"history","title":"Islam in South Asia: scholars and movements","short":"South Asia","level":"Intermediate","why":"South Asia holds one of the largest Muslim populations and its madrasas, fatwa literature and reform movements shape Muslim scholarship worldwide, including many institutions in the West.","mins":900,"pre":["h_empires"],"ideas":["Under the Delhi Sultanate (602–932 AH / 1206–1526 CE) and the Mughals (932–1274 AH / 1526–1857 CE) Ḥanafī fiqh was the law of the courts and Sufi orders such as the Chishtiyyah and later the Naqshbandiyyah spread Islam widely. Aḥmad Sirhindī (d. 1034 AH / 1624 CE) argued for bringing Sufism and state practice under the Sharīʿah, and the Emperor Awrangzeb (r. 1068–1118 AH / 1658–1707 CE) commissioned the Fatāwā ʿĀlamgīriyyah (al-Fatāwā al-Hindiyyah), a large compendium of Ḥanafī rulings.","Shāh Walī Allāh al-Dihlawī (1114–1176 AH / 1703–1762 CE) studied ḥadīth in Madinah with Abū Ṭāhir al-Kurdī, translated the Qurʾān into Persian, wrote Ḥujjat Allāh al-Bālighah on the wisdom of the Sharīʿah, and urged ḥadīth study and reconciliation between the madhhabs; almost every later South Asian movement claims his legacy. In Lucknow the Farangī Maḥall family of scholars, through Mullā Niẓām al-Dīn Sihālawī (d. 1161 AH / 1748 CE), shaped the Dars-i Niẓāmī curriculum with its strong emphasis on logic, kalām and uṣūl, still the backbone of most South Asian madrasas.","After the failed uprising of 1857, scholars built new institutions. Dār al-ʿUlūm Deoband (founded 1283 AH / 1866 CE by Muḥammad Qāsim Nānautawī and Rashīd Aḥmad Gangohī) combined Ḥanafī fiqh, intensive ḥadīth study and reformist Sufism and discouraged customs it regarded as innovations. The Barelwī movement, who call themselves Ahl-e Sunnat wa Jamāʿat, formed around Aḥmad Riḍā Khān of Bareilly (1272–1340 AH / 1856–1921 CE), whose Fatāwā Riḍawiyyah defends devotional practices such as the mawlid and veneration of the Prophet ﷺ and the saints; both are Ḥanafī and Māturīdī, and they disagree chiefly over such practices and over questions of the Prophet's ﷺ knowledge.","The Ahl-e Ḥadīth, led by Sayyid Nadhīr Ḥusayn Dihlawī (d. 1320 AH / 1902 CE) and Ṣiddīq Ḥasan Khān of Bhopal (d. 1307 AH / 1890 CE), reject binding adherence to a single madhhab and derive rulings directly from the Qurʾān and ḥadīth. Nadwat al-ʿUlamāʾ in Lucknow (founded 1311 AH / 1894 CE, with Shiblī Nuʿmānī among its early leaders) sought a middle course between the madrasa and modern learning with a strong emphasis on Arabic, and produced scholars such as Abū al-Ḥasan ʿAlī Nadwī (d. 1420 AH / 1999 CE)."],"callout":["Pitfall","Do not learn these movements from their opponents' polemics. Read each in its own words and in academic studies such as Metcalf's and Sanyal's, and note where they share the same Ḥanafī and Māturīdī foundations."],"lectures":[{"t":"The Mughal Empire (podcast series)","u":"https://www.youtube.com/playlist?list=PLPuvFRZT1O-Mzu_yiJnssyxXnXFPG4I3j","by":"Islamic History Podcast"},{"t":"Islamic Scholarship in the India of the Raj","u":"https://www.youtube.com/watch?v=zh6iEMvTWS4","by":"Prof. Barbara Metcalf (Indian Diaspora Washington DC)"},{"t":"Defending Muhammad in Modernity (Deobandī–Barelwī debates)","u":"https://www.youtube.com/watch?v=Rv4oOHlaPeU","by":"Dr. SherAli Tareen (CICW)"}],"papers":[{"t":"Ḥujjat Allāh al-Bālighah (Arabic, 1286 AH print)","u":"https://archive.org/details/AAlexandrina-094753","by":"Shāh Walī Allāh al-Dihlawī"},{"t":"al-Fawz al-Kabīr fī Uṣūl al-Tafsīr (Arabic, OpenITI text)","u":"https://archive.org/details/wuquf-openiti-1176shahwaliallahdihlawi.fawzkabir-b9cfa3f23111","by":"Shāh Walī Allāh al-Dihlawī"}],"reads":[{"t":"Islamic Revival in British India: Deoband, 1860–1900","u":"https://archive.org/details/islamicrevivalin0000barb","by":"Barbara D. Metcalf (borrowable)"},{"t":"The Ulama in Contemporary Islam: Custodians of Change","u":"https://archive.org/details/ulamaincontempor0000zama","by":"Muhammad Qasim Zaman (borrowable)"},{"t":"Dars-i Nizami","u":"https://en.wikipedia.org/wiki/Dars-i_Nizami","by":"Wikipedia"}],"projects":[{"n":"Movements table","l":"Intermediate","d":"Build a table for Farangī Maḥall, Deoband, the Barelwīs, the Ahl-e Ḥadīth and Nadwah with founding date (AH/CE), founders, madhhab and creed, key institutions and one key text, using each movement's own sources and one academic study."},{"n":"Shāh Walī Allāh's legacy","l":"Advanced","d":"Write 800 words tracing how two different movements read Shāh Walī Allāh, quoting their own descriptions of him, and note where their readings diverge."}],"repos":[]},{"id":"h_africa_sea","section":"history","title":"Islam in Africa and Southeast Asia","short":"Africa & SE Asia","level":"Intermediate","why":"A large share of the world's Muslims live in Africa and Southeast Asia, regions with long scholarly traditions that are often left out of histories centred on the Arab and Persian lands.","mins":900,"pre":["h_empires"],"ideas":["Islam reached West Africa mainly through trans-Saharan trade and scholars rather than conquest. Mansā Mūsā of Mali made his famous pilgrimage in 724 AH / 1324 CE, and Timbuktu, with the Sankore mosque and scholarly families such as the Aqīt, became a centre of Mālikī learning based on texts such as the Mukhtaṣar of Khalīl; Aḥmad Bābā al-Tinbuktī (963–1036 AH / 1556–1627 CE) was taken to Marrakesh after the Moroccan conquest of 999 AH / 1591 CE and became known there as a jurist and biographer.","ʿUthmān dan Fodio (1168–1232 AH / 1754–1817 CE), a Fulani Mālikī scholar and Qādirī Sufi, preached reform in Hausaland for decades before the hijrah and jihad of 1219 AH / 1804 CE that founded the Sokoto Caliphate. He, his brother ʿAbd Allāh and his son Muḥammad Bello wrote hundreds of works in Arabic and local languages, and his daughter Nana Asmāʾu (d. 1281 AH / 1864 CE) organised the education of women.","On the East African coast, Swahili towns such as Kilwa, Mombasa, Lamu and Zanzibar followed the Shāfiʿī school and kept close ties with Ḥaḍramawt and Arabia; Ibn Baṭṭūṭah described Mogadishu and Kilwa on his voyage of 731 AH / 1331 CE. Ethiopia's link with Islam goes back to the first hijrah of the Companions to the Negus in 615 CE.","In the Malay world Islam spread through merchants, Sufis and rulers' conversions: the tombstone of Sultan Malik al-Ṣāliḥ of Samudra-Pasai is dated 696 AH / 1297 CE, and Malacca became a Muslim sultanate in the 15th century CE, with Shāfiʿī fiqh and Ashʿarī creed as the norm. Scholars such as ʿAbd al-Raʾūf al-Sinkilī of Aceh (d. c. 1105 AH / 1693 CE), author of the first complete Malay tafsīr, and Nawawī al-Bantanī (d. 1314 AH / 1897 CE) in Makkah linked the region to the Ḥaramayn, while Javanese pesantren, led by a kyai teaching classical Arabic texts (kitab kuning), remain the core of traditional education."],"callout":["Method","For each region note four things: how Islam arrived, which madhhab and creed took root, the key scholars and texts, and the institutions (mosque-university, pesantren, zāwiyah) that carried learning. This makes regions comparable."],"lectures":[{"t":"Beyond Timbuktu: An Intellectual History of Muslim West Africa","u":"https://www.youtube.com/watch?v=TLUh698Q1es","by":"Prof. Ousmane Kane (Harvard Divinity School)"},{"t":"From Medieval Sankore to Modern Say: Islamic Institutions of Higher Learning in Africa","u":"https://www.youtube.com/watch?v=JLN0ojnsaWk","by":"Prof. Ousmane Kane (Harvard Divinity School)"},{"t":"Islam in Southeast Asia, part 1","u":"https://www.youtube.com/watch?v=0VM8j4hNejc","by":"Dr. Muhamad Ali (UC Riverside)"}],"papers":[{"t":"Travels in Asia and Africa, 1325–1354","u":"https://archive.org/details/travelsinasiaafr0000ibnb","by":"Ibn Baṭṭūṭah (tr. H. A. R. Gibb, 1929)"},{"t":"Tarikh es-Soudan (Taʾrīkh al-Sūdān)","u":"https://archive.org/details/tarikhessoudanpa00sadauoft","by":"ʿAbd al-Raḥmān al-Saʿdī (French tr. O. Houdas, 1900, public domain)"}],"reads":[{"t":"The History of Islam in Africa","u":"https://archive.org/details/isbn_9780864864543","by":"Nehemia Levtzion and Randall L. Pouwels, eds. (borrowable)"},{"t":"Ancient Manuscripts from the Desert Libraries of Timbuktu (exhibition)","u":"https://www.loc.gov/exhibits/mali/","by":"Library of Congress"},{"t":"The Pesantren Tradition: The Role of the Kyai in the Maintenance of Traditional Islam in Java","u":"https://archive.org/details/pesantrentraditi0000dhof","by":"Zamakhsyari Dhofier (borrowable)"}],"projects":[{"n":"Regional comparison grid","l":"Intermediate","d":"Make a grid comparing West Africa, East Africa and the Malay world on arrival of Islam, dominant madhhab, two key scholars with dates, and the main teaching institution, citing a source for each cell."},{"n":"Ibn Baṭṭūṭah reading notes","l":"Intermediate","d":"Read Ibn Baṭṭūṭah's account of Mali or of the East African coast and write a one-page note listing what he says about judges, scholars, mosques and the madhhab followed."}],"repos":[{"r":"Tombouctou Manuscripts Project","u":"https://www.tombouctoumanuscripts.org/","d":"Background and research on the Timbuktu manuscript libraries."}]},{"id":"h_modern","title":"13th–15th centuries AH: colonialism, reform and the modern Muslim world","short":"Modern era","level":"Intermediate","section":"history","why":"The last two centuries replaced classical institutions with nation-states and modern universities, and today's debates on ijtihād, taqlīd and law grow out of them.","mins":700,"pre":["h_empires"],"ideas":["European expansion reshaped the Muslim world: Napoleon invaded Egypt (1213/1798), France took Algiers (1830), Britain ended the Mughal dynasty after 1857, and the Ottomans reformed their state in the Tanzimat (1839–1876). Al-Jabartī's chronicle records how an Azhar scholar saw the French occupation.","Several reform movements arose with different answers: Muḥammad ibn ʿAbd al-Wahhāb (d. 1206/1792) in Najd; the Dār al-ʿUlūm at Deoband (1283/1866) preserving the Ḥanafī madrasa tradition; Sayyid Aḥmad Khān's Aligarh college (1875); and Jamāl al-Dīn al-Afghānī (d. 1314/1897), Muḥammad ʿAbduh (d. 1323/1905) and Rashīd Riḍā (d. 1354/1935), whose journal al-Manār called for ijtihād. Students should describe each on its own terms before evaluating it.","After World War I the Ottoman sultanate was abolished (1922) and the caliphate ended on 27 Rajab 1342/3 March 1924. New states codified law on European models, keeping fiqh mostly in family law, while modern universities took over many roles of the madrasa.","The 20th and 21st centuries brought independence movements, mass print and then digital libraries, Islamic finance, Muslim minorities in the West and new institutions of fatwā. Knowing this history helps explain why a modern fatwā or textbook may differ in method from a classical manual."],"callout":["Method","For each reform figure, read a short primary text before a secondary verdict, and record what problem he was trying to solve."],"lectures":[{"t":"1914: The shaping of the modern Muslim world, part 1","u":"https://www.youtube.com/watch?v=qh9awD5KwNY","by":"Yasir Qadhi"},{"t":"Juridical colonialism, international law and the Ottoman response","u":"https://www.youtube.com/watch?v=DP6aO5dz67w","by":"Mostafa Minawi / Cornell University"},{"t":"The rise and fall of the Muslim Ummah and the printing press","u":"https://www.youtube.com/watch?v=4dEvEFBpVjg","by":"Yasir Qadhi"}],"papers":[{"t":"Napoleon in Egypt: al-Jabartī's Chronicle of the French Occupation, 1798 (library loan)","u":"https://archive.org/details/napoleoninegypta0000jaba_w1v3","by":"ʿAbd al-Raḥmān al-Jabartī (tr. Shmuel Moreh)"}],"reads":[{"t":"Arabic Thought in the Liberal Age, 1798–1939 (library loan)","u":"https://archive.org/details/arabicthoughtinl0000hour_s2o8","by":"Albert Hourani"},{"t":"Who Wants the Caliphate?","u":"https://yaqeeninstitute.org/read/paper/who-wants-the-caliphate","by":"Ovamir Anjum / Yaqeen Institute"},{"t":"Did Islam Spread by the Sword? A Critical Look at Forced Conversions","u":"https://yaqeeninstitute.org/read/paper/did-islam-spread-by-the-sword-a-critical-look-at-forced-conversions","by":"Yaqeen Institute"}],"projects":[{"n":"Reformers table","l":"Beginner","d":"Make a table of six modern movements or figures (dates AH/CE, region, main concern, institution founded, one key text)."},{"n":"Al-Jabartī's eyes","l":"Intermediate","d":"Read al-Jabartī's response to Napoleon's proclamation and write a page on how a traditional scholar reasoned about a foreign power and its claims."}],"repos":[]},{"id":"h_civ","title":"Islamic civilization: madrasa, waqf, science and libraries","short":"Civilization","level":"Intermediate","section":"history","why":"The institutions that paid for, housed and transmitted learning explain how the classical texts you read were produced and preserved.","mins":600,"pre":["h_abbasid"],"ideas":["The madrasa was an endowed college, usually for law, which spread from Khurāsān to Baghdad with the Niẓāmiyyah (459/1067). George Makdisi argued it centred on fiqh and the licence to teach and give fatwā; Jonathan Berkey showed that personal ties between teacher and student mattered more than the building.","A waqf is an endowment whose property cannot be sold and whose income serves a stated purpose; most schools require perpetuity, while the Mālikīs also allow a waqf for a fixed term. Fiqh developed detailed rules for it, and waqfs funded mosques, madrasas, stipends, water fountains and hospitals such as the Manṣūrī bīmāristān in Cairo (683/1284).","The translation movement (2nd–4th/8th–10th centuries) and patrons in Baghdad supported al-Khwārizmī (fl. c. 205/820) in algebra, Ibn al-Haytham (d. c. 430/1040) in optics, Ibn Sīnā (d. 428/1037) in medicine and al-Ṭūsī's observatory at Marāgha (657/1259). Religious needs such as prayer times, qiblah and inheritance shares also drove mathematics and astronomy.","Paper reached Baghdad in the late 2nd/8th century, and book copyists (warrāqūn), public libraries and catalogues such as Ibn al-Nadīm's Fihrist (377/987) followed. Manuscripts carry reading notes (samāʿāt) and ijāzahs that let historians trace who studied a book, when and with whom."],"callout":["Pitfall","Avoid both 'golden age then decline' and 'Muslims merely preserved the Greeks'. Science and scholarship continued well after the 5th/11th century in many regions."],"lectures":[{"t":"Golden age of Islam","u":"https://www.youtube.com/watch?v=K5XKjk0-hCo","by":"Khan Academy"},{"t":"What was the House of Wisdom in Baghdad?","u":"https://www.youtube.com/watch?v=p2nx9Wi2n8s","by":"Filip Holm / Let's Talk Religion"},{"t":"How waqf endowments built the foundation of Muslim society","u":"https://www.youtube.com/watch?v=v64WMHYFzmY","by":"Tahir Talati / The Thinking Muslim"}],"papers":[{"t":"Instruction of the Student: The Method of Learning (library loan)","u":"https://archive.org/details/bwb_Y0-BUB-247","by":"al-Zarnūjī (tr. G. E. von Grunebaum and T. M. Abel)"},{"t":"The Fihrist of al-Nadīm (library loan)","u":"https://archive.org/details/fihristofalnadim0000ibna","by":"Ibn al-Nadīm (tr. Bayard Dodge)"}],"reads":[{"t":"The Rise of Colleges: Institutions of Learning in Islam and the West (library loan)","u":"https://archive.org/details/riseofcollegesin0000makd","by":"George Makdisi"},{"t":"The Structure of Scientific Productivity in Islamic Civilization (PDF)","u":"https://yaqeeninstitute.org/wp-content/uploads/2017/07/FINAL-The-Structure-of-Scientific-Productivity-in-Islamic-Civilization-1-1.pdf","by":"Asadullah Ali / Yaqeen Institute"}],"projects":[{"n":"A waqf deed","l":"Beginner","d":"Write a mock waqf deed for a small library: founder, property, beneficiaries, supervisor (nāẓir) and conditions, then list the fiqh rules each clause depends on."},{"n":"Fihrist survey","l":"Intermediate","d":"Pick one chapter of the Fihrist and count the books listed by subject; write a page on what this shows about the 4th/10th-century Baghdad book market."}],"repos":[{"r":"Muslim Heritage","u":"https://muslimheritage.com/","d":"Articles on science, medicine and institutions in Muslim civilization; check claims against academic sources."}]},{"id":"h_scholarship","title":"History of Islamic scholarship: madhhabs, the ḥadīth canon and transmission","short":"Scholarly history","level":"Intermediate","section":"history","why":"Knowing how the schools, the ḥadīth canon and the chains of teaching formed tells you what authority a given text has and how to read it.","mins":800,"pre":["h_abbasid","collections","madhhab"],"ideas":["The four Sunni schools are named after Abū Ḥanīfah (d. 150/767), Mālik (d. 179/795), al-Shāfiʿī (d. 204/820) and Aḥmad ibn Ḥanbal (d. 241/855), but students such as Abū Yūsuf (d. 182/798) and al-Shaybānī (d. 189/805) did much of the systematizing. Christopher Melchert argues they became stable 'guild' schools by the early 4th/10th century; others, like the Ẓāhirī, Awzāʿī and Jarīrī schools, faded.","Ḥadīth writing moved from personal notebooks (ṣuḥuf) to muṣannafs arranged by topic (ʿAbd al-Razzāq, d. 211/827) and musnads arranged by Companion (Aḥmad), then to the ṣaḥīḥ collections of al-Bukhārī (d. 256/870) and Muslim (d. 261/875). Jonathan Brown shows that their canonical status was secured in the 4th–5th/10th–11th centuries through works such as al-Dāraquṭnī's critiques and al-Ḥākim's Mustadrak.","Learning passed through isnād: hearing (samāʿ), reading back to the teacher (qirāʾah), and written licences (ijāzah), often after long travel (riḥlah). Women such as Karīmah al-Marwaziyyah (d. 463/1070) were key transmitters of Ṣaḥīḥ al-Bukhārī. Biographical works such as Ibn Saʿd's Ṭabaqāt, Ibn Khallikān's (d. 681/1282) alphabetical Wafayāt al-Aʿyān and al-Dhahabī's Siyar record these networks.","Later scholars wrote in layers: matn, sharḥ and ḥāshiyah. Each school fixed its relied-upon positions through editors such as al-Rāfiʿī and al-Nawawī for the Shāfiʿīs or Ibn ʿĀbidīn (d. 1252/1836) for the Ḥanafīs. Placing a book in this chain shows whether it is a founding text, a summary or a commentary."],"callout":["Method","For each text you study, write one line: author, death date, school, genre (matn, sharḥ, ḥāshiyah, ṭabaqāt) and the teacher chain it belongs to."],"lectures":[{"t":"How the first ḥadīth book was compiled","u":"https://www.youtube.com/watch?v=Rywpb0ZYR3c","by":"Omar Suleiman / Yaqeen Institute"},{"t":"What is Sharia? Part 1: the ethical structure","u":"https://www.youtube.com/watch?v=EGAxA7qqsSM","by":"Wael Hallaq / College of Islamic Studies, HBKU"},{"t":"Which madhhab should you follow? Ḥanafī, Shāfiʿī, Mālikī, Ḥanbalī","u":"https://www.youtube.com/watch?v=ChnF5WbCn40","by":"Yasir Qadhi"}],"papers":[{"t":"Ibn Khallikān's Biographical Dictionary, vol. 1 (library loan)","u":"https://archive.org/details/ibnkhallikansbio0001ibnk","by":"Ibn Khallikān (tr. W. MacGuckin de Slane)"},{"t":"Siyar Aʿlām al-Nubalāʾ (Arabic)","u":"https://shamela.ws/book/10906","by":"al-Dhahabī, al-Maktabah al-Shāmilah"},{"t":"Introduction (Muqaddimah) to Ṣaḥīḥ Muslim","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com)"}],"reads":[{"t":"The Formation of the Sunni Schools of Law, 9th–10th Centuries C.E. (library loan)","u":"https://archive.org/details/formationofsunni0000melc","by":"Christopher Melchert"},{"t":"The Origins and Evolution of Islamic Law (library loan)","u":"https://archive.org/details/originsevolution0000hall","by":"Wael B. Hallaq"},{"t":"The Canonization of Ibn Mājah: Authenticity vs. Utility in the Formation of the Sunni Ḥadīth Canon","u":"https://drjonathanbrown.com/2011/the-canonization-of-ibn-majah-authenticity-vs-utility-in-the-formation-of-the-sunni-%e1%b8%a5adith-cano/","by":"Jonathan A.C. Brown"}],"projects":[{"n":"Your isnād to a book","l":"Beginner","d":"Trace a chain from al-Bukhārī to a scholar of the 8th/14th century using biographical entries, recording each link's death date and city."},{"n":"School genealogy","l":"Intermediate","d":"For one madhhab, draw the line from the founder through two students to the main later editor, with the key book of each, and write a paragraph on how the school's relied-upon view was fixed."}],"repos":[{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up death dates, teachers and students of the scholars named in this period."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Arabic texts of the classical chronicles and biographical dictionaries, searchable by name and year."}]},{"id":"h_women","title":"Women scholars in Islamic history","short":"Women scholars","level":"Beginner","section":"history","why":"Women transmitted ḥadīth, taught leading scholars and endowed institutions for over a thousand years, and knowing this history corrects a common blind spot in how Islamic scholarship is told.","mins":1200,"pre":["pr_family","pr_sahabah","h_scholarship"],"ideas":["ʿĀʾishah bint Abī Bakr was among the most knowledgeable Companions in fiqh, ḥadīth and Arabic, narrating over two thousand reports. Abū Mūsā al-Ashʿarī said that whenever a ḥadīth was unclear to the Companions they asked ʿĀʾishah and found knowledge of it with her (al-Tirmidhī 3883). Her corrections of other Companions were later gathered by al-Zarkashī in al-Ijābah li-Īrād mā Istadrakathu ʿĀʾishah ʿalā al-Ṣaḥābah. Other women Companions and Successors, such as Umm Salamah, ʿAmrah bint ʿAbd al-Raḥmān and Umm al-Dardāʾ, were also sought out as teachers.","Asma Sayeed's research shows that women's participation in ḥadīth transmission was strong among the Companions, declined in the following two centuries as ḥadīth became a professional legal field, and revived from the fourth century AH, when hearing collections with short chains (ʿuluw al-isnād) and recorded audition certificates (samāʿāt) gave women transmitters a recognised role.","Karīmah al-Marwaziyyah (d. 463 AH) in Makkah was a celebrated transmitter of Ṣaḥīḥ al-Bukhārī, and al-Khaṭīb al-Baghdādī read the Ṣaḥīḥ with her. Fāṭimah al-Samarqandiyyah, a Ḥanafī jurist of the sixth century AH, issued fatwas signed together with her father ʿAlāʾ al-Dīn al-Samarqandī and her husband al-Kāsānī. Later masters such as Ibn ʿAsākir, al-Dhahabī and Ibn Ḥajar list many women among their teachers, and al-Sakhāwī devoted a whole volume of al-Ḍawʾ al-Lāmiʿ to women of the ninth century AH.","Mohammad Akram Nadwi's biographical dictionary of women ḥadīth scholars (al-Wafāʾ bi-Asmāʾ al-Nisāʾ) records thousands of women; its English preface volume is al-Muḥaddithāt (2007). Women also shaped learning as patrons: endowing (waqf) madrasas, ribāṭs and libraries, and teaching in mosques and homes. Fāṭimah al-Fihriyyah is traditionally credited with founding the Qarawiyyīn mosque in Fez in 245 AH."],"callout":["Method","When you read a biography of any major scholar, list the women among his teachers and students and look them up in a biographical dictionary. This turns a general claim into evidence you can cite."],"lectures":[{"t":"Reviving the Legacy of Female Scholarship in Islam","u":"https://www.youtube.com/watch?v=26-hFgOlHLc","by":"Mohammad Akram Nadwi (ADAMS Center)"},{"t":"Hidden Figures (Session 2): Tracing the History of Muslim Women Scholars","u":"https://www.youtube.com/watch?v=SFAiu1IF3FI","by":"Asma Sayeed (Islamic Center of Southern California)"}],"papers":[{"t":"Jāmiʿ al-Tirmidhī 3883: the Companions consult ʿĀʾishah","u":"https://sunnah.com/tirmidhi:3883","by":"al-Tirmidhī (sunnah.com)"},{"t":"al-Ḍawʾ al-Lāmiʿ li-Ahl al-Qarn al-Tāsiʿ, vol. 12: Kitāb al-Nisāʾ (Arabic)","u":"https://shamela.ws/book/6675","by":"Shams al-Dīn al-Sakhāwī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Women and the Transmission of Religious Knowledge in Islam","u":"https://www.cambridge.org/core/books/women-and-the-transmission-of-religious-knowledge-in-islam/31725711489DC490A744289FD7D6759C","by":"Asma Sayeed, Cambridge University Press (2013)"},{"t":"Al-Muḥaddithāt: The Women Scholars in Islam (print)","u":"https://bookshop.rabata.org/products/al-muhaddithat-the-women-scholars-in-islam","by":"Mohammad Akram Nadwi, Interface Publications"},{"t":"Female Scholars in Islamic History: Revisiting Their Pivotal Role","u":"https://yaqeeninstitute.org/read/paper/female-scholars-in-islamic-history-revisiting-their-pivotal-role","by":"Yaqeen Institute"}],"projects":[{"n":"Ten women, ten centuries","l":"Beginner","d":"Write a short entry for one woman scholar from each of ten Hijri centuries, giving her dates, city, field, one notable teacher or student, and the source you used."},{"n":"Teachers' list","l":"Intermediate","d":"Using Nadwi's al-Muḥaddithāt and al-Sakhāwī's volume on women, compile a list of at least eight women who taught a famous male scholar (such as Ibn Ḥajar or al-Dhahabī), noting what text each transmitted."}],"repos":[]},{"id":"siyar","title":"Scholars' biographies: Siyar Aʿlām al-Nubalāʾ","short":"Siyar","level":"Advanced","why":"Al-Dhahabī's Siyar teaches the history of Islamic scholarship through the lives of its people, and models fair judgement of great figures.","mins":1400,"pre":["h_rashidun","isnad"],"ideas":["Shams al-Dīn al-Dhahabī (d. 748/1348) of Damascus was a ḥadīth critic and historian. His other works include Tārīkh al-Islām, Mīzān al-Iʿtidāl on narrators and Tadhkirat al-Ḥuffāẓ.","Siyar Aʿlām al-Nubalāʾ arranges notable figures by generation (ṭabaqah), from the Companions to al-Dhahabī's own era. It covers jurists, ḥadīth scholars, ascetics, rulers and others, and draws largely on his Tārīkh al-Islām.","Entries combine dates, teachers and students, reports about character and worship, and al-Dhahabī's own comments. He often weighs a scholar's merits against his errors and warns against both exaggerated praise and unjust criticism.","Reading the Siyar alongside the ḥadīth sciences shows how narrator criticism worked in practice, and how scholarship was carried through teachers, travel and study circles across regions."],"callout":["Method","Read the Siyar by generations, not at random. Follow one chain of teachers and students, such as Mālik to al-Shāfiʿī to Aḥmad, so the biographies connect."],"lectures":[{"t":"Siyar Aʿlām al-Nubalāʾ, lesson 1: Abū ʿUbaydah ibn al-Jarrāḥ","u":"https://www.youtube.com/watch?v=_tAuEj5nOuE","by":"Sh. Omer Khurshid, Talweeh Academy"},{"t":"Imam al-Dhahabī","u":"https://www.youtube.com/watch?v=eoAdFLCQacc","by":"Sh. Rashid Khan, Darul Ihsaan"}],"papers":[{"t":"Siyar Aʿlām al-Nubalāʾ (Arabic, al-Risālah edition)","u":"https://shamela.ws/book/10906","by":"al-Dhahabī (eds. under Shuʿayb al-Arnaʾūṭ), al-Maktabah al-Shāmilah"},{"t":"Tahdhīb al-Tahdhīb (Arabic, Hyderabad edition)","u":"https://shamela.ws/book/3310","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Mamluk Historiographic Studies: The State of the Art (includes al-Dhahabī's historical and biographical works)","u":"https://knowledge.uchicago.edu/record/984","by":"Li Guo, Mamlūk Studies Review 1 (1997), open access"},{"t":"Tārīkh al-Islām of adh-Dhahabī","u":"https://www.cambridge.org/core/journals/journal-of-the-royal-asiatic-society/article/abs/tarikh-alislam-of-adhdhahabi/D75CC61574FFB1D3338E2CC74DAE0FB6","by":"Journal of the Royal Asiatic Society"}],"projects":[{"n":"Teacher-student chain","l":"Intermediate","d":"Trace one line of transmission across five generations in the Siyar and draw it as a timeline with dates, cities and one notable quality recorded for each scholar."},{"n":"Al-Dhahabī's judgements","l":"Advanced","d":"Collect five passages where al-Dhahabī criticises or defends a scholar. Translate each and write a short note on the principles of fairness he applies."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"history"}]},{"id":"y2aqidah","title":"Advanced ʿaqīdah & intellectual history","level":"Advanced","intro":"Year two reads a major creedal text closely and then follows the great debates over reason, philosophy and the Qurʾān as God's speech.","phase":11,"optional":false,"topics":[{"id":"wasitiyyah","title":"al-ʿAqīdah al-Wāsiṭiyyah","short":"Wāsiṭiyyah","level":"Advanced","why":"Ibn Taymiyyah's short creed is the most studied Atharī statement on the divine attributes and on Sunni positions as a middle way between sects.","mins":1200,"pre":["tahawi","sifat","schools"],"ideas":["Ibn Taymiyyah (d. 728/1328) wrote the creed for a judge from Wāsiṭ, and it was examined in sessions before Mamluk scholars in Damascus in 705/1306. It is mostly Qurʾānic verses and ḥadīth arranged by theme.","Its method is to affirm the attributes God affirms for Himself according to their apparent meaning (ʿalā ẓāhirihā) as befits Him, without distortion (taḥrīf), negation (taʿṭīl), asking how (takyīf) or likening to creation (tamthīl). Ibn Taymiyyah holds that the meaning is known while the modality (kayf) is not.","It presents Ahl al-Sunnah as a middle (wasaṭ) in five areas: on the attributes, between the Jahmiyyah and the Mushabbihah; on God's acts, between the Jabriyyah and the Qadariyyah; on the promise and threat (waʿīd), between the Murjiʾah and the Waʿīdiyyah of the Qadariyyah; on the names and rulings of faith and religion, between the Ḥarūriyyah and Muʿtazila and the Murjiʾah and Jahmiyyah; and on the Companions, between the Rāfiḍah and the Khawārij.","Ashʿarī and Māturīdī scholars accept much of its content, but where it affirms attributes such as istiwāʾ, the hand and descent according to their apparent meaning without modality, they generally use tafwīḍ (consigning the meaning to God) or taʾwīl (interpretation). Its examination in 705/1306 shows these differences were already debated in his lifetime; knowing them lets you read it with precision rather than polemic."],"callout":["Method","Memorise the list of verses on each attribute, then read a commentary (for example Ibn ʿUthaymīn's) section by section, noting each opposing view named."],"lectures":[{"t":"Explanation of al-ʿAqīdah al-Wāsiṭiyyah by Ibn ʿUthaymīn (English subtitles, playlist)","u":"https://www.youtube.com/playlist?list=PLNQ4e5_fAoQe1PUNh1CVyAjPqsU_-YFxO","by":"Path of Light"},{"t":"al-ʿAqīdah al-Wāsiṭiyyah, lesson 1: overview of the book","u":"https://www.youtube.com/watch?v=hvvu1cl_YKI","by":"Zulfiker Ibrahim / Markaz al-Sunnah"}],"papers":[{"t":"al-ʿAqīdah al-Wāsiṭiyyah (Arabic and English)","u":"https://abuaminaelias.com/al-aqeedah-al-wasitiyyah-by-ibn-taymiyyah/","by":"Ibn Taymiyyah (tr. Abu Amina Elias)"},{"t":"al-ʿAqīdah al-Wāsiṭiyyah (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D8%B9%D9%82%D9%8A%D8%AF%D8%A9_%D8%A7%D9%84%D9%88%D8%A7%D8%B3%D8%B7%D9%8A%D8%A9","by":"Ibn Taymiyyah"}],"reads":[{"t":"Ibn Taymiyya","u":"https://plato.stanford.edu/entries/ibn-taymiyya/","by":"Jon Hoover / Stanford Encyclopedia of Philosophy"},{"t":"Ibn Taymiyya on Reason and Revelation (open access)","u":"https://library.oapen.org/handle/20.500.12657/37977","by":"Carl Sharif El-Tobgui (Brill)"}],"projects":[{"n":"Middle-way chart","l":"Intermediate","d":"Make a table of the five 'middle positions' in the creed: the two extremes, the Sunni position and the proof-texts cited."},{"n":"Three-school comparison","l":"Advanced","d":"Pick three attributes (e.g. istiwāʾ, hand, descent) and set out the Wāsiṭiyyah, Ashʿarī and Māturīdī readings in 600 words."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Look up each verse the creed cites with translation and tafsīr."}],"section":"aqidah"},{"id":"reason","title":"Reason and revelation","short":"ʿAql and naql","level":"Advanced","why":"Whether reason can override scripture, and what reason can know alone, divides the theological schools and still drives modern debates.","mins":1500,"pre":["wasitiyyah","schools"],"ideas":["Many later Ashʿarīs, most clearly Fakhr al-Dīn al-Rāzī, stated a 'universal rule' (al-qānūn al-kullī): if a definitive rational proof conflicts with the apparent sense of scripture, reason is put first and the text is reinterpreted or its meaning left to God.","Ibn Taymiyyah's Darʾ Taʿāruḍ al-ʿAql wa al-Naql answers that clear reason (ṣarīḥ al-ʿaql) never truly conflicts with sound transmission (ṣaḥīḥ al-naql). Apparent conflicts come from faulty premises or weak reports.","The Muʿtazila held that good and bad are knowable by reason and that God is bound by justice. Ashʿarīs held that moral obligation is known only through revelation; Māturīdīs held that reason can recognise good and evil, while they differed among themselves on whether obligation exists before revelation.","Al-Ghazālī's Qānūn al-Taʾwīl sets rules for handling apparent conflict and urges restraint: do not deny proven reason, do not rush to reinterpret, and suspend judgement where certainty is not possible."],"callout":["Pitfall","'Reason' means different things in each school (kalām proofs, Aristotelian demonstration, innate fiṭrah). Define the term each author uses before comparing them."],"lectures":[{"t":"Ibn Taymiyyah on Reason and Revelation","u":"https://www.youtube.com/watch?v=VA57sBh22yA","by":"Carl Sharif El-Tobgui / Al Baseerah"},{"t":"Why Study... Ibn Taymiyya","u":"https://www.youtube.com/watch?v=iRgm85xQhNI","by":"Jon Hoover / University of Nottingham"},{"t":"Faith vs. Reason: Can There Be an Islamic Philosophy?","u":"https://www.youtube.com/watch?v=viJc5754IH4","by":"Abdal Hakim Murad / Islam On Demand"}],"papers":[{"t":"Darʾ Taʿāruḍ al-ʿAql wa al-Naql (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%AF%D8%B1%D8%A1_%D8%AA%D8%B9%D8%A7%D8%B1%D8%B6_%D8%A7%D9%84%D8%B9%D9%82%D9%84_%D9%88%D8%A7%D9%84%D9%86%D9%82%D9%84","by":"Ibn Taymiyyah"},{"t":"Deliverance from Error (al-Munqidh min al-Ḍalāl)","u":"http://www.ghazali.org/works/watt3.htm","by":"al-Ghazālī (tr. W. Montgomery Watt)"},{"t":"Qānūn al-Taʾwīl (Arabic, ed. M. Bejou)","u":"http://www.ghazali.org/books/qununtawail-bejou.pdf","by":"al-Ghazālī"}],"reads":[{"t":"Ibn Taymiyya on Reason and Revelation: A Study of Darʾ Taʿāruḍ (open access PDF)","u":"https://library.oapen.org/bitstream/20.500.12657/37977/1/9789004412866_webready_content_text.pdf","by":"Carl Sharif El-Tobgui (Brill, 2020)"},{"t":"Arabic and Islamic Philosophy of Religion","u":"https://plato.stanford.edu/entries/arabic-islamic-religion/","by":"Jon McGinnis & Rahim Acar / Stanford Encyclopedia of Philosophy"}],"projects":[{"n":"The universal rule","l":"Intermediate","d":"State al-Rāzī's universal rule in your own words, then list Ibn Taymiyyah's main objections from El-Tobgui's study as numbered points."},{"n":"Three schools on ethics","l":"Advanced","d":"Write 700 words comparing Muʿtazilī, Ashʿarī and Māturīdī views on whether reason can know good and evil, with one classical source for each."}],"repos":[{"r":"Arabic Wikisource","u":"https://ar.wikisource.org/","d":"Read Darʾ Taʿāruḍ and other primary texts in Arabic."}],"section":"aqidah"},{"id":"falsafa","title":"Philosophy and kalām: the Tahāfut and its responses","short":"Tahāfut debate","level":"Advanced","why":"Al-Ghazālī's critique of the philosophers and Ibn Rushd's reply define how Sunni theology absorbed logic while rejecting key metaphysical claims.","mins":1800,"pre":["reason","schools"],"ideas":["Al-Ghazālī first summarised the philosophers in Maqāṣid al-Falāsifah, then attacked them in Tahāfut al-Falāsifah (488/1095) in twenty discussions, mainly against Ibn Sīnā's system.","He judged three doctrines to be unbelief: the eternity of the world, that God knows particulars only in a universal way, and the denial of bodily resurrection. The other seventeen he called innovation or simply unproven.","In the seventeenth discussion he denies that causes produce effects by necessity: fire does not burn cotton by its own nature but by God's creating the burning. This is a defence of miracles, not a denial of regular causal patterns.","Ibn Rushd (d. 595/1198) replied in Tahāfut al-Tahāfut and argued in Faṣl al-Maqāl that the Law commands demonstrative reflection for those capable of it. He divided people into demonstrative, dialectical and rhetorical classes, each addressed by scripture in its own way."],"callout":["Method","Read al-Ghazālī's introduction and discussions one, thirteen and seventeen with a summary of Ibn Sīnā's view beside you; then read Faṣl al-Maqāl in one sitting."],"lectures":[{"t":"Al-Ghazālī's 'The Incoherence of the Philosophers'","u":"https://www.youtube.com/watch?v=3pYDNlJq-mw","by":"Abdal Hakim Murad / Islam On Demand"},{"t":"Is Philosophy Useless? Was al-Ghazālī Dishonest?","u":"https://www.youtube.com/watch?v=ViI5ZwC8cgM","by":"Peter Adamson / Oases of Wisdom"},{"t":"Library Chat #20: The Rise of Sunnī Kalām (3rd/4th Hijrī centuries)","u":"https://www.youtube.com/watch?v=NjoB9UYmv1Q","by":"Yasir Qadhi"}],"papers":[{"t":"Tahāfut al-Falāsifah: Incoherence of the Philosophers (1963)","u":"http://www.ghazali.org/works/taf-eng.pdf","by":"al-Ghazālī (tr. Sabih Ahmad Kamali)"},{"t":"Averroes: On the Harmony of Religion and Philosophy (Faṣl al-Maqāl; library loan)","u":"https://archive.org/details/averroesonharmon0000geor","by":"Ibn Rushd (tr. George F. Hourani)"},{"t":"Faṣl al-Maqāl (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D9%81%D8%B5%D9%84_%D8%A7%D9%84%D9%85%D9%82%D8%A7%D9%84","by":"Ibn Rushd"}],"reads":[{"t":"Al-Ghazali","u":"https://plato.stanford.edu/entries/al-ghazali/","by":"Frank Griffel / Stanford Encyclopedia of Philosophy"},{"t":"Ibn Rushd [Averroes]","u":"https://plato.stanford.edu/entries/ibn-rushd/","by":"Fouad Ben Ahmed & Robert Pasnau / Stanford Encyclopedia of Philosophy"},{"t":"Ibn Rushd (Averroes)","u":"https://iep.utm.edu/ibn-rush/","by":"Internet Encyclopedia of Philosophy"}],"projects":[{"n":"Three charges","l":"Intermediate","d":"For each of the three doctrines al-Ghazālī condemned, write the philosophers' claim, his objection and Ibn Rushd's reply in a three-column table."},{"n":"Causation essay","l":"Advanced","d":"Write 800 words on the seventeenth discussion: what al-Ghazālī denies, what he affirms, and why Ibn Rushd thought it undermined knowledge."}],"repos":[{"r":"ghazali.org","u":"https://www.ghazali.org/","d":"Free translations and editions of the Tahāfut and related works."}],"section":"thought"},{"id":"mihnah","title":"The createdness of the Qurʾān and the Miḥnah","short":"Miḥnah","level":"Advanced","why":"The Miḥnah was the first state-enforced test of doctrine in Islam, and its outcome fixed the Sunni teaching that the Qurʾān is the uncreated speech of God.","mins":900,"pre":["sifat"],"ideas":["In 218/833 the caliph al-Maʾmūn ordered his governor in Baghdad to test judges and scholars on whether the Qurʾān is created. The test continued under al-Muʿtaṣim and al-Wāthiq and was ended by al-Mutawakkil around 234/848.","Most scholars gave way under pressure. Aḥmad ibn Ḥanbal refused, was imprisoned and flogged under al-Muʿtaṣim, and his steadfastness made him the emblem of the ahl al-ḥadīth.","The Muʿtazila argued that an eternal Qurʾān would be a second eternal being beside God. The ahl al-ḥadīth answered that the Qurʾān is God's speech, an attribute of His, and not created; later Ashʿarīs distinguished eternal inner speech from created recitations and copies.","Historians debate the motive: theology alone, or a caliphal bid to control religious authority against the scholars. Muhammad Qasim Zaman, Nimrod Hurvitz and Michael Cooperson give different weights to these causes."],"callout":["Method","Read al-Maʾmūn's letters in al-Ṭabarī first, then a biography of Aḥmad. Note the attribution of al-Radd ʿalā al-Jahmiyyah to Aḥmad is debated by scholars."],"lectures":[{"t":"Library Chat #13: On the Origins of the Ṣifāt Controversy","u":"https://www.youtube.com/watch?v=1h3bI2Pgtwg","by":"Yasir Qadhi"}],"papers":[{"t":"The History of al-Ṭabarī, vol. 32: The Reunification of the ʿAbbāsid Caliphate (library loan)","u":"https://archive.org/details/reunificationofa0032abar","by":"al-Ṭabarī (tr. C. E. Bosworth)"},{"t":"al-Radd ʿalā al-Jahmiyyah wa al-Zanādiqah (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D8%B1%D8%AF_%D8%B9%D9%84%D9%89_%D8%A7%D9%84%D8%AC%D9%87%D9%85%D9%8A%D8%A9_%D9%88%D8%A7%D9%84%D8%B2%D9%86%D8%A7%D8%AF%D9%82%D8%A9","by":"attributed to Aḥmad ibn Ḥanbal"},{"t":"Khalq Afʿāl al-ʿIbād (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%AE%D9%84%D9%82_%D8%A3%D9%81%D8%B9%D8%A7%D9%84_%D8%A7%D9%84%D8%B9%D8%A8%D8%A7%D8%AF","by":"al-Bukhārī"}],"reads":[{"t":"Mihna","u":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/mihna","by":"Muhammad Qasim Zaman / Encyclopedia.com"},{"t":"Classical Arabic Biography: The Heirs of the Prophets in the Age of al-Maʾmūn (library loan)","u":"https://archive.org/details/classicalarabicb0000coop","by":"Michael Cooperson"}],"projects":[{"n":"Miḥnah chronology","l":"Beginner","d":"List each caliph from al-Maʾmūn to al-Mutawakkil with dates, the policy on the Miḥnah and the scholars affected."},{"n":"Positions on God's speech","l":"Advanced","d":"Write 600 words setting out the Muʿtazilī, Ḥanbalī and Ashʿarī positions on the Qurʾān as speech, with one primary quotation each."}],"repos":[],"section":"aqidah"},{"id":"sects","title":"Sects and movements: Khawārij, Shīʿa, Muʿtazila and others","short":"Sects","level":"Intermediate","why":"Classical heresiography explains what each early group believed and why Sunni creed is phrased the way it is.","mins":1200,"pre":["h_rashidun","schools"],"ideas":["The Khawārij left ʿAlī after the arbitration at Ṣiffīn. Their defining doctrine was declaring Muslims unbelievers for grave sins and rebelling against rulers on that basis; the Ibāḍīs of Oman descend from a moderate branch and reject the label.","The Shīʿa hold that leadership after the Prophet ﷺ belonged to ʿAlī and his descendants by designation (naṣṣ). They later divided into Zaydīs, Ismāʿīlīs and Twelvers (Imāmīs), who differ on the line and role of the imams.","The Muʿtazila were a rationalist kalām school built on five principles: divine unity, divine justice, the promise and the threat, the intermediate position of the grave sinner, and commanding right and forbidding wrong. They held that the Qurʾān is created.","The Murjiʾa separated deeds from faith, and the Jahmiyya denied the divine attributes; both shaped how Sunni creeds word their statements on īmān and the attributes. Sufism (taṣawwuf) is not a sect but a discipline of the inner life practised across the Sunni schools; it is treated in its own topic on taṣawwuf."],"callout":["Method","Read each group in its own words where possible, such as al-Ṣadūq's Twelver creed, then in a Sunni heresiographer. Al-Shahrastānī's al-Milal wa al-Niḥal (Kazi and Flynn translation, print) aims at neutral description, while al-Baghdādī writes openly as a polemicist."],"lectures":[{"t":"Lives of the Sahaba 36: ʿAlī pt. 7, the Khawārij","u":"https://www.youtube.com/watch?v=uiwDEEpKslE","by":"Yasir Qadhi / Memphis Islamic Center"},{"t":"Unity does not mean Uniformity & the Hadith of the 73 Sects","u":"https://www.youtube.com/watch?v=6fDXifZ5jnY","by":"Yasir Qadhi"},{"t":"Sunnah, Shariʿah, Sectarianism & Ijtihad (Understanding Islam, session 2)","u":"https://www.youtube.com/watch?v=GmJgoGBQ0k8","by":"Abdal Hakim Murad / Islam On Demand"}],"papers":[{"t":"al-Milal wa al-Niḥal (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D9%85%D9%84%D9%84_%D9%88%D8%A7%D9%84%D9%86%D8%AD%D9%84","by":"al-Shahrastānī"},{"t":"Moslem Schisms and Sects (al-Farq bayn al-Firaq), part 1 (1920; an openly polemical Ashʿarī heresiography)","u":"https://archive.org/details/moslemschismssec01baghuoft","by":"ʿAbd al-Qāhir al-Baghdādī (tr. K. C. Seelye)"},{"t":"A Shiite Creed (Risālat al-Iʿtiqādāt), 1942: a Twelver creed in its own words","u":"https://archive.org/details/in.ernet.dli.2015.57172","by":"Ibn Bābawayh al-Ṣadūq (tr. Asaf A. A. Fyzee)"}],"reads":[{"t":"The Formative Period of Islamic Thought (library loan)","u":"https://archive.org/details/formativeperiodo0000watt","by":"W. Montgomery Watt"},{"t":"Arabic and Islamic Philosophy of Religion","u":"https://plato.stanford.edu/entries/arabic-islamic-religion/","by":"Jon McGinnis & Rahim Acar / Stanford Encyclopedia of Philosophy"}],"projects":[{"n":"Sect profile cards","l":"Beginner","d":"Make one card per group (Khawārij, Zaydīs, Twelvers, Ismāʿīlīs, Muʿtazila, Murjiʾa, Jahmiyya) with origin, key doctrines, a source in the group's own words where available and the Sunni response."},{"n":"Heresiography comparison","l":"Advanced","d":"Compare al-Baghdādī's and al-Shahrastānī's entries on the Muʿtazila and write 500 words on differences in tone and method."}],"repos":[{"r":"Arabic Wikisource","u":"https://ar.wikisource.org/","d":"Free Arabic texts of classical works, including al-Milal wa al-Niḥal."}],"section":"thought"},{"id":"tasawwuf","section":"tazkiyah","title":"Taṣawwuf: its sources, early figures and later developments","short":"Taṣawwuf","level":"Intermediate","why":"Taṣawwuf is the tradition that most Sunni scholars over the centuries used to name the science of iḥsān and the purification of the heart, and its history, its classical criteria and the debates about its later forms are essential for understanding Muslim religious life.","mins":1300,"pre":["tazkiyah","sects","schools"],"ideas":["Its proponents root taṣawwuf in the station of iḥsān in the ḥadīth of Jibrīl, worshipping Allah as though you see Him, and in the Qurʾānic call to purify the soul (Q 91:9). Early ascetics and worshippers such as al-Ḥasan al-Baṣrī (d. 110/728) and Rābiʿah al-ʿAdawiyyah stressed renunciation, fear and love of Allah. By the third Hijri century figures such as al-Ḥārith al-Muḥāsibī and al-Junayd of Baghdad (d. 298/910) had developed a vocabulary of the self, its states (aḥwāl) and stations (maqāmāt).","Al-Junayd became the model of 'sober' Sufism. Al-Qushayrī quotes him saying that this path is bound by the Qurʾān and the Sunnah, and that one who has not learned the Qurʾān and written ḥadīth should not be followed in it. Al-Qushayrī wrote his Risālah (437/1045) because he saw laxity in the Sharīʿah among those claiming the path. It, al-Sarrāj's Kitāb al-Lumaʿ and al-Hujwīrī's Kashf al-Maḥjūb set the classical criterion: no inner state is valid if it contradicts the outward law.","Al-Ghazālī (d. 505/1111) joined law, creed and spirituality in the Iḥyāʾ, and after him Sufi orders (ṭuruq) such as the Qādiriyyah, Shādhiliyyah and Naqshbandiyyah spread across the Muslim world, with many jurists and ḥadīth scholars as members. Ibn ʿArabī (d. 638/1240) and the doctrine later called waḥdat al-wujūd became the most contested part of this legacy, defended by some and sharply criticised by others, including Sufis such as Aḥmad Sirhindī.","Ibn Taymiyyah (d. 728/1328) praised early masters such as al-Junayd and wrote a commentary on ʿAbd al-Qādir al-Jīlānī's Futūḥ al-Ghayb, while rejecting Ibn ʿArabī's monism, seeking help from the dead and some practices of samāʿ. Ibn al-Qayyim's Madārij al-Sālikīn is a commentary on al-Harawī's Sufi manual Manāzil al-Sāʾirīn. Later critics, including many Salafī scholars and some modern reformers, reject the label and many practices of the orders, while many Ashʿarī and Māturīdī scholars regard Sharīʿah-bound taṣawwuf as part of Sunni orthodoxy. This remains a real disagreement and should be studied as one."],"callout":["Method","Judge any Sufi claim by the classical criterion the early masters themselves set: agreement with the Qurʾān, the Sunnah and the Sharīʿah. Read al-Qushayrī and a critic such as Ibn Taymiyyah side by side rather than through polemical summaries."],"lectures":[{"t":"The Risalah of Imam Qushayri (64 lessons)","u":"https://www.youtube.com/playlist?list=PL1hb2hXXO1KQB0ZABy6q-ZT6WnUc14_PW","by":"Dr. Tarek Elgawhary (Islamic Community Center of Potomac)"},{"t":"Essentials of Islamic Spirituality (43 lessons)","u":"https://www.youtube.com/playlist?list=PLTgDm4XwxaRJYaKugt3a2UGBoN93jUEH_","by":"Mufti Abdur-Rahman ibn Yusuf Mangera (Zamzam Academy)"},{"t":"Manāzil al-Sāʾirīn: Stations of the Wayfarers (108 lessons)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqTn33B4fbF7aQswoxcdPUI2","by":"Dr. Hatem al-Haj"}],"papers":[{"t":"al-Risālah al-Qushayriyyah fī ʿIlm al-Taṣawwuf (Arabic)","u":"https://shamela.ws/book/9953","by":"al-Qushayrī (ed. ʿAbd al-Ḥalīm Maḥmūd); English: Al-Qushayri's Epistle on Sufism, trans. Alexander Knysh (Garnet, 2007, print/loan)"},{"t":"Kitāb al-Lumaʿ fī al-Taṣawwuf (Arabic edition with English abstract of contents, 1914)","u":"https://archive.org/details/kitaballuma00sarruoft","by":"Abū Naṣr al-Sarrāj (ed. R. A. Nicholson, public domain)"},{"t":"The Kashf al-Maḥjūb: the oldest Persian treatise on Sufism (1911)","u":"https://archive.org/details/in.ernet.dli.2015.283428","by":"al-Hujwīrī (trans. R. A. Nicholson, public domain)"},{"t":"Madārij al-Sālikīn (Arabic)","u":"https://shamela.ws/book/8370","by":"Ibn Qayyim al-Jawziyyah"}],"reads":[{"t":"A Glimpse of Sufism from the Circle of Ibn Taymiyya: al-Baʿlabakkī's Epistle on the Spiritual Way","u":"https://research-portal.uu.nl/en/publications/a-glimpse-of-sufism-from-the-circle-of-ibn-taymiyya-an-edition-an/","by":"Arjan Post (Journal of Sufi Studies, 2016)"},{"t":"Ibn Taymiyya","u":"https://plato.stanford.edu/entries/ibn-taymiyya/","by":"Jon Hoover (Stanford Encyclopedia of Philosophy)"},{"t":"Sufism: A New History of Islamic Mysticism (library loan)","u":"https://archive.org/details/sufismnewhistory0000knys","by":"Alexander Knysh (Princeton, 2017)"}],"projects":[{"n":"Criteria chart","l":"Intermediate","d":"Collect five statements from al-Qushayrī's Risālah (from al-Junayd and other early masters) on the Sharīʿah as the measure of the path, and set beside them Ibn Taymiyyah's or Ibn al-Qayyim's comments on the same themes, noting agreements and disagreements."},{"n":"Timeline essay","l":"Intermediate","d":"Draw a timeline from al-Ḥasan al-Baṣrī to the later ṭuruq and write a 1,000-word essay presenting the main defenders and critics of later Sufism fairly in their own terms, with sources for each claim."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Search the Arabic texts of al-Qushayrī, al-Sarrāj, Ibn Taymiyyah and Ibn al-Qayyim for the passages discussed above."}]},{"id":"khaldun","title":"Ibn Khaldūn's Muqaddimah: knowledge and history","short":"Muqaddimah","level":"Intermediate","why":"The Muqaddimah teaches how to test historical reports and gives a classical map of the Islamic sciences and how they are learned.","mins":1500,"pre":["h_rashidun","ilm"],"ideas":["Ibn Khaldūn (732–808/1332–1406), a Mālikī judge from Tunis, wrote the Muqaddimah in 1377 as the introduction to his universal history. He proposed a new science of human social organisation (ʿilm al-ʿumrān).","He argued that historians err through partisanship, over-trust in transmitters and ignorance of how societies work. A report should be checked against what is possible in the nature of civilisation, not only by its chain.","ʿAṣabiyyah is the group feeling that lets a people win power. Dynasties, he observed, tend to weaken as luxury replaces this solidarity, usually within about three generations, roughly 120 years.","Chapter six divides the sciences into transmitted (naqlī) sciences such as tafsīr, ḥadīth, fiqh and uṣūl, and rational (ʿaqlī) sciences such as logic and mathematics. He treats learning as the acquisition of a habit (malakah) through graded teaching."],"callout":["Method","Read the Introduction and Book One chapter one first, then chapter six on the sciences. Use Rosenthal's notes to identify the many scholars he mentions."],"lectures":[{"t":"Readings from Ibn Khaldūn's Muqaddimah, series 1","u":"https://www.youtube.com/watch?v=Ar1zLYt8_Dw","by":"ISTAC (IIUM)"},{"t":"Ibn Khaldūn: towards a non-Eurocentric approach in the social sciences","u":"https://www.youtube.com/watch?v=0X86jFZIH2E","by":"Syed Farid Alatas"},{"t":"Ibn Khaldūn & the Muqaddimah: a historical review","u":"https://www.youtube.com/watch?v=MIuAzk9k-jc","by":"Filip Holm / Let's Talk Religion"}],"papers":[{"t":"The Muqaddimah, vol. 1 (Rosenthal translation, library loan)","u":"https://archive.org/details/muqaddimahintrod0001ibnk","by":"Ibn Khaldūn (tr. Franz Rosenthal)"},{"t":"The Muqaddimah, vol. 3: the sciences (Rosenthal translation, library loan)","u":"https://archive.org/details/muqaddimahintrod0003ibnk","by":"Ibn Khaldūn (tr. Franz Rosenthal)"},{"t":"Muqaddimat Ibn Khaldūn (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D9%85%D9%82%D8%AF%D9%85%D8%A9_%D8%A7%D8%A8%D9%86_%D8%AE%D9%84%D8%AF%D9%88%D9%86","by":"Ibn Khaldūn"}],"reads":[{"t":"The Muqaddimah: An Introduction to History (abridged, library loan)","u":"https://archive.org/details/introductiontohi0000njda","by":"Ibn Khaldūn (tr. Rosenthal, abridged by N. J. Dawood)"},{"t":"Ibn Khaldun: His Life and Work","u":"https://www.muslimphilosophy.com/ik/klf.htm","by":"Muslim Philosophy online"},{"t":"Ibn Khaldūn (encyclopedia entries)","u":"https://www.encyclopedia.com/people/history/historians-miscellaneous-biographies/ibn-khaldun","by":"Encyclopedia.com"}],"projects":[{"n":"Report-testing checklist","l":"Intermediate","d":"Turn Ibn Khaldūn's causes of historians' errors into a checklist and apply it to one report you read in the early history topic."},{"n":"Map of the sciences","l":"Beginner","d":"Draw a diagram of chapter six's classification of sciences, with one sentence per science on its subject matter."}],"repos":[{"r":"Muslim Philosophy online","u":"https://www.muslimphilosophy.com/","d":"Reference pages on Ibn Khaldūn and other thinkers."}],"section":"history"}]},{"id":"y2usul","title":"Advanced uṣūl & legal reasoning","level":"Advanced","intro":"This quarter studies how jurists build rulings: a major uṣūl text, the objectives of the law, legal maxims, and how fatwas adapt to time and necessity.","phase":12,"optional":false,"topics":[{"id":"mustasfa","title":"Advanced uṣūl: al-Mustaṣfā","short":"al-Mustaṣfā","level":"Advanced","why":"Al-Ghazālī's last major work on legal theory is a model of the theologians' (mutakallimūn) method and shaped later Shāfiʿī and Mālikī uṣūl.","mins":2400,"pre":["waraqat","sources","sunnah"],"ideas":["Al-Ghazālī completed al-Mustaṣfā min ʿIlm al-Uṣūl in 503/1109. It opens with a long introduction on logic, which he says is the prerequisite for all sciences, a choice later uṣūlīs debated.","He organises uṣūl around four 'poles': the ruling (ḥukm), the sources that produce it, the methods of deriving rulings from texts (language, implication, analogy), and the person who derives it (the mujtahid) and the one who follows (the muqallid).","He names five necessities the law protects: religion, life, intellect, lineage and property. These became the core of later maqāṣid theory.","He accepts unattested public interest (maṣlaḥah mursalah) only when it is necessary, certain and universal. His example is enemies using Muslim captives as shields, where the whole community would perish otherwise."],"callout":["Method","Read the four poles' table of contents first, then one pole at a time with Hallaq's or Kamali's chapter on the same topic to check your understanding."],"lectures":[{"t":"Principles of Islamic Jurisprudence (lecture series)","u":"https://www.youtube.com/playlist?list=PLv5Bf8DRI9C7VWTvBD7u8Cu4Et2lNpkDk","by":"Mohammad Hashim Kamali / IAIS Malaysia"},{"t":"What Is the Importance of Uṣūl al-Fiqh?","u":"https://www.youtube.com/watch?v=-VZUsU0sV7Y","by":"Faraz Rabbani / SeekersGuidance"}],"papers":[{"t":"al-Mustaṣfā, vol. 1: English translation (PhD thesis, Chicago 1987)","u":"http://www.ghazali.org/books/azhmd-p2.pdf","by":"al-Ghazālī (tr. Ahmad Zaki Hammad)"},{"t":"al-Mustaṣfā (Bulaq edition scans)","u":"http://www.ghazali.org/books/mustasfa/index.html","by":"al-Ghazālī"},{"t":"al-Mustaṣfā (Arabic, Wikisource)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D8%B5%D9%81%D9%89","by":"al-Ghazālī"}],"reads":[{"t":"Abū Ḥāmid al-Ghazālī's Juristic Doctrine in al-Mustaṣfā (study, part 1)","u":"http://www.ghazali.org/books/azhmd-p1.pdf","by":"Ahmad Zaki Hammad"},{"t":"A History of Islamic Legal Theories (library loan)","u":"https://archive.org/details/historyofislamic0000hall","by":"Wael B. Hallaq"},{"t":"Principles of Islamic Jurisprudence (library loan)","u":"https://archive.org/details/principlesofisla0000kama","by":"Mohammad Hashim Kamali"}],"projects":[{"n":"Four-poles map","l":"Intermediate","d":"Draw the structure of al-Mustaṣfā as a tree of poles, chapters and key terms, with Arabic and English for each."},{"n":"Maṣlaḥah case","l":"Advanced","d":"Summarise al-Ghazālī's human-shield example and his three conditions, then apply them to one modern case in 600 words."}],"repos":[{"r":"ghazali.org","u":"https://www.ghazali.org/","d":"Arabic editions and English studies of al-Ghazālī's legal works."}],"section":"usul"},{"id":"maqasid","title":"Maqāṣid al-sharīʿah","short":"Maqāṣid","level":"Advanced","why":"The objectives of the law explain why rulings exist and guide jurists in new cases, but they are easily misused when cut off from the texts.","mins":1800,"pre":["mustasfa"],"ideas":["The theory grew from al-Juwaynī and al-Ghazālī (the five necessities) through ʿIzz al-Dīn ibn ʿAbd al-Salām and al-Qarāfī; some later jurists, al-Qarāfī among them, added honour (ʿirḍ) as a sixth.","Al-Shāṭibī (d. 790/1388) in al-Muwāfaqāt ranked objectives as necessities (ḍarūriyyāt), needs (ḥājiyyāt) and refinements (taḥsīniyyāt). He argued that these objectives are established by induction (istiqrāʾ) across many texts, which gives them certainty.","Muḥammad al-Ṭāhir ibn ʿĀshūr (d. 1973) in Maqāṣid al-Sharīʿah al-Islāmiyyah proposed general objectives such as preserving social order, equality, freedom and natural disposition (fiṭrah), and urged maqāṣid as a separate discipline.","Classical jurists did not treat maqāṣid as an independent source that can override clear texts. Critics warn that some modern uses do exactly that; read modern writers such as Jasser Auda with this debate in mind."],"callout":["Pitfall","Do not cite 'the maqāṣid' to set aside a specific ruling. Ask what text and what inductive evidence supports each objective you invoke."],"lectures":[{"t":"Maqāṣid al-Sharīʿah: Past Achievements and Future Challenges","u":"https://www.youtube.com/watch?v=MJp4NjnksAw","by":"IAIS Malaysia"},{"t":"What are Principles of Shariah (Maqāṣid al-Sharīʿah)?","u":"https://www.youtube.com/watch?v=Bvbp4OMbdqo","by":"Jasser Auda / Let the Quran Speak"}],"papers":[{"t":"Ibn Ashur: Treatise on Maqāṣid al-Sharīʿah (library loan)","u":"https://archive.org/details/ibnashurtreatise0000ibns","by":"Ibn ʿĀshūr (tr. Mohamed El-Tahir El-Mesawi)"},{"t":"al-Muwāfaqāt, vol. 2 (Arabic; contains the Book of Objectives)","u":"https://archive.org/details/BBib-Alex-09800","by":"al-Shāṭibī"}],"reads":[{"t":"Maqāṣid al-Sharīʿah Made Simple","u":"https://iiit.org/wp-content/uploads/MaqasidAl-ShariahMadeSimple-UPDATED-RED.pdf","by":"Mohammad Hashim Kamali / IIIT"},{"t":"Imam al-Shāṭibī's Theory of the Higher Objectives and Intents of Islamic Law","u":"https://iiit.org/wp-content/uploads/Imam-Al-Shatibis-Theory-of-the-Higher-Objectives-and-Intents-of-Islamic-Law-1.pdf","by":"Ahmad al-Raysuni (tr. Nancy Roberts) / IIIT"},{"t":"An Examination of the Modern Discourse on Maqāṣid al-Sharīʿa","u":"https://digitalcommons.montclair.edu/religion-facpubs/16","by":"Yasir S. Ibrahim / Montclair State University"}],"projects":[{"n":"Three-tier table","l":"Intermediate","d":"For each of the five necessities, give one ruling at the level of necessity, need and refinement, with its textual basis."},{"n":"Critique memo","l":"Advanced","d":"Read Ibrahim's article and one modern maqāṣid argument, then write 700 words on where the argument stays within classical limits and where it goes beyond them."}],"repos":[],"section":"usul"},{"id":"shatibi","title":"al-Shāṭibī's al-Muwāfaqāt","short":"al-Muwāfaqāt","level":"Advanced","why":"Al-Muwāfaqāt is the classic attempt to read the whole sharīʿah through its purposes, and most modern discussions of maqāṣid build on it.","mins":1800,"pre":["mustasfa","maqasid"],"ideas":["Abū Isḥāq al-Shāṭibī (d. 790/1388) was a Mālikī jurist of Granada. Al-Muwāfaqāt has five parts: introductory premises, legal rulings (aḥkām), the purposes of the law (maqāṣid), the evidences (adillah), and ijtihād.","He argues that the law aims at human welfare in this life and the next. Its purposes fall into three levels: necessities (ḍarūriyyāt) protecting religion, life, intellect, lineage and property; needs (ḥājiyyāt) that remove hardship; and refinements (taḥsīniyyāt).","His method is inductive (istiqrāʾ): a universal principle becomes certain when countless particular texts point to it, even if no single text states it. Universal principles and particular rulings must then be read together, without sacrificing either.","Al-Shāṭibī also stresses the intentions of the legally responsible person, the role of the Arabic of the first audience in reading texts, and the qualifications of the mujtahid. Muḥammad al-Ṭāhir ibn ʿĀshūr and many modern writers built on his work."],"callout":["Pitfall","Maqāṣid in al-Shāṭibī are derived from the texts, not set against them. Do not use 'the purpose of the law' to override clear rulings, which is the opposite of his method."],"lectures":[{"t":"al-Muwāfaqāt fī Uṣūl al-Sharīʿah: Abū Isḥāq al-Shāṭibī","u":"https://www.youtube.com/watch?v=qqApuxZNbIE","by":"Cambridge Islamic College"},{"t":"Maqāṣid al-Sharīʿah: Between Theology and Law","u":"https://www.youtube.com/watch?v=V6K5rCrFVbU","by":"Jasser Auda, St Andrews Encyclopaedia of Theology"}],"papers":[{"t":"al-Muwāfaqāt (Arabic)","u":"https://shamela.ws/book/11435","by":"al-Shāṭibī (ed. Mashhūr Ḥasan Āl Salmān), al-Maktabah al-Shāmilah"},{"t":"The Reconciliation of the Fundamentals of Islamic Law, Vol. 1","u":"https://www.garnetpublishing.co.uk/product/the-reconciliation-of-the-fundamentals-of-islamic-law-vol-1","by":"al-Shāṭibī (trans. Imran Ahsan Khan Nyazee), Garnet (print)"}],"reads":[{"t":"Imam al-Shatibi's Theory of the Higher Objectives and Intents of Islamic Law","u":"https://iiit.org/wp-content/uploads/Imam-Al-Shatibis-Theory-of-the-Higher-Objectives-and-Intents-of-Islamic-Law-1.pdf","by":"Ahmad al-Raysuni, IIIT (free PDF)"},{"t":"Review of Shatibi's Philosophy of Islamic Law by Muhammad Khalid Masud","u":"https://cambridge.org/core/journals/journal-of-law-and-religion/article/shatibis-philosophy-of-islamic-law-by-muhammad-khalid-masud-islamabad-the-islamic-research-institute1995-pp-xii-294-price-not-available-isbn-9694081556/6C665F42F28DB4F572C9F70518B461AA","by":"Journal of Law and Religion"}],"projects":[{"n":"Map of the Muwāfaqāt","l":"Intermediate","d":"Draw a one-page outline of the five parts of al-Muwāfaqāt with two sentences on the main thesis of each, using the Arabic table of contents and the Nyazee translation."},{"n":"Induction case study","l":"Advanced","d":"Pick one of the five necessities and collect ten Qurʾān and ḥadīth texts that point to it. Write a sho
