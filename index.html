e contingency argument from al-Ghazālī or Ibn Taymiyyah as numbered premises and conclusion, and note the objection each premise usually meets."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."}]},{"id":"c_comparative","title":"Comparative religion: Judaism, Christianity and Islam","short":"Comparing faiths","section":"thought","level":"Intermediate","why":"The Qurʾān addresses Jews and Christians directly, and Muslim scholars produced a large literature on their scriptures and beliefs that remains central to interfaith study.","mins":720,"pre":["tawhid","pr_anbiya"],"ideas":["The Qurʾān calls Jews and Christians 'People of the Book' (ahl al-kitāb), affirms the Torah and Gospel as revealed, and invites them to a 'common word' of worshipping God alone (3:64). It also corrects beliefs it rejects, such as the divinity of Jesus and the Trinity (4:171, 5:73).","Muslim scholars discussed taḥrīf, the alteration of earlier scripture. Some stressed alteration of meaning by interpretation (taḥrīf al-maʿnā), while Ibn Ḥazm in al-Fiṣal argued in detail for alteration of the text itself. Ibn Taymiyyah accepted that some text was changed but held that much of the problem lay in interpretation.","Ibn Taymiyyah's al-Jawāb al-Ṣaḥīḥ li-man Baddala Dīn al-Masīḥ answers a Christian letter from Cyprus, itself a reworking of an earlier letter by Paul of Antioch. It is one of the largest Muslim works on Christian doctrine and scripture.","In Islam, Jesus (ʿĪsā) is a prophet and the Messiah, born of the Virgin Mary, who was not killed or crucified (4:157) and will return. Muslim study of Judaism has focused on Moses, the Torah and law, with notable parallels in legal method between rabbinic and Islamic jurisprudence."],"callout":["Method","Read each religion's beliefs in its own sources and words before reading Muslim critiques. A fair statement of another view is the first step in serious comparison."],"lectures":[{"t":"Islam is the Closest Religion to Christianity","u":"https://www.youtube.com/watch?v=AtKNyOSkSsg","by":"Abdal Hakim Murad / Islam On Demand"},{"t":"Who Was Jesus in Islam","u":"https://www.youtube.com/watch?v=qpD4GNe5gwQ","by":"Yasir Qadhi"},{"t":"Muslims and Jews","u":"https://www.youtube.com/watch?v=HjsLQtW1xbg","by":"Reuven Firestone / International Studies Institute, University of New Mexico"}],"papers":[{"t":"al-Jawāb al-Ṣaḥīḥ li-man Baddala Dīn al-Masīḥ (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D8%AC%D9%88%D8%A7%D8%A8_%D8%A7%D9%84%D8%B5%D8%AD%D9%8A%D8%AD_%D9%84%D9%85%D9%86_%D8%A8%D8%AF%D9%84_%D8%AF%D9%8A%D9%86_%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%AD","by":"Ibn Taymiyyah (Arabic Wikisource)"},{"t":"al-Fiṣal fī al-Milal wa al-Ahwāʾ wa al-Niḥal (Arabic)","u":"https://ar.wikisource.org/wiki/%D8%A7%D9%84%D9%81%D8%B5%D9%84_%D9%81%D9%8A_%D8%A7%D9%84%D9%85%D9%84%D9%84_%D9%88%D8%A7%D9%84%D8%A3%D9%87%D9%88%D8%A7%D8%A1_%D9%88%D8%A7%D9%84%D9%86%D8%AD%D9%84","by":"Ibn Ḥazm (Arabic Wikisource)"},{"t":"Qurʾān 3:64 with Tafsīr Ibn Kathīr (a common word between us and you)","u":"https://quran.com/3:64/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"}],"reads":[{"t":"Finding and Following Jesus: The Muslim Claim to the Messiah","u":"https://yaqeeninstitute.org/read/paper/finding-and-following-jesus-the-muslim-claim-to-the-messiah","by":"Shabbir Akhtar, Yaqeen Institute"},{"t":"The Qurʾān's Engagement with Christian and Jewish Literature","u":"https://yaqeeninstitute.org/read/paper/the-qurans-engagement-with-christian-and-jewish-literature","by":"Taha Soomro, Yaqeen Institute"},{"t":"A Common Word Between Us and You (2007 open letter)","u":"https://www.acommonword.com/the-acw-document/","by":"138 Muslim scholars"}],"projects":[{"n":"Doctrine table","l":"Beginner","d":"Make a table comparing God, prophethood, scripture, Jesus and salvation in Judaism, Christianity and Islam, citing a primary source from each tradition."},{"n":"Classical response","l":"Advanced","d":"Read one chapter of al-Jawāb al-Ṣaḥīḥ and write 800 words summarising the Christian claim it answers, Ibn Taymiyyah's argument, and how a modern Christian might respond."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read the verses with several translations and the abridged English Tafsīr Ibn Kathīr."}]},{"id":"c_fiqh","title":"Contemporary fiqh: bioethics, finance, technology and minorities","short":"Contemporary fiqh","section":"contemporary","level":"Advanced","why":"New medical, financial and technological questions have no direct ruling in the classical books, and studying how scholars answer them shows legal theory at work today.","mins":780,"pre":["fatwa","maqasid","qawaid"],"ideas":["Many modern questions are answered through collective ijtihād in fiqh academies, such as the International Islamic Fiqh Academy of the OIC (founded 1981) and the Fiqh Council of the Muslim World League, which bring jurists together with doctors, economists and other specialists.","Islamic bioethics applies legal maxims and the objectives of the Sharīʿah to new cases. For example, the International Islamic Fiqh Academy in 1986 accepted brain death as legal death, while other scholars disagreed; organ donation, IVF within marriage and genetic testing are argued through necessity, harm and the protection of life and lineage.","Fiqh of minorities (fiqh al-aqalliyyāt), associated with Ṭāhā Jābir al-ʿAlwānī and Yūsuf al-Qaraḍāwī, addresses Muslims living under non-Muslim law. The European Council for Fatwa and Research (founded 1997) issued rulings such as its 1999 opinion permitting a conventional mortgage for a family home under need, which other scholars rejected.","New technology raises questions about ownership, privacy, fraud and responsibility, from cryptocurrency to artificial intelligence. Scholars usually begin by asking what the new thing really is (taṣawwur), because a ruling on a thing depends on an accurate conception of it."],"callout":["Method","For any modern ruling, find the actual resolution text, note who issued it and when, list the evidences and maxims cited, and look for a dissenting view before forming your own summary."],"lectures":[{"t":"Maqāṣid and Bioethics: From the Thin to the Thick Approach","u":"https://www.youtube.com/watch?v=SaVtb064G-o","by":"Mohammed Ghaly / CILE"},{"t":"Islamic Bioethics in the Age of Genetics","u":"https://www.youtube.com/watch?v=zNB-JkuRIjM","by":"Mohammed Ghaly / CILE"},{"t":"Muslims Living as a Minority and Fiqh al-Aqalliyyāt","u":"https://www.youtube.com/watch?v=rJqr0O-ghR8","by":"Muhammad ibn Adam / DarulIftaaUK"}],"papers":[{"t":"Resolutions of the International Islamic Fiqh Academy","u":"https://iifa-aifi.org/en/resolutions","by":"International Islamic Fiqh Academy (OIC)"},{"t":"Fatwas of the Fiqh Council of North America","u":"https://fiqhcouncil.org/fatwas/","by":"Fiqh Council of North America"}],"reads":[{"t":"Islamic Ethics and the Genome Question (open access)","u":"https://library.oapen.org/handle/20.500.12657/37820","by":"Mohammed Ghaly (ed.), Brill, 2018"},{"t":"Toward an Islamic Ethics and Fiqh of Artificial Intelligence","u":"https://yaqeeninstitute.org/read/paper/toward-an-islamic-ethics-and-fiqh-of-artificial-intelligence","by":"Mohamed AbuTaleb, Yaqeen Institute"},{"t":"Shariah in Today's World: Renewing Islamic Discourse","u":"https://yaqeeninstitute.org/read/paper/shariah-in-todays-world-renewing-islamic-discourse","by":"Hatem al-Haj, Yaqeen Institute"}],"projects":[{"n":"Resolution brief","l":"Intermediate","d":"Choose one fiqh academy resolution (for example on brain death or organ transplants) and write a one-page brief: the question, the ruling, the evidences and maxims cited, and one dissenting view."},{"n":"New case analysis","l":"Advanced","d":"Pick a new technology question and write 1,000 words that first describe the thing accurately (taṣawwur), then apply relevant maxims and objectives, and end with the range of possible rulings."}],"repos":[{"r":"CILE: Research Center for Islamic Legislation and Ethics","u":"https://www.cilecenter.org/","d":"Find seminars, papers and podcasts on Islamic bioethics and contemporary ethics."},{"r":"International Islamic Fiqh Academy","u":"https://iifa-aifi.org/en/resolutions","d":"Read the academy's resolutions on medical, financial and social questions."}]},{"id":"d_dawah","section":"contemporary","title":"Daʿwah: explaining Islam with wisdom","short":"Daʿwah","level":"Intermediate","why":"Explaining Islam to others is part of the Prophetic mission, and doing it with knowledge, accuracy and good character matters as much as the content.","mins":600,"pre":["b_seerah","adab_talib","c_comparative"],"ideas":["The Qurʾān sets the method in al-Naḥl 16:125: invite with wisdom (ḥikmah), good counsel (al-mawʿiẓah al-ḥasanah) and argument in the best manner. Classical exegetes read wisdom as choosing the right words, proofs and timing for the particular audience, and most scholars treat organised daʿwah as a communal obligation (farḍ kifāyah), while every Muslim conveys accurately what he or she knows.","The Prophet ﷺ taught priorities and gradualism: when he sent Muʿādh to Yemen he told him to begin with the testimony of faith, then prayer, then zakāh (al-Bukhārī 1395), and he told his envoys to make things easy and not drive people away (al-Bukhārī 69). His letter to Heraclius (al-Bukhārī 7) is short, courteous, addresses the ruler by his title and quotes Āl ʿImrān 3:64 as common ground.","Daʿwah must be ʿalā baṣīrah, with clear knowledge (Yūsuf 12:108). That means separating agreed core beliefs from matters of scholarly disagreement, admitting what you do not know, never issuing fatwas, and remembering that there is no compulsion in religion (al-Baqarah 2:256) and that guidance belongs to Allah alone (al-Qaṣaṣ 28:56).","Historically, much of the spread of Islam came through traders, scholars and Sufis whose conduct drew people to the faith, as T. W. Arnold documented in The Preaching of Islam (1896). Good practice today includes representing other religions fairly, arguing with the People of the Book only in the best way (al-ʿAnkabūt 29:46), and avoiding staged debates that aim at winning rather than understanding."],"callout":["Pitfall","Do not memorise ready-made answers to every objection. Learn the core of creed and the Sīrah well, say \"I do not know, let me ask a scholar\" when needed, and let your character carry as much weight as your words."],"lectures":[{"t":"Ep. 28: Inviting people to good (Guidebook to God)","u":"https://www.youtube.com/watch?v=UM_-BfKmJNQ","by":"Sh. Yahya Ibrahim (Yaqeen Institute)"},{"t":"Sharḥ al-Daʿwah ilā Allāh wa-Akhlāq al-Duʿāh li-Ibn Bāz (Arabic)","u":"https://www.youtube.com/watch?v=ZpkUN-QE2ew","by":"Ṣāliḥ al-ʿUṣaymī"},{"t":"Muḥāḍarāt fī al-Daʿwah (Arabic lecture series, 18 parts)","u":"https://www.youtube.com/playlist?list=PL914QhoC1BhvTeo41VDUgYMDwGfLOj5-l","by":"Ṣāliḥ Āl al-Shaykh (al-Rāyah recordings)"}],"papers":[{"t":"Sūrat al-Naḥl 16:125 with tafsīr","u":"https://quran.com/16/125","by":"Qurʾān (quran.com)"},{"t":"Ṣaḥīḥ al-Bukhārī 7: the Prophet's ﷺ letter to Heraclius","u":"https://sunnah.com/bukhari:7","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī 1395: the instructions to Muʿādh on sending him to Yemen","u":"https://sunnah.com/bukhari:1395","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī 69: \"Make things easy and do not make them difficult\"","u":"https://sunnah.com/bukhari:69","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"In Defense of Faith: Principles and Guidelines for Islamic Apologetics","u":"https://yaqeeninstitute.org/read/blog/in-defense-of-faith-principles-and-guidelines-for-islamic-apologetics","by":"Yaqeen Institute"},{"t":"The Preaching of Islam: A History of the Propagation of the Muslim Faith","u":"https://archive.org/details/preachingofislam1896arno","by":"T. W. Arnold (1896, public domain)"}],"projects":[{"n":"Three-audience explanation","l":"Intermediate","d":"Write a 300-word explanation of tawḥīd and prophethood for three audiences (a curious colleague, a practising Christian, a philosophy student), then note what you changed for each and why, and ask a teacher to check accuracy."},{"n":"Prophetic letters study","l":"Intermediate","d":"Compare the letter to Heraclius with the instructions to Muʿādh and list five principles of method they share, each tied to a phrase in the Arabic text."}],"repos":[{"r":"quran.com","u":"https://quran.com/","d":"Look up and compare translations of the verses on daʿwah."}]},{"id":"d_minority","section":"contemporary","title":"Muslims as minorities: citizenship and the rights of non-Muslims","short":"Minorities","level":"Intermediate","why":"Many Muslims now live as citizens of non-Muslim states, and Muslim societies have always included non-Muslims, so the fiqh of covenants, residence and coexistence is practical knowledge.","mins":720,"pre":["c_fiqh","f_siyasa"],"ideas":["Classical jurists divided the world into lands under Muslim rule (dār al-Islām), lands at war (dār al-ḥarb) and, for many, lands bound by treaty (dār al-ʿahd or dār al-ṣulḥ). They differed on residence outside Muslim rule: many allowed it where a Muslim can practise the religion openly, and some Shāfiʿīs such as al-Māwardī held it could even be preferable when it served Islam, while others discouraged it; the first hijrah of the Companions to the Christian Negus of Abyssinia is the classic precedent.","A Muslim who enters or lives in a country under a grant of safety (amān), visa or citizenship is bound by that covenant, since the Qurʾān commands fulfilling contracts (al-Māʾidah 5:1) and treachery is forbidden. Contemporary scholars such as ʿAbd Allāh ibn Bayyah describe citizenship as such a covenant; they debate whether a separate fiqh al-aqalliyyāt is needed or whether the general rules of necessity, custom and public interest are enough.","Under Muslim rule non-Muslims could live as protected people (ahl al-dhimmah) with guaranteed life, property, worship and communal courts in return for jizyah, from which women, children, the poor and monks were exempt. The Prophet ﷺ warned that whoever kills a person under covenant will not smell the fragrance of Paradise (al-Bukhārī 3166) and that he will plead against whoever wrongs one (Abū Dāwūd 3052); actual practice varied by period, from Ottoman millets to episodes of harsh treatment.","The Qurʾān permits kindness and justice toward non-Muslims who do not fight Muslims or expel them (al-Mumtaḥanah 60:8). Modern statements such as the Marrakesh Declaration (2016 CE / 1437 AH) draw on the Charter of Madinah to argue for equal citizenship, while scholars and academics such as Andrew March examine how Islamic ethics can support loyal participation in a pluralist state without giving up religious identity."],"callout":["Method","Separate three questions that are often mixed: what classical fiqh said for a Muslim polity, what it said about Muslims living under others, and what contemporary scholars say about modern citizenship. Note who holds each view and on what evidence."],"lectures":[{"t":"Fiqh al-wāqiʿ fī bilād al-aqalliyyāt (\"Fiqh of Reality\": how fiqh changes, Arabic)","u":"https://www.youtube.com/watch?v=1zGB1QrKuSs","by":"Shaykh ʿAbd Allāh ibn Bayyah (official channel)"},{"t":"Islam, the West and Challenges of Muslim Minorities","u":"https://www.youtube.com/watch?v=QZdnfVOLAeI","by":"Dr. Sherman Jackson and Shaykh Mohammad Akram Nadwi (Islamic Circles)"},{"t":"Western Muslims and Human Rights: An Alternative Framework?","u":"https://www.youtube.com/watch?v=IQAMUB2PiJA","by":"Dr. Sherman Jackson (Duke University)"}],"papers":[{"t":"Sūrat al-Mumtaḥanah 60:8 with tafsīr","u":"https://quran.com/60/8","by":"Qurʾān (quran.com)"},{"t":"Ṣaḥīḥ al-Bukhārī 3166: the sin of killing a person under covenant","u":"https://sunnah.com/bukhari:3166","by":"al-Bukhārī (sunnah.com)"},{"t":"Sunan Abī Dāwūd 3052: wronging a person under covenant","u":"https://sunnah.com/abudawud:3052","by":"Abū Dāwūd (sunnah.com)"}],"reads":[{"t":"Does That Apply to Non-Muslims, Too?","u":"https://yaqeeninstitute.org/read/paper/does-that-apply-to-non-muslims-too","by":"Justin Parrott (Yaqeen Institute)"},{"t":"Religious Minorities Under Muslim Rule","u":"https://yaqeeninstitute.org/read/paper/religious-minorities-under-muslim-rule","by":"Tesneem Alkiek (Yaqeen Institute)"},{"t":"Islam and Liberal Citizenship: The Search for an Overlapping Consensus","u":"https://archive.org/details/islamliberalciti0000marc","by":"Andrew F. March (borrowable)"}],"projects":[{"n":"Survey of positions on residence","l":"Intermediate","d":"Write a survey of at least four scholarly positions on Muslims living under non-Muslim rule, with the scholar, school, evidence and conditions for each, and have it reviewed by a teacher."},{"n":"Rights table","l":"Intermediate","d":"Make a table of the rights and duties of ahl al-dhimmah in classical fiqh, with a source for each row, and add a column comparing each with a modern citizenship right."}],"repos":[{"r":"Marrakesh Declaration","u":"https://www.marrakeshdeclaration.org/","d":"Text and background of the 2016 declaration on the rights of religious minorities in Muslim-majority countries."}]}]},{"id":"y3fiqh","title":"Year 3 track A: Fiqh and uṣūl","level":"Advanced","intro":"A specialization track for students who have finished the Year 2 fiqh and uṣūl work. It studies how the schools were formed, how jurists disagree, how legal language is read, how one school's manual is mastered, and how law meets changing circumstances.","phase":15,"optional":true,"topics":[{"id":"sp_fiqh","title":"Specialization: Fiqh & uṣūl","short":"Fiqh track","level":"Advanced","why":"This track trains the learner to read a madhhab's main manual with its legal theory, so that rulings are understood through their evidence, method and purposes.","mins":28000,"pre":["madhhab","mustasfa","maqasid","qawaid","fatwa"],"ideas":["Months 1–3: The nature of fiqh as against sharīʿah, the sources (Qurʾān, Sunnah, ijmāʿ, qiyās and the disputed sources), and legal language: command and prohibition, general and specific, absolute and qualified, and the five rulings from obligatory to forbidden.","Months 4–6: Ikhtilāf through Ibn Rushd's Bidāyat al-Mujtahid, maqāṣid al-sharīʿah (preserving religion, life, intellect, lineage and property), and the five universal legal maxims: matters are judged by their aims, certainty is not removed by doubt, hardship brings ease, harm is removed, and custom is authoritative.","Months 7–10: Specialise in one school's main text with a teacher, in the Arabic: al-Hidāyah of al-Marghīnānī (Ḥanafī), the Risālah of Ibn Abī Zayd then the Mukhtaṣar of Khalīl (Mālikī), al-Nawawī's Minhāj al-Ṭālibīn (Shāfiʿī), or al-Bahūtī's al-Rawḍ al-Murbiʿ (Ḥanbalī), studying the school's evidence as well as its rulings. The colonial-era English versions linked here are historical translations of limited reliability; use modern annotated translations where they exist (such as Nyazee's al-Hidāyah) only alongside the Arabic.","Months 11–12: Fiqh and reality through Ibn al-Qayyim's Iʿlām al-Muwaqqiʿīn, including his chapter on fatwa changing with time, place, circumstance and custom, then a capstone research paper that surveys how qualified scholars of one madhhab have answered a contemporary question, reviewed by a teacher."],"callout":["Method","Keep one bound notebook per chapter of your madhhab text: the ruling, its evidence, the school's reasoning, the main dissenting view, and the relevant legal maxim."],"lectures":[{"t":"The Coherence of Sharia: Legal Maxims (Qawāʿid Fiqhiyyah)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqSVx7VjquRMwMM_jZ9nsDcD","by":"Hatem al-Haj"},{"t":"Maqasid Al-Shariah as a Philosophy of Islamic Law: A Systems Approach","u":"https://www.youtube.com/watch?v=l7zwMInT5hk","by":"Jasser Auda (IIIT)"}],"papers":[{"t":"The Hedaya, or Guide, vol. 1 (historical translation: made from a Persian version, abridged, omits the ʿibādāt; limited reliability)","u":"https://archive.org/details/in.ernet.dli.2015.221892","by":"al-Marghīnānī (trans. Charles Hamilton, 1791); study al-Hidāyah in Arabic with a teacher"},{"t":"Minhaj et Talibin (historical translation from van den Berg's French; limited reliability)","u":"https://archive.org/details/minhajettalibinm00nawauoft","by":"al-Nawawī (trans. E. C. Howard, 1914); study Minhāj al-Ṭālibīn in Arabic with a teacher"},{"t":"Maliki Law: a summary of the Mukhtaṣar of Khalīl","u":"https://archive.org/details/ruxton1916maliki-law-khalil","by":"Khalīl ibn Isḥāq (trans. F. H. Ruxton, 1916; historical summary, use alongside the Arabic)"},{"t":"Iʿlām al-Muwaqqiʿīn ʿan Rabb al-ʿĀlamīn (Arabic)","u":"https://shamela.ws/book/11496","by":"Ibn Qayyim al-Jawziyyah"}],"reads":[{"t":"Maqasid al-Shariah: A Beginner's Guide (open access)","u":"https://iiit.org/en/book/maqasid-al-shariah-a-beginners-guide/","by":"Jasser Auda (IIIT)"},{"t":"Principles of Islamic Jurisprudence (print)","u":"https://www.meccabooks.com/products/principles-of-islamic-jurisprudence","by":"Mohammad Hashim Kamali (Islamic Texts Society)"},{"t":"The Risālah of Ibn Abī Zayd al-Qayrawānī (print)","u":"https://meccabooks.com/products/the-risalah-ibn-abi-zayd-al-qayrawani","by":"trans. Aisha Bewley (Diwan Press)"}],"projects":[{"n":"Annotated chapter","l":"Advanced","d":"Take one chapter of your madhhab's manual (e.g. sales or marriage) and produce an annotated edition: each ruling with its evidence, the school's reasoning and the main opposing view."},{"n":"Capstone research paper","l":"Advanced","d":"Write a 5,000–7,000 word paper surveying the existing answers of qualified scholars in one madhhab to a contemporary question, setting out their sources, maxims, maqāṣid and reasoning on custom and necessity. It is reviewed by a qualified teacher and is a survey of scholarly positions, not a fatwa to be acted on."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth cited here with Arabic, English and grading."}],"section":"fiqh"},{"id":"y3f_madhhabs","title":"History and structure of the four madhhabs","short":"Madhhab history","level":"Advanced","section":"fiqh","why":"Knowing how the Ḥanafī, Mālikī, Shāfiʿī and Ḥanbalī schools formed and how their doctrine is organized lets you read any school text with a sense of where its authority comes from.","mins":2400,"pre":["sp_fiqh","madhhab","taqlid"],"ideas":["Before the personal schools there were regional traditions of law in Kufa, Medina, Mecca and Syria. Christopher Melchert argues that the classical schools, with recognized teachers, chains of training and a body of doctrine attached to an eponym, took shape around the late 3rd/9th and early 4th/10th centuries through figures such as Ibn Surayj (Shāfiʿī), al-Khallāl (Ḥanbalī) and al-Karkhī (Ḥanafī).","Ahmed El Shamsy describes al-Shāfiʿī's project as a turn from local custom to a law tied explicitly to the Qurʾān and ḥadīth, preserved in writing. His Egyptian students, such as al-Buwayṭī, al-Muzanī and al-Rabīʿ, then made his texts the core of a school.","Each school separates layers of authority: the founder's reported positions, the derived views of later jurists (wujūh or takhrīj), and the relied-upon position (al-muʿtamad) fixed by later editors such as al-Rāfiʿī and al-Nawawī for the Shāfiʿīs or al-Mardāwī for the Ḥanbalīs. Other schools, such as the Ẓāhirī and Jarīrī, did not survive as living traditions.","Mohammad Fadel argues that from the 7th/13th century the abridged manual (mukhtaṣar) stated a school's authoritative doctrine so that judges and muftis gave uniform answers. On this reading taqlīd served predictability and the rule of law, not only intellectual decline."],"callout":["Method","When you read a historical claim about a school, ask what kind of source supports it: biographical dictionaries (ṭabaqāt), the founders' own texts, or later manuals. Melchert relies mostly on ṭabaqāt, which were written by members of the schools themselves."],"lectures":[{"t":"Introduction to Islamic Law","u":"https://www.youtube.com/watch?v=OrqCzqNr4AE","by":"Mohammad Fadel (Tokat Institute)"},{"t":"The Hanbali School Part 1: History & Sanad","u":"https://www.youtube.com/watch?v=5LI3ExwUNY4","by":"Hatem al-Haj (Safina Society)"}],"papers":[{"t":"Islamic Jurisprudence: Shāfiʿī's Risāla (library loan)","u":"https://archive.org/details/bwb_C0-ABV-991","by":"al-Shāfiʿī (trans. Majid Khadduri, 1961)"},{"t":"The Muqaddimah, vol. 3: the section on jurisprudence and the schools (library loan)","u":"https://archive.org/details/muqaddimahintrod0003ibnk","by":"Ibn Khaldūn (trans. Franz Rosenthal)"},{"t":"Ṭabaqāt al-Shāfiʿiyyah al-Kubrā (Arabic)","u":"https://shamela.ws/book/6739","by":"Tāj al-Dīn al-Subkī (ed. al-Ṭanāḥī and al-Ḥulw), al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Formation of the Sunni Schools of Law, 9th–10th Centuries C.E. (library loan)","u":"https://archive.org/details/formationofsunni0000melc","by":"Christopher Melchert (Brill, 1997)"},{"t":"The Canonization of Islamic Law: A Social and Intellectual History","u":"https://www.cambridge.org/core/books/canonization-of-islamic-law/B3892734396826AA432980B31657C082","by":"Ahmed El Shamsy (Cambridge University Press, 2013)"}],"projects":[{"n":"School timeline","l":"Advanced","d":"Build a timeline for one school from its eponym to about 1300 AH, listing for each generation two jurists, their key text, and whether they produced riwāyah, takhrīj or tarjīḥ. Finish with a one-page note on when the muʿtamad of that school became fixed."},{"n":"Melchert and El Shamsy compared","l":"Advanced","d":"Write a 2,000-word review essay comparing how Melchert and El Shamsy explain the rise of the schools. Identify the sources each relies on and one point where they disagree."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]},{"id":"y3f_comparative","title":"Comparative fiqh: Ibn Rushd's Bidāyat al-Mujtahid","short":"Comparative fiqh","level":"Advanced","section":"fiqh","why":"Ibn Rushd's Bidāyat al-Mujtahid explains why jurists disagree on each question, which trains you to reason about evidence rather than memorize rulings.","mins":3600,"pre":["sp_fiqh","y3f_madhhabs","ikhtilaf"],"ideas":["Ibn Rushd al-Ḥafīd (d. 595/1198), Mālikī judge in Seville and Cordoba and the philosopher known in Latin as Averroes, wrote Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid. His stated aim is to give the student the tools to reach the level of a mujtahid, so for each question he names the cause of disagreement (sabab al-ikhtilāf) and not only the positions.","The causes he returns to are mostly linguistic and evidential: a word with more than one meaning, a general term that may be restricted, a literal versus figurative reading, conflicting reports, a ḥadīth that did not reach a jurist, and the conflict of analogy (qiyās) with a text. These map directly onto the topics of uṣūl al-fiqh.","He separates questions addressed by the texts (al-masāʾil al-manṭūq bihā) from those the texts leave silent. This makes the work a guide to the core of each chapter rather than an exhaustive manual, and it is why he cites the main schools together with early figures such as the Companions and the jurists of the cities.","Other great works of comparative law include Ibn Qudāmah's al-Mughnī (Ḥanbalī) and al-Nawawī's al-Majmūʿ (Shāfiʿī). Maribel Fierro has argued that the Bidāyah fits the Almohad policy of favouring the sources over school doctrine, which helps explain its method."],"callout":["Pitfall","Ibn Rushd sometimes reports a school's position in summary form. Before you quote what a school holds, check it against that school's own relied-upon manual, because later editors may have fixed a different view."],"lectures":[{"t":"Comparative Fiqh: Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid (class series)","u":"https://www.youtube.com/playlist?list=PLffiZW9B2ANpxWKPfTRIn7Gn8Y1f0z80t","by":"Shpendim Nadzaku"},{"t":"Fiqh al-Khilāf: Ethics of Disagreements (class series)","u":"https://www.youtube.com/playlist?list=PL2V63Qx6iXIQTAVoxq_AeAIyF90GACan-","by":"Islamic University of Minnesota"}],"papers":[{"t":"Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid (Arabic)","u":"https://shamela.ws/book/21739","by":"Ibn Rushd (Dār al-Ḥadīth ed.), al-Maktabah al-Shāmilah"},{"t":"The Distinguished Jurist's Primer, vol. 2 (library loan)","u":"https://archive.org/details/distinguishedjur0002aver","by":"Ibn Rushd (trans. Imran Ahsan Khan Nyazee)"},{"t":"al-Mughnī (Arabic)","u":"https://shamela.ws/book/8463","by":"Ibn Qudāmah al-Maqdisī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Ibn Rushd [Averroes]","u":"https://plato.stanford.edu/entries/ibn-rushd/","by":"Stanford Encyclopedia of Philosophy"},{"t":"The Legal Policies of the Almohad Caliphs and Ibn Rushd's Bidāyat al-Mujtahid","u":"https://doi.org/10.1093/jis/10.3.226","by":"Maribel Fierro (Journal of Islamic Studies, 1999)"}],"projects":[{"n":"Disagreement map","l":"Advanced","d":"Take one chapter of the Bidāyah (for example, ablution or sale) and tabulate every question: positions, holders, and Ibn Rushd's stated cause of disagreement. Classify each cause under an uṣūl heading and count which causes dominate."},{"n":"Verify against the manuals","l":"Advanced","d":"Choose five questions where Ibn Rushd reports the four schools and check each report against al-Mughnī and one relied-upon manual of another school. Write a short report on where the Bidāyah agrees with the later muʿtamad and where it differs."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]},{"id":"y3f_language","title":"Advanced legal hermeneutics: al-Āmidī and al-Rāzī","short":"Legal hermeneutics","level":"Advanced","section":"fiqh","why":"Most juristic disagreement turns on how the words of the Qurʾān and Sunnah are read, and al-Āmidī and al-Rāzī wrote the fullest classical treatments of that question.","mins":4000,"pre":["sp_fiqh","mustasfa","y3f_comparative"],"ideas":["Ibn Khaldūn names four foundational works of the theologians' method in uṣūl: al-Juwaynī's al-Burhān, al-Ghazālī's al-Mustaṣfā, ʿAbd al-Jabbār's al-ʿUmad and Abū al-Ḥusayn al-Baṣrī's al-Muʿtamad. Fakhr al-Dīn al-Rāzī (d. 606/1210) in al-Maḥṣūl and Sayf al-Dīn al-Āmidī (d. 631/1233) in al-Iḥkām fī Uṣūl al-Aḥkām each condensed and reworked this tradition.","The linguistic chapters classify expressions: literal and figurative (ḥaqīqah and majāz), general and particular (ʿāmm and khāṣṣ), unqualified and qualified (muṭlaq and muqayyad), ambiguous and clarified (mujmal and mubayyan), and what is stated versus what is implied (manṭūq and mafhūm, including mafhūm al-muwāfaqah and mafhūm al-mukhālafah). Commands and prohibitions get their own long sections: most theorists hold that an unqualified command indicates obligation, while repetition and immediacy are disputed.","Bernard Weiss presents al-Āmidī's jurisprudence as a structured search for God's law in which the mujtahid moves from the authority of the texts, through their meaning, to probable conclusions. Much of the law rests on ẓann (preponderant probability), and the theory explains why acting on it is still obligatory.","Al-Rāzī argued that purely verbal proofs yield only probability, since certainty would require ruling out ambiguity, figurative use, unstated restriction and similar possibilities. Ibn al-Qayyim rejected this as a basis for taʾwīl in al-Ṣawāʿiq al-Mursalah, and most Ḥanafī theorists (the Iraqi line, against the Samarqandīs such as Abū Manṣūr al-Māturīdī, who agreed with the Shāfiʿīs) hold that a general term is definitive in its scope. Aron Zysow's typology of an 'economy of certainty' explains such differences."],"callout":["Method","Read one linguistic question, such as whether an unqualified command requires immediate performance, in both al-Maḥṣūl and al-Iḥkām side by side. Note each author's list of positions, their proofs and their replies before reading any modern summary."],"lectures":[{"t":"Ḥanafī Uṣūl al-Fiqh 101 (class series)","u":"https://www.youtube.com/playlist?list=PLNyV15Nh9fKV6Q1mKERvTBVltfzf0CXly","by":"Omer Khurshid (Talweeh Academy)"},{"t":"Ḥanafī Uṣūl al-Fiqh 101, Lesson 10: Understanding Amr","u":"https://www.youtube.com/watch?v=1aLbpIbX9kc","by":"Omer Khurshid (Talweeh Academy)"},{"t":"al-Shāfiʿī's Risālah","u":"https://www.youtube.com/watch?v=9XR-23dSqhs","by":"Hamza Karamali (Blogging Theology)"}],"papers":[{"t":"al-Iḥkām fī Uṣūl al-Aḥkām (Arabic)","u":"https://shamela.ws/book/10801","by":"Sayf al-Dīn al-Āmidī (ed. ʿAbd al-Razzāq ʿAfīfī), al-Maktabah al-Shāmilah"},{"t":"al-Maḥṣūl fī ʿIlm Uṣūl al-Fiqh (Arabic)","u":"https://shamela.ws/book/2022","by":"Fakhr al-Dīn al-Rāzī (ed. Taha Jabir al-Alwani), al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Search for God's Law: Islamic Jurisprudence in the Writings of Sayf al-Dīn al-Āmidī (library loan)","u":"https://archive.org/details/searchforgodslaw0000weis","by":"Bernard G. Weiss (University of Utah Press, 1992)"},{"t":"The Economy of Certainty: An Introduction to the Typology of Islamic Legal Theory (print)","u":"https://lockwoodpressonline.com/index.php/ebooks/catalog/book/26","by":"Aron Zysow (Lockwood Press)"}],"projects":[{"n":"Commentary on one masʾalah","l":"Advanced","d":"Translate the section on whether a general term (ʿāmm) remains a proof after it has been restricted from al-Iḥkām, then add notes comparing al-Rāzī's treatment in al-Maḥṣūl. Aim for 2,500 words with every position attributed."},{"n":"Hermeneutic case file","l":"Advanced","d":"Pick three disputed rulings from the Bidāyah and, for each, identify the linguistic rule at stake (for example mafhūm al-mukhālafah) and how the Shāfiʿī and Ḥanafī theorists differ on it. Present it as a table with a one-paragraph conclusion."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]},{"id":"y3f_manual","title":"Madhhab specialization: one primary manual with commentary","short":"Manual + sharḥ","level":"Advanced","section":"fiqh","why":"Real competence in fiqh comes from working through one school's standard manual and its main commentary, because that is where the relied-upon doctrine and its reasoning are kept.","mins":9000,"pre":["sp_fiqh","y3f_madhhabs","ar_classical"],"ideas":["Each school has a standard chain of texts. Ḥanafī: al-Marghīnānī's al-Hidāyah (d. 593/1197) with Ibn al-Humām's Fatḥ al-Qadīr (d. 861/1457), and Ibn ʿĀbidīn for late fatwa positions. Shāfiʿī: al-Nawawī's Minhāj al-Ṭālibīn with Ibn Ḥajar al-Haytamī's Tuḥfat al-Muḥtāj (d. 974/1567) or al-Ramlī's Nihāyat al-Muḥtāj (d. 1004/1596).","Mālikī: the Mukhtaṣar of Khalīl ibn Isḥāq (d. 776/1374) with al-Dardīr's al-Sharḥ al-Kabīr (d. 1201/1786) and al-Dasūqī's gloss. Ḥanbalī: al-Ḥajjāwī's Zād al-Mustaqniʿ with al-Buhūtī's al-Rawḍ al-Murbiʿ (d. 1051/1641).","These works come in layers: a dense base text (matn), a commentary (sharḥ) that opens its wording, gives evidence and states the relied-upon view, and glosses (ḥāshiyah) that correct or extend the commentary. Much legal development happened inside commentaries, which is why reading the matn alone is not enough.","Each school has its own technical terms for the strength of opinions. In the Minhāj, al-Nawawī uses al-aẓhar and al-mashhūr for al-Shāfiʿī's own two opinions, al-aṣaḥḥ and al-ṣaḥīḥ for the views of his followers, and al-madhhab where the school's reports differ. Ḥanafīs use phrases such as ẓāhir al-riwāyah and ʿalayhi al-fatwā, set out by Ibn ʿĀbidīn in ʿUqūd Rasm al-Muftī."],"callout":["Method","Choose one school and one commentary, and read it with a teacher if possible. Keep a running glossary of the commentator's terms and a list of every place where he departs from the matn."],"lectures":[{"t":"al-ʿAynī's comprehensive commentary on the Hidāyah","u":"https://www.youtube.com/watch?v=-koOEEeMbhY","by":"Talweeh Academy"},{"t":"Mukhtaṣar Khalīl (class series)","u":"https://www.youtube.com/playlist?list=PLKOt0wDHQe3A","by":"Abdarhmane Deyah (Assiddiq Islamic Foundation)"}],"papers":[{"t":"Fatḥ al-Qadīr ʿalā al-Hidāyah (Arabic)","u":"https://shamela.ws/book/21744","by":"Ibn al-Humām (Ḥalabī ed.), al-Maktabah al-Shāmilah"},{"t":"Tuḥfat al-Muḥtāj fī Sharḥ al-Minhāj, with the glosses of al-Shirwānī and al-ʿAbbādī (Arabic)","u":"https://shamela.ws/book/9059","by":"Ibn Ḥajar al-Haytamī, al-Maktabah al-Shāmilah"},{"t":"al-Sharḥ al-Kabīr with Ḥāshiyat al-Dasūqī (Arabic)","u":"https://shamela.ws/book/21604","by":"al-Dardīr and al-Dasūqī, al-Maktabah al-Shāmilah"},{"t":"al-Rawḍ al-Murbiʿ Sharḥ Zād al-Mustaqniʿ (Arabic)","u":"https://shamela.ws/book/1679","by":"Manṣūr al-Buhūtī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Social Logic of Taqlīd and the Rise of the Mukhtaṣar","u":"https://doi.org/10.1163/1568519962599122","by":"Mohammad Fadel (Islamic Law and Society, 1996)"},{"t":"Sharḥ al-Manẓūmah al-musammāh ʿUqūd Rasm al-Muftī (Arabic)","u":"https://shamela.ws/book/1610/41","by":"Ibn ʿĀbidīn, in Majmūʿat Rasāʾil Ibn ʿĀbidīn, al-Maktabah al-Shāmilah"}],"projects":[{"n":"Chapter study file","l":"Advanced","d":"Work through one full chapter of your chosen commentary (for example, the chapter on salam sales) and produce a structured summary: each ruling, its evidence as the commentator gives it, and the term he uses for its strength. Mark every point where the gloss corrects the commentary."},{"n":"Matn to muʿtamad","l":"Advanced","d":"Select ten rulings from the matn and trace each through the commentary and one later fatwa work of the same school. Write up which rulings changed, why, and which later authority fixed the change."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."},{"r":"OpenITI","u":"https://openiti.org/","d":"Machine-readable corpus of premodern Arabic texts, useful for searching terms across many legal or theological works at once."}]},{"id":"y3f_reality","title":"Fiqh and reality: necessity, custom and minority contexts","short":"Necessity & custom","level":"Advanced","section":"fiqh","why":"Jurists built tools for changed circumstances, such as necessity, need and custom, and these tools frame today's debates on Muslims living as minorities.","mins":3000,"pre":["sp_fiqh","qawaid","fatwa","y3f_language"],"ideas":["Necessity (ḍarūrah) is grounded in verses such as Q 2:173. The maxim 'necessity makes the prohibited permissible' is limited by a second maxim: what is allowed by necessity is measured by its extent. Under the larger rule 'hardship brings ease', al-Suyūṭī also records that a general need (ḥājah) can be treated like necessity.","Custom (ʿurf) enters the law through the maxim 'custom is authoritative' (al-ʿādah muḥakkamah). Ibn ʿĀbidīn's Nashr al-ʿUrf argues that rulings built on custom change when the custom changes, so a mufti must know the practice of his own people. A custom that contradicts a clear text is invalid (ʿurf fāsid).","Muslims living under non-Muslim rule were already discussed by premodern jurists. Al-Wansharīsī's fatwa Asnā al-Matājir (late 9th/15th century) held that Muslims under Christian rule in Iberia must emigrate. Other jurists, such as the Shāfiʿī al-Māwardī, are reported to have held that staying could be better where one could practise the religion openly.","Taha Jabir al-Alwani (d. 2016) proposed a 'fiqh of minorities' (fiqh al-aqalliyyāt) that treats Muslims in the West as citizens with a positive role rather than temporary residents. Critics have asked whether a separate jurisprudence risks becoming a list of concessions. Scholars such as Mohammad Fadel and Sherman Jackson discuss how existing school doctrine can meet these questions."],"callout":["Pitfall","Do not treat necessity or custom as a general licence. Before citing either, state the exact maxim, its conditions and its limits as a named classical source gives them."],"lectures":[{"t":"Living in Non-Muslim Countries (Ask Shaykh YQ #121)","u":"https://www.youtube.com/watch?v=9NAk3woiazU","by":"Yasir Qadhi"},{"t":"Muslims as a Self-Governing Community","u":"https://www.youtube.com/watch?v=6bAtRj_Zh2Q","by":"Mohammad Fadel (The Hurma Project)"},{"t":"The 'American Madhhab'","u":"https://www.youtube.com/watch?v=6DQdeCG9tRk","by":"Sherman Jackson (The Usuli Institute)"}],"papers":[{"t":"Nashr al-ʿUrf fī Bināʾ Baʿḍ al-Aḥkām ʿalā al-ʿUrf (Arabic)","u":"https://shamela.ws/book/1610/488","by":"Ibn ʿĀbidīn, in Majmūʿat Rasāʾil Ibn ʿĀbidīn, al-Maktabah al-Shāmilah"},{"t":"al-Ashbāh wa al-Naẓāʾir, the five major maxims (Arabic)","u":"https://shamela.ws/book/21719","by":"Jalāl al-Dīn al-Suyūṭī, al-Maktabah al-Shāmilah"},{"t":"Asnā al-Matājir fī Bayān Aḥkām man Ghalaba ʿalā Waṭanihi al-Naṣārā (Arabic)","u":"https://shamela.ws/book/6243","by":"Aḥmad al-Wansharīsī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Towards a Fiqh for Minorities: Some Basic Reflections (free PDF)","u":"https://iiit.org/wp-content/uploads/Towards-a-Fiqh-for-Minorities-Book-2010-edition-1.pdf","by":"Taha Jabir al-Alwani (IIIT, 2010)"},{"t":"Islamic Jurisprudence, Islamic Law, and Modernity, incl. the chapter on fiqh al-aqalliyyāt (print)","u":"https://lockwoodpressonline.com/index.php/ebooks/catalog/book/77","by":"Mohammad H. Fadel (Lockwood Press, 2023)"}],"projects":[{"n":"Custom audit","l":"Advanced","d":"Collect ten rulings from one school's manual that the commentators say rest on custom (for example, what counts as receipt in a sale). For each, describe the custom assumed, whether it still holds in your context, and what Ibn ʿĀbidīn's principle would imply."},{"n":"Residence debate brief","l":"Advanced","d":"Write a 3,000-word research brief comparing al-Wansharīsī's Asnā al-Matājir, a report of al-Māwardī's view, and al-Alwani's paper. Set out the legal reasoning of each and the circumstances it assumes, without arguing for a conclusion."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]}]},{"id":"y3tafsir","title":"Year 3 track B: Qurʾānic studies and tafsīr","level":"Advanced","intro":"This track moves from introductory principles to the major works of the exegetical tradition: the encyclopaedias of ʿulūm al-Qurʾān, the great classical commentaries, the linguistic school, thematic approaches and modern tafsīr. The aim is to read these sources directly and to judge how interpretations are built.","phase":16,"optional":true,"topics":[{"id":"sp_tafsir","title":"Specialization: Qurʾānic studies & tafsīr","short":"Tafsīr track","level":"Advanced","why":"This track trains a learner to read the major classical tafsīrs critically and to understand how the Qurʾān is interpreted for law, creed and guidance.","mins":15000,"pre":["ulum","tmethod","tcompare","ahkam"],"ideas":["Months 1–3: the nature of the Qurʾān (revelation, iʿjāz, preservation) and the ʿulūm al-Qurʾān, reading al-Zarkashī's al-Burhān, which arranges the field in forty-seven topics such as asbāb al-nuzūl, Makkī and Madanī, naskh and qirāʾāt.","Months 4–6: tafsīr methodologies (by transmission and by reasoned interpretation, following principles such as Ibn Taymiyyah's Muqaddimah fī Uṣūl al-Tafsīr), then a close comparison of al-Ṭabarī, Ibn Kathīr and al-Qurṭubī on the same passages.","Months 7–9: the Qurʾān and law (āyāt al-aḥkām and the legal tafsīrs) and the Qurʾān and creed (verses on divine attributes, decree and the unseen, and how the theological schools read them).","Months 10–12: misinterpretation (reading verses out of context, ignoring the Arabic or the Sunnah, and sectarian or modern distortions) and a capstone project in which the learner writes a documented commentary on a short sūrah."],"callout":["Method","Keep one bound notebook per sūrah you study, with the same headings each time: language, context, transmitted reports, scholars' views, and rulings or lessons."],"lectures":[{"t":"Qurʾānic Studies with Dr Joseph Lumbard","u":"https://www.youtube.com/playlist?list=PLFQB9yBhxkFmLeNPmU7HNX-dGrboiUBs6","by":"Joseph Lumbard"},{"t":"al-Muqaddimah fī Uṣūl al-Tafsīr: Ibn Taymiyyah","u":"https://www.youtube.com/watch?v=wh9kfZs3ERk","by":"Cambridge Islamic College"}],"papers":[{"t":"al-Burhān fī ʿUlūm al-Qurʾān (Arabic)","u":"https://shamela.ws/book/11436","by":"Badr al-Dīn al-Zarkashī (ed. Muḥammad Abū al-Faḍl Ibrāhīm), al-Maktabah al-Shāmilah"},{"t":"Jāmiʿ al-Bayān (Tafsīr al-Ṭabarī) on Āl ʿImrān 3:7","u":"https://quran.com/3:7/tafsirs/ar-tafsir-al-tabari","by":"al-Ṭabarī (Arabic, Quran.com)"},{"t":"Tafsīr Ibn Kathīr (abridged)","u":"https://quran.com/1:1/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (English, Quran.com)"},{"t":"Asbāb al-Nuzūl","u":"https://www.altafsir.com/Books/Asbab%20Al-Nuzul%20by%20Al-Wahidi.pdf","by":"al-Wāḥidī (trans. Mokrane Guezzou), Royal Aal al-Bayt Institute"}],"reads":[{"t":"Tafsīr, taʾwīl, and tadabbur","u":"https://www.akramnadwi.com/?p=4986","by":"Mohammad Akram Nadwi"},{"t":"Review of The Formation of the Classical Tafsir Tradition: The Qur'an Commentary of al-Thaʿlabi","u":"https://ajis.org/index.php/ajiss/article/view/1537","by":"American Journal of Islam and Society (on Walid Saleh's study)"}],"projects":[{"n":"Comparative tafsīr dossier","l":"Advanced","d":"Choose ten passages and set al-Ṭabarī, Ibn Kathīr and al-Qurṭubī side by side. Produce a 20-page dossier noting each author's sources, method and conclusions."},{"n":"Capstone sūrah commentary","l":"Advanced","d":"Write a documented commentary on a short sūrah (for example al-Mulk or al-Ḥujurāt) covering language, context, transmitted reports, legal and creedal points, with every claim cited to a classical source."}],"repos":[{"r":"Quran.com","u":"https://quran.com","d":"Verse-by-verse text with al-Ṭabarī, Ibn Kathīr, al-Qurṭubī and al-Saʿdī side by side."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com","d":"Word-by-word grammar and morphology for checking how an interpretation reads the Arabic."}],"section":"quran"},{"id":"y3t_burhan","section":"quran","title":"Advanced ʿulūm al-Qurʾān: al-Zarkashī's al-Burhān","short":"al-Burhān","level":"Advanced","why":"Al-Burhān is the classic reference that gathers the Qurʾānic sciences into one system, and later works such as al-Suyūṭī's al-Itqān build directly on it.","mins":2400,"pre":["sp_tafsir","ulum","context"],"ideas":["Badr al-Dīn al-Zarkashī (d. 794/1392), a Shāfiʿī scholar of Cairo, arranged al-Burhān fī ʿUlūm al-Qurʾān into forty-seven sciences (anwāʿ), from the occasions of revelation and the coherence of verses to inimitability, oaths, parables and the rules of interpretation. Al-Suyūṭī's al-Itqān, with eighty types, draws heavily on it.","Coherence between verses and sūrahs (munāsabah) is placed near the start of the book, and al-Zarkashī treats it as a noble science that most commentators neglected. The idea was later developed into a full commentary by al-Biqāʿī in Naẓm al-Durar.","Many chapters overlap with uṣūl al-fiqh, such as the general and specific (ʿāmm and khāṣṣ), the unclear and the clarified (mujmal and mubayyan) and abrogation. This shows that the Qurʾānic sciences are a meeting point of law, theology, grammar and rhetoric rather than a separate discipline.","One of the longest sections treats the styles of the Qurʾān (asālīb), such as emphasis, ellipsis, repetition and figurative speech. Al-Zarkashī's point is that correct interpretation depends on mastering Arabic rhetoric, not only on transmitted reports."],"callout":["Method","Do not read al-Burhān cover to cover. Read its table of contents, then study three types in full (for example munāsabah, asbāb al-nuzūl and the conditions of the mufassir) and compare each with the matching chapter of al-Itqān."],"lectures":[{"t":"Qurʾānic Sciences in 30 Days, Part 1: Introduction and definitions","u":"https://www.youtube.com/watch?v=UTx_zr0KWt0","by":"Dr Mufti Abdur-Rahman ibn Yusuf Mangera, ZamZam Academy"},{"t":"Ulum al-Qur'an (class series)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQEbSb0KOPNyz2MyuGm3qc1G","by":"Shaykh Shoiab Shah, WISE English Academy"}],"papers":[{"t":"al-Burhān fī ʿUlūm al-Qurʾān (Arabic)","u":"https://shamela.ws/book/11436","by":"Badr al-Dīn al-Zarkashī (ed. Muḥammad Abū al-Faḍl Ibrāhīm), al-Maktabah al-Shāmilah"},{"t":"al-Itqān fī ʿUlūm al-Qurʾān (Arabic)","u":"https://shamela.ws/book/11728","by":"Jalāl al-Dīn al-Suyūṭī, al-Maktabah al-Shāmilah"},{"t":"Naẓm al-Durar fī Tanāsub al-Āyāt wa al-Suwar, on al-Baqarah 2:1–5 (Arabic)","u":"https://tafsir.app/nathm-aldurar/2/1","by":"Burhān al-Dīn al-Biqāʿī, Tafsir.app"}],"reads":[{"t":"An Introduction to ʿUlūm al-Qurʾān: The Field of Qurʾānic Studies","u":"https://yaqeeninstitute.org/read/paper/an-introduction-to-ulum-al-quran-the-field-of-quranic-studies","by":"Yaqeen Institute"},{"t":"The Oxford Handbook of Qurʾānic Studies","u":"https://doi.org/10.1093/oxfordhb/9780199698646.001.0001","by":"ed. Mustafa Shah and Muhammad Abdel Haleem, Oxford University Press"}],"projects":[{"n":"Burhān and Itqān concordance","l":"Advanced","d":"Build a table matching al-Zarkashī's forty-seven types to al-Suyūṭī's eighty, noting which are merged, split or new. Add a 1,500-word essay on what al-Suyūṭī changed and why."},{"n":"Munāsabah case study","l":"Advanced","d":"Take one sūrah of moderate length and record what al-Burhān's principles and al-Biqāʿī's Naẓm al-Durar say about the links between its verses. Write a 2,500-word paper assessing how convincing the proposed links are."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Tafsir.app (al-Bāḥith al-Qurʾānī)","u":"https://tafsir.app","d":"Read dozens of Arabic tafsīrs side by side on the same verse, including al-Ṭabarī, al-Rāzī, al-Kashshāf and al-Baḥr al-Muḥīṭ."}]},{"id":"y3t_classical","section":"quran","title":"The great classical tafsīrs: al-Ṭabarī, al-Rāzī, al-Qurṭubī, Ibn Kathīr","short":"Great tafsīrs","level":"Advanced","why":"These four commentaries represent the main directions of classical exegesis: transmitted reports, theology, law and the method of the early generations, and most later tafsīr depends on them.","mins":3000,"pre":["sp_tafsir","tcompare","tmethod"],"ideas":["Al-Ṭabarī (d. 310/923), in Jāmiʿ al-Bayān, gathers the views of the Companions and Successors with their chains and then states which view he prefers (tarjīḥ), usually with linguistic arguments. It is the main archive of early exegesis and the foundation of later tafsīr based on reports.","Fakhr al-Dīn al-Rāzī (d. 606/1210), in Mafātīḥ al-Ghayb, writes a theological commentary from an Ashʿarī position, dividing each passage into numbered questions (masāʾil) and engaging the Muʿtazila and the philosophers. Many scholars hold that the work was completed by others after his death.","Al-Qurṭubī (d. 671/1273), in al-Jāmiʿ li-Aḥkām al-Qurʾān, focuses on legal rulings, giving Mālikī positions but comparing the schools. Ibn Kathīr (d. 774/1373) interprets the Qurʾān by the Qurʾān, then the Sunnah, then the Companions, following the principles of his teacher Ibn Taymiyyah, and often judges the chains of reports and warns against isrāʾīliyyāt.","Walid Saleh describes tafsīr as a genealogical tradition in which each author works through his predecessors; al-Thaʿlabī's encyclopaedic al-Kashf wa al-Bayān fed later works such as al-Baghawī's. He also argues that Ibn Taymiyyah's Muqaddimah fī Uṣūl al-Tafsīr narrowed authority to the early generations, shaping Ibn Kathīr and much modern exegesis."],"callout":["Method","Read one verse in all four commentaries in a single sitting. Note what each one keeps from al-Ṭabarī, what it drops and what it adds; this is the fastest way to see each author's method."],"lectures":[{"t":"How the Qurʾān has been interpreted and translated: understanding the tafsīr tradition","u":"https://www.youtube.com/watch?v=IrJWOpUxX6Y","by":"Johanna Pink, Exploring the Quran and the Bible"},{"t":"Is The Study Quran a tafsīr?","u":"https://www.youtube.com/watch?v=U2ORkjjOU7Y","by":"Joseph Lumbard"}],"papers":[{"t":"Jāmiʿ al-Bayān on Āyat al-Kursī, 2:255 (Arabic)","u":"https://tafsir.app/tabari/2/255","by":"al-Ṭabarī, Tafsir.app"},{"t":"Mafātīḥ al-Ghayb on 2:255 (Arabic)","u":"https://tafsir.app/alrazi/2/255","by":"Fakhr al-Dīn al-Rāzī, Tafsir.app"},{"t":"al-Jāmiʿ li-Aḥkām al-Qurʾān on 2:255 (Arabic)","u":"https://tafsir.app/qurtubi/2/255","by":"al-Qurṭubī, Tafsir.app"},{"t":"Tafsīr Ibn Kathīr on 2:255 (abridged English)","u":"https://quran.com/2:255/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (Darussalam abridgment), Quran.com"}],"reads":[{"t":"The Formation of the Classical Tafsīr Tradition: The Qurʾān Commentary of al-Thaʿlabī (Brill, 2004)","u":"https://doi.org/10.1163/9789047412564","by":"Walid A. Saleh"},{"t":"Preliminary Remarks on the Historiography of tafsīr in Arabic: A History of the Book Approach","u":"https://doi.org/10.3366/jqs.2010.0103","by":"Walid A. Saleh, Journal of Qur'anic Studies"},{"t":"Review of The Formation of the Classical Tafsir Tradition","u":"https://ajis.org/index.php/ajiss/article/view/1537","by":"American Journal of Islam and Society"}],"projects":[{"n":"Four-tafsīr verse dossier","l":"Advanced","d":"Choose a theologically or legally rich verse and translate the core of all four commentaries on it. Write a 3,500-word paper tracing what each author inherited from al-Ṭabarī and where he departed from him."},{"n":"Source map of one commentary","l":"Advanced","d":"For one sūrah in Ibn Kathīr or al-Qurṭubī, list every named earlier authority cited. Produce a chart of sources by century and a short essay on what the chart shows about the author's method."}],"repos":[{"r":"Tafsir.app (al-Bāḥith al-Qurʾānī)","u":"https://tafsir.app","d":"Read dozens of Arabic tafsīrs side by side on the same verse, including al-Ṭabarī, al-Rāzī, al-Kashshāf and al-Baḥr al-Muḥīṭ."},{"r":"Altafsir.com","u":"https://www.altafsir.com","d":"Royal Aal al-Bayt Institute library of classical tafsīrs, with some English translations."}]},{"id":"y3t_language","section":"quran","title":"Linguistic and rhetorical tafsīr: al-Zamakhsharī and Abū Ḥayyān","short":"Linguistic tafsīr","level":"Advanced","why":"The linguistic commentaries show how grammar and rhetoric decide meaning, and al-Kashshāf in particular shaped Qurʾānic rhetoric for every later school despite its author's theology.","mins":2400,"pre":["sp_tafsir","ar_nahw","ar_balagha"],"ideas":["Al-Zamakhsharī (d. 538/1144), a Muʿtazilī grammarian from Khwārazm, wrote al-Kashshāf to show the Qurʾān's inimitability through the sciences of meaning (maʿānī) and expression (bayān). His characteristic style raises an objection (\"if you say...\") and answers it (\"I say...\").","His Muʿtazilī doctrines appear in the commentary, for example in denying that God will be seen in the Hereafter when explaining 7:143 and in his reading of human free will. Sunni scholars kept the book but read it with corrections: Ibn al-Munayyir's al-Intiṣāf points out its iʿtizāl, and al-Bayḍāwī's Anwār al-Tanzīl adapts much of it within a Sunni framework.","Abū Ḥayyān al-Andalusī (d. 745/1344), in al-Baḥr al-Muḥīṭ, gathers grammatical analysis and variant readings in great detail and often disputes al-Zamakhsharī and Ibn ʿAṭiyyah. He defends canonical readings that grammarians had criticised, such as Ḥamzah's reading wa al-arḥāmi in 4:1, which al-Zamakhsharī had judged weak.","In this school, grammatical analysis (iʿrāb) is an interpretive decision: where a phrase attaches, what is understood but omitted (ḥadhf) and why words are placed early or late (taqdīm wa taʾkhīr) change the meaning. Al-Samīn al-Ḥalabī, a student of Abū Ḥayyān, collected these questions in al-Durr al-Maṣūn."],"callout":["Pitfall","Do not take a rhetorical reading from al-Kashshāf as neutral. Check each theological point against a Sunni gloss such as al-Intiṣāf or against al-Bayḍāwī before relying on it."],"lectures":[{"t":"Tafsīr al-Kashshāf of al-Zamakhsharī","u":"https://www.youtube.com/watch?v=KfxXodtjsVk","by":"Mohammad Akram Nadwi, Al-Salam Institute"},{"t":"Introduction to Arabic rhetoric","u":"https://www.youtube.com/watch?v=wr0T2MqnSmg","by":"Mohammad Akram Nadwi, Al-Salam Institute"}],"papers":[{"t":"al-Kashshāf on al-Nisāʾ 4:1 (Arabic)","u":"https://tafsir.app/kashaf/4/1","by":"al-Zamakhsharī, Tafsir.app"},{"t":"al-Baḥr al-Muḥīṭ on al-Nisāʾ 4:1 (Arabic)","u":"https://tafsir.app/albahr-almuheet/4/1","by":"Abū Ḥayyān al-Andalusī, Tafsir.app"},{"t":"al-Kashshāf with Ibn al-Munayyir's al-Intiṣāf and other glosses (Arabic)","u":"https://shamela.ws/book/23627","by":"al-Zamakhsharī, al-Maktabah al-Shāmilah"},{"t":"al-Baḥr al-Muḥīṭ fī al-Tafsīr (Arabic, full text)","u":"https://shamela.ws/book/23591","by":"Abū Ḥayyān al-Andalusī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"A Traditional Muʿtazilite Qurʾān Commentary: The Kashshāf of Jār Allāh al-Zamakhsharī (Brill, 2006)","u":"https://doi.org/10.1163/9789047417767","by":"Andrew J. Lane"},{"t":"Introduction to Iʿjāz al-Qurʾān: The Miraculous Nature of the Qurʾān","u":"https://yaqeeninstitute.org/read/paper/introduction-to-ijaz-al-quran-the-miraculous-nature-of-the-quran","by":"Yaqeen Institute"}],"projects":[{"n":"Kashshāf and its critics","l":"Advanced","d":"Select five passages where al-Zamakhsharī's theology affects his reading and translate his comment, Ibn al-Munayyir's reply and al-Bayḍāwī's version. Write a 3,000-word paper on how Sunni scholars kept his rhetoric while rejecting his doctrine."},{"n":"Iʿrāb decides meaning","l":"Advanced","d":"Collect ten verses where al-Baḥr al-Muḥīṭ lists competing grammatical analyses. For each, write the Arabic, the options, the resulting English meanings and the view you find strongest with reasons."}],"repos":[{"r":"Tafsir.app (al-Bāḥith al-Qurʾānī)","u":"https://tafsir.app","d":"Read dozens of Arabic tafsīrs side by side on the same verse, including al-Ṭabarī, al-Rāzī, al-Kashshāf and al-Baḥr al-Muḥīṭ."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com","d":"Word-by-word grammar and a root concordance for collecting every occurrence of a term."}]},{"id":"y3t_thematic","section":"quran","title":"Thematic tafsīr (al-tafsīr al-mawḍūʿī)","short":"Thematic tafsīr","level":"Advanced","why":"Thematic tafsīr asks what the whole Qurʾān says on a subject, or what unifies a whole sūrah, and it is one of the most common forms of modern Qurʾānic writing.","mins":2000,"pre":["sp_tafsir","y3t_classical","y3t_burhan"],"ideas":["Al-tafsīr al-mawḍūʿī has two main forms: gathering every passage on one theme across the Qurʾān (such as patience or covenant), and reading a single sūrah as a unity organised around a central theme. Both differ from analytical tafsīr (taḥlīlī), which moves verse by verse.","Its roots are classical: interpreting the Qurʾān by the Qurʾān, the science of munāsabah and al-Biqāʿī's Naẓm al-Durar. In the twentieth century Ḥamīd al-Dīn al-Farāhī and Amīn Aḥsan Iṣlāḥī developed the idea of structural coherence (naẓm), and Muṣṭafā Muslim and others wrote handbooks of method.","Muḥammad al-Ghazālī's Naḥw Tafsīr Mawḍūʿī li-Suwar al-Qurʾān (English: A Thematic Commentary on the Qurʾān) gives each sūrah's main themes in plain prose. Fazlur Rahman's Major Themes of the Qurʾān arranges its teaching under God, humanity, nature, prophethood, eschatology, Satan and community; his wider hermeneutics are contested by many traditional scholars.","The method is only as good as its collection of evidence. A sound study gathers every occurrence of the relevant roots and terms, considers context, abrogation, occasions of revelation, the Sunnah and the classical commentaries, and avoids choosing only the verses that suit a modern argument."],"callout":["Pitfall","A theme chosen in advance can pull verses out of context. Start from a complete concordance of the Arabic terms, read every passage in its sūrah, and only then write the synthesis."],"lectures":[{"t":"Usul Talks: Thematic tafsīr, how we navigate the exegetical tradition","u":"https://www.youtube.com/watch?v=GjbYuw_Dwf8","by":"Issam Eido, Usul Academy"},{"t":"Muqaddimah Tafsīr Niẓām al-Qurʾān: Ḥamīd al-Dīn al-Farāhī","u":"https://www.youtube.com/watch?v=0TEmqx22ck8","by":"Cambridge Islamic College"},{"t":"A Thematic Commentary on the Qurʾān (class series)","u":"https://www.youtube.com/playlist?list=PLnY1zv_MLwhwzTVq4rwIN8H0tfohPerTG","by":"Sh. Moutasem al-Hameedy, Abu Huraira Center"}],"papers":[{"t":"A Thematic Commentary on the Qurʾān (free PDF)","u":"https://iiit.org/en/book/a-thematic-commentary-on-the-quran/","by":"Muḥammad al-Ghazālī (trans. Ashur A. Shamis), IIIT"},{"t":"Major Themes of the Qurʾān, 2nd ed. (print)","u":"https://press.uchicago.edu/ucp/books/book/chicago/M/bo6826294.html","by":"Fazlur Rahman, University of Chicago Press"},{"t":"Naẓm al-Durar on the opening of al-Baqarah (Arabic)","u":"https://tafsir.app/nathm-aldurar/2/1","by":"Burhān al-Dīn al-Biqāʿī, Tafsir.app"}],"reads":[{"t":"The Sūra as a Unity: A Twentieth-Century Development in Qurʾān Exegesis","u":"https://doi.org/10.4324/9780203988848-16","by":"Mustansir Mir, in Approaches to the Qurʾān (Routledge)"},{"t":"Mabāḥith fī al-Tafsīr al-Mawḍūʿī (Arabic)","u":"https://shamela.ws/book/7314","by":"Muṣṭafā Muslim, al-Maktabah al-Shāmilah"}],"projects":[{"n":"Concordance-based theme study","l":"Advanced","d":"Choose a Qurʾānic concept (for example ṣabr or mīthāq), list every occurrence of its roots using the Quranic Arabic Corpus, and classify the verses. Write a 4,000-word thematic study citing at least two classical commentaries for each key passage."},{"n":"Sūrah unity paper","l":"Advanced","d":"Compare al-Ghazālī's thematic summary of one sūrah with al-Biqāʿī's account of its coherence. Produce an outline of the sūrah's sections and a 2,500-word argument for or against a single central theme."}],"repos":[{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com","d":"Word-by-word grammar and a root concordance for collecting every occurrence of a term."},{"r":"Tafsir.app (al-Bāḥith al-Qurʾānī)","u":"https://tafsir.app","d":"Read dozens of Arabic tafsīrs side by side on the same verse, including al-Ṭabarī, al-Rāzī, al-Kashshāf and al-Baḥr al-Muḥīṭ."}]},{"id":"y3t_modern","section":"quran","title":"Modern tafsīr and how misreadings happen","short":"Modern tafsīr","level":"Advanced","why":"Most people now meet the Qurʾān through modern commentaries, translations and media, so a specialist must know these works and be able to explain how a reading goes wrong.","mins":2000,"pre":["sp_tafsir","y3t_classical","c_modern"],"ideas":["Modern tafsīr begins in the late nineteenth century. Muḥammad ʿAbduh and Rashīd Riḍā's Tafsīr al-Manār aimed at moral and social reform and was sceptical of isrāʾīliyyāt; Ibn ʿĀshūr's al-Taḥrīr wa al-Tanwīr joined rhetoric with the higher objectives of the law; Sayyid Quṭb's Fī Ẓilāl al-Qurʾān was written as a call to action; and scientific exegesis (tafsīr ʿilmī) read modern discoveries into the text.","Johanna Pink shows that modern exegesis is shaped by media (print, television and the internet), by state religious institutions and by interpretive communities. Her study of commentaries on 5:51 from the Arab world, Turkey and Indonesia shows how political settings shape readings while authors claim continuity with the tradition.","Misreadings usually follow a few patterns: cutting a verse from its context (for example quoting 9:5 without 9:6), ignoring the occasion of revelation, reading later meanings into Arabic words, relying on one translation, and ignoring the Sunnah and the consensus of the commentators. The same errors appear in extremist and in polemical readings.","The Study Quran (2015), edited by Seyyed Hossein Nasr with Joseph Lumbard and others, gives a commentary that summarises many classical Sunni and Shīʿī tafsīrs. A useful test for any modern work is to ask which classical sources it uses, what it leaves out and whether it states its own method."],"callout":["Method","When you meet a surprising modern reading, check it in three steps: the full passage in Arabic, two classical commentaries, and the meaning of the key words in a classical dictionary. Most misreadings fail at the first step."],"lectures":[{"t":"Freiburg conversations on tafsīr and transregional Islamic networks #07: Johanna Pink","u":"https://www.youtube.com/watch?v=PklTcPZoBCM","by":"Johanna Pink, GloQur, University of Freiburg"},{"t":"Understanding the place of The Study Quran","u":"https://www.youtube.com/watch?v=L-UgqwRzI74","by":"Joseph Lumbard"}],"papers":[{"t":"Tafsīr al-Manār (Arabic)","u":"https://shamela.ws/book/12304","by":"Muḥammad ʿAbduh and Muḥammad Rashīd Riḍā, al-Maktabah al-Shāmilah"},{"t":"al-Taḥrīr wa al-Tanwīr on al-Tawbah 9:5 (Arabic)","u":"https://tafsir.app/ibn-aashoor/9/5","by":"Muḥammad al-Ṭāhir Ibn ʿĀshūr, Tafsir.app"},{"t":"Tafsīr Ibn Kathīr on al-Tawbah 9:6 (abridged English)","u":"https://quran.com/9:6/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (Darussalam abridgment), Quran.com"}],"reads":[{"t":"Tradition and Ideology in Contemporary Sunnite Qurʾānic Exegesis: Qurʾānic Commentaries from the Arab World, Turkey and Indonesia and their Interpretation of Q 5:51","u":"https://doi.org/10.1163/157006010x489801","by":"Johanna Pink, Die Welt des Islams (2010)"},{"t":"Muslim Qurʾānic Interpretation Today: Media, Genealogies and Interpretive Communities (contents and prologue, free PDF)","u":"https://www.orient.uni-freiburg.de/islamwissenschaft/mitarbeiter/pink/pink-muslim-quranic-interpretation-toc-prologue.pdf/at_download/file","by":"Johanna Pink, University of Freiburg (book: Equinox, 2019)"},{"t":"Modern Qurʾānic Hermeneutics (The Oxford Handbook of Qurʾānic Studies)","u":"https://doi.org/10.1093/oxfordhb/9780199698646.013.66","by":"Oxford University Press"}],"projects":[{"n":"Anatomy of a misreading","l":"Advanced","d":"Find a widely shared modern claim about a verse (from a polemicist, a preacher or an extremist text). Write a 2,500-word case study that sets out the claim, the full Arabic context, two classical and one modern commentary, and the exact step where the reading fails."},{"n":"Modern commentaries compared","l":"Advanced","d":"Translate the comments of Tafsīr al-Manār, Ibn ʿĀshūr and The Study Quran on one passage. Produce a comparison table of sources cited and a 2,000-word essay on how each relates to the classical tradition."}],"repos":[{"r":"Tafsir.app (al-Bāḥith al-Qurʾānī)","u":"https://tafsir.app","d":"Read dozens of Arabic tafsīrs side by side on the same verse, including al-Ṭabarī, al-Rāzī, al-Kashshāf and al-Baḥr al-Muḥīṭ."},{"r":"Quran.com","u":"https://quran.com","d":"Compare many English translations and read Ibn Kathīr and other tafsīrs on any verse."}]}]},{"id":"y3aqidah","title":"Year 3 track C: ʿAqīdah and Islamic thought","level":"Advanced","intro":"A specialization track for students who have finished the Year 2 creed work. It reads the history of kalām, Atharī theology through Ibn Taymiyyah and Ibn al-Qayyim, the Māturīdī school, the theology of prophecy, and eschatology in depth.","phase":17,"optional":true,"topics":[{"id":"sp_aqidah","title":"Specialization: ʿAqīdah & Islamic thought","short":"ʿAqīdah track","level":"Advanced","why":"This track moves from the sources of creed to the classical debates with philosophy and the sects, so the learner can read primary theological texts and answer modern questions with care.","mins":26000,"pre":["schools","wasitiyyah","reason","falsafa","mihnah"],"ideas":["Months 1–3: Sources and method of creed (Qurʾān, mutawātir and āḥād ḥadīth, ijmāʿ, the role of reason), then advanced tawḥīd through three creeds read side by side: al-ʿAqīdah al-Ṭaḥāwiyyah, accepted across the Sunni schools; al-Nasafī's ʿAqāʾid with al-Taftāzānī's commentary, the standard Māturīdī and Ashʿarī teaching text; and Ibn Taymiyyah's Atharī creed al-Wāsiṭiyyah.","Months 4–6: The attribute debates in depth, with each position stated in its own terms: affirmation without modality or likeness (ithbāt bi-lā kayf), consigning the meaning to God (tafwīḍ) and interpretation (taʾwīl); God's speech and the Miḥnah; the problem of qadar and human action; and the sects through al-Shahrastānī's al-Milal wa al-Niḥal, read as a heresiography with its own Ashʿarī viewpoint.","Months 7–9: Philosophy and kalām: al-Ghazālī's Tahāfut al-Falāsifah and its three charges against the philosophers (eternity of the world, God's knowledge of particulars, bodily resurrection), Ibn Rushd's Faṣl al-Maqāl and Tahāfut al-Tahāfut, and Ibn Taymiyyah's critique of Aristotelian logic.","Months 10–12: Modern doubts (atheism, the problem of evil, science and scripture) handled with the classical tools, then a capstone paper of 6,000–8,000 words on one question, comparing at least two schools from their own primary texts."],"callout":["Method","Read every school from its own best authors before reading its critics, and keep a running file of definitions; most theological disputes turn on terms used in different senses. Ibn Rushd's Faṣl al-Maqāl and al-Shahrastānī's al-Milal are available in Hourani's and Kazi and Flynn's translations for months 4–9."],"lectures":[{"t":"Explanation of al-ʿAqīdah al-Wāsiṭiyyah by Ibn al-ʿUthaymīn (English subtitles)","u":"https://www.youtube.com/playlist?list=PLNQ4e5_fAoQe1PUNh1CVyAjPqsU_-YFxO","by":"Path of Light (Atharī commentary)"},{"t":"The Islamic Creed according to Imam al-Ṭaḥāwī's book (30 episodes)","u":"https://www.youtube.com/playlist?list=PLgcTs9YAg99_h3Qe165hUG1yHkLRytGRt","by":"Shaykh Muhammad al-Yaqoubi (Ashʿarī/Māturīdī commentary)"},{"t":"Al-Ghazali's The Incoherence of the Philosophers","u":"https://www.youtube.com/watch?v=3pYDNlJq-mw","by":"Abdal Hakim Murad (Islam On Demand)"}],"papers":[{"t":"al-ʿAqīdah al-Ṭaḥāwiyyah (English translation)","u":"https://www.masud.co.uk/ISLAM/misc/tahawi.htm","by":"Abū Jaʿfar al-Ṭaḥāwī (trans. Iqbal Ahmad Azami), masud.co.uk"},{"t":"A Commentary on the Creed of Islam: al-Taftāzānī on the creed of al-Nasafī (library loan)","u":"https://archive.org/details/commentaryoncree0000masd","by":"Najm al-Dīn al-Nasafī and Saʿd al-Dīn al-Taftāzānī (trans. Earl Edgar Elder, Columbia University Press, 1950)"},{"t":"al-ʿAqīdah al-Wāsiṭiyyah: Arabic text with English translation","u":"https://abuaminaelias.com/al-aqeedah-al-wasitiyyah-by-ibn-taymiyyah/","by":"Ibn Taymiyyah (trans. Abu Amina Elias)"},{"t":"The Foundations of the Articles of Faith (Qawāʿid al-ʿAqāʾid, Iḥyāʾ Book 2)","u":"https://www.ghazali.org/works/gz-faith.htm","by":"al-Ghazālī (trans. Nabih Amin Faris), ghazali.org"},{"t":"Tahāfut al-Falāsifah (Incoherence of the Philosophers), PDF","u":"http://www.ghazali.org/works/taf-eng.pdf","by":"al-Ghazālī (trans. Sabih Ahmad Kamali, 1963)"}],"reads":[{"t":"Ibn Taymiyya","u":"https://plato.stanford.edu/entries/ibn-taymiyya/","by":"Stanford Encyclopedia of Philosophy"},{"t":"Ibn Rushd [Averroes]","u":"https://plato.stanford.edu/entries/ibn-rushd/","by":"Stanford Encyclopedia of Philosophy"},{"t":"Review of Ibn Taymiyya Against the Greek Logicians (trans. Wael B. Hallaq, Clarendon, 1993)","u":"https://www.cambridge.org/core/journals/bulletin-of-the-school-of-oriental-and-african-studies/article/hallaqwael-b-tr-ibn-taymiyya-against-the-greek-logicians-lviii-264-pp-oxford-clarendon-press-1993-30/D1CE0C8BFCC193269E3D76ADF7DE0E4D","by":"Bulletin of SOAS (Cambridge)"}],"projects":[{"n":"Creed comparison dossier","l":"Advanced","d":"Produce a 20-page dossier setting the Ṭaḥāwiyyah, al-Nasafī's ʿAqāʾid (with al-Taftāzānī), the Wāsiṭiyyah and al-Ghazālī's Qawāʿid al-ʿAqāʾid side by side on ten doctrines, stating each school's position in its own terms, with citations and short notes on each difference."},{"n":"Capstone paper","l":"Advanced","d":"Write a 6,000–8,000 word paper on one classical debate (e.g. causality in the Tahāfut and Ibn Rushd's reply, or God's speech in the Miḥnah), using primary texts and at least five academic sources."}],"repos":[{"r":"ghazali.org","u":"https://ghazali.org/","d":"Primary texts and translations of al-Ghazālī's works."}],"section":"aqidah"},{"id":"y3a_kalam","title":"History of kalām: the Muʿtazila, the Ashʿarīs and the Māturīdīs","short":"History of kalām","level":"Advanced","section":"aqidah","why":"Kalām is the discipline in which Muslim theologians argued about God, the world and human action with rational proofs, and the history of its Muʿtazilī, Ashʿarī and Māturīdī schools explains most later creedal debates.","mins":4000,"pre":["sp_aqidah","schools","falsafa","mihnah"],"ideas":["The Muʿtazila, traced to Wāṣil ibn ʿAṭāʾ (d. 131/748), organized their creed around five principles: divine unity (tawḥīd), justice (ʿadl), the promise and the threat, the intermediate position of the grave sinner, and commanding right and forbidding wrong. Josef van Ess shows that the 2nd/8th and 3rd/9th centuries were far more varied than the later school labels suggest.","Abū al-Ḥasan al-Ashʿarī (d. 324/935–6) left the Muʿtazila and defended Sunni positions with their own methods; his Maqālāt al-Islāmiyyīn is an early and careful survey of the views of the sects. In Samarqand his contemporary Abū Manṣūr al-Māturīdī (d. 333/944) founded the second Sunni kalām school, later systematised by Abū al-Muʿīn al-Nasafī (d. 508/1114) and followed by most Ḥanafīs (see y3a_maturidi). Early Ashʿarīs such as al-Bāqillānī (d. 403/1013) developed the atomism already used by Muʿtazilī theologians such as Abū al-Hudhayl, arguing from atoms and accidents that the world came into being in time and so has a Maker.","Al-Juwaynī's al-Irshād (d. 478/1085) and al-Ghazālī's al-Iqtiṣād fī al-Iʿtiqād (d. 505/1111) are systematic statements of Ashʿarī theology. In Fayṣal al-Tafriqah al-Ghazālī also set limits on declaring other Muslims unbelievers, a text translated and studied by Sherman Jackson.","Ayman Shihadeh describes how Fakhr al-Dīn al-Rāzī (d. 606/1210) absorbed Avicennan philosophy into kalām, producing a 'philosophical theology'. The Niẓāmiyyah colleges, founded from 459/1067, helped spread Ashʿarism, and later handbooks such as al-Ījī's al-Mawāqif and al-Taftāzānī's Sharḥ al-Maqāṣid shaped madrasa teaching for centuries."],"callout":["Method","Read each school's positions in its own texts first, then in its opponents' reports. Al-Ashʿarī's Maqālāt is valuable precisely because it records views fairly before he argues against them."],"lectures":[{"t":"Muslim Theology and Islamic Mysticism, Part 1","u":"https://www.youtube.com/watch?v=CbvG4KffgSI","by":"Abdal Hakim Murad (Islam On Demand)"},{"t":"Library Chat #21: The Niẓāmiyya College and the Rise of the Ashʿarite School","u":"https://www.youtube.com/watch?v=0RtikV6PG2M","by":"Yasir Qadhi"},{"t":"Transcendent God, Rational World: A Māturīdī Theology","u":"https://www.youtube.com/watch?v=HsUexhMuPMk","by":"Ramon Harvey (Al-Mahdi Institute)"}],"papers":[{"t":"Maqālāt al-Islāmiyyīn wa Ikhtilāf al-Muṣallīn (Arabic, ed. Ritter)","u":"https://shamela.ws/book/37614","by":"Abū al-Ḥasan al-Ashʿarī, al-Maktabah al-Shāmilah"},{"t":"al-Irshād ilā Qawāṭiʿ al-Adillah fī Uṣūl al-Iʿtiqād (Arabic)","u":"https://archive.org/details/al-irshad_ila_qawati_al-adilla","by":"Imām al-Ḥaramayn al-Juwaynī"},{"t":"Al-Ghazali on Divine Essence: a translation from al-Iqtiṣād fī al-Iʿtiqād (PhD thesis)","u":"https://www.ghazali.org/books/Iqtisad%20Dissertation%20final.pdf","by":"al-Ghazālī (trans. Dennis Morgan Davis Jr., University of Utah, 2005)"},{"t":"Kitāb al-Tawḥīd (Arabic)","u":"https://shamela.ws/book/6365","by":"Abū Manṣūr al-Māturīdī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Flowering of Muslim Theology (library loan)","u":"https://archive.org/details/floweringofmusli00essj","by":"Josef van Ess (Harvard University Press, 2006)"},{"t":"From al-Ghazālī to al-Rāzī: 6th/12th Century Developments in Muslim Philosophical Theology","u":"https://www.cambridge.org/core/journals/arabic-sciences-and-philosophy/article/abs/from-alghazali-to-alrazi-6th12th-century-developments-in-muslim-philosophical-theology/78BA2498C60BAD551F35CD1C641A7726","by":"Ayman Shihadeh (Arabic Sciences and Philosophy, 2005)"},{"t":"On the Boundaries of Theological Tolerance in Islam: al-Ghazālī's Fayṣal al-Tafriqa (library loan)","u":"https://archive.org/details/onboundariesofth0001jack","by":"Sherman A. Jackson (Oxford University Press, 2002)"}],"projects":[{"n":"One doctrine across five centuries","l":"Advanced","d":"Trace one question, such as the createdness of the Qurʾān or the human act (kasb for the Ashʿarīs, ikhtiyār for the Māturīdīs), from al-Ashʿarī's Maqālāt and al-Māturīdī's Kitāb al-Tawḥīd through al-Juwaynī's Irshād and al-Ghazālī's Iqtiṣād. Write a 3,000-word paper showing how the arguments and terms changed."},{"n":"Annotated map of kalām","l":"Advanced","d":"Produce an annotated chart of thirty theologians from Wāṣil ibn ʿAṭāʾ to al-Taftāzānī, including the Māturīdī line from al-Māturīdī to Abū al-Muʿīn al-Nasafī: school, city, death date, main surviving work and one distinctive thesis, each with a source reference."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."},{"r":"ghazali.org","u":"https://www.ghazali.org/","d":"Arabic editions, translations and studies of al-Ghazālī's theological works."}]},{"id":"y3a_athari","title":"Atharī theology in depth: Ibn Taymiyyah and Ibn al-Qayyim","short":"Atharī theology","level":"Advanced","section":"aqidah","why":"Ibn Taymiyyah and his student Ibn al-Qayyim gave the Atharī creed its fullest rational defence, and their arguments remain central to Sunni debates today.","mins":4000,"pre":["sp_aqidah","wasitiyyah","reason","y3a_kalam"],"ideas":["Ibn Taymiyyah (d. 728/1328) holds that God's names and attributes are affirmed as the Qurʾān and Sunnah state them, without distortion, denial, asking how, or likening to creation. In al-Tadmuriyyah he argues that speaking of the attributes follows speaking of the essence: whoever affirms an essence unlike other essences can affirm attributes unlike other attributes.","In al-Ṣawāʿiq al-Mursalah, Ibn al-Qayyim (d. 751/1350) attacks what he calls four 'idols' of the theologians: the claim that revealed texts are verbal proofs that yield no certainty, the claim that reason must override revelation when they appear to conflict, figurative reinterpretation (taʾwīl), and the theory of majāz. The surviving text is incomplete, and the abridgement by Ibn al-Mawṣilī is widely read alongside it.","Jon Hoover calls Ibn Taymiyyah's theodicy one of 'perpetual optimism': God creates and commands for a wise purpose (ḥikmah), and the world He creates is the best expression of that wisdom. Ibn al-Qayyim's Shifāʾ al-ʿAlīl sets out the same view of decree, wisdom and causation against both the Jabriyya and the Qadariyya.","The Ḥanbalī tradition was not uniform before them, and Ibn Taymiyyah's creedal texts were examined at councils in Damascus and Cairo in 705/1305–6. Hoover's work on his influence on Mamlūk Ashʿarism shows that later Ashʿarīs read and answered him closely."],"callout":["Pitfall","Do not judge Ibn Taymiyyah or his opponents
