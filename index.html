from later polemics. Read a full passage in his own words, such as a section of al-Tadmuriyyah, and identify the position he is answering before deciding what he meant."],"lectures":[{"t":"Ibn Taymiyya's Impact on Early 14th-Century Mamlūk Ashʿarism","u":"https://www.youtube.com/watch?v=VZ6-Nre7obs","by":"Jon Hoover (School of Mamluk Studies)"},{"t":"#askatheologian: Who was Ibn Taymiyya?","u":"https://www.youtube.com/watch?v=MepNKQj0OGY","by":"Jon Hoover (University of Nottingham)"},{"t":"Ibn Taymiyyah's Theology, Part 2","u":"https://www.youtube.com/watch?v=5ntla3R9NfQ","by":"Hatem al-Haj (Blogging Theology)"}],"papers":[{"t":"al-Tadmuriyyah (Arabic, ed. al-Saʿawī)","u":"https://shamela.ws/book/22666","by":"Ibn Taymiyyah, al-Maktabah al-Shāmilah"},{"t":"al-Ṣawāʿiq al-Mursalah ʿalā al-Jahmiyyah wa al-Muʿaṭṭilah (Arabic)","u":"https://shamela.ws/book/184","by":"Ibn Qayyim al-Jawziyyah (ʿAṭāʾāt al-ʿIlm ed.), al-Maktabah al-Shāmilah"},{"t":"Shifāʾ al-ʿAlīl fī Masāʾil al-Qaḍāʾ wa al-Qadar wa al-Ḥikmah wa al-Taʿlīl (Arabic)","u":"https://shamela.ws/book/12021","by":"Ibn Qayyim al-Jawziyyah, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Ibn Taymiyya's Theodicy of Perpetual Optimism (open access)","u":"https://library.oapen.org/handle/20.500.12657/32296","by":"Jon Hoover (Brill, 2007)"},{"t":"Atheism and Radical Skepticism: Ibn Taymiyyah's Epistemic Critique","u":"https://yaqeeninstitute.org/read/paper/atheism-and-radical-skepticism-ibn-taymiyyahs-epistemic-critique","by":"Yaqeen Institute"}],"projects":[{"n":"The four idols, annotated","l":"Advanced","d":"Summarize Ibn al-Qayyim's argument against one of the four 'idols' in al-Ṣawāʿiq, then find the passage of al-Rāzī or al-Āmidī he is answering. Write a 2,500-word paper presenting both sides fairly."},{"n":"Theodicy reading guide","l":"Advanced","d":"Produce a chapter-by-chapter reading guide to Shifāʾ al-ʿAlīl, with a two-sentence summary of each chapter, the main proof-texts cited and the opponents named, checked against Hoover's account of the same themes."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]},{"id":"y3a_maturidi","title":"Māturīdī theology: al-Māturīdī's Kitāb al-Tawḥīd","short":"Māturīdī theology","level":"Advanced","section":"aqidah","why":"The Māturīdī school, rooted in the Ḥanafī scholars of Samarqand, has been the creed of a large share of Sunni Muslims, and its founder's Kitāb al-Tawḥīd is a demanding but rewarding primary source.","mins":3600,"pre":["sp_aqidah","tahawi","y3a_kalam"],"ideas":["Abū Manṣūr al-Māturīdī (d. 333/944) of Samarqand wrote Kitāb al-Tawḥīd and a Qurʾān commentary, Taʾwīlāt Ahl al-Sunnah. Kitāb al-Tawḥīd opens by rejecting blind imitation in creed and names the sources of knowledge as sense perception, reliable reports and rational reflection.","Ulrich Rudolph argues that al-Māturīdī developed an existing Samarqand Ḥanafī tradition linked to Abū Ḥanīfah's circle rather than founding a school from nothing. His standing outside Transoxiana rose later, especially through Abū al-Muʿīn al-Nasafī's Tabṣirat al-Adillah (d. 508/1114).","Points traditionally listed against the Ashʿarīs include: bringing-into-being (takwīn) as an eternal attribute, the view that reason alone can know the obligation to know God, a strong emphasis on God's wisdom (ḥikmah) in His acts, and the Ḥanafī position that faith itself does not increase or decrease. Later scholars noted that several of these differences are partly verbal.","Najm al-Dīn al-Nasafī's short creed (d. 537/1142) with al-Taftāzānī's commentary (d. 792/1390) became a standard madrasa text. Ramon Harvey's Transcendent God, Rational World is a recent constructive theology built on Māturīdī sources."],"callout":["Method","Kitāb al-Tawḥīd is difficult Arabic and the printed text has problems. Read it with Rudolph's study open beside it, and read one section at a time with a summary of the opponent being answered."],"lectures":[{"t":"Introduction: Transcendent God, Rational World","u":"https://www.youtube.com/watch?v=UNZ4iFzGRhg","by":"Ramon Harvey (Cambridge Muslim College)"},{"t":"Why Māturīdī Theology Is Relevant Today","u":"https://www.youtube.com/watch?v=I2Znv-1YwAs","by":"Ramon Harvey (Blogging Theology)"}],"papers":[{"t":"Kitāb al-Tawḥīd (Arabic, ed. Fathalla Kholeif)","u":"https://shamela.ws/book/6365","by":"Abū Manṣūr al-Māturīdī, al-Maktabah al-Shāmilah"},{"t":"A Commentary on the Creed of Islam: al-Taftāzānī on the creed of al-Nasafī (library loan)","u":"https://archive.org/details/commentaryoncree0000masd","by":"al-Taftāzānī (trans. Earl Edgar Elder, 1950)"}],"reads":[{"t":"Transcendent God, Rational World: A Māturīdī Theology (open access)","u":"https://library.oapen.org/handle/20.500.12657/62332","by":"Ramon Harvey (Edinburgh University Press, 2021)"},{"t":"Al-Māturīdī and the Development of Sunnī Theology in Samarqand","u":"https://doi.org/10.1163/9789004261846","by":"Ulrich Rudolph (trans. Rodrigo Adem, Brill, 2015)"}],"projects":[{"n":"Kitāb al-Tawḥīd section study","l":"Advanced","d":"Translate and annotate the opening section of Kitāb al-Tawḥīd on the sources of knowledge (about 5 printed pages). Add notes comparing it with the epistemology section of al-Taftāzānī's commentary."},{"n":"Ashʿarī–Māturīdī differences","l":"Advanced","d":"Make a table of the commonly listed points of difference between the two schools. For each, cite one Māturīdī and one Ashʿarī primary source and judge whether the difference is substantive or verbal, giving reasons."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]},{"id":"y3a_prophecy","title":"Prophecy, miracles and revelation (al-nubuwwāt)","short":"Prophecy","level":"Advanced","section":"aqidah","why":"Belief in prophecy connects reason to revelation, and theologians developed careful accounts of what a prophet is, how prophethood is proved and how miracles differ from other wonders.","mins":3000,"pre":["sp_aqidah","pr_dalail","y3a_kalam"],"ideas":["Theologians define the miracle (muʿjizah) as an event that breaks the usual course of things, joined to a claim of prophethood and a challenge (taḥaddī) that cannot be met. For Ashʿarīs such as al-Bāqillānī (in al-Tamhīd and his treatise al-Bayān ʿan al-Farq bayn al-Muʿjizāt wa al-Karāmāt wa al-Ḥiyal wa al-Kahānah wa al-Siḥr, ed. McCarthy, 1958) and al-Juwaynī, it works like God saying 'My servant has spoken the truth', and the challenge separates it from the wonders (karāmāt) of saints and from sorcery.","Ibn Taymiyyah's al-Nubuwwāt is a response to this Ashʿarī account. He notes that the Qurʾān calls these events signs and proofs (āyāt and barāhīn) rather than 'miracles', and argues that prophethood is known through many indicators together, including the prophet's character, his message, and the outcome of his mission.","Al-Māturīdī argues in Kitāb al-Tawḥīd that reason itself shows humans need prophets for guidance, and answers Ibn al-Rāwandī's attacks on prophecy. Philosophers such as Ibn Sīnā explained prophecy through the powers of the intellect and imagination, and al-Ghazālī in al-Munqidh describes prophecy as a mode of knowing above reason that one can confirm by experience of the Prophet's ﷺ teaching.","The Qurʾān is treated as the central proof of Muḥammad's ﷺ prophethood. The Muʿtazilī al-Naẓẓām held that its inimitability lay in God preventing people from imitating it (ṣarfah), while al-Bāqillānī and later rhetoricians located it in the text's own eloquence and composition."],"callout":["Method","Read al-Bāqillānī in his own works before reading Ibn Taymiyyah's response. For each author, separate three questions: what a prophet is, how prophethood is proved, and what a miracle is. Many apparent disagreements turn out to be answers to different questions."],"lectures":[{"t":"Prophecy in the theology of al-Māturīdī and the Māturīdī tradition","u":"https://www.youtube.com/watch?v=EeaSFsVcCww","by":"Ramon Harvey (ZITh Tübingen, Prophecy conference)"},{"t":"Proofs of Prophethood (series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhF2OG4GEdWPxQO72WauTwaO","by":"Mohammad Elshinawy (Yaqeen Institute)"}],"papers":[{"t":"Tamhīd al-Awāʾil wa Talkhīṣ al-Dalāʾil (Arabic; chapters against the deniers of prophethood and on the inimitability of the Qurʾān)","u":"https://shamela.ws/book/6389","by":"al-Bāqillānī (ed. R. J. McCarthy, 1957), al-Maktabah al-Shāmilah"},{"t":"Kitāb al-Nubuwwāt (Arabic, ed. al-Ṭuwayyān)","u":"https://shamela.ws/book/11817","by":"Ibn Taymiyyah, al-Maktabah al-Shāmilah"},{"t":"Kitāb al-Tawḥīd, section on proving the prophethood of the prophets (Arabic)","u":"https://shamela.ws/book/6365/200","by":"Abū Manṣūr al-Māturīdī, al-Maktabah al-Shāmilah"},{"t":"Deliverance from Error (al-Munqidh min al-Ḍalāl), section on prophecy","u":"http://www.ghazali.org/works/watt3.htm","by":"al-Ghazālī (trans. W. Montgomery Watt)"}],"reads":[{"t":"Arabic and Islamic Philosophy of Religion (section 4: prophecy and miracles)","u":"https://plato.stanford.edu/entries/arabic-islamic-religion/","by":"Jon McGinnis and Rahim Acar (Stanford Encyclopedia of Philosophy)"},{"t":"The Physical Miracles of Prophet Muhammad ﷺ","u":"https://yaqeeninstitute.org/read/paper/the-physical-miracles-of-prophet-muhammad","by":"Mohammad Elshinawy and Nazir Khan (Yaqeen Institute)"},{"t":"The Inimitable Qurʾan: The Revelation to Prophet Muhammad ﷺ","u":"https://yaqeeninstitute.org/read/paper/the-inimitable-quran-the-revelation-to-prophet-muhammad","by":"Yaqeen Institute"}],"projects":[{"n":"Miracle and karāmah","l":"Advanced","d":"Write a 2,500-word paper comparing how al-Bāqillānī, in his own Tamhīd (and al-Bayān, if you can obtain McCarthy's edition), and Ibn Taymiyyah, in al-Nubuwwāt as his response, distinguish a prophet's sign from a saint's wonder and from sorcery. Quote each from his own text and assess the strength of each criterion."},{"n":"Proof-of-prophethood catalogue","l":"Advanced","d":"Build an annotated catalogue of the types of proof for prophethood found in al-Bāqillānī's Tamhīd, al-Māturīdī's Kitāb al-Tawḥīd, al-Ghazālī's al-Munqidh and Ibn Taymiyyah's al-Nubuwwāt. For each type, give one quoted example and note which author relies on it most."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."},{"r":"ghazali.org","u":"https://www.ghazali.org/","d":"Arabic editions, translations and studies of al-Ghazālī's theological works."}]},{"id":"y3a_eschatology","title":"Eschatology in depth: signs of the Hour, barzakh and resurrection","short":"Eschatology","level":"Advanced","section":"aqidah","why":"Belief in the Last Day is a pillar of faith, and studying its sources critically protects against both denial and the careless use of reports about the end times.","mins":3000,"pre":["sp_aqidah","akhirah","collections"],"ideas":["The main events affirmed in Sunni creed are death and the barzakh (Q 23:100), the trumpet blasts, resurrection (baʿth), the gathering (ḥashr), the Great Intercession of the Prophet ﷺ (al-shafāʿah al-ʿuẓmā) that opens the reckoning, the reckoning and the books of deeds, the scales (mīzān), the Prophet's ﷺ basin (ḥawḍ), the bridge (ṣirāṭ), further intercession for sinners, and finally Paradise or the Fire. Scholars differ on the exact order of some of these; al-Qurṭubī, for example, discusses whether the basin comes before or after the bridge.","Scholars divide the signs of the Hour into minor and major. In Ṣaḥīḥ Muslim, Ḥudhayfah ibn Asīd reports ten major signs: the smoke, the Dajjāl, the beast, the sun rising from the west, the descent of ʿĪsā, Yaʾjūj and Maʾjūj, three collapses of the earth, and a fire that drives people to their gathering place.","Ahl al-Sunnah affirm the bliss and punishment of the grave, which some Muʿtazilīs denied. Al-Ghazālī judged the philosophers' denial of bodily resurrection to be unbelief in Tahāfut al-Falāsifah, and Ibn al-Qayyim's Kitāb al-Rūḥ discusses questions such as whether the dead hear and how the soul relates to the body in the barzakh.","Eschatological literature mixes strong and weak reports. The editor of al-Qurṭubī's al-Tadhkirah notes that he sometimes transmits weak narrations without comment, so every report needs grading, and scholars warn against applying signs to current events without evidence."],"callout":["Pitfall","Do not build conclusions about current events on reports about the end times. Grade each report first, then read the classical commentators on it, and keep matters of the unseen within what the texts actually state."],"lectures":[{"t":"Understanding the Traditions of the Signs of Judgement Day (series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctVjKA2ulHYeZsnuI_tieZoc","by":"Yasir Qadhi"},{"t":"The Life in the Barzakh (series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctVw0HhfP7N02hNlScC-3UhN","by":"Yasir Qadhi"},{"t":"The Day of Judgement (series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctXqgEpxF8L-ZItU3uBAjtOR","by":"Yasir Qadhi"}],"papers":[{"t":"Ṣaḥīḥ Muslim, The Book of Tribulations and Portents of the Last Hour","u":"https://sunnah.com/muslim/54","by":"Muslim ibn al-Ḥajjāj"},{"t":"The Remembrance of Death and the Afterlife (Iḥyāʾ, Book 40; library loan)","u":"https://archive.org/details/remembranceofdea0000ghaz","by":"al-Ghazālī (trans. T. J. Winter)"},{"t":"al-Tadhkirah bi-Aḥwāl al-Mawtā wa Umūr al-Ākhirah (Arabic)","u":"https://shamela.ws/book/21536","by":"al-Qurṭubī (ed. al-Ṣādiq ibn Muḥammad Ibrāhīm), al-Maktabah al-Shāmilah"},{"t":"Kitāb al-Rūḥ (Arabic)","u":"https://shamela.ws/book/390","by":"Ibn Qayyim al-Jawziyyah (ʿAṭāʾāt al-ʿIlm ed.), al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Islamic Understanding of Death and Resurrection (library loan)","u":"https://archive.org/details/islamicunderstan0000smit","by":"Jane I. Smith and Yvonne Y. Haddad (SUNY Press, 1981)"},{"t":"Eschatology: Islamic Eschatology","u":"https://www.encyclopedia.com/environment/encyclopedias-almanacs-transcripts-and-maps/eschatology-islamic-eschatology","by":"Marilyn Robinson Waldman (Encyclopedia of Religion)"}],"projects":[{"n":"Graded dossier of the major signs","l":"Advanced","d":"For each of the ten major signs, collect the main reports from Ṣaḥīḥ Muslim and Ṣaḥīḥ al-Bukhārī, note their gradings and any longer versions in al-Qurṭubī's Tadhkirah. Present the dossier with a column marking what is firmly established and what rests on weaker reports."},{"n":"Barzakh question paper","l":"Advanced","d":"Choose three questions from Ibn al-Qayyim's Kitāb al-Rūḥ (for example, whether the dead hear the living) and write a 2,500-word paper giving his evidence, his opponents' views and how al-Ghazālī treats the same questions in The Remembrance of Death."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Check the wording, grading and context of eschatological ḥadīth."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Arabic manuals, commentaries and theological works page by page, with print-matching page numbers for citation."}]}]},{"id":"y3hadith","title":"Year 3 track D: Ḥadīth sciences","level":"Advanced","intro":"This track takes the learner from knowing the rules of ḥadīth criticism to working with the sources the specialists use: the narrator dictionaries, the tools of takhrīj, the two Ṣaḥīḥs, their great commentaries and the early collections. Each topic ends in a research output of the kind a graduate student would produce.","phase":18,"optional":true,"topics":[{"id":"sp_hadith","title":"Specialization: Ḥadīth sciences","short":"Ḥadīth track","level":"Advanced","why":"This track trains a learner to read isnāds, weigh narrators and defects, and understand how ḥadīth are used in law and defended in modern debate.","mins":18000,"pre":["ilal","tadlis","mukhtalif","hfiqh","mawdu","critiques"],"ideas":["Months 1–3: the authority of the Sunnah (al-Shāfiʿī's al-Risālah and Muslim's Introduction), technical terminology through Ibn Ḥajar's Nuzhat al-Naẓar, and the isnād: connection, breaks, tadlīs and the forms of transmission.","Months 4–6: jarḥ wa taʿdīl using works such as Tahdhīb al-Tahdhīb, then ʿilal through Ibn Rajab's Sharḥ ʿIlal al-Tirmidhī, then matn criticism, studying how early critics judged texts as well as chains.","Months 7–9: mukhtalif al-ḥadīth (al-Shāfiʿī and Ibn Qutaybah), ḥadīth and fiqh through Bulūgh al-Marām and its commentaries, and the methods and conditions of the canonical collections, especially al-Bukhārī and Muslim.","Months 10–12: fabrication and its detection (Ibn al-Jawzī and al-Suyūṭī), modern and orientalist critiques with Muslim and academic responses, and a capstone takhrīj study of a single ḥadīth."],"callout":["Method","Keep a running narrator file. Each time a name appears in your reading, add the critics' verdicts and dates, so that by the end of the year you have built your own small rijāl reference."],"lectures":[{"t":"Ulum al-Hadith: Nuzhat al-Nazar (class series)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQFcB1_Ly4sCYlTupsuq9Xho","by":"Dr Muhammad Mansur Ali, WISE English Academy"},{"t":"Ṣaḥīḥ al-Bukhārī: Muḥammad ibn Ismāʿīl al-Bukhārī","u":"https://www.youtube.com/watch?v=UiVl1rD4Juo","by":"Cambridge Islamic College"},{"t":"Verifying and Understanding Hadith","u":"https://www.youtube.com/watch?v=heitI0S9BCo","by":"Jonathan A.C. Brown, Yaqeen Institute"}],"papers":[{"t":"The Nuzhah of Ibn Ḥajar al-ʿAsqalānī: a translation and critical commentary (PhD thesis)","u":"https://etheses.bham.ac.uk/id/eprint/3405/","by":"Ibn Ḥajar al-ʿAsqalānī (trans. Ather Shahbaz Hussain, University of Birmingham)"},{"t":"Ṣaḥīḥ Muslim: the Introduction (Muqaddimah)","u":"https://sunnah.com/muslim/introduction","by":"Imam Muslim (English on sunnah.com)"},{"t":"Sharḥ ʿIlal al-Tirmidhī (Arabic)","u":"https://shamela.ws/book/9552","by":"Ibn Rajab al-Ḥanbalī (ed. Hammām ʿAbd al-Raḥīm Saʿīd), al-Maktabah al-Shāmilah"},{"t":"Tahdhīb al-Tahdhīb (Arabic, Hyderabad edition)","u":"https://shamela.ws/book/3310","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Authenticating Hadith and the History of Hadith Criticism","u":"https://yaqeeninstitute.org/read/paper/authenticating-hadith-and-the-history-of-hadith-criticism","by":"Jonathan A.C. Brown, Yaqeen Institute"},{"t":"The Canonization of Ibn Mājah: Authenticity vs. Utility in the Formation of the Sunni Ḥadīth Canon","u":"https://drjonathanbrown.com/2011/the-canonization-of-ibn-majah-authenticity-vs-utility-in-the-formation-of-the-sunni-%e1%b8%a5adith-cano/","by":"Jonathan A.C. Brown"},{"t":"How We Know Early Ḥadīth Critics Did Matn Criticism and Why It's So Hard to Find","u":"https://drjonathanbrown.com/2011/how-we-know-early-%e1%b8%a5adith-critics-did-matn-criticism-and-why-its-so-hard-to-find/","by":"Jonathan A.C. Brown (Islamic Law and Society, 2008)"}],"projects":[{"n":"Capstone takhrīj study","l":"Advanced","d":"Take one ḥadīth, gather all its routes from the major collections, draw the isnād tree, assess each narrator from the rijāl works, discuss any ʿillah, and give a reasoned grade in a 15-page paper."},{"n":"Critique and response paper","l":"Advanced","d":"Write a 5,000-word paper presenting one modern critique of ḥadīth (Schacht's common link, for example) in its own terms, followed by the classical and academic responses and your assessment."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com","d":"Read the canonical collections in Arabic and English and compare chapter placements and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}],"section":"hadith"},{"id":"y3h_rijal","section":"hadith","title":"Rijāl literature: Tahdhīb al-Kamāl and its abridgements","short":"Rijāl books","level":"Advanced","why":"The narrator dictionaries are where every judgment on a chain is checked, so a specialist must know how they were built, how they relate to each other and how to read an entry.","mins":2400,"pre":["sp_hadith","isnad","ilal"],"ideas":["ʿAbd al-Ghanī al-Maqdisī (d. 600/1203) compiled al-Kamāl fī Asmāʾ al-Rijāl on the narrators of the six books. Al-Mizzī (d. 742/1341) reworked it as Tahdhīb al-Kamāl, giving for each narrator his teachers and students, the statements of the critics and his death date, with symbols showing which of the six books narrate from him.","Later works abridge and correct al-Mizzī. Al-Dhahabī wrote al-Kāshif and Tadhhīb al-Tahdhīb; Ibn Ḥajar cut the teacher and student lists and added further critics' statements in Tahdhīb al-Tahdhīb, then reduced each entry to one line in Taqrīb al-Tahdhīb, placing every narrator in one of twelve ranks from Companion to fabricator.","Other dictionaries serve different purposes. Ibn Abī Ḥātim's al-Jarḥ wa al-Taʿdīl preserves the early critics' words with chains, al-Dhahabī's Mīzān al-Iʿtidāl gathers every narrator who was criticised, including those outside the six books, and Ibn Ḥajar's Lisān al-Mīzān covers those in the Mīzān who are not in the Tahdhīb.","A one-word verdict is a summary, not the evidence. Critics often qualify a narrator (reliable except from a certain teacher, or weakened after his memory changed), and modern editors such as the authors of Taḥrīr Taqrīb al-Tahdhīb disagree with many of Ibn Ḥajar's grades, so the specialist returns to the critics' own words."],"callout":["Method","Choose one narrator and read his entry in the Taqrīb, then in Tahdhīb al-Tahdhīb, Tahdhīb al-Kamāl and the Mīzān. Note what each work adds or removes; this teaches the structure of the genre faster than reading any one book from the start."],"lectures":[{"t":"Al-Jarḥ wa-l-Taʿdīl, Lesson 2: Understanding al-Jarḥ (narrator criticism)","u":"https://www.youtube.com/watch?v=Hl1QOB_wcq0","by":"Talweeh Academy"},{"t":"Nukhbat al-Fikar: Ibn Ḥajar al-ʿAsqalānī on the science of ḥadīth (seminar)","u":"https://www.youtube.com/watch?v=EYdJJ7MtXo0","by":"Mohammad Akram Nadwi, Cambridge Islamic College"}],"papers":[{"t":"Tahdhīb al-Kamāl fī Asmāʾ al-Rijāl (Arabic)","u":"https://shamela.ws/book/3722","by":"al-Mizzī, al-Maktabah al-Shāmilah"},{"t":"Taqrīb al-Tahdhīb (Arabic)","u":"https://shamela.ws/book/8609","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"},{"t":"Mīzān al-Iʿtidāl fī Naqd al-Rijāl (Arabic)","u":"https://shamela.ws/book/1692","by":"al-Dhahabī, al-Maktabah al-Shāmilah"},{"t":"al-Jarḥ wa al-Taʿdīl (Arabic)","u":"https://shamela.ws/book/2170","by":"Ibn Abī Ḥātim al-Rāzī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Constructive Critics, Ḥadīth Literature, and the Articulation of Sunnī Islam (Brill, 2004)","u":"https://doi.org/10.1163/9789047413677","by":"Scott C. Lucas"},{"t":"The Development of Early Sunnite Ḥadīth Criticism: The Taqdima of Ibn Abī Ḥātim al-Rāzī (Brill, 2001)","u":"https://doi.org/10.1163/9789004453241","by":"Eerik Dickinson"},{"t":"Review of Dickinson, The Development of Early Sunnite Hadith Criticism","u":"https://ajis.org/index.php/ajiss/article/view/1577","by":"American Journal of Islam and Society"}],"projects":[{"n":"Four-dictionary narrator file","l":"Advanced","d":"For three narrators of differing grades, transcribe and translate their entries in the Taqrīb, Tahdhīb al-Tahdhīb, Tahdhīb al-Kamāl and the Mīzān. Write a 1,500-word note explaining how the final grade was reached and where you would revise it."},{"n":"Critic vocabulary study","l":"Advanced","d":"Collect every verdict one early critic (for example Yaḥyā ibn Maʿīn or Abū Ḥātim) gives in thirty entries of al-Jarḥ wa al-Taʿdīl. Produce a table mapping his terms to Ibn Ḥajar's twelve ranks, with a short essay on where they do not match."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Muslim Scholars Database","u":"https://muslimscholars.info/","d":"Look up narrators' teachers, students and dates to cross-check a dictionary entry quickly."}]},{"id":"y3h_takhrij","section":"hadith","title":"Takhrīj: tracing a ḥadīth through the sources","short":"Takhrīj","level":"Advanced","why":"Takhrīj is the practical skill of finding every source and chain of a report so that it can be graded, and it is the first step in any serious ḥadīth research.","mins":1800,"pre":["sp_hadith","collections","isnad"],"ideas":["In later usage takhrīj means pointing to the original sources that narrate a ḥadīth with their own chains, and then judging its grade where needed. A later book that quotes a report without its own isnād, such as a fiqh manual or a sermon collection, is not an original source.","Maḥmūd al-Ṭaḥḥān's Uṣūl al-Takhrīj wa Dirāsat al-Asānīd sets out five routes into the sources: by the Companion (musnads and aṭrāf works such as al-Mizzī's Tuḥfat al-Ashrāf), by the opening words, by a distinctive word (Wensinck's concordance, al-Muʿjam al-Mufahras li-Alfāẓ al-Ḥadīth al-Nabawī), by topic (for example Wensinck's Handbook of Early Muhammadan Tradition, in Arabic Miftāḥ Kunūz al-Sunnah), and by a feature of the chain or text.","The classical takhrīj books show the full method at work. Al-Zaylaʿī's Naṣb al-Rāyah traces the ḥadīths of the Ḥanafī manual al-Hidāyah, and Ibn Ḥajar's al-Talkhīṣ al-Ḥabīr does the same for a major Shāfiʿī work, gathering routes, naming the narrator on whom they converge and giving a verdict.","Gathering routes is also how a weak report may be strengthened by supporting chains (mutābaʿāt) and witness reports (shawāhid), or exposed as a single error copied many times. A digital search is only a first step: check printed editions and numbering, compare wording, and note when a report in a musnad comes from a later transmitter's additions."],"callout":["Pitfall","Finding a ḥadīth \"in\" a famous book does not settle its grade. Al-Musnad, the Muṣannafs and al-Ḥākim's Mustadrak contain weak reports, so always identify the chain and the point where its routes converge before quoting a verdict."],"lectures":[{"t":"Takhrīj al-Ḥadīth, Lesson 1: Definition, development, importance and benefits","u":"https://www.youtube.com/watch?v=IHmLyDphC78","by":"Talweeh Academy"},{"t":"Ulum al-Hadith: Nuzhat al-Nazar (class series)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQFcB1_Ly4sCYlTupsuq9Xho","by":"Dr Muhammad Mansur Ali, WISE English Academy"}],"papers":[{"t":"Tuḥfat al-Ashrāf bi-Maʿrifat al-Aṭrāf (Arabic)","u":"https://shamela.ws/book/11385","by":"al-Mizzī, al-Maktabah al-Shāmilah"},{"t":"Naṣb al-Rāyah li-Aḥādīth al-Hidāyah (Arabic)","u":"https://shamela.ws/book/11428","by":"Jamāl al-Dīn al-Zaylaʿī, al-Maktabah al-Shāmilah"},{"t":"al-Talkhīṣ al-Ḥabīr fī Takhrīj Aḥādīth al-Rāfiʿī al-Kabīr (Arabic)","u":"https://shamela.ws/book/1581","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"},{"t":"A Handbook of Early Muhammadan Tradition (1927), a topical index for the topic route","u":"https://archive.org/details/in.ernet.dli.2015.73249","by":"A. J. Wensinck, Internet Archive (Digital Library of India)"}],"reads":[{"t":"al-Takhrīj wa Dirāsat al-Asānīd (Arabic study guide)","u":"https://shamela.ws/book/3933","by":"Ḥātim al-ʿAwnī, al-Maktabah al-Shāmilah"},{"t":"Further branches of muṣṭalaḥ: iʿtibār, mutābaʿāt and shawāhid","u":"https://www.islamic-awareness.org/hadith/ulum/ascc.html","by":"Suhaib Hasan (hosted by Islamic Awareness)"},{"t":"Appendix: verdicts on commonly quoted ḥadīths (worked examples)","u":"https://www.islamic-awareness.org/hadith/ulum/aape.html","by":"Suhaib Hasan (hosted by Islamic Awareness)"}],"projects":[{"n":"Full takhrīj of one report","l":"Advanced","d":"Take a ḥadīth commonly quoted in sermons and trace it through the six books, Musnad Aḥmad, the Muṣannafs and al-Ḥākim. Produce a takhrīj note in the classical format: sources with volume and page, a diagram of routes, the converging narrator and a reasoned verdict."},{"n":"Five-route comparison log","l":"Advanced","d":"Locate the same three ḥadīths using each of al-Ṭaḥḥān's five routes (Tuḥfat al-Ashrāf, an opening-word index, the Muʿjam al-Mufahras word concordance, Wensinck's topical Handbook and a database). Write a one-page report on which route was fastest, which was most complete and what each missed."}],"repos":[{"r":"al-Muʿjam al-Mufahras li-Alfāẓ al-Ḥadīth al-Nabawī (Concordance et indices de la tradition musulmane, vols. I–II, library loan)","u":"https://archive.org/details/concordanceetind0012ajwe","d":"Wensinck's word concordance to the nine collections, for the distinctive-word route of takhrīj."},{"r":"Mawsūʿat al-Ḥadīth (Islam-DB)","u":"https://hadith.islam-db.com/","d":"Arabic database of ḥadīth texts and chains for the first search step; always confirm results in the printed sources."}]},{"id":"y3h_methods","section":"hadith","title":"The methods of al-Bukhārī and Muslim","short":"Bukhārī & Muslim","level":"Advanced","why":"The two Ṣaḥīḥs are the most authoritative ḥadīth books in Sunni Islam, and reading them well means understanding how each author selected, arranged and presented his material.","mins":2400,"pre":["sp_hadith","collections","ilal"],"ideas":["Al-Bukhārī's Ṣaḥīḥ is both a collection and a work of legal and theological argument. His chapter headings (tarājim) state positions, often supported by Qurʾānic verses, Companion statements or chainless (muʿallaq) reports, which is why scholars said that al-Bukhārī's fiqh is in his chapter titles.","Al-Bukhārī repeats and divides reports to use different parts under different headings. Muslim instead gathers the routes of a ḥadīth in one place, puts the strongest first and records small differences of wording precisely, which makes his book ideal for comparing chains.","Neither author wrote a full statement of his conditions; later scholars such as Ibn Ṭāhir al-Maqdisī and al-Ḥāzimī inferred them. The best-known difference concerns connection: al-Bukhārī is reported to have required evidence that a narrator met his teacher at least once, while Muslim, in his introduction, defends accepting contemporaries who could have met when the narrator is not known for tadlīs.","Jonathan Brown shows that the two books became canonical over the fourth and fifth Islamic centuries through works built on them, such as al-Ḥākim's Mustadrak and the mustakhrajs. Critics like al-Dāraquṭnī still questioned around two hundred reports, and Ibn Ḥajar answered the criticisms of al-Bukhārī in Hady al-Sārī."],"callout":["Method","Read one book of Ṣaḥīḥ al-Bukhārī with attention only to the chapter headings, and write down the position each heading takes. Then read the same topic in Muslim and compare how the two authors arrange the same material."],"lectures":[{"t":"Ṣaḥīḥ Muslim: Muslim ibn al-Ḥajjāj al-Naysābūrī","u":"https://www.youtube.com/watch?v=ZKzhENzMXNU","by":"Cambridge Islamic College"},{"t":"Tea Over Books: al-Bukhārī, Islam's foremost traditionist","u":"https://www.youtube.com/watch?v=C4-Cp-1pMjQ","by":"Dr Belal Alabbas and Abdal Hakim Murad, Cambridge Muslim College"}],"papers":[{"t":"Introduction (Muqaddimah) to Ṣaḥīḥ Muslim","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com translation)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book 2: Belief (study the chapter headings)","u":"https://sunnah.com/bukhari/2","by":"al-Bukhārī (sunnah.com translation)"},{"t":"Ibn Ḥajar's Hady al-Sārī: A Medieval Interpretation of the Structure of al-Bukhārī's al-Jāmiʿ al-Ṣaḥīḥ (Journal of Near Eastern Studies, 1995)","u":"https://www.jstor.org/stable/546299","by":"Ibn Ḥajar al-ʿAsqalānī (trans. Mohammad Fadel), JSTOR"}],"reads":[{"t":"The Canonization of al-Bukhārī and Muslim: The Formation and Function of the Sunnī Ḥadīth Canon (Brill, 2007)","u":"https://doi.org/10.1163/ej.9789004158399.i-431","by":"Jonathan A.C. Brown"},{"t":"Criticism of the Proto-Hadith Canon: al-Dāraquṭnī's Adjustment of the Ṣaḥīḥayn","u":"https://drjonathanbrown.com/2011/criticism-of-the-proto-hadith-canon-al-daraqu%e1%b9%adnis-adjustment-of-the-%e1%b9%a3a%e1%b8%a5i%e1%b8%a5ayn/","by":"Jonathan A.C. Brown"},{"t":"Ṣaḥīḥ Muslim","u":"https://akramnadwi.com/?p=4861","by":"Mohammad Akram Nadwi"}],"projects":[{"n":"Tarājim analysis","l":"Advanced","d":"Translate and analyse the chapter headings of one book of Ṣaḥīḥ al-Bukhārī (for example Kitāb al-ʿIlm), using Fatḥ al-Bārī to explain each link between heading and report. Produce a 3,000-word paper on what the headings reveal about al-Bukhārī's positions."},{"n":"Routes in Muslim","l":"Advanced","d":"Take one ḥadīth that Muslim narrates through five or more chains and diagram them. Write an explanation of why he ordered them as he did and what each later route adds in wording or connection."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com","d":"Arabic and English texts of the major collections, including the Muwaṭṭaʾ and Musnad Aḥmad, for checking wording and numbering."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}]},{"id":"y3h_sharh","section":"hadith","title":"Ḥadīth commentary: Fatḥ al-Bārī and al-Minhāj","short":"Ḥadīth sharḥ","level":"Advanced","why":"The great commentaries are where the ḥadīth tradition explains its texts, derives rulings and settles apparent conflicts, so they are the main bridge between ḥadīth and fiqh.","mins":3000,"pre":["sp_hadith","y3h_methods","hfiqh"],"ideas":["A sharḥ explains rare words and grammar, identifies unnamed people in the chain or text, joins variant routes to recover the full wording, derives legal and ethical rulings, reconciles apparent contradictions and reports the views of the schools. Knowing these standard moves lets you find what you need in a long commentary.","Ibn Ḥajar's Fatḥ al-Bārī, written over about twenty-five years and finished in 842/1438, explains how each report fits al-Bukhārī's chapter heading and traces chainless reports to connected chains. Its long introduction, Hady al-Sārī, defends the Ṣaḥīḥ's narrators and answers the criticisms against it.","Al-Nawawī's (d. 676/1277) al-Minhāj fī Sharḥ Ṣaḥīḥ Muslim is shorter and focused on rulings, often recording consensus and the positions of the madhhabs from a Shāfiʿī viewpoint. Its introduction discusses Muslim's method, and the chapter titles found in most printed editions of Ṣaḥīḥ Muslim are commonly attributed to al-Nawawī.","Commentaries were living works. Joel Blecher shows that Fatḥ al-Bārī was read aloud in public sessions, revised over time and shaped by rivalry with al-ʿAynī's ʿUmdat al-Qārī. Commentators also bring their theological and legal commitments, so it is useful to compare at least two on any contested ḥadīth."],"callout":["Method","Do not read a commentary from start to finish. Pick one ḥadīth, read its sharḥ in Fatḥ al-Bārī and al-Minhāj, and label each paragraph as language, narrators, reconciliation, rulings or ethics."],"lectures":[{"t":"Fatḥ al-Bārī by Ibn Ḥajar al-ʿAsqalānī (Great Books of Islamic Civilization)","u":"https://www.youtube.com/watch?v=sq8qfYPYiTI","by":"Sh. Abdool Hamid, Islamic Institute of Toronto"},{"t":"Reflections on Hadith Commentary, Continuity and Change","u":"https://www.youtube.com/watch?v=IOtHwcw1Oak","by":"Joel Blecher, ZITh Prophecy"}],"papers":[{"t":"Fatḥ al-Bārī bi-Sharḥ Ṣaḥīḥ al-Bukhārī (Arabic, Salafiyyah edition)","u":"https://shamela.ws/book/1673","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"},{"t":"al-Minhāj Sharḥ Ṣaḥīḥ Muslim ibn al-Ḥajjāj (Arabic)","u":"https://shamela.ws/book/1711","by":"al-Nawawī, al-Maktabah al-Shāmilah"},{"t":"Ṣaḥīḥ al-Bukhārī 1: actions are by intentions","u":"https://sunnah.com/bukhari:1","by":"al-Bukhārī (sunnah.com translation)"}],"reads":[{"t":"Said the Prophet of God: Hadith Commentary across a Millennium (print)","u":"https://www.ucpress.edu/books/said-the-prophet-of-god/paper","by":"Joel Blecher, University of California Press"},{"t":"Ḥadīth Commentary in the Presence of Students, Patrons, and Rivals: Ibn Ḥajar and Ṣaḥīḥ al-Bukhārī in Mamluk Cairo","u":"https://doi.org/10.1163/18778372-13413403","by":"Joel Blecher, Oriens"},{"t":"Revision in the Manuscript Age: New Evidence of Early Versions of Ibn Ḥajar's Fatḥ al-Bārī","u":"https://doi.org/10.1086/690766","by":"Joel Blecher, Journal of Near Eastern Studies"}],"projects":[{"n":"Parallel sharḥ study","l":"Advanced","d":"Choose a ḥadīth found in both Ṣaḥīḥs and translate the key passages of Fatḥ al-Bārī and al-Minhāj on it. Write a 3,000-word comparison of their methods, sources and legal conclusions."},{"n":"Annotated mini-commentary","l":"Advanced","d":"Write your own sharḥ of one short ḥadīth in the classical order (wording, narrators, routes, rulings, benefits), citing every claim to a named commentary. Aim for 2,000 words with full references."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."},{"r":"Sunnah.com","u":"https://sunnah.com","d":"Arabic and English texts of the major collections, including the Muwaṭṭaʾ and Musnad Aḥmad, for checking wording and numbering."}]},{"id":"y3h_early","section":"hadith","title":"Early ḥadīth works: muwaṭṭaʾs, muṣannafs and musnads","short":"Early collections","level":"Advanced","why":"The collections of the second and early third centuries show how ḥadīth, Companion opinion and local practice were combined before the canonical books, and they are central to modern debates about the origins of Islamic law.","mins":2400,"pre":["sp_hadith","collections","critiques"],"ideas":["Three early genres differ in arrangement and content. A muwaṭṭaʾ (Mālik, d. 179/795) is arranged by legal topic and mixes Prophetic ḥadīth, Companion and Successor reports and Madinan practice with the author's opinions; a muṣannaf (ʿAbd al-Razzāq, d. 211/827; Ibn Abī Shaybah, d. 235/849) is topical with many āthār; a musnad (Aḥmad, d. 241/855) is arranged by Companion.","The Muwaṭṭaʾ survives in several recensions. The common one is that of Yaḥyā ibn Yaḥyā al-Laythī, while the recension of al-Shaybānī adds Ḥanafī comments. It includes reports without full chains (balāghāt), which shows that it was composed before the later standards of the Ṣaḥīḥs were fixed.","Musnad Aḥmad holds around 27,000 reports in modern editions, including additions by his son ʿAbd Allāh and the transmitter al-Qaṭīʿī. Aḥmad did not intend it to contain only sound reports, and scholars debated whether it contains any fabrications; Ibn Ḥajar defended it in al-Qawl al-Musaddad.","These works matter for academic history. Harald Motzki analysed the Muṣannaf of ʿAbd al-Razzāq by its main sources and argued that its material reflects genuine Meccan legal teaching from the late first century, earlier than Joseph Schacht's dating. Scott Lucas showed that Prophetic ḥadīth are a minority of the legal material in Ibn Abī Shaybah's Muṣannaf."],"callout":["Method","Read one chapter, such as the book of fasting, in the Muwaṭṭaʾ, the Muṣannaf of ʿAbd al-Razzāq and Ṣaḥīḥ al-Bukhārī. Count Prophetic, Companion and Successor reports in each; the difference in proportions is the lesson."],"lectures":[{"t":"Muwaṭṭaʾ: the first major collection of ḥadīth (Mālik ibn Anas)","u":"https://www.youtube.com/watch?v=Cda6pCsjEeo","by":"Cambridge Islamic College"},{"t":"Muwaṭṭaʾ of Muḥammad ibn al-Ḥasan al-Shaybānī (Great Books of Islamic Civilization)","u":"https://www.youtube.com/watch?v=TBDTFpFJgBU","by":"Sh. Yusuf Badat, Islamic Institute of Toronto"}],"papers":[{"t":"Muwaṭṭaʾ Mālik (recension of Yaḥyā al-Laythī)","u":"https://sunnah.com/malik","by":"Mālik ibn Anas (Arabic and English on sunnah.com)"},{"t":"Musnad Aḥmad","u":"https://sunnah.com/ahmad","by":"Aḥmad ibn Ḥanbal (Arabic and English on sunnah.com)"},{"t":"al-Muṣannaf (Arabic, ed. Ḥabīb al-Raḥmān al-Aʿẓamī)","u":"https://shamela.ws/book/13174","by":"ʿAbd al-Razzāq al-Ṣanʿānī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Mālik, the Muwaṭṭaʾ and Sunni Identity","u":"https://drjonathanbrown.com/2020/malik-the-muwa%e1%b9%ad%e1%b9%ada-and-sunni-identity/","by":"Jonathan A.C. Brown"},{"t":"The Origins of Islamic Jurisprudence: Meccan Fiqh before the Classical Schools (Brill, 2002)","u":"https://doi.org/10.1163/9789004491533","by":"Harald Motzki (trans. Marion H. Katz)"},{"t":"Where are the Legal Ḥadīth? A Study of the Muṣannaf of Ibn Abī Shayba","u":"https://doi.org/10.1163/156851908x299232","by":"Scott C. Lucas, Islamic Law and Society"}],"projects":[{"n":"Genre comparison dataset","l":"Advanced","d":"Build a spreadsheet of every report in one legal chapter of the Muwaṭṭaʾ and the Muṣannaf of ʿAbd al-Razzāq, coding each as Prophetic, Companion, Successor or practice. Write a 2,500-word paper interpreting the results alongside Motzki and Lucas."},{"n":"Musnad versus Ṣaḥīḥ","l":"Advanced","d":"Take ten reports of one Companion in Musnad Aḥmad and locate each in the six books. Write a report on which reports the canonical authors left out and propose reasons from their known conditions."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com","d":"Arabic and English texts of the major collections, including the Muwaṭṭaʾ and Musnad Aḥmad, for checking wording and numbering."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Searchable Arabic texts of the classical works cited here, with page numbers matching the print editions."}]}]},{"id":"mastery","title":"Year 4+: mastery and research","level":"Advanced","intro":"This stage is about how knowledge is carried, found, checked and passed on. It covers learning with teachers, research tools, manuscripts, the Western academy, the great reference works, and the ethics of teaching and fatwa.","phase":19,"optional":true,"topics":[{"id":"m_ijazah","title":"Learning with teachers: ijāzah and isnād","short":"Ijāzah & isnād","section":"method","level":"Advanced","why":"The ijāzah links a student to a chain of teachers, and understanding what it does and does not certify is part of learning responsibly.","mins":900,"pre":["isnad","hterms","adab_talib"],"ideas":["Ḥadīth scholars classified the ways of receiving a text (ṭuruq al-taḥammul). Ibn al-Ṣalāḥ lists eight, from strongest to weakest: hearing from the teacher (samāʿ), reading to him (qirāʾah or ʿarḍ), licence (ijāzah), handing over a copy (munāwalah), writing (mukātabah), notification (iʿlām), bequest (waṣiyyah) and finding a written text (wijādah).","An ijāzah is a licence to transmit a text or body of texts on the teacher's authority. Some are specific (a named book to a named student) and some are general, which scholars debated. Garrett Davidson shows that after the great collections were fixed, transmission continued mainly to keep the chain connected (ittiṣāl) and to seek short, elevated chains (ʿulūw), not to authenticate the texts.","Reading sessions were recorded in audition notes (samāʿāt) written on manuscripts, naming the reader, the listeners and the date. These notes, and Mohammad Akram Nadwi's research on al-muḥaddithāt, show that many women were teachers and transmitters, such as Karīmah al-Marwaziyyah, who transmitted Ṣaḥīḥ al-Bukhārī.","An ijāzah of transmission is not the same as a licence to teach a subject or to give fatwa. A chain of names guarantees connection to a tradition, while competence must still be shown through study, testing by teachers and sound character."],"callout":["Pitfall","Do not collect ijāzahs as trophies. Read the texts with the teacher, and treat a quick ijāzah as a blessing of connection, not as proof that you have mastered the book."],"lectures":[{"t":"What every student of knowledge should know about gatherings of isnād","u":"https://www.youtube.com/watch?v=OOL-gbYkWRA","by":"Asim al-Qaryooti, AMAU"},{"t":"Reviving the legacy of female scholarship in Islam","u":"https://www.youtube.com/watch?v=26-hFgOlHLc","by":"Mohammad Akram Nadwi, ADAMS Center"}],"papers":[{"t":"Muqaddimat Ibn al-Ṣalāḥ (Maʿrifat Anwāʿ ʿUlūm al-Ḥadīth), Arabic","u":"https://shamela.ws/book/22870","by":"Ibn al-Ṣalāḥ (ed. Nūr al-Dīn ʿItr), al-Maktabah al-Shāmilah"},{"t":"al-Ilmāʿ ilā Maʿrifat Uṣūl al-Riwāyah wa Taqyīd al-Samāʿ (Arabic)","u":"https://shamela.ws/book/6030","by":"al-Qāḍī ʿIyāḍ (ed. al-Sayyid Aḥmad Ṣaqr), al-Maktabah al-Shāmilah"},{"t":"Tadhkirat al-Sāmiʿ wa al-Mutakallim fī Adab al-ʿĀlim wa al-Mutaʿallim (Arabic)","u":"https://shamela.ws/book/151180","by":"Ibn Jamāʿah, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Review of Carrying on the Tradition: A Social and Intellectual History of Hadith Transmission across a Thousand Years","u":"https://ajis.org/index.php/ajiss/article/view/2992","by":"Scott Lucas, American Journal of Islam and Society (on Garrett A. Davidson, Brill 2020)"},{"t":"Hadith: Muhammad's Legacy in the Medieval and Modern World","u":"https://oneworld-publications.com/work/hadith-2/","by":"Jonathan A.C. Brown, Oneworld (print)"},{"t":"Audience Certificates in Arabic Manuscripts: The Genre and a Case Study (PDF)","u":"https://www.csmc.uni-hamburg.de/publications/mc/files/articles/mc08-seidensticker.pdf","by":"Tilman Seidensticker, manuscript cultures 8, CSMC University of Hamburg"}],"projects":[{"n":"Map a chain","l":"Intermediate","d":"Take the isnād of one ijāzah or one ḥadīth from Ṣaḥīḥ al-Bukhārī and draw it as a timeline with each narrator's death date and city."},{"n":"Modes of transmission table","l":"Advanced","d":"From Ibn al-Ṣalāḥ's chapter on taḥammul, make a table of the eight modes with the wording each requires (ḥaddathanā, akhbaranā, etc.) and one line on how strong scholars judged it."}],"repos":[]},{"id":"m_research","title":"Research methods in Islamic studies","short":"Research methods","section":"method","level":"Advanced","why":"Serious study needs the skill to find what has been written on a question, in Arabic and in European languages, and to judge its quality.","mins":1200,"pre":["ar_classical","ilm"],"ideas":["Start with the primary sources and their classical bibliographies. Ibn al-Nadīm's al-Fihrist (4th/10th century) and Ḥājjī Khalīfah's Kashf al-Ẓunūn (11th/17th century) list thousands of works by title and field, and are still used to learn what was written on a topic.","For modern scholarship, the Encyclopaedia of Islam (second edition and the ongoing THREE) gives signed overview articles with bibliographies, and Index Islamicus indexes European-language articles, chapters and books on Islam from 1906 onward. University library research guides show how these tools fit together.","Digital corpora have changed research. al-Maktabah al-Shāmilah allows full-text searching of thousands of Arabic books, and the OpenITI corpus provides machine-readable texts with stable identifiers for computational work such as tracing text reuse.","Digital texts are only as good as the edition behind them. Always note which printed edition a Shāmilah file follows, cite volume and page of the print, and check important passages against a scan or a critical edition."],"callout":["Method","Before writing on any question, build a source sheet: three primary texts, one encyclopedia article, and two recent academic studies. Write down why you trust each one."],"lectures":[{"t":"Maktabah Shāmilah: a walkthrough","u":"https://www.youtube.com/watch?v=1qiJcnn6oNI","by":"Arabic Enthusiasts"},{"t":"OpenITI OCR and text production teleconference","u":"https://www.youtube.com/watch?v=Cb5FI9NUJXY","by":"OpenITI Project"}],"papers":[{"t":"Kashf al-Ẓunūn ʿan Asāmī al-Kutub wa al-Funūn (Arabic)","u":"https://shamela.ws/book/2118","by":"Ḥājjī Khalīfah (Kâtip Çelebi), al-Maktabah al-Shāmilah"},{"t":"al-Fihrist (Arabic)","u":"https://shamela.ws/book/7642","by":"Ibn al-Nadīm (ed. Ibrāhīm Ramaḍān), al-Maktabah al-Shāmilah"}],"reads":[{"t":"Middle Eastern and Islamic Studies research guide","u":"https://guides.library.cornell.edu/MideastIslamStudies/Home","by":"Cornell University Library"},{"t":"Islamic Studies research guide","u":"https://guides.library.georgetown.edu/islam","by":"Georgetown University Library"},{"t":"Index Islamicus Online","u":"https://bibliographies.brillonline.com/IIO/","by":"Brill (subscription; ask a university library)"}],"projects":[{"n":"Annotated bibliography","l":"Advanced","d":"Pick one narrow question (for example the ruling on the witr prayer) and compile ten sources: five classical, five modern, each with a two-sentence note on its value."},{"n":"Edition check","l":"Intermediate","d":"Find one quotation in al-Shāmilah, identify the printed edition the file follows, and write a full citation with volume, page and editor."}],"repos":[{"r":"OpenITI Corpus","u":"https://openiti.org/projects/OpenITI%20Corpus.html","d":"Machine-readable premodern Arabic texts for searching and digital research."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Full-text search across classical Arabic works."}]},{"id":"m_manuscripts","title":"Manuscripts and critical editions (taḥqīq)","short":"Manuscripts","section":"method","level":"Advanced","why":"Almost every classical book reached us through handwritten copies, so knowing how manuscripts work and how editions are made lets you judge the text you are reading.","mins":1500,"pre":["ar_classical","m_research","isnad"],"ideas":["A manuscript carries more than its text. The colophon gives the copyist and date, ownership notes and endowment (waqf) statements record its history, and collation and audition notes show that it was checked against another copy or read before a teacher.","Muslim scholars developed rules for accurate copying long before modern textual criticism. Works such as al-Qāḍī ʿIyāḍ's al-Ilmāʿ discuss vowelling difficult words, marking omissions in the margin, collating (muqābalah) against the teacher's copy and how to correct errors.","Taḥqīq, or critical editing, means locating the surviving copies, judging their value (an autograph or a copy read to the author is best), choosing a base text, recording variants in an apparatus, and identifying quotations and people. A good editor explains these choices in the introduction.","Adam Gacek's Arabic Manuscripts: A Vademecum for Readers (Brill, 2009) explains the terms, scripts, materials and conventions you will meet. Digitised collections from Princeton, Leiden and the Qatar Digital Library now let anyone see the manuscripts themselves."],"callout":["Method","When you buy or download a printed edition, read the editor's introduction first. Note how many manuscripts were used and which one is the base, since this tells you how much to trust the printed wording."],"lectures":[{"t":"Manuscript Centre Lectures","u":"https://www.youtube.com/playlist?list=PL1ri262Fg97lhcFW8b55fXZAyVKqwFJbZ","by":"Al-Furqan Islamic Heritage Foundation"},{"t":"An Introduction to Islamic Manuscript Culture (conference)","u":"https://www.youtube.com/playlist?list=PLZR0JWf1w4rXBLvE2_kaplnJn8toxKr_Z","by":"UCLA International Institute"},{"t":"Arabic-Script Manuscripts in Africa","u":"https://www.youtube.com/playlist?list=PLwlmcbYzDDe6snc_hfpkqKe4NVIdfEe5I","by":"The Islamic Manuscript Association"}],"papers":[{"t":"al-Ilmāʿ ilā Maʿrifat Uṣūl al-Riwāyah wa Taqyīd al-Samāʿ (Arabic)","u":"https://shamela.ws/book/6030","by":"al-Qāḍī ʿIyāḍ, al-Maktabah al-Shāmilah"},{"t":"Tadhkirat al-Sāmiʿ wa al-Mutakallim (Arabic; final chapter on books and copying)","u":"https://shamela.ws/book/151180","by":"Ibn Jamāʿah, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Arabic Manuscripts: A Vademecum for Readers","u":"https://www.degruyterbrill.com/document/isbn/9789047443032/html","by":"Adam Gacek, Brill (print and e-book)"},{"t":"Review of Arabic Manuscripts: A Vademecum for Readers","u":"https://rbecs.org/2013/12/31/amvr/","by":"W. Andrew Smith, RBECS"},{"t":"The Islamic Manuscript Association","u":"https://www.islamicmanuscript.org","by":"TIMA (cataloguing standards, training and resources)"}],"projects":[{"n":"Describe a manuscript","l":"Intermediate","d":"Open one digitised Arabic manuscript in the Princeton collection and write a one-page description: title, author, copyist, date, script, notes in the margins and any ownership or waqf statements."},{"n":"Compare an edition","l":"Advanced","d":"Read the introduction of one critical edition and summarise how many manuscripts the editor used, which was the base text and why, and list three variant readings from the apparatus."}],"repos":[{"r":"Princeton Islamic Manuscripts (Digital PUL)","u":"https://dpul.princeton.edu/islamicmss","d":"Browse high-resolution scans of Arabic, Persian and Turkish manuscripts."},{"r":"Leiden University Libraries Digital Collections","u":"https://digitalcollections.universiteitleiden.nl/","d":"Search the Leiden Oriental manuscript collections."}]},{"id":"m_academy","title":"Islamic studies in the Western academy","short":"Western academy","section":"method","level":"Advanced","why":"Much modern writing on Islam comes from Western universities, and a student needs to understand its methods, history and critics in order to use it well.","mins":1200,"pre":["m_research","critiques"],"ideas":["Academic Islamic studies grew out of nineteenth-century European Orientalism, philology and history of religions. Scholars such as Ignaz Goldziher (Muhammedanische Studien, 1889–90) and later Joseph Schacht argued that much ḥadīth reflected later legal and political debates, and this sceptical view shaped the field for decades.","Edward Said's Orientalism (1978) argued that Western scholarship on the East was bound up with power and produced a fixed image of 'the Orient'. Wael Hallaq's Restating Orientalism (2018) accepts the critique but argues that Said did not go far enough, because the problem lies in the structure of modern knowledge itself.","The field today is varied. Some scholars remain sceptical about early sources, while others, such as Harald Motzki with his isnād-cum-matn analysis, and Jonathan Brown in his survey of the debates, show that the sources can be dated and tested carefully.","Reading academic work well means separating evidence from framework. A study can contain excellent manuscript research while working from assumptions a Muslim reader does not share, so note both the data it brings and the premises it starts from."],"callout":["Method","For any academic book, write two lists: what the author shows with evidence, and what the author assumes. This keeps you from both rejecting useful research and absorbing premises without noticing."],"lectures":[{"t":"Islamic Studies in the East and West: history, reflections and future","u":"https://www.youtube.com/watch?v=2dxo4M4jMWo","by":"Jonathan A.C. Brown, Institute of Islamic Thought and Research"},{"t":"A Critique of Modernity: The State and its Forms of Knowledge","u":"https://www.youtube.com/playlist?list=PLg_sc8wcf6k8maFgdDbKZy8QFU2Dsbxyn","by":"Wael B. Hallaq and Ovamir Anjum, American Islamic College"},{"t":"Course: Edward Said's Orientalism","u":"https://www.youtube.com/playlist?list=PLW4ijepGeAnYzl1OIiE6ujfo68geSNPqk","by":"Masood Raja"}],"papers":[{"t":"Muhammedanische Studien (German, 1889)","u":"https://archive.org/details/muhammedanisches00gold","by":"Ignaz Goldziher, Internet Archive"},{"t":"Orientalism","u":"https://www.penguinrandomhouse.com/books/159948/orientalism-by-edward-w-said/9780394740676/","by":"Edward W. Said, Vintage (print)"}],"reads":[{"t":"Restating Orientalism: A Critique of Modern Knowledge","u":"https://cup.columbia.edu/book/restating-orientalism/9780231187626","by":"Wael B. Hallaq, Columbia University Press (print)"},{"t":"Review of Wael B. Hallaq, Restating Orientalism","u":"https://journalhosting.ucalgary.ca/index.php/ariel/article/view/68684","by":"ARIEL: A Review of International English Literature"},{"t":"Edward Said and Wael Hallaq: Overlooked Questions in Postcolonial Studies (Arabic, English abstract)","u":"https://tabayyun.dohainstitute.org/en/issue055/Pages/art06.aspx","by":"Rachid Benbih, Tabayyun 14/55 (2026), Arab Center for Research and Policy Studies"}],"projects":[{"n":"Two readings of one ḥadīth debate","l":"Advanced","d":"Using Brown's Hadith as a guide, write a two-page comparison of how Goldziher or Schacht and a traditional muḥaddith would approach the same report."},{"n":"Evidence versus framework","l":"Intermediate","d":"Take one academic article on an Islamic topic and fill a two-column table: claims backed by evidence, and underlying assumptions, with a closing paragraph on what you would keep."}],"repos":[]},{"id":"m_reference","title":"Reading the great reference works","short":"Reference works","section":"method","level":"Advanced","why":"The large commentaries and dictionaries gather centuries of scholarship, and knowing how to consult them is what turns a reader into a researcher.","mins":1800,"pre":["ar_dict","ar_classical","m_research"],"ideas":["Fatḥ al-Bārī by Ibn Ḥajar al-ʿAsqalānī (d. 852/1449) is the most consulted commentary on Ṣaḥīḥ al-Bukhārī. Its introduction, Hady al-Sārī, explains al-Bukhārī's method and defends criticised narrators, and the body gathers chains, variant wordings and legal discussion for each report.","al-Mughnī of Ibn Qudāmah (d. 620/1223) is a commentary on the Ḥanbalī Mukhtaṣar of al-Khiraqī, but it also records the views of the Companions, the Successors and the other schools with their evidence. This makes it one of the best single works of comparative fiqh.","Mafātīḥ al-Ghayb, the large tafsīr of Fakhr al-Dīn al-Rāzī (d. 606/1210), treats each verse through a series of questions on language, theology, law and philosophy. Scholars discuss whether parts were completed by later hands, so cite it with care.","Lisān al-ʿArab of Ibn Manẓūr (d. 711/1311) combines five earlier dictionaries and many poetic and ḥadīth examples. In its original arrangement (and the Dār Ṣādir printing) entries go by the last root letter and then the first, but some modern editions (e.g. Dār al-Maʿārif, Cairo) rearrange it by first letter, so check which arrangement your edition uses and always look up the root, not the word as it appears."],"callout":["Method","Never read these works cover to cover at first. Learn their structure, then consult them on one question at a time, reading the full entry or section rather than a quoted line."],"lectures":[{"t":"Tea Over Books: al-Bukhārī, Islam's foremost traditionist","u":"https://www.youtube.com/watch?v=C4-Cp-1pMjQ","by":"Belal Alabbas and Abdal Hakim Murad, Cambridge Muslim College"},{"t":"How to use Maktaba Shamela (complete course)","u":"https://www.youtube.com/playlist?list=PLdPL7Oil8Z_nAzjGqMP-x2EO2dM-dbeKY","by":"Kanz-ul-Madaris Board"}],"papers":[{"t":"Fatḥ al-Bārī bi-Sharḥ Ṣaḥīḥ al-Bukhārī (Arabic, Salafiyyah ed.)","u":"https://shamela.ws/book/1673","by":"Ibn Ḥajar al-ʿAsqalānī, al-Maktabah al-Shāmilah"},{"t":"al-Mughnī (Arabic)","u":"https://shamela.ws/book/8463","by":"Ibn Qudāmah, al-Maktabah al-Shāmilah"},{"t":"Mafātīḥ al-Ghayb (al-Tafsīr al-Kabīr), Arabic","u":"https://shamela.ws/book/23635","by":"Fakhr al-Dīn al-Rāzī, al-Maktabah al-Shāmilah"},{"t":"Lisān al-ʿArab (Arabic)","u":"https://shamela.ws/book/1687","by":"Ibn Manẓūr, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Book review: Said the Prophet of God: Hadith Commentary across a Millennium by Joel Blecher (on Fatḥ al-Bārī and its rivals)","u":"https://knowledge.uchicago.edu/records/pn6ak-nvk75","by":"Christian Mauder, Mamlūk Studies Review (open access)"},{"t":"Ibn Qudāmah's comparative methodology in al-Mughnī and its relevance to contemporary ijtihād","u":"https://journal.uin-alauddin.ac.id/index.php/mjpm/article/view/54759","by":"Mazahibuna 7(1), 2025 (CC BY 4.0)"},{"t":"Arabic Lexicography: Its History, and Its Place in the General History of Lexicography (library loan)","u":"https://archive.org/details/arabiclexicograp0000hayw","by":"John A. Haywood (Brill, 1960)"}],"projects":[{"n":"One ḥadīth, four works","l":"Advanced","d":"Choose one legal ḥadīth from al-Bukhārī and write a two-page report using Fatḥ al-Bārī for the ḥadīth, al-Mughnī for the legal positions and Lisān al-ʿArab for one key word."},{"n":"Root study","l":"Intermediate","d":"Look up one Qurʾānic root in Lisān al-ʿArab and list its main meanings with the poetic or ḥadīth evidence given for each, then compare with al-Rāzī's comments on a verse using it."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Read and search the full text of all four reference works."},{"r":"altafsir.com","u":"https://www.altafsir.com","d":"Compare al-Rāzī's comments on a verse with other classical tafsīrs side by side."}]},{"id":"m_teaching","title":"Teaching, writing and the ethics of fatwa (adab al-muftī)","short":"Adab al-muftī","section":"method","level":"Advanced","why":"Whoever teaches or answers questions speaks about the religion of God, so the classical scholars wrote detailed ethics for the teacher, the writer and the muftī.","mins":1200,"pre":["fatwa","ikhtilaf","taqlid","adab_talib"],"ideas":["Ibn al-Ṣalāḥ (d. 643/1245) wrote Adab al-Muftī wa al-Mustaftī, and al-Nawawī (d. 676/1277) reworked it in the introduction to al-Majmūʿ, later printed as Ādāb al-Fatwā. They set out who may give fatwa, the levels of muftī from the independent mujtahid to one who transmits his school, and the manners of both muftī and questioner.","A fatwa is a non-binding answer to a specific question, while a judge's ruling (qaḍāʾ) binds the parties. A fatwa is therefore tied to the question asked, the questioner's situation, and the time and place, and it cannot be lifted out and applied everywhere.","Ibn Qayyim al-Jawziyyah's Iʿlām al-Muwaqqiʿīn has a famous chapter on how fatwas change with changes of time, place, circumstance, intention and custom. Classical authors also praise saying \"I do not know\" (lā adrī), and Mālik is reported to have answered many questions this way.","Ibn Jamāʿah's Tadhkirat al-Sāmiʿ wa al-Mutakallim sets out the teacher's ethics: sincerity, teaching at the student's level, not speaking beyond one's knowledge, and care for students. The same rules apply to anyone who writes or teaches publicly, online included."],"callout":["Pitfall","Do not apply a fatwa you read online to yourself or others without asking what question it answered, in which country, and under which school. When the case is yours, ask a qualified local scholar."],"lectures":[{"t":"Are the answers on SeekersGuidance considered fatwa?","u":"https://www.youtube.com/watch?v=26-5Px2dibI","by":"Faraz Rabbani, SeekersGuidance"},{"t":"How do we understand that fatwas are non-binding?","u":"https://www.youtube.com/watch?v=51RFyc-9Gxg","by":"Abdul-Rahim Reasat, SeekersGuidance"},{"t":"How to understand a fatwa","u":"https://www.youtube.com/watch?v=1xHXf1brbCY","by":"Islam21c"}],"papers":[{"t":"Adab al-Muftī wa al-Mustaftī (Arabic)","u":"https://shamela.ws/book/10720","by":"Ibn al-Ṣalāḥ (ed. Muwaffaq ʿAbd Allāh ʿAbd al-Qādir), al-Maktabah al-Shāmilah"},{"t":"Ādāb al-Fatwā wa al-Muftī wa al-Mustaftī (Arabic)","u":"https://shamela.ws/book/6345","by":"al-Nawawī (ed. Bassām ʿAbd al-Wahhāb al-Jābī), al-Maktabah al-Shāmilah"},{"t":"Iʿlām al-Muwaqqiʿīn ʿan Rabb al-ʿĀlamīn (Arabic)","u":"https://shamela.ws/book/11496","by":"Ibn Qayyim al-Jawziyyah, al-Maktabah al-Shāmilah"},{"t":"Tadhkirat al-Sāmiʿ wa al-Mutakallim (Arabic)","u":"https://shamela.ws/book/151180","by":"Ibn Jamāʿah, al-Maktabah al-Shāmilah"}],"reads":[{"t":"Follow Your Heart or Trust the Scholars? The Islamic Ethics of Moral Authority","u":"https://yaqeeninstitute.org/read/paper/follow-your-heart-or-trust-the-scholars-the-islamic-ethics-of-moral-authority","by":"Ovamir Anjum, Yaqeen Institute"},{"t":"Why We Need Ulama: The Importance of Seeking Islamic Knowledge From Scholars","u":"https://yaqeeninstitute.org/read/paper/why-we-need-ulama-the-importance-of-seeking-islamic-knowledge-from-scholars","by":"Usaama al-Azami, Yaqeen Institute"}],"projects":[{"n":"Read a fatwa responsibly","l":"Intermediate","d":"Take one published fatwa and write a one-page analysis: the exact question, the school and evidence used, the context assumed, and which details would change the answer."},{"n":"Etiquette summary","l":"Advanced","d":"Summarise al-Nawawī's Ādāb al-Fatwā in twenty numbered rules in English, each with the Arabic phrase it comes from, as a guide you could give to a study circle."}],"repos":[]}]}],"courses":[{"t":"Sunnah.com","u":"https://sunnah.com/","by":"Ḥadīth collections with gradings","kind":"Tool"},{"t":"Quran.com","u":"https://quran.com/","by":"Qurʾān with translations, word-by-word and tafsīr","kind":"Tool"},{"t":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","by":"Word-by-word grammar and morphology","kind":"Tool"},{"t":"altafsir.com","u":"https://www.altafsir.com/","by":"Classical tafsīr works in Arabic, some in English","kind":"Tool"},{"t":"tafsir.app","u":"https://tafsir.app/","by":"Many classical tafsīrs side by side (Arabic)","kind":"Tool"},{"t":"al-Maktaba al-Shāmila","u":"https://shamela.ws/","by":"Large library of classical Arabic texts","kind":"Library"},{"t":"Internet Archive","u":"https://archive.org/","by":"Public-domain classical texts and older translations","kind":"Library"},{"t":"Ghazali.org","u":"https://www.ghazali.org/","by":"Al-Ghazālī's works and translations","kind":"Library"},{"t":"SeekersGuidance","u":"https://seekersguidance.org/","by":"Free structured courses with qualified teachers","kind":"Courses"},{"t":"Yaqeen Institute","u":"https://yaqeeninstitute.org/","by":"Research papers (use the academic articles)","kind":"Articles"},{"t":"Cambridge Muslim College","u":"https://www.cambridgemuslimcollege.ac.uk/","by":"Lectures and programs","kind":"Courses"},{"t":"Zaytuna College","u":"https://zaytuna.edu/","by":"Public lectures and articles","kind":"Courses"}]};
const CONFIG={"key":"isl","searchHint":"Search topics, texts, scholars","title":"Islamic Studies Atlas","short":"Islamic Studies","tag":"ʿilm","base":0,"daily":false,"parallel":[1,2,3,10],"sections":[{"id":"quran","title":"Qurʾān & tafsīr","desc":"Recitation, the Qurʾānic sciences and interpretation"},{"id":"hadith","title":"Ḥadīth","desc":"Prophetic reports: terminology, criticism, collections and commentary"},{"id":"aqidah","title":"ʿAqīdah & theology","desc":"Belief, the schools of theology and the Hereafter"},{"id":"usul","title":"Uṣūl al-fiqh","desc":"Legal theory: how rulings are derived"},{"id":"fiqh","title":"Fiqh","desc":"Applied law: worship, transactions, family, inheritance and governance"},{"id":"prophet","title":"The Prophet ﷺ & the prophets","desc":"Sīrah, shamāʾil, the prophets, the Prophet's family and Companions"},{"id":"history","title":"History by Hijri century","desc":"From the Rightly Guided Caliphs to the modern Muslim world"},{"id":"tazkiyah","title":"Tazkiyah, akhlāq & taṣawwuf","desc":"Purification of the heart, character, rights and the spiritual path"},{"id":"arabic","title":"Arabic","desc":"The tool for every other discipline"},{"id":"thought","title":"Thought, sects & civilization","desc":"Philosophy, sects, comparative religion and intellectual history"},{"id":"contemporary","title":"Contemporary questions","desc":"Modern fiqh and present-day issues"},{"id":"method","title":"Manhaj & research","desc":"How knowledge works, the student's adab, and scholarly research"}],"papersLabel":"Primary texts","papersShort":"texts","coursesLabel":"Libraries & platforms","coursesEyebrow":"Free, reliable places to read","coursesLede":"Where to find the texts and tools used throughout the path.","labels":{"watch":"Lectures","reads":"Articles & commentaries","build":"Notebook exercises","repos":"Study tools","projects":"Exercises","milestone":"Milestone output","readsShort":"articles","projShort":"exercises","reposShort":"tools","lecShort":"lectures"},"projEyebrow":"Learn by writing","projLede":"Each phase ends with a written milestone. Every topic also has two notebook exercises. Writing is how you find out whether you understood.","capsLabel":"Milestone outputs","topicProjLabel":"Notebook exercises","pathLede":"From what every Muslim must know (farḍ ʿayn) through a two-year foundation, then one Year 3 specialization and Year 4 research. Three tracks run alongside: Arabic for the whole way, the Prophet ﷺ during Year 1, and history by Hijri century during Year 2. Do not skip ahead.","eyebrow":"Usūl before furūʿ · method before volume · primary texts first","headline":"A structured path through the Islamic sciences, from first principles.","lede":"Start with practical basics, then two years of foundations in the classical order: manhaj, ʿaqīdah, uṣūl, ḥadīth, Qurʾānic sciences, fiqh, history and tazkiyah, with Arabic alongside. Every topic gives you the key ideas, lectures, primary texts, articles and notebook exercises.","hubs":[{"id":"arabic","section":"arabic","title":"Arabic programme","eyebrow":"The tool for every discipline","lede":"A structured route from the alphabet to reading classical texts. Work through the levels in order alongside the main path, with one course per level and the free notes and workbooks listed below. The goal is recognition first, then reading."}],"pages":[{"id":"timetable","title":"Daily timetable","html":""},{"id":"method","title":"Study method","html":"<div class=\"method\"><p class=\"eyebrow\">Read this once</p><h1>Study method</h1><p class=\"lede\">How to use this path the way traditional students trained, adapted for independent study.</p><h3>Principles</h3><ul class=\"\"><li>Uṣūl before furūʿ: foundations before details.</li><li>Method before volume.</li><li>Understanding before memorization.</li><li>Primary texts first, then summaries, then lectures.</li><li>Read short classical texts slowly. Do not binge-watch.</li></ul><h3>Daily format (1.5–2 hours)</h3><ul class=\"\"><li>Qurʾān: 15–30 minutes, with meaning.</li><li>Reading: 60–90 minutes of the current text.</li><li>Writing: 15–20 minutes in your notebook.</li><li>One principle written down.</li><li>One sunnah applied consciously.</li></ul><h3>Notebook sections</h3><ul class=\"\"><li>Definitions</li><li>Principles</li><li>Evidence</li><li>Questions (not answers)</li></ul><h3>Weekly</h3><ul class=\"\"><li>Review the week&#x27;s notes and write a one-paragraph synthesis.</li><li>One longer lecture.</li><li>Self-reflection: did my character improve?</li></ul><h3>How the disciplines depend on each other</h3><ul class=\"\"><li>Arabic supports every track.</li><li>Uṣūl al-fiqh underpins fiqh, tafsīr and ḥadīth.</li><li>Ḥadīth underpins fiqh and ʿaqīdah.</li><li>Qurʾān and tafsīr underpin everything.</li><li>History prevents misinterpretation.</li><li>Tazkiyah prevents arrogance.</li></ul><h3>Common mistakes</h3><ul class=\"warn\"><li>Tafsīr without ʿulūm al-Qurʾān</li><li>Fiqh without uṣūl</li><li>Ḥadīth without methodology</li><li>ʿAqīdah without history</li><li>Knowledge without tazkiyah</li><li>Jumping between madhhabs</li><li>Self-made fatwas without study</li><li>Social media debates, short clips and &#x27;exposing&#x27; channels</li><li>Skipping ahead</li></ul><h3>After Year 2 you are ready for</h3><ul class=\"\"><li>A specialized track (fiqh, ḥadīth, tafsīr or ʿaqīdah)</li><li>Teacher-guided study toward ijāzah</li><li>Advanced Arabic immersion</li><li>Writing structured research papers</li></ul><p class=\"empty\" style=\"margin-top:28px\">This path builds literacy, not authority to give fatwas. For practical rulings in your own life, ask a qualified scholar.</p></div>"}],"capstones":[{"n":"Set up your study notebook","l":"Beginner","phase":0,"d":"The notebook is mandatory. Set it up before anything else and use it every day.","steps":["Create four sections: Definitions, Principles, Evidence, Questions (questions, not answers)","Write the daily format at the front: 60–90 min reading, 15–20 min writing","Learn the fiqh of purification and prayer in one madhhab, including the fiqh of women","Write the conditions, pillars and invalidators of prayer in your madhhab","After each Sīrah episode, write one event, its date and one lesson"],"uses":["b_tajweed","b_worship","b_seerah"]},{"n":"Month 1 output: knowledge and disagreement","l":"Beginner","phase":4,"d":"You should be able to explain why disagreement is not deviation, and why following scholars is not blind imitation.","steps":["Define ʿilm, yaqīn and ẓann in your own words, with one example each","List the sources of knowledge with an example for each","Summarize the reasons Ibn Taymiyyah gives for scholars leaving a ḥadīth","Write one page: why following qualified scholarship is not blind imitation"],"uses":["ilm","ikhtilaf","taqlid"]},{"n":"Month 2 output: creed with evidence","l":"Intermediate","phase":5,"d":"Correct belief based on evidence and methodology, not slogans.","steps":["Write the difference between tafwīḍ, taʾwīl and tashbīh, with one example each","Explain why early Muslims avoided speculative theology","List the main points of the Ṭaḥāwiyyah on tawḥīd, īmān and qadar with their evidence","Write a short, fair summary of the Atharī, Ashʿarī and Māturīdī approaches"],"uses":["tahawi","tawhid","qadar","sifat","schools"]},{"n":"Month 3 output: how law works","l":"Intermediate","phase":6,"d":"You should be able to explain why the Sunnah is binding and how a ruling is derived.","steps":["Map the four sources (Qurʾān, Sunnah, ijmāʿ, qiyās) with one example ruling each","Define the five legal rulings (wājib, mandūb, mubāḥ, makrūh, ḥarām)","Explain ʿāmm/khāṣṣ and muṭlaq/muqayyad with Qurʾānic examples","Write one page: why the Sunnah is binding, from al-Risālah"],"uses":["sources","waraqat","sunnah"]},{"n":"Month 4 output: one chain a week","l":"Intermediate","phase":7,"d":"Stop misusing ḥadīth by learning how it is checked.","steps":["Classify 20 narrations from Sunnah.com as marfūʿ, mawqūf or maqṭūʿ and note their grading","Diagram one isnād per week: narrators, links, any break","Write the difference between a weak (ḍaʿīf) and a fabricated (mawḍūʿ) report","Read the Muqaddimah of Ṣaḥīḥ Muslim and list Muslim's stated conditions"],"uses":["hterms","isnad","collections","happly"]},{"n":"Month 5 output: compare the commentators","l":"Intermediate","phase":8,"d":"Understand how the Qurʾān is interpreted, not cherry-picked.","steps":["Pick one short sūrah and read it in al-Ṭabarī, Ibn Kathīr and al-Saʿdī","For each verse, note what is transmitted (riwāyah) and what is reasoned (dirāyah)","Record the Makkī/Madanī status and any asbāb al-nuzūl","Write one page on where the three agree and why they differ"],"uses":["ulum","context","tmethod","tcompare"]},{"n":"End of Year 1 self-check","l":"Intermediate","phase":9,"d":"After six months you should be able to read classical texts without panic, know where you stand and why, respect disagreement without relativism, and know what you don't know.","steps":["Read 5 pages of a classical text and summarize it without notes","Explain your madhhab's ruling on one act of worship and its evidence","Give a balanced half-page account of the first fitnah","Describe the Khawārij, Shīʿa and Muʿtazila in neutral terms","Write what you still don't know: your Year 2 questions"],"uses":["madhhab","history","sects","khaldun","tazkiyah"]},{"n":"Q1 output: reason and revelation","l":"Advanced","phase":11,"d":"Explain why Sunni scholars rejected both rational extremism and literalism, and explain philosophical errors without mockery.","steps":["Summarize the Wāsiṭiyyah's method on the attributes","Outline the three issues on which al-Ghazālī declared the philosophers in error","Write a two-page account of the Miḥnah and its long-term effects"],"uses":["wasitiyyah","reason","falsafa","mihnah"]},{"n":"Q2 output: text to ruling","l":"Advanced","phase":12,"d":"Trace a ruling from text to principle to ruling, and recognize misuse of maqāṣid.","steps":["Pick one contemporary question and trace the evidence, principle and ruling","List five legal maxims with one application each","Write one page on correct use and abuse of maqāṣid arguments"],"uses":["mustasfa","maqasid","qawaid","fatwa","f_muamalat","f_faraid"]},{"n":"Q3 output: accept or reject","l":"Advanced","phase":13,"d":"Explain why a ḥadīth is accepted or rejected, and tell scholarly disagreement apart from ignorance.","steps":["Study one ḥadīth graded differently by two scholars and explain why","Reconcile two apparently conflicting ṣaḥīḥ narrations using jamʿ or tarjīḥ","Trace one ruling in Bulūgh al-Marām across the four madhhabs","Summarize one orientalist claim about ḥadīth and the main scholarly responses"],"uses":["ilal","tadlis","mukhtalif","hfiqh","mawdu","critiques"]},{"n":"Q4 output: Year 2 synthesis","l":"Advanced","phase":14,"d":"Read history without emotional bias and keep knowledge tied to character.","steps":["Analyze three legal verses with their juristic readings","Write a short biography of one scholar from Siyar and what made them trustworthy","Write a page on intentions and the arrogance of knowledge, from Madārij al-Sālikīn","Choose your Year 3 specialization and write why"],"uses":["shatibi","ahkam","siyar","madarij"]},{"n":"Ḥifẓ and recitation log","l":"Beginner","phase":1,"d":"A steady connection with the Qurʾān across all years.","steps":["Recite al-Fātiḥah and the short sūrahs to a teacher and correct your mistakes","Set a daily memorization and revision portion and log it","Read one juzʾ of the Qurʾān with meaning each month and note what you reflected on"],"uses":["b_tajweed","q_hifz"]},{"n":"Sīrah timeline and notebook","l":"Intermediate","phase":3,"d":"By the end of Year 1 you should be able to narrate the Sīrah in order with dates, and describe the Prophet ﷺ from the Shamāʾil.","steps":["Draw a timeline from the Year of the Elephant to 11 AH with the major events and their Hijri dates","For each prophet in
