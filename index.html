he Prophet's ﷺ life and the generations of Companions and Successors in al-Ṭabaqāt al-Kubrā, giving isnāds for most reports.","Ḥadīth scholars applied different standards to different material: they were strict with reports about lawful and unlawful matters and more lenient with maghāzī and virtues. A sīrah report therefore needs checking against the ṣaḥīḥ collections when it is used for belief or law.","Modern academic study ranges from strong scepticism about the sources (as in Crone and Cook) to methods that date reports by analysing isnāds together with texts (isnād-cum-matn analysis, Harald Motzki) and that trace ʿUrwah's material through several lines (Gregor Schoeler). Guillaume's English translation is itself a reconstruction that adds al-Ṭabarī's versions to Ibn Hishām."],"callout":["Method","When a sīrah story matters to you, find it in Ibn Hishām, al-Wāqidī and the ṣaḥīḥ collections, and compare isnāds and details before you rely on it."],"lectures":[{"t":"Keynote: Early Islamic System of Teaching and Transmission","u":"https://www.youtube.com/watch?v=Fgbb_Nlj6ZM","by":"Gregor Schoeler (Frankfurter Koranstudien)"},{"t":"The Historical Muhammad","u":"https://www.youtube.com/watch?v=GdaxAXEdx04","by":"Sean W. Anthony (MSU Muslim Studies Program)"}],"papers":[{"t":"The Life of Muhammad: a translation of Ibn Isḥāq's Sīrat Rasūl Allāh (borrowable)","u":"https://archive.org/details/lifeofmuhammadtr0000ibnh","by":"Ibn Isḥāq (trans. A. Guillaume)"},{"t":"Kitāb al-Maghāzī (Arabic, ed. A. von Kremer, Calcutta 1856, partial)","u":"https://archive.org/details/in.ernet.dli.2015.398726","by":"al-Wāqidī"},{"t":"al-Ṭabaqāt al-Kubrā (Arabic, al-Khānjī edition)","u":"https://shamela.ws/book/146","by":"Ibn Saʿd"},{"t":"al-Sīrah al-Nabawiyyah (Arabic)","u":"https://shamela.ws/book/23833","by":"Ibn Hishām"}],"reads":[{"t":"The Biography of Muhammad: Nature and Authenticity (print)","u":"https://www.routledge.com/The-Biography-of-Muhammad-Nature-and-Authenticity/Schoeler/p/book/9781138788862","by":"Gregor Schoeler (trans. Uwe Vagelpohl)"},{"t":"The Life of Muhammad: al-Wāqidī's Kitāb al-Maghāzī, with introduction (print)","u":"https://www.routledge.com/The-Life-of-Muhammad-Al-Waqidis-Kitab-al-Maghazi/Faizer/p/book/9780415864855","by":"Rizwi Faizer (ed.)"}],"projects":[{"n":"One event, three sources","l":"Intermediate","d":"Compare the account of one event (for example the Treaty of al-Ḥudaybiyah) in Ibn Hishām, al-Wāqidī and Ṣaḥīḥ al-Bukhārī in a three-column table, noting agreements, additions and isnāds."},{"n":"Historiography essay","l":"Advanced","d":"Write a 1,500-word essay explaining the difference between the ḥadīth critics' view of al-Wāqidī and the modern historians' use of him, citing at least two scholarly works."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic originals of the classical works cited here."},{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."}]}]},{"id":"manhaj","title":"Manhaj: how Islamic knowledge works","level":"Beginner","intro":"Before studying creed or law, learn what the tradition means by knowledge, why qualified scholars reach different answers, and how ordinary believers relate to expert scholarship.","phase":4,"optional":false,"topics":[{"id":"ilm","title":"What is knowledge (ʿilm)?","short":"Knowledge (ʿilm)","level":"Beginner","why":"The classical idea of ʿilm shapes everything else in the curriculum: what counts as knowledge, which sciences are obligatory, and how knowledge should change the one who learns it.","mins":600,"pre":[],"ideas":["Theologians define ʿilm as a firm conviction that matches reality and rests on proof; it is distinguished from ẓann (strong probability), shakk (doubt) and jahl (ignorance). Much of law works with ẓann, while core creed seeks certainty (yaqīn).","Al-Ghazālī divides knowledge into farḍ ʿayn, which every Muslim must learn (basic creed, the rulings of acts one actually performs, the diseases of the heart), and farḍ kifāyah, which the community must cover (medicine, advanced law, arithmetic and the like).","He also separates praiseworthy sciences from blameworthy ones and warns that some sciences become blameworthy through misuse, for example disputation pursued for status rather than truth.","The tradition ties knowledge to action and character: the 'scholars of the hereafter' are known by humility, scrupulousness and acting on what they know. Knowledge is also transmitted through teachers and chains (isnād), not only books."],"callout":["Method","Read the Book of Knowledge slowly, one section a week, and keep a two-column log: the classifications al-Ghazālī makes, and the practical advice he gives the student."],"lectures":[{"t":"Everything Starts With Knowledge","u":"https://www.youtube.com/watch?v=vwoe6j9IyIs","by":"Yasir Qadhi"},{"t":"Certainty is Not Lost Due to Doubt","u":"https://www.youtube.com/watch?v=evK03w6Di_o","by":"Hamza Yusuf (Islam On Demand)"}],"papers":[{"t":"The Book of Knowledge (Kitāb al-ʿIlm, Iḥyāʾ ʿUlūm al-Dīn, Book 1)","u":"https://ghazali.org/works/bk1-sec-1.htm","by":"al-Ghazālī (trans. Nabih Amin Faris)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Knowledge (Kitāb al-ʿIlm)","u":"https://sunnah.com/bukhari/3","by":"al-Bukhārī"},{"t":"Deliverance from Error (al-Munqidh min al-Ḍalāl)","u":"http://www.ghazali.org/works/watt3.htm","by":"al-Ghazālī (trans. W. Montgomery Watt)"}],"reads":[{"t":"Understanding the Uṣūl: The Foundation of Islamic Sciences","u":"https://yaqeeninstitute.org/read/paper/understanding-the-usul-the-foundation-of-islamic-sciences","by":"Mohamed AbuTaleb (Yaqeen Institute)"},{"t":"There Has Always Been Fake News: Misinformation and Islamic Critical Epistemology","u":"https://yaqeeninstitute.org/read/paper/fake-news-is-nothing-new-misinformation-and-islamic-critical-epistemology.","by":"Arnold Yasin Mol (Yaqeen Institute)"},{"t":"al-Ghazali","u":"https://plato.stanford.edu/entries/al-ghazali/","by":"Frank Griffel (Stanford Encyclopedia of Philosophy)"}],"projects":[{"n":"Map of the sciences","l":"Beginner","d":"Draw a one-page chart of al-Ghazālī's classification (farḍ ʿayn, farḍ kifāyah, praiseworthy, blameworthy) and place each subject in this curriculum on it."},{"n":"Personal farḍ ʿayn list","l":"Beginner","d":"Write a one-page list of what you personally must know now (creed, the fiqh of your own worship and work), with a source for each item and a date to finish it."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth cited here with Arabic, English and grading."}],"section":"method"},{"id":"adab_talib","title":"Adab of the student of knowledge","short":"Student adab","level":"Beginner","section":"method","why":"Classical scholars treated right intention and conduct as the precondition for gaining and keeping knowledge, so this topic shapes how all later study is done.","mins":720,"pre":["ilm"],"ideas":["The genre of ādāb al-ʿālim wa-l-mutaʿallim sets out the manners of teacher and student. Key works are al-Khaṭīb al-Baghdādī's al-Jāmiʿ li-Akhlāq al-Rāwī wa-Ādāb al-Sāmiʿ, al-Zarnūjī's Taʿlīm al-Mutaʿallim, Ibn Jamāʿah's (d. 733 AH) Tadhkirat al-Sāmiʿ wa-l-Mutakallim and, in modern times, Bakr Abū Zayd's Ḥilyat Ṭālib al-ʿIlm.","All of them begin with intention: knowledge is sought for Allah, to remove one's own ignorance and to act on it, not for status or argument. Ibn Jamāʿah treats purity of the heart and avoiding sin as conditions for knowledge to settle.","The student chooses a teacher carefully, because 'this knowledge is religion, so look to whom you take your religion from' (Ibn Sīrīn, in the introduction to Ṣaḥīḥ Muslim). He respects the teacher, asks well, and does not jump between teachers or books without reason.","Learning is gradual (tadarruj): one masters a short text (matn) in each science with a teacher before moving to longer works, revises constantly and writes notes. Ibn Jamāʿah also gives rules for handling books, keeping good company and the student's daily schedule."],"callout":["Pitfall","Do not read adab books as a checklist to judge others. Their authors meant them as self-examination, and they warn especially against arguing to win and showing off knowledge."],"lectures":[{"t":"02: Adab, Seeking Sacred Knowledge","u":"https://www.youtube.com/watch?v=bL5IUct0YOU","by":"Tabraze Azam (SeekersGuidance)"},{"t":"01: Introduction to Sacred Learning: How to Seek Islamic Knowledge","u":"https://www.youtube.com/watch?v=OiV-ITAgOYE","by":"Faraz Rabbani (SeekersGuidance)"},{"t":"Ḥilyat Ṭālib al-ʿIlm: Manners of the Seeker of Knowledge","u":"https://www.youtube.com/playlist?list=PL3boWDFecv-ur_5ut-hb6QtMe0V6PES5v","by":"Abdur Raheem McCarthy (Zidni Institute)"}],"papers":[{"t":"Tadhkirat al-Sāmiʿ wa-l-Mutakallim fī Adab al-ʿĀlim wa-l-Mutaʿallim (Arabic)","u":"https://shamela.ws/book/151180","by":"Ibn Jamāʿah"},{"t":"Instruction of the Student: The Method of Learning (1947 translation, borrowable)","u":"https://archive.org/details/bwb_Y0-BUB-247","by":"al-Zarnūjī (trans. G.E. von Grunebaum and T.M. Abel)"},{"t":"Ḥilyat Ṭālib al-ʿIlm (Arabic)","u":"https://shamela.ws/book/9884","by":"Bakr Abū Zayd"},{"t":"Ṣaḥīḥ Muslim, Introduction (on taking knowledge from reliable people)","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj"}],"reads":[{"t":"The Etiquette of Allah's Elect (Adab 03)","u":"https://seekersguidance.org/articles/knowledge/adab-03-etiquette-allahs-elect/","by":"Tabraze Azam (SeekersGuidance)"},{"t":"Advice Regarding Being a Student of Knowledge and Taking Notes","u":"https://islamqa.org/hanafi/seekersguidance-hanafi/31671/advice-regarding-being-a-student-of-knowledge-and-taking-notes/","by":"SeekersGuidance (via IslamQA.org)"}],"projects":[{"n":"Adab digest","l":"Beginner","d":"Read the student chapters of Ibn Jamāʿah or al-Zarnūjī and condense them into twenty numbered rules, each with the author's reason or evidence."},{"n":"Study charter","l":"Beginner","d":"Write a one-page personal study charter (intention, teachers, texts per science, weekly schedule, revision method) based on the adab works, and review it after one month."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic originals of the classical works cited here."},{"r":"Internet Archive","u":"https://archive.org/","d":"Borrow the 1947 English translation of al-Zarnūjī through the free lending library."}]},{"id":"ikhtilaf","title":"Why scholars disagree (ikhtilāf)","short":"Ikhtilāf","level":"Beginner","why":"Disagreement among qualified jurists is a normal and principled part of the law; understanding its causes protects the learner from both confusion and contempt for scholars.","mins":540,"pre":["ilm"],"ideas":["Texts are either qaṭʿī (definitive in authenticity and meaning) or ẓannī (open to more than one reading). Valid ikhtilāf happens in the ẓannī area; matters of consensus (ijmāʿ) and definitive texts are not open to dispute.","In Rafʿ al-Malām, Ibn Taymiyyah argues that no recognised imam knowingly opposes a sound ḥadīth. A scholar who leaves one either doubts that the Prophet ﷺ said it, doubts that it means the ruling in question, or holds that it was abrogated; he then lists ten concrete reasons under these headings.","Other causes include different readings of Arabic words and grammar, different rules for weighing ḥadīth, and different uṣūl, such as the status of Madinan practice or of a Companion's opinion. Ibn Rushd's Bidāyat al-Mujtahid traces each disagreement back to such a cause.","The Companions themselves differed over the Prophet's ﷺ instruction to pray ʿAṣr at Banū Qurayẓah and he blamed neither group; a mujtahid who errs still earns one reward. Scholars separate disagreement of variety (tanawwuʿ) from real contradiction (taḍādd)."],"callout":["Pitfall","Valid ikhtilāf does not mean every opinion is acceptable. Ask who holds the view, on what evidence, and whether it contradicts ijmāʿ before treating it as a live option."],"lectures":[{"t":"Difference Of Opinion: A Mercy Or A Curse","u":"https://www.youtube.com/watch?v=yu5ddO3lILM","by":"Yasir Qadhi"},{"t":"The Removal of Blame From The Great Imams (lessons)","u":"https://www.youtube.com/playlist?list=PLZyEF9g5A_ymG4D2O8WHCWDLV3X2iznKv","by":"Tariq Appleby (uploaded by Dawud Badr ud-Din)"}],"papers":[{"t":"Rafʿ al-Malām ʿan al-Aʾimmah al-Aʿlām (Arabic)","u":"https://shamela.ws/book/4118","by":"Ibn Taymiyyah (English: Abdul-Hakim al-Matroudi, Exonerating the Distinguished Jurists, Equinox 2023, print)"},{"t":"Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid: author's introduction (Arabic)","u":"https://shamela.ws/book/21739/1","by":"Ibn Rushd al-Ḥafīd (English: Imran Ahsan Khan Nyazee, The Distinguished Jurist's Primer, Garnet, print)"},{"t":"Ṣaḥīḥ al-Bukhārī 4119: praying ʿAṣr at Banū Qurayẓah","u":"https://sunnah.com/bukhari:4119","by":"al-Bukhārī"},{"t":"Ṣaḥīḥ al-Bukhārī 7352: the reward of the judge who strives and errs","u":"https://sunnah.com/bukhari:7352","by":"al-Bukhārī"}],"reads":[{"t":"Difference of Opinion: Where Do We Draw the Line?","u":"https://yaqeeninstitute.org/read/paper/difference-of-opinion-where-do-we-draw-the-line","by":"Nazir Khan (Yaqeen Institute)"},{"t":"Preserving Unity and Avoiding Division: A New Approach to the Ethics of Disagreement in Islam (free PDF)","u":"https://iiit.org/?p=42273","by":"Taha Jabir al-Alwani (IIIT)"},{"t":"Review of Exonerating the Distinguished Jurists: Ibn Taymiyyah's Rafʿ al-Malām in translation (al-Matroudi, Equinox, 2023)","u":"https://doi.org/10.1017/S0041977X24000466","by":"Bulletin of SOAS (Cambridge)"}],"projects":[{"n":"Cause-of-disagreement table","l":"Beginner","d":"Pick three well-known disputed rulings (e.g. raising the hands in prayer, reciting al-Fātiḥah behind the imam) and fill a table: the positions, the texts, and which of Ibn Taymiyyah's causes explains the split."},{"n":"Banū Qurayẓah note","l":"Beginner","d":"Write 300 words on what the ʿAṣr at Banū Qurayẓah report teaches about literal and purposive reading of a command, citing the text on sunnah.com."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth cited here with Arabic, English and grading."}],"section":"method"},{"id":"taqlid","title":"Following scholarship: taqlīd, ijtihād & the madhhabs","short":"Taqlīd & madhhabs","level":"Beginner","why":"Most Muslims are not mujtahids, so the tradition worked out how laypeople follow qualified scholars responsibly through the madhhabs.","mins":600,"pre":["ikhtilaf"],"ideas":["Ijtihād is a qualified jurist's full effort to derive a ruling from the evidence; taqlīd is accepting the ruling of a qualified mujtahid without examining his proof yourself. The Qurʾān's 'ask the people of knowledge if you do not know' (16:43) is the classic proof-text for the layperson.","Later jurists describe levels: the absolute mujtahid who founds a method, the mujtahid within a school, scholars who weigh opinions inside the school (tarjīḥ), and the muqallid. Most students and imams today work at the lower levels.","A madhhab is not just one imam's opinions but a method and a body of reviewed rulings refined over centuries. The four surviving Sunni schools are the Ḥanafī, Mālikī, Shāfiʿī and Ḥanbalī.","Whether a layperson must keep to one school is itself disputed: many later jurists required it for order and to prevent hunting for easy opinions, while others, including many earlier authorities, held that the layperson's school is that of the mufti he asks. Related questions are talfīq (combining views so that the result is valid in no single school) and tatabbuʿ al-rukhaṣ (hunting for easy opinions), which the scholars condemn."],"callout":["Method","Choose one school for your worship now and learn it from a teacher. Read Shāh Walī Allāh's history of how the schools formed and Ibn al-Qayyim's critique of blind taqlīd alongside al-Būṭī, and leave questions of switching or combining opinions to a qualified scholar."],"lectures":[{"t":"The Four Madhhabs: Introduction to the Schools of Islamic Law","u":"https://www.youtube.com/watch?v=ZbDG4fTI708","by":"Al-Salam Institute"},{"t":"Does One Have to Stick to One Madhhab Only?","u":"https://www.youtube.com/watch?v=9cB1fwhPM3I","by":"Faraz Rabbani (SeekersGuidance)"},{"t":"Which Scholar Should YOU Follow?","u":"https://www.youtube.com/watch?v=FwguxcBViLA","by":"Yasir Qadhi"}],"papers":[{"t":"Qurʾān 16:43 ('ask the people of remembrance')","u":"https://quran.com/16/43","by":"Qurʾān"},{"t":"al-Inṣāf fī Bayān Asbāb al-Ikhtilāf (Arabic)","u":"https://shamela.ws/book/422","by":"Shāh Walī Allāh al-Dihlawī (ed. ʿAbd al-Fattāḥ Abū Ghuddah; English: Marcia Hermansen, Shah Wali Allah's Treatises on Islamic Law, Fons Vitae, print)"},{"t":"Iʿlām al-Muwaqqiʿīn: the section on taqlīd, opening with the debate between a muqallid and a 'man of proof' (Arabic)","u":"https://shamela.ws/book/17798/1264","by":"Ibn Qayyim al-Jawziyyah (ed. Mashhūr Āl Salmān, vol. 3)"},{"t":"Why Does One Have to Follow a Madhhab? (one side of a modern debate: al-Būṭī's reply to al-Khujandī)","u":"https://masud.co.uk/ISLAM/nuh/buti.htm","by":"Muhammad Saʿid Ramadan al-Buti (trans. Nuh Ha Mim Keller)"}],"reads":[{"t":"What is a Madhhab? Exploring the Role of Islamic Schools of Law","u":"https://yaqeeninstitute.org/read/paper/what-is-a-madhhab-exploring-the-role-of-islamic-schools-of-law","by":"Emad Hamdeh (Yaqeen Institute)"},{"t":"Why Muslims Follow Madhhabs (argues for following one school)","u":"https://masud.co.uk/ISLAM/nuh/madhhabstlk.htm","by":"Nuh Ha Mim Keller"}],"projects":[{"n":"Levels of ijtihād chart","l":"Beginner","d":"Make a chart of the levels from absolute mujtahid to muqallid, with one historical example at each level and what each is permitted to do."},{"n":"Survey of positions","l":"Intermediate","d":"Write a 600-word survey of scholarly positions on whether a layperson must follow one madhhab, summarising al-Būṭī, Ibn al-Qayyim and Shāh Walī Allāh fairly in their own terms, to be reviewed by a teacher."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Check verses with several translations and classical tafsīr."}],"section":"method"},{"id":"p_imams","section":"history","title":"The Four Imams and the great ḥadīth masters","short":"Four Imams","level":"Intermediate","why":"The four founders of the surviving Sunni schools of law and the compilers of the six canonical ḥadīth books shaped almost every text a student will read, so knowing their lives, teachers and methods makes the later literature intelligible.","mins":900,"pre":["taqlid"],"ideas":["Abū Ḥanīfah al-Nuʿmān ibn Thābit (80–150 AH / 699–767 CE) studied in Kufa for about eighteen years with Ḥammād ibn Abī Sulaymān, heir to the legal tradition of Ibrāhīm al-Nakhaʿī and Ibn Masʿūd, and is known for disciplined use of qiyās and istiḥsān. Mālik ibn Anas (93–179 AH / 711–795 CE) learned in Madinah from Nāfiʿ the client of Ibn ʿUmar, Ibn Shihāb al-Zuhrī and Rabīʿat al-Raʾy, and compiled al-Muwaṭṭaʾ, which combines ḥadīth, Companions' reports and the practice (ʿamal) of the people of Madinah.","Muḥammad ibn Idrīs al-Shāfiʿī (150–204 AH / 767–820 CE) studied with Muslim ibn Khālid al-Zanjī in Makkah, with Mālik in Madinah and with Muḥammad al-Shaybānī in Baghdad; his al-Risālah is the first systematic work of uṣūl al-fiqh, and his rulings are divided into an earlier Iraqi and a later Egyptian doctrine (al-qadīm and al-jadīd). Aḥmad ibn Ḥanbal (164–241 AH / 780–855 CE) studied with Hushaym ibn Bashīr, Sufyān ibn ʿUyaynah, Wakīʿ and al-Shāfiʿī, compiled the Musnad of roughly 27,000 reports, and became the symbol of resistance in the Miḥnah.","The schools spread through students, judges and books rather than through the founders alone. Abū Yūsuf (d. 182 AH), chief judge under Hārūn al-Rashīd, and al-Shaybānī (d. 189 AH) made Ḥanafī law the law of the ʿAbbāsid courts and later of the Seljuk, Ottoman and Mughal states; Saḥnūn's al-Mudawwanah (Qayrawān, 3rd c. AH) carried Mālikī law to North and West Africa and al-Andalus; al-Muzanī and al-Rabīʿ al-Murādī spread Shāfiʿī law from Egypt to Syria, Yemen, East Africa and Southeast Asia; Abū Bakr al-Khallāl (d. 311 AH) gathered Aḥmad's scattered answers (masāʾil) into a Ḥanbalī corpus.","The six books came from one generation of ḥadīth critics. Al-Bukhārī (194–256 AH / 810–870 CE), a student of Aḥmad, ʿAlī ibn al-Madīnī and Isḥāq ibn Rāhawayh, and his student Muslim ibn al-Ḥajjāj (d. 261 AH / 875 CE) of Nishapur compiled the two Ṣaḥīḥs; Abū Dāwūd al-Sijistānī (d. 275 AH), al-Tirmidhī (d. 279 AH), al-Nasāʾī (d. 303 AH) and Ibn Mājah (d. 273 AH) arranged their Sunan by legal chapters for jurists, and their acceptance as a canon came gradually over the following centuries."],"callout":["Method","Make a timeline that places each imam and ḥadīth master with his teachers and students on one sheet. Seeing that al-Shāfiʿī studied with Mālik and taught Aḥmad, and that Aḥmad taught al-Bukhārī, removes the false picture of rival camps."],"lectures":[{"t":"The lives of the four Imams (9 episodes)","u":"https://www.youtube.com/playlist?list=PL9OPVukugS7y-iJAr037vaQtpI4n-JchZ","by":"Sh. Ali Hammuda"},{"t":"Siyar al-Aʾimmah al-Arbaʿah (Arabic)","u":"https://www.youtube.com/playlist?list=PLLHf-aTYo5FnFKkclhiPpN0VvKMHDyw3a","by":"Dr. Walīd al-Samāmʿah"},{"t":"Life of Imam Bukhari: an explanation of Kitāb al-Duʿāʾ from Ṣaḥīḥ al-Bukhārī, part 1","u":"https://www.youtube.com/watch?v=_gJYLhvG90E","by":"Dr. Yasir Qadhi"}],"papers":[{"t":"al-Muwaṭṭaʾ of Imām Mālik","u":"https://sunnah.com/malik","by":"Mālik ibn Anas (sunnah.com)"},{"t":"Ṣaḥīḥ Muslim: the Introduction (al-Muqaddimah)","u":"https://sunnah.com/muslim/introduction","by":"Muslim ibn al-Ḥajjāj (sunnah.com)"},{"t":"Musnad Aḥmad (selections)","u":"https://sunnah.com/ahmad","by":"Aḥmad ibn Ḥanbal (sunnah.com)"},{"t":"Ibn Khallikan's Biographical Dictionary, vol. 2 (entries on Mālik, al-Shāfiʿī and al-Bukhārī)","u":"https://archive.org/details/india.history.resource.41157","by":"Ibn Khallikān (tr. W. M. de Slane, 1843, public domain)"}],"reads":[{"t":"The Formation of the Sunni Schools of Law, 9th–10th Centuries C.E.","u":"https://archive.org/details/formationofsunni0000melc","by":"Christopher Melchert (borrowable)"},{"t":"The Origins and Evolution of Islamic Law","u":"https://archive.org/details/originsevolution0000hall","by":"Wael B. Hallaq (borrowable)"}],"projects":[{"n":"Teacher-student chart","l":"Intermediate","d":"Draw a chart linking the four imams, the six ḥadīth compilers and at least two teachers and two students of each, with death dates in AH and CE. Check every link against Ibn Khallikān or al-Dhahabī."},{"n":"School spread map","l":"Intermediate","d":"On a blank map, mark where each madhhab became dominant and write one sentence per region naming the student, judge or book that carried it there."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the Muwaṭṭaʾ, the Musnad and the six books in Arabic and English."}]}]},{"id":"aqidah","title":"ʿAqīdah: core Sunni creed","level":"Beginner","intro":"A month on the shared Sunni creed through al-Ṭaḥāwī's text, then the central questions of tawḥīd, decree and the divine attributes, and how the Atharī, Ashʿarī and Māturīdī schools answer them.","phase":5,"optional":false,"topics":[{"id":"tahawi","title":"Core Sunni creed: al-ʿAqīdah al-Ṭaḥāwiyyah","short":"Ṭaḥāwiyyah","level":"Beginner","why":"The Ṭaḥāwiyyah is a short creed accepted as a statement of Sunni belief by Atharīs, Ashʿarīs and Māturīdīs alike, which makes it the best common starting text.","mins":720,"pre":["ilm"],"ideas":["Abū Jaʿfar al-Ṭaḥāwī (d. 321/933), an Egyptian Ḥanafī jurist and ḥadīth scholar, states that he records the creed of Abū Ḥanīfah, Abū Yūsuf and Muḥammad al-Shaybānī. The text is a list of brief statements without long arguments.","It covers God's oneness and transcendence, the Qurʾān as God's uncreated speech, the vision of God in Paradise, prophethood and the finality of Muḥammad ﷺ, the decree, the unseen (the Throne, the Pen, the Bridge, intercession), the Companions and obedience to rulers.","It defines īmān as affirmation by the tongue and assent of the heart, the Ḥanafī position. Atharīs define it as belief, speech and action; most Ashʿarīs define it as assent of the heart (taṣdīq), with deeds belonging to its perfection, though some Ashʿarīs adopt the ahl al-ḥadīth wording. It also refuses to declare a Muslim an unbeliever for a sin unless he deems it lawful, against the Khawārij.","The text is read through different commentaries. Ibn Abī al-ʿIzz (d. 792/1390) wrote an influential commentary from an Atharī angle drawing on Ibn Taymiyyah, while many Ḥanafī-Māturīdī scholars wrote commentaries reading the same lines through kalām."],"callout":["Method","Memorise the text in short sections. For each, write the creed point in one line and note which group it answers (Muʿtazilah, Jahmiyyah, Khawārij, Murjiʾah, Qadariyyah)."],"lectures":[{"t":"Aqidah al-Tahawiyyah (2007)","u":"https://www.youtube.com/watch?v=N5Xyt3xRJr8","by":"Hamza Yusuf (ShaykhHamza.com)"},{"t":"The Islamic Creed according to Imam Tahawi's book (series)","u":"https://www.youtube.com/playlist?list=PLgcTs9YAg99_h3Qe165hUG1yHkLRytGRt","by":"Muhammad al-Yaqoubi"}],"papers":[{"t":"al-ʿAqīdah al-Ṭaḥāwiyyah: Arabic text with English translation","u":"https://www.abuaminaelias.com/aqeedah-tahawiyyah/","by":"al-Ṭaḥāwī (trans. Abu Amina Elias)"},{"t":"The Creed of Imam al-Ṭaḥāwī (print, with Arabic and notes)","u":"https://www.meccabooks.com/products/the-creed-of-imam-al-tahawi","by":"al-Ṭaḥāwī (trans. Hamza Yusuf), print"}],"reads":[{"t":"The Cambridge Companion to Classical Islamic Theology: Introduction","u":"https://www.cambridge.org/core/books/abs/cambridge-companion-to-classical-islamic-theology/introduction/777CB6B6F8531053630973346390DE1B","by":"Tim Winter (ed.), Cambridge University Press"},{"t":"The Muslim Creed: Its Genesis and Historical Development","u":"https://archive.org/details/WensinckMc1932","by":"A. J. Wensinck (1932)"}],"projects":[{"n":"Creed outline","l":"Beginner","d":"Group the Ṭaḥāwiyyah's statements under six headings (God, revelation, prophets, the unseen, īmān, community) in a one-page outline with paragraph numbers."},{"n":"Commentary comparison","l":"Intermediate","d":"Choose three statements (e.g. on īmān, the vision of God, the Throne) and write a short note on how an Atharī commentary and a Māturīdī commentary explain each."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Check verses with several translations and classical tafsīr."}],"section":"aqidah"},{"id":"tawhid","title":"Tawḥīd and īmān","short":"Tawḥīd & īmān","level":"Beginner","why":"Tawḥīd is the centre of Islamic belief, and the definition of īmān decides how Muslims judge faith, sin and unbelief.","mins":600,"pre":["tahawi"],"ideas":["Atharī scholars, especially after Ibn Taymiyyah, divide tawḥīd into rubūbiyyah (God alone creates and governs), ulūhiyyah (God alone is worshipped) and al-asmāʾ wa al-ṣifāt (God's names and attributes). Kalām theologians usually speak of oneness in essence, attributes and acts.","The Ḥadīth of Jibrīl sets out islām (the five pillars), īmān (belief in God, His angels, books, messengers, the Last Day and the decree) and iḥsān (worshipping God as though you see Him).","Atharīs define īmān as belief, speech and action that increases and decreases. Most Ashʿarīs define it as assent of the heart (taṣdīq), with deeds as its completion; Ḥanafī-Māturīdī scholars define it as assent and confession and hold that it does not increase or decrease in substance. All agree that sinners remain Muslims and that deeds matter for salvation.","Shirk, associating partners with God in His lordship, worship or attributes, is the gravest sin. The Sunni middle way rejects both the Khawārij, who expelled sinners from Islam, and the extreme Murjiʾah, who said sin does not harm faith."],"callout":["Pitfall","Do not turn terminology into a test of faith. The threefold division and the kalām formulation are teaching tools; learn what each school means before judging it."],"lectures":[{"t":"Kitaab At-Tawheed (complete series)","u":"https://www.youtube.com/playlist?list=PL_u0J0sW_WiMq6gWSKu89V2vDcAVtNrtP","by":"Yasir Qadhi (uploaded by Abu Bilaal)"},{"t":"The Branches of Faith (Ramadan series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctVcI9uVCcxiniU2J0MhumDA","by":"Yasir Qadhi"}],"papers":[{"t":"The Foundations of the Articles of Faith (Iḥyāʾ, Book 2)","u":"https://ghazali.org/works/gz-faith.htm","by":"al-Ghazālī (trans. Nabih Amin Faris)"},{"t":"The Ḥadīth of Jibrīl (Forty Ḥadīth, no. 2)","u":"https://sunnah.com/nawawi40:2","by":"al-Nawawī"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Tawḥīd","u":"https://sunnah.com/bukhari/97","by":"al-Bukhārī"},{"t":"Sūrat al-Ikhlāṣ (112)","u":"https://quran.com/112","by":"Qurʾān"}],"reads":[{"t":"The Muslim Creed (includes the Fiqh Akbar texts and the Waṣiyyah of Abū Ḥanīfah)","u":"https://archive.org/details/WensinckMc1932","by":"A. J. Wensinck (1932)"},{"t":"Kalam","u":"https://www.britannica.com/topic/kalam-Islam","by":"Encyclopaedia Britannica"}],"projects":[{"n":"Definitions sheet","l":"Beginner","d":"On one page, give the Atharī, Ashʿarī and Ḥanafī-Māturīdī definitions of īmān with a source for each, and list three points all three agree on."},{"n":"Ḥadīth of Jibrīl study","l":"Beginner","d":"Write a 500-word study of the Ḥadīth of Jibrīl showing how it organises islām, īmān and iḥsān, with one Qurʾānic verse for each of the six articles of faith."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth cited here with Arabic, English and grading."},{"r":"Quran.com","u":"https://quran.com/","d":"Check verses with several translations and classical tafsīr."}],"section":"aqidah"},{"id":"aq_asma","title":"The Names of Allah (al-Asmāʾ al-Ḥusnā)","short":"Names of Allah","level":"Beginner","section":"aqidah","why":"Knowing Allah through the names He gave Himself is the heart of tawḥīd, and it shapes how a Muslim prays, asks and lives.","mins":1500,"pre":["tawhid","fa_aqidah"],"ideas":["The Prophet ﷺ said that Allah has ninety-nine names and whoever 'enumerates' (aḥṣā) them enters Paradise (al-Bukhārī 2736, Muslim 2677). Classical commentators such as al-Khaṭṭābī explain aḥṣāhā as learning them, understanding their meanings and acting on them. The names are not limited to ninety-nine: another report has the Prophet ﷺ ask by every name Allah 'kept in the knowledge of the unseen'. The well-known list of ninety-nine in al-Tirmidhī is judged by many ḥadīth critics, including Ibn Taymiyyah and Ibn Ḥajar, to be a narrator's addition rather than the Prophet's words.","Sunni scholars hold that the names are tawqīfī: established only by the Qurʾān and authentic Sunnah, not coined by reason or analogy. Many distinguish a name (ism), which needs a text, from a description (waṣf) or an act reported of Allah, which does not automatically make a name. Ibn al-Qayyim adds that each name both identifies Allah and implies an attribute, and that some names are only praised when paired, such as al-Muʿṭī with al-Māniʿ.","Sunni schools agree that the names are real and perfect, and differ on how to treat the attributes they imply. Atharīs affirm every attribute with its apparent meaning while denying any likeness to creation and any question of 'how'. Ashʿarīs and Māturīdīs build on the attributes of meaning (knowledge, power, will, life, hearing, sight, speech, and for Māturīdīs takwīn), and for names that seem to imply bodily qualities they either consign the meaning to Allah (tafwīḍ) or give a fitting interpretation (taʾwīl). Each side states its own view best, so read them in their own words.","The names are meant to change worship. The Qurʾān commands 'call on Him by them' (7:180), so the believer asks for mercy by al-Raḥmān and for forgiveness by al-Ghafūr. al-Ghazālī's al-Maqṣad al-Asnā gives, for each name, the servant's share (ḥaẓẓ al-ʿabd): for example, knowing al-Ḥalīm teaches forbearance. Al-Saʿdī's short commentary ties each name to the hope, fear and love it should produce."],"callout":["Method","Take one or two names a week: find them in the Qurʾān, read one classical explanation, and note one change in your duʿāʾ. When you meet Atharī and Ashʿarī explanations of the same name, record both fairly before forming a view with a teacher."],"lectures":[{"t":"Allah's Names: The Name I Need (Ramadan 2026 series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhH0KWBrGxxR-lCCwlTFIVbm","by":"Omar Suleiman (Yaqeen Institute)"},{"t":"Allah's Names & How to Use Them","u":"https://www.youtube.com/playlist?list=PLTgDm4XwxaRKfD_SWnm-L790_Dh4kIDNY","by":"Mufti Abdur-Rahman ibn Yusuf Mangera (ZamZam Academy)"},{"t":"Explanation of the Beautiful Names of Allah","u":"https://www.youtube.com/playlist?list=PLo8-JRSO3j93SMfqIKUrlCrn29VJdF9Ox","by":"Muhammad Tim Humble (KALEMAH)"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī 2736: Allah has ninety-nine names","u":"https://sunnah.com/bukhari:2736","by":"al-Bukhārī (sunnah.com)"},{"t":"The Ninety-Nine Beautiful Names of God (al-Maqṣad al-Asnā) (print)","u":"https://www.its.org.uk/product/al-ghazali-on-the-ninety-nine-beautiful-names-of-god/","by":"al-Ghazālī (tr. David B. Burrell and Nazih Daher), Islamic Texts Society"},{"t":"Tafsīr Asmāʾ Allāh al-Ḥusnā (Arabic)","u":"https://shamela.ws/book/10090","by":"ʿAbd al-Raḥmān al-Saʿdī (comp. ʿUbayd al-ʿUbayd), al-Maktabah al-Shāmilah"},{"t":"Qurʾān 7:180 with Tafsīr Ibn Kathīr (call on Him by His names)","u":"https://quran.com/7:180/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"}],"reads":[{"t":"Understanding the Qurʾān Through the Names of Allah","u":"https://yaqeeninstitute.org/read/paper/approaching-the-quran-through-the-names-of-allah","by":"Yaqeen Institute"},{"t":"The Divine Wisdom Behind the Pairing of Allah's Names in the Qurʾān","u":"https://yaqeeninstitute.org/read/paper/the-divine-wisdom-behind-the-pairing-of-allahs-names-in-the-quran","by":"Yaqeen Institute"},{"t":"Mercy and Might on Judgment Day: Allah's Name Māliki Yawm al-Dīn","u":"https://yaqeeninstitute.org/read/paper/mercy-and-might-on-judgment-day-allahs-name-maliki-yawn-al-din","by":"Yaqeen Institute"}],"projects":[{"n":"Name journal","l":"Beginner","d":"For ten names, write one page each: the Arabic root, two verses where the name occurs, al-Ghazālī's 'servant's share' and al-Saʿdī's explanation, and one duʿāʾ you will make by that name."},{"n":"Two readings, one name","l":"Intermediate","d":"Choose a name that implies an attribute discussed between the schools (for example al-ʿAlī or al-Raḥmān) and write a one-page table setting out the Atharī and the Ashʿarī/Māturīdī explanations, each in its own scholars' words and with sources."}],"repos":[{"r":"Quran.com","u":"https://quran.com","d":"Find each name in context and read Ibn Kathīr and al-Saʿdī on the verse."}]},{"id":"aq_angels","title":"Angels, jinn and the revealed books","short":"Angels, jinn, books","level":"Beginner","section":"aqidah","why":"Belief in angels and in the revealed books are pillars of faith, and the jinn are part of the unseen that the Qurʾān describes, so each must be learned from revelation rather than folklore.","mins":600,"pre":["fa_aqidah"],"ideas":["Angels are created from light, jinn from smokeless fire and Ādam from clay (Muslim 2996). Angels do not disobey Allah (66:6) and are neither daughters of Allah nor gendered as the pagans claimed (43:19). Some are named in the Qurʾān or authentic ḥadīth, such as Jibrīl, Mīkāʾīl, Mālik and Hārūt and Mārūt; the popular name ʿIzrāʾīl for the angel of death is not in authentic texts.","Jinn are a responsible creation (51:56) with believers and disbelievers among them (72:11–14), who see humans while humans do not normally see them (7:27). Most scholars hold that Iblīs was of the jinn (18:50), while some early reports, attributed to Ibn ʿAbbās among others, counted him among the angels.","Muslims believe in every book Allah revealed: the scrolls of Ibrāhīm and Mūsā, the Tawrāh, the Zabūr, the Injīl and the Qurʾān (87:18–19), which confirms and stands guard over them (5:48). Scholars differed on the alteration (taḥrīf) of earlier scriptures: al-Bukhārī glossed it as misinterpretation, Ibn Ḥazm argued for extensive textual change, and Ibn Taymiyyah held that some wording changed while much remained.","Knowledge of the unseen comes only from revelation, so reports must be checked. Works such as al-Suyūṭī's al-Ḥabāʾik fī Akhbār al-Malāʾik gather many weak reports and Isrāʾīliyyāt, and the Prophet ﷺ taught neither to affirm nor deny what the People of the Book relate (Bukhārī 4485)."],"callout":["Method","For each named angel or claim about the jinn, write down whether it comes from the Qurʾān, an authentic ḥadīth, a weak report or later lore. This one habit prevents most errors in this topic."],"lectures":[{"t":"Angels in Your Presence (Ramadan series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhF2LFN-3QxnuregEv1oKPIc","by":"Omar Suleiman (Yaqeen Institute)"},{"t":"The Reality of Jinn in the Qur'an and Sunnah","u":"https://www.youtube.com/watch?v=ZzhSwxJQAFU","by":"Yasir Qadhi"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Beginning of Creation (angels, jinn, Iblīs)","u":"https://sunnah.com/bukhari/59","by":"al-Bukhārī (sunnah.com)"},{"t":"Sūrat al-Jinn (72)","u":"https://quran.com/72","by":"The Qurʾān (quran.com)"},{"t":"al-Ḥabāʾik fī Akhbār al-Malāʾik (Arabic; check each report's grading)","u":"https://shamela.ws/book/21944","by":"Jalāl al-Dīn al-Suyūṭī (al-Maktabah al-Shāmilah)"},{"t":"Ākām al-Marjān fī Aḥkām al-Jānn (Arabic)","u":"https://shamela.ws/book/6451","by":"Badr al-Dīn al-Shiblī (al-Maktabah al-Shāmilah)"}],"reads":[{"t":"Do You Really Believe in Angels? (In Pursuit of Conviction III)","u":"https://yaqeeninstitute.org/read/paper/in-pursuit-of-conviction-iii-do-you-really-believe-in-angels","by":"Zohair Abdul-Rahman (Yaqeen Institute)"},{"t":"The Qurʾān's Engagement with Christian and Jewish Literature","u":"https://yaqeeninstitute.org/read/paper/the-qurans-engagement-with-christian-and-jewish-literature","by":"Taha Soomro (Yaqeen Institute)"}],"projects":[{"n":"Index of named angels","l":"Beginner","d":"Build an index of every named angel and angelic role you meet, with the exact source for each, marked as Qurʾān, authentic ḥadīth, weak report or later lore."},{"n":"The earlier scriptures in the Qurʾān","l":"Beginner","d":"Collect the verses on the Tawrāh and Injīl (for example 2:79, 3:3, 5:43–48) and write one page summarizing what they say and the classical views on taḥrīf, with sources."}],"repos":[{"r":"quran.com","u":"https://quran.com","d":"Read the verses on angels, jinn and earlier scriptures with translation and tafsīr."},{"r":"sunnah.com","u":"https://sunnah.com","d":"Check the source and grading of ḥadīths about angels and jinn."}]},{"id":"qadar","title":"Qadar: divine decree and human choice","short":"Qadar","level":"Intermediate","why":"Belief in the decree is one of the six articles of faith, and how it fits with human responsibility was one of the first theological debates in Islam.","mins":480,"pre":["tawhid"],"ideas":["Many Sunni teachers present qadar in four levels: God's knowledge of all things, His writing of them, His will that whatever He wills happens, and His creating of all things including human acts.","The early Qadariyyah, and later the Muʿtazilah, held that humans create their own acts so that God is not the author of evil. The Jabriyyah held that humans are compelled. Sunni schools reject both and affirm real human choice within God's decree.","Ashʿarī theologians explain human agency through kasb (acquisition): God creates the act and the person acquires it. Māturīdī theologians give the human choice (ikhtiyār) a larger role, and Atharīs speak of God creating the person's will and power as real causes.","Qadar is not an excuse for sin. When the Companions asked whether to rely on what is written and stop acting, the Prophet ﷺ answered: 'Act, for each is eased toward what he was created for.'"],"callout":["Method","Keep two questions apart: the theological question (how decree and choice relate) and the practical one (how to act, repent and accept hardship). The ḥadīth answer the second very directly."],"lectures":[{"t":"Branches of Faith, Part 13: Belief in Qadr","u":"https://www.youtube.com/watch?v=d2SwI_pNIII","by":"Yasir Qadhi (Memphis Islamic Center)"},{"t":"Is Everything We Do Predestined or Do We Have Free Will?","u":"https://www.youtube.com/watch?v=cYJiEx2NlVg","by":"Yasir Qadhi"}],"papers":[{"t":"Ṣaḥīḥ Muslim, Book of Destiny (Kitāb al-Qadar)","u":"https://sunnah.com/muslim/46","by":"Muslim ibn al-Ḥajjāj"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Divine Will (al-Qadar)","u":"https://sunnah.com/bukhari/82","by":"al-Bukhārī"},{"t":"The Foundations of the Articles of Faith (sections on God's will and acts)","u":"https://ghazali.org/works/gz-faith.htm","by":"al-Ghazālī (trans. Nabih Amin Faris)"}],"reads":[{"t":"Predestination vs. Free Will in Islam: Understanding Allah's Qadr","u":"https://yaqeeninstitute.org/read/paper/predestination-vs-free-will-in-islam-understanding-allahs-qadr","by":"Yaqeen Institute"},{"t":"Conscious or coerced: Divine decree in Islam","u":"https://yaqeeninstitute.org/curriculum/principles-of-faith/divine-decree-in-islam","by":"Yaqeen Institute curriculum"}],"projects":[{"n":"Five positions table","l":"Intermediate","d":"Make a table of the Qadariyyah/Muʿtazilah, Jabriyyah, Ashʿarī, Māturīdī and Atharī positions on who creates human acts, with one key term and one source for each."},{"n":"Ḥadīth commentary","l":"Intermediate","d":"Write 500 words on the debate of Ādam and Mūsā (Bukhārī 6614), explaining why scholars say it concerns blame after repentance, not an excuse for sin."}],"repos":[{"r":"Sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth cited here with Arabic, English and grading."}],"section":"aqidah"},{"id":"sifat","title":"Divine attributes: tafwīḍ, taʾwīl and tashbīh","short":"Divine attributes","level":"Intermediate","why":"How to read texts that describe God's hand, face, descent or rising over the Throne is the main point of difference between Sunni theological schools.","mins":600,"pre":["tawhid"],"ideas":["All Sunni schools reject two errors: tashbīh or tajsīm (likening God to creation or making Him a body) and taʿṭīl (stripping God of the attributes He affirms for Himself). Qurʾān 42:11, 'There is nothing like Him, and He is the All-Hearing, the All-Seeing', holds both sides together.","Tafwīḍ means affirming the text while consigning its precise meaning to God, without asking how. Many early scholars and later Ashʿarīs and Māturīdīs held this; al-Ghazālī's Iljām al-ʿAwāmm defends it as the right way for non-specialists.","Taʾwīl means interpreting a text in a sense the Arabic allows that fits God's transcendence, for example reading 'hand' as power or favour. Later Ashʿarīs and Māturīdīs allowed it, mainly to answer anthropomorphism.","Atharī scholars such as Ibn Taymiyyah and Ibn al-Qayyim affirm the attributes with their apparent meaning but without likeness or 'how' (bilā kayf), and reject both taʾwīl and a tafwīḍ that leaves the words without meaning. Ibn Qudāmah's wording in Lumʿat al-Iʿtiqād is read by some as tafwīḍ and by others as affirmation. The saying ascribed to Mālik, 'the rising is known and its how is unknown', is quoted by all sides."],"callout":["Pitfall","Do not learn this topic from polemical clips. Read each school's own statement of its view first, and note that each one accuses the others of the very errors it seeks to avoid."],"lectures":[{"t":"Branches of Faith, Part 9: Names & Attributes of Allah","u":"https://www.youtube.com/watch?v=p_dtyUrfqMU","by":"Yasir Qadhi (Memphis Islamic Center)"},{"t":"Affirming the Divine Attributes: Between the Ashʿarites and Others","u":"https://www.youtube.com/watch?v=JQbpj4rI0eI","by":"Ali Gomaa (al-Azhar lectures, translated)"}],"papers":[{"t":"Qurʾān 42:11 ('There is nothing like Him')","u":"https://quran.com/42/11","by":"Qurʾān"},{"t":"Iljām al-ʿAwāmm ʿan ʿIlm al-Kalām (Arabic)","u":"http://www.ghazali.org/works/iljam.pdf","by":"al-Ghazālī"},{"t":"al-ʿAqīdah al-Wāsiṭiyyah: Arabic text with English translation","u":"https://abuaminaelias.com/al-aqeedah-al-wasitiyyah-by-ibn-taymiyyah/","by":"Ibn Taymiyyah (trans. Abu Amina Elias)"}],"reads":[{"t":"Tashbīh","u":"https://www.britannica.com/topic/tashbih","by":"Encyclopaedia Britannica"},{"t":"Ašʿarīya","u":"https://www.iranicaonline.org/articles/ashariya/","by":"Encyclopaedia Iranica"}],"projects":[{"n":"Three readings of one verse","l":"Intermediate","d":"Take Qurʾān 20:5 (the Throne) and write how a mufawwiḍ, a muʾawwil and an Atharī would each explain it, quoting a classical source for each."},{"n":"Glossary","l":"Beginner","d":"Write a glossary of ten terms (tashbīh, tajsīm, taʿṭīl, tafwīḍ, taʾwīl, ithbāt, bilā kayf, ṣifāt dhātiyyah, ṣifāt fiʿliyyah, mutashābih) with one-line definitions."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Check verses with several translations and classical tafsīr."}],"section":"aqidah"},{"id":"schools","title":"Sunni theological schools: Atharī, Ashʿarī, Māturīdī","short":"Sunni schools","level":"Intermediate","why":"Knowing the history and main differences of the three Sunni schools lets the learner read classical works accurately and discuss creed without sectarian confusion.","mins":600,"pre":["sifat","qadar"],"ideas":["The Atharī (traditionalist) school, associated with Aḥmad ibn Ḥanbal and later Ibn Qudāmah and Ibn Taymiyyah, takes creed from the Qurʾān, Sunnah and the early generations and is wary of kalām. It is dominant among Ḥanbalīs.","The Ashʿarī school follows Abū al-Ḥasan al-Ashʿarī (d. 324/935-6), a former Muʿtazilī who defended Sunni positions with rational argument. It was developed by al-Bāqillānī, al-Juwaynī, al-Ghazālī and al-Rāzī and spread mainly among Shāfiʿīs and Mālikīs.","The Māturīdī school follows Abū Manṣūr al-Māturīdī (d. 333/944) of Samarqand and became the main creed of Ḥanafīs. It differs from the Ashʿarīs on a small number of points, such as the ability of reason to know good and evil, the eternal attribute of bringing into being (takwīn), and saying 'I am a believer, God willing'.","The authorship and dating of al-Ashʿarī's al-Ibānah, which reads close to Atharī positions, are debated. Historically the three schools often recognised each other as Ahl al-Sunnah, while disputing sharply over the attributes and the use of kalām."],"callout":["Method","Build a comparison grid with rows for key questions (attributes, the Qurʾān as speech, human acts, reason and ethics, īmān) and fill each cell only from a primary text or a reliable academic summary."],"lectures":[{"t":"What Are the Differences Between Salafism and Ashʿarism? (Ask Shaykh YQ #140)","u":"https://www.youtube.com/watch?v=zIL-TMe5N0A","by":"Yasir Qadhi"},{"t":"Ashʿaria and Maturidi","u":"https://www.youtube.com/watch?v=E3ZO4HNeC_Y","by":"Umar Faruq Abd-Allah"},{"t":"Essentials of Islamic Beliefs: Ūshī's Badʾ al-Amālī Explained","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5He7OdfILDac7ATBXa9Nxac","by":"Faraz Rabbani (SeekersGuidance)"}],"papers":[{"t":"The Muslim Creed (Fiqh Akbar I and II, Waṣiyyat Abī Ḥanīfah, with study)","u":"https://archive.org/details/WensinckMc1932","by":"A. J. Wensinck (1932)"},{"t":"The Foundations of the Articles of Faith (an Ashʿarī creed)","u":"https://ghazali.org/works/gz-faith.htm","by":"al-Ghazālī (trans. Nabih Amin Faris)"},{"t":"al-ʿAqīdah al-Wāsiṭiyyah (an Atharī creed)","u":"https://abuaminaelias.com/al-aqeedah-al-wasitiyyah-by-ibn-taymiyyah/","by":"Ibn Taymiyyah (trans. Abu Amina Elias)"}],"reads":[{"t":"Ašʿarī, Abu'l-Ḥasan","u":"https://www.iranicaonline.org/articles/asari-abul-hasan-ali-b/","by":"C. E. Bosworth (Encyclopaedia Iranica)"},{"t":"Ashʿariyyah","u":"https://www.britannica.com/topic/Ashariyyah","by":"Encyclopaedia Britannica"},{"t":"Māturīdiyyah","u":"https://www.britannica.com/topic/Maturidiyah","by":"Encyclopaedia Britannica"}],"projects":[{"n":"Comparison grid","l":"Intermediate","d":"Complete a five-row grid comparing the Atharī, Ashʿarī and Māturīdī answers on attributes, the Qurʾān, human acts, reason and ethics, and īmān, with one citation per cell."},{"n":"Biographical sketches","l":"Beginner","d":"Write 200-word sketches of al-Ashʿarī, al-Māturīdī and Aḥmad ibn Ḥanbal: dates, city, key works, and the problem each was responding to."}],"repos":[],"section":"aqidah"},{"id":"aq_iman_kufr","title":"Īmān and kufr: takfīr and its conditions","short":"Īmān, kufr, takfīr","level":"Intermediate","section":"aqidah","why":"Declaring a Muslim an unbeliever has grave consequences, and classical scholars hedged it with conditions and impediments precisely because the Khawārij showed how much harm careless takfīr does.","mins":840,"pre":["tahawi","tawhid"],"ideas":["Kufr includes denial, arrogant refusal, doubt and hypocrisy. Scholars also speak of a 'lesser kufr' (kufr dūna kufr, after Ibn ʿAbbās on 5:44) for sins called kufr in the texts that do not take a person out of Islam. Ahl al-Sunnah agree that a Muslim does not become an unbeliever by a major sin unless he holds it lawful, against the Khawārij, who made major sins kufr, and the Muʿtazilah, who placed the sinner between belief and unbelief.","Scholars distinguish judging a statement or act to be kufr in general from judging a specific person a kāfir. Ibn Taymiyyah stressed that the second requires conditions and the absence of impediments: knowledge rather than ignorance, intention rather than slip of the tongue (the man who said in joy 'You are my servant and I am your Lord', Muslim), free choice rather than coercion (16:106), and no plausible interpretation (taʾwīl).","In Fayṣal al-Tafriqah al-Ghazālī defines unbelief as calling the Prophet ﷺ a liar in anything he brought, and urges restraint toward anyone who prays toward the qiblah and interprets texts by recognized rules, since wrongly sparing many is lighter than wrongly shedding one Muslim's blood. Takfīr of an individual, with its effects on marriage, inheritance and life, belongs to qualified judges and scholars after the proof has been established.","The Khawārij emerged after Ṣiffīn (37 AH), declaring ʿAlī and others unbelievers over the arbitration. The Prophet ﷺ described people who recite the Qurʾān without it passing their throats (Bukhārī), and warned that calling a brother 'kāfir' returns to one of them (Bukhārī 6104). Most scholars did not declare the Khawārij themselves unbelievers, a reminder that even severe error was judged with care."],"callout":["Pitfall","Chapters on apostasy (riddah) in the fiqh manuals and lists of 'nullifiers' are addressed to judges and muftīs, not to individuals judging their neighbours. Read them alongside the conditions and impediments, never on their own."],"lectures":[{"t":"Explanation of The Book of Īmān of Abū ʿUbayd","u":"https://www.youtube.com/watch?v=XxbJLjb5RUo","by":"Hatem al-Haj"},{"t":"Lives of the Sahaba 36: ʿAlī pt. 7, the Khawārij","u":"https://www.youtube.com/watch?v=uiwDEEpKslE","by":"Yasir Qadhi (Memphis Islamic Center)"}],"papers":[{"t":"Kitāb al-Īmān (Arabic, ed. al-Albānī)","u":"https://shamela.ws/book/11316","by":"Abū ʿUbayd al-Qāsim ibn Sallām (al-Maktabah al-Shāmilah)"},{"t":"On the Boundaries of Theological Tolerance in Islam: al-Ghazālī's Fayṣal al-Tafriqa (library loan)","u":"https://archive.org/details/onboundariesofth0001jack","by":"al-Ghazālī (trans. Sherman A. Jackson, Oxford University Press, 2002)"},{"t":"al-Iʿlām bi-Qawāṭiʿ al-Islām (Arabic, Shāfiʿī)","u":"https://shamela.ws/book/13644","by":"Ibn Ḥajar al-Haytamī (al-Maktabah al-Shāmilah)"},{"t":"Ṣaḥīḥ al-Bukhārī 6104: whoever calls his brother a kāfir","u":"https://sunnah.com/bukhari:6104","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"The Islamic Doctrine of Takfīr (Excommunication): Tracing its Historical Development in the Thought of Ibn Ḥanbal, Ibn Taymiyya, and Muḥammad Ibn ʿAbd al-Wahhāb","u":"https://journalofislamiclaw.com/current/article/view/nakissa","by":"Aria Nakissa (Journal of Islamic Law)"},{"t":"The Amman Message (2005): the three points on madhhabs, takfīr and fatwas","u":"https://ammanmessage.com/","by":"Amman Message official site"},{"t":"Difference of Opinion: Where Do We Draw the Line?","u":"https://yaqeeninstitute.org/read/paper/difference-of-opinion-where-do-we-draw-the-line","by":"Nazir Khan (Yaqeen Institute)"}],"projects":[{"n":"Conditions and impediments table","l":"Intermediate","d":"Tabulate the conditions and impediments of takfīr as given by Ibn Taymiyyah and al-Ghazālī, with a Qurʾān verse or ḥadīth supporting each and the page reference."},{"n":"Khawārij case study","l":"Intermediate","d":"Write a 600-word study of the Khawārij: their arguments, the replies of ʿAlī and Ibn ʿAbbās, and how later scholars judged them, with references."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read the ḥadīths on the Khawārij and on calling Muslims unbelievers in their full chapters."}]},{"id":"akhirah","title":"The unseen and the Hereafter (al-ghayb and al-ākhirah)","short":"The Hereafter","level":"Beginner","section":"aqidah","why":"Belief in the unseen and the Last Day is a pillar of faith, and knowing what the sound texts say, and do not say, protects against both doubt and folklore.","mins":900,"pre":["tawhid"],"ideas":["Al-ghayb is what the senses cannot reach, and the believers are praised for believing in it (Q 2:3). Knowledge of it comes only from revelation, so Ahl al-Sunnah affirm what the Qurʾān and authentic ḥadīth state about angels, the grave and the Hour, and refrain from adding details without evidence.","After death the soul enters the barzakh. Sunni creeds, such as al-Ṭaḥāwiyyah, affirm the questioning in the grave by two angels (named Munkar and Nakīr in a ḥadīth in al-Tirmidhī) and its bliss or punishment, citing Q 40:46 and many ḥadīth. Some Muʿtazilīs denied the punishment of the grave.","The signs of the Hour are minor (many already passed, such as the Prophet's ﷺ own coming) and major. A ḥadīth in Ṣaḥīḥ Muslim lists ten major signs, including the smoke, the Dajjāl, the beast, the sun rising from the west, the descent of ʿĪsā, and Yaʾjūj and Maʾjūj. Scholars warn against forcing these texts onto current events.","The Day of Resurrection includes the blowing of the trumpet, the gathering, the books of deeds, the scales (mīzān), the bridge (ṣirāṭ), the Prophet's ﷺ basin (ḥawḍ) and intercession (shafāʿah), followed by Paradise or Hell. Ahl al-Sunnah hold that the believers will see Allah, and that believers who committed major sins will not remain in Hell forever, unlike the Khawārij and Muʿtazilah."],"callout":["Pitfall","Popular sermons on death and the Hour often use weak or invented reports. Check every narration's grading on sunnah.com or with a teacher before you repeat it."],"lectures":[{"t":"Understanding the traditions of the signs of Judgement Day (series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctVjKA2ulHYeZsnuI_tieZoc","by":"Yasir Qadhi"},{"t":"The life in the barzakh (series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctVw0HhfP7N02hNlScC-3UhN","by":"Yasir Qadhi"},{"t":"The Other Side: barzakh and beyond (Ramadan series 2025)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhEw1lGauK0-NKXqcCDlWtq7","by":"Omar Suleiman / Yaqeen Institute"}],"papers":[{"t":"The Remembrance of Death and the Afterlife: Iḥyāʾ Book XL (library loan)","u":"https://archive.org/details/remembranceofdea0000ghaz","by":"al-Ghazālī (tr. T. J. Winter)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Softening the Heart (Kitāb al-Riqāq)","u":"https://sunnah.com/bukhari/81","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ Muslim, Book of Tribulations and Portents of the Last Hour","u":"https://sunnah.com/muslim/54","by":"Muslim ibn al-Ḥajjāj (sunnah.com)"},{"t":"al-Tadhkirah bi-Aḥwāl al-Mawtā wa Umūr al-Ākhirah (Arabic)","u":"https://shamela.ws/book/30031","by":"al-Qurṭubī, al-Maktabah al-Shāmilah"}],"reads":[{"t":"The Minor Resurrection: What Happens after Death (Islamic Creed Series 5, print)","u":"https://iiph.com/?p=24906","by":"Umar S. al-Ashqar (tr. Nasiruddin al-Khattab), IIPH"},{"t":"The Islamic Understanding of Death and Resurrection (library loan)","u":"https://archive.org/details/islamicunderstan0000smit","by":"Jane I. Smith and Yvonne Y. Haddad"},{"t":"Mercy and Might on Judgment Day: Allah's Name Māliki Yawm al-Dīn","u":"https://yaqeeninstitute.org/read/paper/mercy-and-might-on-judgment-day-allahs-name-maliki-yawn-al-din","by":"Yaqeen Institute"}],"projects":[{"n":"Stages of the journey","l":"Beginner","d":"Make an ordered chart from death to Paradise or Hell (death, barzakh, trumpet, gathering, books, scales, ṣirāṭ, ḥawḍ, intercession), with one Qurʾān verse or authentic ḥadīth reference for each stage."},{"n":"Signs of the Hour file","l":"Intermediate","d":"From Ṣaḥīḥ Muslim's Book of Tribulations, list the ten major signs with ḥadīth numbers, then note for three minor signs how classical commentators explained them without tying them to dates."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read and check the grading of ḥadīth on the grave, the Hour and the Hereafter."},{"r":"Quran.com","u":"https://quran.com/","d":"Read the eschatological sūrahs (e.g. al-Qiyāmah, al-Takwīr, al-Infiṭār) with translation and tafsīr."}]},{"id":"aq_ruqyah","title":"Magic, the evil eye and ruqyah","short":"Sihr, ʿayn, ruqyah","level":"Beginner","section":"aqidah","why":"The Qurʾān and Sunnah affirm magic and the evil eye and teach ruqyah, yet this area attracts superstition and exploitation, so a Muslim needs to know exactly what the texts say and no more.","mins":540,"pre":["aq_angels"],"ideas":["The Qurʾān speaks of sihr in 2:102 and teaches seeking refuge from 'those who blow on knots' (113:4). Most Sunni scholars, Ashʿarī and Atharī, hold that magic has real effects, but only by Allah's permission; the Muʿtazilah and some others, such as the Ḥanafī al-Jaṣṣāṣ and Ibn Ḥazm, held it is illusion or trickery. Practising magic is a grave sin, and many jurists count it as kufr.","'The evil eye is real' (Bukhārī 5740, Muslim 2188). The Sunnah's remedies are ruqyah, asking the person whose gaze caused harm to wash, and saying 'mā shāʾ Allāh' or asking for blessing on what one admires.","Ruqyah is permitted when it uses Allah's words, names or attributes, in understandable language, with the belief that it works only by His decree: 'there is no harm in ruqā as long as they contain no shirk' (Muslim). The Prophet ﷺ recited al-Muʿawwidhāt over himself (Bukhārī). Scholars differed over amulets containing Qurʾān, which some early scholars allowed and others, such as Ibn Masʿūd's students, forbade; non-Qurʾānic charms are forbidden.","The Sunnah also rejects omens (ṭiyarah) and consulting fortune-tellers, and commands seeking medical treatment, since Allah sent down a cure for every disease (Bukhārī 5678). Not every illness is jinn or magic. Beating, seclusion with a healer, large fees and fear-selling are forbidden, and Muslim scholarly bodies have warned against them."],"callout":["Pitfall","Do not diagnose yourself or others with sihr or the eye from symptoms. Keep to the Prophet's ﷺ daily adhkār and authentic ruqyah, see a doctor, and treat anyone who charges heavily or uses force as a warning sign."],"lectures":[{"t":"The Reality of Sihr (Black Magic), Exorcisms & Jinns, Part II","u":"https://www.youtube.com/watch?v=szMpZQL9HZo","by":"Yasir Qadhi"},{"t":"Truth about the Evil Eye: Seeking protection against al-ʿAyn","u":"https://www.youtube.com/watch?v=9mzk4vi-tNA","by":"Yasir Qadhi"},{"t":"Sihr or Something Else? Understanding Black Magic, Jinn and Evil Eye with a Ruqya Expert","u":"https://www.youtube.com/watch?v=oQkutWmnzoA","by":"Yasir Qadhi"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Medicine (ruqyah, the evil eye, magic)","u":"https://sunnah.com/bukhari/76","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ Muslim, Book of Greetings (chapters on ruqā and the evil eye)","u":"https://sunnah.com/muslim/39","by":"Muslim (sunnah.com)"},{"t":"al-Ṭibb al-Nabawī (Arabic; from Zād al-Maʿād)","u":"https://shamela.ws/book/23649","by":"Ibn Qayyim al-Jawziyyah (al-Maktabah al-Shāmilah)"},{"t":"Sūrat al-Falaq (113)","u":"https://quran.com/113","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Jinn and Mental Illness among Muslims: A Commentary (psychiatrists' view; its doubt about possession is a minority position)","u":"https://journals.iium.edu.my/kom/index.php/imjm/article/view/1341","by":"Md Rosli A.N., Hashi A.A. and Razali Z.A. (IIUM Medical Journal Malaysia, 2020)"},{"t":"ANIC Warning to the Community Regarding Fraudulent Ruqya Services","u":"https://anic.org.au/wp-content/uploads/2024/12/Warning-Letter-regarding-Ruqya-Services.pdf","by":"Australian National Imams Council (2018)"}],"projects":[{"n":"Authentic ruqyah sheet","l":"Beginner","d":"Compile the verses and ḥadīths used for ruqyah and protection, each with its source and grading. In a second column list popular practices you have seen and whether any text supports them."},{"n":"Positions on sihr and amulets","l":"Intermediate","d":"Write a one-page survey of the classical positions on the reality of magic and on Qurʾānic amulets, naming who held each view and citing sources."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Check the source and grading of any ruqyah or protection ḥadīth before using it."}]}]},{"id":"usul","title":"Uṣūl al-fiqh","level":"Intermediate","intro":"Uṣūl al-fiqh is the discipline that explains how jurists move from the Qurʾān and Sunnah to concrete rulings. This month covers the agreed sources, the legal vocabulary of al-Waraqāt, and al-Shāfiʿī's case for the authority of the Sunnah.","phase":6,"optional":false,"topics":[{"id":"sources","title":"Sources of law: Qurʾān, Sunnah, ijmāʿ, qiyās","short":"Sources of law","level":"Beginner","why":"Every ruling in fiqh traces back to a small set of recognised evidences, so knowing what they are and how they rank is the first step in legal theory.","mins":360,"pre":["ilm","ikhtilaf"],"ideas":["Fiqh is knowledge of the practical rulings themselves, while uṣūl al-fiqh studies the evidences (adillah) behind them and the rules for deriving rulings from them. A jurist needs both: the rulings and the method.","The Qurʾān and the Sunnah are the two revealed sources. The Sunnah explains the Qurʾān, specifies its general statements and adds rulings it does not mention, which is why the Qurʾān commands obedience to the Messenger ﷺ (4:59, 59:7).","Ijmāʿ is the agreement of the qualified jurists (mujtahids) of the community in one era, after the Prophet ﷺ, on a legal ruling. It must rest on some evidence (mustanad), which most jurists allow to be a text or an analogy, and scholars differed on how widely it can be claimed and how it is known.","Qiyās extends the ruling of an original case (aṣl) to a new case (farʿ) because both share the same effective cause (ʿillah), as when the prohibition of wine is extended to other intoxicants. Other evidences such as istiḥsān, maṣlaḥah mursalah, ʿurf and the practice of Madinah are accepted by some schools and disputed by others."],"callout":["Method","Read the opening sections of al-Waraqāt on the sources, then make a one-page table of the four sources with a definition, a Qurʾānic or ḥadīth proof-text and one worked example for each. Add the disputed sources in a second column with the schools that use them."],"lectures":[{"t":"Usul al-Fiqh Lesson One: Introduction & Background","u":"https://www.youtube.com/watch?v=WUlWA05essE","by":"Suhaib Webb"},{"t":"Usul al-Shashi with Shaykh Akram Nadwi","u":"https://www.youtube.com/watch?v=h6qh0drx3dw","by":"Mohammad Akram Nadwi / Al-Salam Institute"}],"papers":[{"t":"Qurʾān 4:59 with Tafsīr Ibn Kathīr (obedience to Allah, the Messenger and those in authority)","u":"https://quran.com/4:59/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Darussalam)"},{"t":"Qurʾān 59:7 with Tafsīr Ibn Kathīr (\"whatever the Messenger gives you, take it\")","u":"https://quran.com/59:7/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Darussalam)"},{"t":"Ṣaḥīḥ al-Bukhārī 7352: the reward of the judge who exercises ijtihād","u":"https://sunnah.com/bukhari:7352","by":"al-Bukhārī (sunnah.com translation)"},{"t":"Al-Waraqāt of Imām al-Juwaynī: translation with commentary (free, CC licence)","u":"https://archive.org/details/AlWaraqatOfImamAlJuvainiCommentaryByMuhammadNabeelMusharraf","by":"al-Juwaynī (trans. and commentary Muhammad Nabeel Musharraf)"}],"reads":[{"t":"A Primer on Islamic Legal Theory (Uṣūl al-Fiqh)","u":"https://traversingtradition.com/2021/05/24/a-primer-on-islamic-legal-theory-u%e1%b9%a3ul-al-fiqh/","by":"Amir Aboguddah, Traversing Tradition"},{"t":"The Core Principles of Islamic Jurisprudence within Legal Theory: A Comprehensive Analysis","u":"https://adab.um.edu.my/index.php/RIS/article/download/53210/17768/159036","by":"Hafiz Falak Shair Faiz & Hafiz Sfarish Ali, Universiti Malaya (2024)"}],"projects":[{"n":"Sources map","l":"Beginner","d":"Draw a diagram of the four agreed sources and the main disputed ones, with arrows showing how each depends on the Qurʾān and Sunnah. Annotate each with one example ruling."},{"n":"Qiyās worksheet","l":"Beginner","d":"Take three classical analogies (for example wine to other intoxicants) and write out the aṣl, farʿ, ḥukm and ʿillah for each in a four-column table."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Read the proof-texts with translation and the English abridgment of Ibn Kathīr."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Search classical Arabic uṣūl works once your Arabic allows."}],"section":"usul"},{"id":"waraqat","title":"Legal language & rulings: al-Waraqāt","short":"al-Waraqāt","level":"Intermediate","why":"Al-Juwaynī's al-Waraqāt is the classic first text of uṣūl and teaches the vocabulary of rulings and legal language used in every later book.","mins":720,"pre":["sources","ar_nahw"],"ideas":["Al-Waraqāt (\"The Pages\") is a short primer by Imām al-Ḥaramayn al-Juwaynī (d. 478/1085), the teacher of al-Ghazālī. It is usually studied with the commentary of Jalāl al-Dīn al-Maḥallī, and al-ʿImrīṭī put it into verse for memorisation.","It opens with the five rulings (al-aḥkām al-khamsah): obligatory (wājib), recommended (mandūb), permissible (mubāḥ), disliked (makrūh) and forbidden (ḥarām), plus valid (ṣaḥīḥ) and void (bāṭil). Each is defined by its consequence, for example the wājib is rewarded when done and punished when left.","The core chapters treat legal language: a command (amr) indicates obligation and a prohibition (nahy) indicates prohibition unless some indicator (qarīnah) shows otherwise. It also covers general and specific (ʿāmm and khāṣṣ), ambiguous and clarified (mujmal and mubayyan), and literal and figurative usage.","The later chapters cover the Prophet's ﷺ actions, abrogation, conflicting evidences, ijmāʿ, reports (akhbār), qiyās, and the order of evidences. It ends with the qualifications of the muftī and mujtahid and the meaning of taqlīd, which ties uṣūl back to everyday religious practice."],"callout":["Method","Read one short section of the matn, then its explanation, then summarise each definition in your own words with one example from fiqh. Memorising the definitions in Arabic pays off in every later uṣūl book."],"lectures":[{"t":"Usul al-Fiqh: Imam al-Haramain's Waraqāt (playlist)","u":"https://www.youtube.com/playlist?list=PLbWCg5aT2vUt5W_8df0Ek4bLVH3PgCN3q","by":"Suhaib Webb"},{"t":"Al Waraqat, Lesson 1: Introduction to Usul al-Fiqh","u":"https://www.youtube.com/watch?v=B0IRkv_om3w","by":"Salman Nasir / The Legacy Institute"}],"papers":[{"t":"al-Waraqāt (Arabic text, OpenITI)","u":"https://archive.org/details/wuquf-openiti-0478imamharamaynjuwayni.waraqat-9639cb45d7b7","by":"Imām al-Ḥaramayn al-Juwaynī"},{"t":"Al-Waraqāt of Imām al-Juwaynī: translation with commentary (free, CC licence)","u":"https://archive.org/details/AlWaraqatOfImamAlJuvainiCommentaryByMuhammadNabeelMusharraf","by":"al-Juwaynī (trans. and commentary Muhammad Nabeel Musharraf)"},{"t":"Al-Waraqāt: Imām al-Juwaynī's introduction to Islamic jurisprudence (ebook)","u":"https://musafurber.gumroad.com/l/waraqat","by":"al-Juwaynī (trans. Musa Furber) (paid ebook)"}],"reads":[{"t":"Islamic Legal Theory: A Critical Introduction (based on al-Juwaynī's Waraqāt)","u":"https://hackettpublishing.com/islamic-legal-theory-a-critical-introduction","by":"David R. Vishanoff, Hackett (print)"},{"t":"Difference of Opinion: Where Do We Draw the Line?","u":"https://yaqeeninstitute.org/read/paper/difference-of-opinion-where-do-we-draw-the-line","by":"Nazir Khan, Yaqeen Institute"}],"projects":[{"n":"Definitions deck","l":"Intermediate","d":"Make 40 flashcards with each Waraqāt definition in Arabic on one side and your English rendering plus a fiqh example on the other."},{"n":"Command analysis","l":"Intermediate","d":"Choose five Qurʾānic commands (for example 2:43, 2:282, 5:2) and write a paragraph on each explaining whether it indicates obligation, recommendation or permission, and what indicator decides it."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read al-Maḥallī's commentary and other Arabic shurūḥ of al-Waraqāt."}],"section":"usul"},{"id":"u_ijmaqiyas","section":"usul","title":"Ijmāʿ and qiyās in depth","short":"Ijmāʿ & qiyās","level":"Intermediate","why":"After the Qurʾān and Sunnah, consensus and analogy are the two sources through which Sunni jurists fixed settled rulings and extended the law to new cases, and much juristic disagreement turns on how they are defined and used.","mins":1100,"pre":["sources","waraqat"],"ideas":["Ijmāʿ is the agreement of the qualified jurists (mujtahids) of the Muslim community in any one age after the Prophet's ﷺ death on a ruling of the Sharīʿah. Jurists cite Q 4:115 and the reports that the community will not agree on error, and they hold that a consensus must rest on some textual basis (mustanad). Denying a consensus known to all, such as the obligation of the five prayers, is treated very differently from disputing a claimed consensus on a detailed question.","The schools differ on its scope. Explicit consensus is accepted by all four schools; tacit consensus (ijmāʿ sukūtī), where some state a view and the rest stay silent, is accepted as proof by the Ḥanafīs and many Ḥanbalīs but not by others, including a position reported from al-Shāfiʿī. Mālik gave weight to the practice of the people of Madinah, and the Ẓāhirīs limited binding consensus to the Companions. Aḥmad's warning that one who claims consensus may be wrong, and should say 'we know of no disagreement', is often cited as a call for caution.","Qiyās extends the ruling of a textual case (aṣl) to a new case (farʿ) because they share the same effective cause (ʿillah). The standard example is wine: its prohibition is extended to other intoxicating drinks because the cause is intoxication. Uṣūl works set out the ways of identifying the ʿillah (masālik al-ʿillah), such as an explicit text, consensus, testing and eliminating possible causes (al-sabr wa al-taqsīm), and suitability (munāsabah).","Not every jurist accepted qiyās equally. The Ẓāhirīs, notably Dāwūd and Ibn Ḥazm, rejected it, while the four schools accepted it but disagreed on its limits: Ḥanafīs, for example, do not apply it to fix ḥudūd punishments and expiations, and they used istiḥsān to depart from a strict analogy, which al-Shāfiʿī criticised. Many jurists also class the a fortiori inference (striking parents is forbidden because even saying 'uff' is) as textual implication rather than qiyās."],"callout":["Pitfall","A sentence in a book saying 'there is consensus' is a claim to be checked, not an automatic proof. Later scholars such as Ibn Taymiyyah wrote critiques of earlier consensus lists, so look for whether a known disagreement exists before relying on one."],"lectures":[{"t":"Usul al-Fiqh 4: Ijma and Qiyas","u":"https://www.youtube.com/watch?v=uHEL8qQ9Qrs","by":"Ismail Kamdar"},{"t":"Theory of Fiqh based on Uṣūl al-Shāshī (Ḥanafī, 34 lessons)","u":"https://www.youtube.com/playlist?list=PL9KwNBQ-bRQEVxTn5OnBwoJ5nbIXpFOCc","by":"WISE English Academy"},{"t":"Usul al-Fiqh: Imam al-Haramain's Waraqāt (Shāfiʿī, 67 lessons)","u":"https://www.youtube.com/playlist?list=PLbWCg5aT2vUt5W_8df0Ek4bLVH3PgCN3q","by":"Suhaib Webb"}],"papers":[{"t":"Islamic Jurisprudence: Shāfiʿī's Risāla (chapters on consensus and analogy; library loan)","u":"https://archive.org/details/bwb_C0-ABV-991","by":"al-Shāfiʿī (trans. Majid Khadduri, 1961)"},{"t":"al-Ijmāʿ (Arabic)","u":"https://shamela.ws/book/12445","by":"Ibn al-Mundhir (ed. Fuʾād ʿAbd al-Munʿim)"},{"t":"al-Iḥkām fī Uṣūl al-Aḥkām (Arabic; books on ijmāʿ and qiyās)","u":"https://shamela.ws/book/10801","by":"Sayf al-Dīn al-Āmidī"},{"t":"al-Uṣūl min ʿIlm al-Uṣūl (Arabic primer)","u":"https://shamela.ws/book/9942","by":"Muḥammad ibn Ṣāliḥ al-ʿUthaymīn"}],"reads":[{"t":"Principles of Islamic Jurisprudence, chapters on ijmāʿ and qiyās (library loan)","u":"https://archive.org/details/principlesofisla0000kama","by":"Mohammad Hashim Kamali"},{"t":"A History of Islamic Legal Theories: An Introduction to Sunnī uṣūl al-fiqh (library loan)","u":"https://archive.org/details/historyofislamic0000hall","by":"Wael B. Hallaq (Cambridge, 1997)"}],"projects":[{"n":"Qiyās worksheet","l":"Intermediate","d":"Work through three classical analogies (for example wine and other intoxicants, the six ribawī items, and the travel prayer) by filling in aṣl, farʿ, ḥukm and ʿillah, and record how two schools identify the ʿillah differently."},{"n":"Consensus check","l":"Intermediate","d":"Choose five rulings listed in Ibn al-Mundhir's al-Ijmāʿ and, for each, record whether a later work such as Ibn Qudāmah's al-Mughnī reports any dissent, writing a short note on how strong each claim is."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Search consensus statements and the chapters on qiyās in the classical uṣūl works."}]},{"id":"sunnah","title":"The authority of the Sunnah: al-Risālah","short":"Risālah & Sunnah","level":"Intermediate","why":"Al-Shāfiʿī's al-Risālah is the oldest surviving work of legal theory and the classic argument for why the Sunnah, including single-narrator reports, binds Muslims.","mins":600,"pre":["sources","waraqat"],"ideas":["Al-Shāfiʿī (d. 204/820) wrote al-Risālah, in the form we have it, in Egypt. Its organising idea is bayān: God's guidance reaches people in several ways, from explicit Qurʾānic text, to Qurʾānic statements explained by the Sunnah, to rulings found in the Sunnah alone, to rulings reached by ijtihād.","He argues that where the Qurʾān pairs \"the Book\" with \"the Wisdom\" (for example 2:129 and 62:2), the Wisdom is the Sunnah. Combined with the verses commanding obedience to the Messenger ﷺ, this makes the Sunnah a binding source rather than optional advice.","A central chapter defends acting on the report of a single reliable narrator (khabar al-wāḥid), provided the narrator is trustworthy, understands what he narrates and transmits it precisely. One of his examples is the people of Qubāʾ turning toward the Kaʿbah in prayer on the word of one messenger.","Al-Shāfiʿī held that the Sunnah can specify the Qurʾān's general wording but that Qurʾān is abrogated only by Qurʾān and Sunnah only by Sunnah. Modern historians debate how far the Risālah founded uṣūl al-fiqh as a genre: Wael Hallaq argues that the full discipline took shape later, while Joseph Lowry reads the Risālah as a coherent system in its own right."],"callout":["Pitfall","Khadduri's translation reorders some chapters, so check the section numbers against Lowry's edition when following a lecture or citation. Read the argument about single reports slowly and list each proof he gives."],"lectures":[{"t":"Translating al-Shāfiʿī's Risāla","u":"https://www.youtube.com/watch?v=0uYlJJgV0yI","by":"NYUAD Institute (Library of Arabic Literature)"},{"t":"Decoding the Sunnah for Today","u":"https://www.youtube.com/watch?v=a_QKPP7fvmo","by":"Mohammad Akram Nadwi / Al-Salam Institute"}],"papers":[{"t":"The Epistle on Legal Theory: A Translation of al-Shāfiʿī's Risālah","u":"https://nyupress.org/9781479855445/the-epistle-on-legal-theory/","by":"al-Shāfiʿī (trans. Joseph E. Lowry), NYU Press (print)"},{"t":"Al-Shāfiʿī's Risāla: Treatise on the Foundations of Islamic Jurisprudence","u":"https://its.org.uk/catalogue/al-shafiis-risala-treatise-on-the-foundation-of-islamic-jurisprudence-hardback/","by":"al-Shāfiʿī (trans. Majid Khadduri), Islamic Texts Society (print)"}],"reads":[{"t":"Are Hadith Necessary? An Examination of the Authority of Hadith in Islam","u":"https://yaqeeninstitute.org/read/paper/are-hadith-necessary","by":"Emad Hamdeh, Yaqeen Institute"},{"t":"Uṣūl al-Fiqh and Shāfiʿī's Risāla Revisited","u":"https://journals.uio.no/JAIS/article/view/7749","by":"Wael B. Hallaq, Journal of Arabic and Islamic Studies 19 (2019)"},{"t":"The Epistle on Legal Theory (book page)","u":"https://melc.sas.upenn.edu/people/books/epistle-legal-theory","by":"Joseph E. Lowry, University of Pennsylvania"}],"projects":[{"n":"Argument outline","l":"Intermediate","d":"Write a two-page outline of al-Shāfiʿī's case for the single-narrator report, listing each Qurʾānic verse and precedent he uses and the objection it answers."},{"n":"Bayān chart","l":"Intermediate","d":"Build a chart of al-Shāfiʿī's levels of bayān with two examples for each level taken from the Risālah itself."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Look up every verse al-Shāfiʿī cites and read it in context."}],"section":"usul"},{"id":"aq_bidah","title":"Sunnah and bidʿah: definitions and scholarly disagreement","short":"Sunnah & bidʿah","level":"Intermediate","section":"usul","why":"Disputes over bidʿah divide Muslim communities, and most of them turn on which definition a scholar uses, so knowing the classical definitions lets a student follow the argument without contempt for either side.","mins":720,"pre":["sunnah","ikhtilaf"],"ideas":["The key texts are 'every bidʿah is misguidance' (Muslim 867; Forty Ḥadīth no. 28), 'whoever introduces into this matter of ours what is not of it, it is rejected' (Forty Ḥadīth no. 5), and 'whoever starts a good practice (sunnah ḥasanah) in Islam' (Muslim 1017). ʿUmar said of the congregational tarāwīḥ, 'what an excellent bidʿah this is' (Bukhārī 2010).","al-Shāfiʿī, as reported by al-Bayhaqī, divided new matters into those that contradict the Qurʾān, Sunnah, a report or consensus, which are misguided innovation, and good matters that contradict none of these, which are not blameworthy. al-ʿIzz ibn ʿAbd al-Salām in Qawāʿid al-Aḥkām classed innovations under the five rulings (obligatory, recommended, forbidden, disliked, permitted), and al-Nawawī and al-Qarāfī adopted this division.","al-Shāṭibī in al-Iʿtiṣām defined bidʿah as an invented way in religion that imitates the Sharīʿah and is followed as devotion. He rejected the five-fold division, since anything with a sound legal basis is not bidʿah, and distinguished 'real' from 'additional' (iḍāfiyyah) bidʿah and both from public-interest measures (maṣāliḥ mursalah). Ibn Rajab and Ibn Taymiyyah read 'every bidʿah' as general in its legal sense and the Salaf's 'good bidʿah' as linguistic, though Ibn Taymiyyah allowed that some people may be rewarded for their sincere intention.","Much of the dispute is about terms: both sides agree that worldly inventions are not blameworthy and that a practice with a
