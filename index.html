 the Qurʾān, note where his story appears and one lesson","Write a one-page description of the Prophet ﷺ from al-Tirmidhī's Shamāʾil","Profile ten Companions: name, role, one narration they transmitted"],"uses":["pr_anbiya","pr_makkah","pr_madinah","pr_shamail","pr_sahabah"]},{"n":"Hijri history notebook","l":"Intermediate","phase":10,"d":"Place every scholar and text you read in its century and political context.","steps":["Make a table by Hijri century: dynasty, key events, major scholars, key books","Write one page on how the ʿAbbāsid period shaped the madhhabs and the ḥadīth canon","Write a balanced account of one contested event using two sources","Describe one institution (madrasa, waqf or library) and how it worked"],"uses":["h_rashidun","h_umayyad","h_abbasid","h_civ","h_scholarship"]},{"n":"Year 4 research project","l":"Advanced","phase":19,"d":"A real piece of research, written to academic standards and checked with a teacher.","steps":["Choose a question within your Year 3 track and write a research proposal","Compile a bibliography of primary and secondary sources with Index Islamicus and OpenITI","Read one manuscript or critical edition of a short text","Write a 6,000-word paper with full references and have a qualified teacher review it"],"uses":["m_research","m_manuscripts","m_reference","m_ijazah"]},{"n":"Fiqh & uṣūl capstone","l":"Advanced","phase":15,"d":"This track trains the learner to read a madhhab's main manual with its legal theory, so that rulings are understood through their evidence, method and purposes.","steps":["Annotated chapter: Take one chapter of your madhhab's manual (e.g. sales or marriage) and produce an annotated edition: each ruling with its evidence, the school's reasoning and the main opposing view.","Capstone research paper: Write a 5,000–7,000 word paper surveying the existing answers of qualified scholars in one madhhab to a contemporary question, setting out their sources, maxims, maqāṣid and reasoning on custom and necessity. It is reviewed by a qualified teacher and is a survey of scholarly positions, not a fatwa to be acted on."],"uses":["sp_fiqh"]},{"n":"Qurʾānic studies & tafsīr capstone","l":"Advanced","phase":16,"d":"This track trains a learner to read the major classical tafsīrs critically and to understand how the Qurʾān is interpreted for law, creed and guidance.","steps":["Comparative tafsīr dossier: Choose ten passages and set al-Ṭabarī, Ibn Kathīr and al-Qurṭubī side by side. Produce a 20-page dossier noting each author's sources, method and conclusions.","Capstone sūrah commentary: Write a documented commentary on a short sūrah (for example al-Mulk or al-Ḥujurāt) covering language, context, transmitted reports, legal and creedal points, with every claim cited to a classical source."],"uses":["sp_tafsir"]},{"n":"ʿAqīdah & Islamic thought capstone","l":"Advanced","phase":17,"d":"This track moves from the sources of creed to the classical debates with philosophy and the sects, so the learner can read primary theological texts and answer modern questions with care.","steps":["Creed comparison dossier: Produce a 20-page dossier setting the Ṭaḥāwiyyah, al-Nasafī's ʿAqāʾid (with al-Taftāzānī), the Wāsiṭiyyah and al-Ghazālī's Qawāʿid al-ʿAqāʾid side by side on ten doctrines, stating each school's position in its own terms, with citations and short notes on each difference.","Capstone paper: Write a 6,000–8,000 word paper on one classical debate (e.g. causality in the Tahāfut and Ibn Rushd's reply, or God's speech in the Miḥnah), using primary texts and at least five academic sources."],"uses":["sp_aqidah"]},{"n":"Ḥadīth sciences capstone","l":"Advanced","phase":18,"d":"This track trains a learner to read isnāds, weigh narrators and defects, and understand how ḥadīth are used in law and defended in modern debate.","steps":["Capstone takhrīj study: Take one ḥadīth, gather all its routes from the major collections, draw the isnād tree, assess each narrator from the rijāl works, d let mapPh=store.get(K+".mapPh","cur");
function mapSet(){const p=mapPh==="cur"?curPhase():mapPh;if(p==="all")return {ids:ORDER,ctx:new Set()};const main=ORDER.filter(id=>T[id].ph===p);const ctx=new Set();main.forEach(id=>ancestors(id).forEach(a=>{if(T[a].ph!==p)ctx.add(a)}));return {ids:ORDER.filter(id=>main.includes(id)||ctx.has(id)),ctx}}
function mapSVG(){

  const W=144,H=40,GX=14,GY=40,LX=34,tiers=[];ids.forEach(id=>(tiers[dd[id]]=tiers[dd[id]]||[]).push(id));

    row.forEach((id,k)=>pos[id]={x:LX+k*(W+GX),y:14+d*(H+GY)})});
  const width=LX+Math.max(...tiers.map(r=>r.length))*(W+GX),height=14+tiers.length*(H+GY);

  ids.forEach(id=>{const p=pos[id];n+=`<g class="node${done[id]?" done":""}${ctx.has(id)?" ctx":""}" data-id="${id}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${esc(T[id].title)}"><rect width="${W}" height="${H}" rx="6"/><text class="cn" x="10" y="15">${T[id].num}</text><text x="10" y="31">${esc(T[id].short)}</text></g>`});

function render(){
  const h=location.hash.slice(1);let v;
  if(h.startsWith("t-")&&T[h.slice(2)])v=topicPage(h.slice(2));else if(h==="path")v=pathPage();else if(h==="map")v=mapPage();else if(h==="daily"&&CONFIG.daily)v=dailyPage();else if(h==="projects")v=projectsPage();else if(h==="courses")v=coursesPage();else if(h==="sections"&&CONFIG.sections)v=sectionsPage();else if(h==="playlists"&&PL.length)v=playlistsPage();else if(h.startsWith("hub-")&&(CONFIG.hubs||[]).some(x=>"hub-"+x.id===h))v=hubPage(CONFIG.hubs.find(x=>"hub-"+x.id===h));else if(h==="timetable"){v=timetablePage()}else if((CONFIG.pages||[]).some(p=>p.id===h)){const p=CONFIG.pages.find(p=>p.id===h);v={crumb:`<a href="#">${esc(CONFIG.short)}</a> / ${esc(p.title)}`,wide:false,toc:[],html:p.html}}else v=home();
  renderIndex(h);toggleNav(false);
  $("#crumb").innerHTML=v.crumb;
  const pg=$("#page");pg.classList.toggle("wide",!!v.wide||!v.toc.length);
  pg.innerHTML=`<article>${v.html}</article>`+(v.toc.length?`<aside class="toc"><h5>On this page</h5>${v.toc.map(([k,l])=>`<a href="#${h}" data-to="${k}">${l}</a>`).join("")}</aside>`:"");
  pg.querySelectorAll("aside.toc a").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.to)?.scrollIntoView({behavior:"smooth"})});
  if(tocObs)tocObs.disconnect();
  if(v.toc.length&&"IntersectionObserver"in window){tocObs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)pg.querySelectorAll("aside.toc a").forEach(a=>a.classList.toggle("on",a.dataset.to===en.target.id))}),{rootMargin:"-70px 0px -70% 0px"});pg.querySelectorAll("h2[id]").forEach(x=>tocObs.observe(x))}
  v.after&&v.after();
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});

if(CONFIG.daily)(async()=>{
  const fail=m=>{daily=m;if(location.hash==="#daily")render()};
  const timer=setTimeout(()=>{if(daily===null)fail("The daily drop didn't load. Reopen the page to try again.")},10000);
  const db=window.claude?await window.claude.use("db"):null;
  if(!db){try{const r=await fetch("daily.json",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();clearTimeout(timer);daily=(j.days||[]).slice(0,14);fresh={};daily.forEach(d=>(d.items||[]).forEach(i=>{if(i.topic)(fresh[i.topic]=fresh[i.topic]||[]).push({...i,date:d.date})}));const h=location.hash;if(h==="#daily"||h.startsWith("#t-"))render();return}catch{clearTimeout(timer);fail("The daily drop isn't available here. Everything else works offline.");return}}
  db.collection("daily").orderBy("date","desc").limit(14).onSnapshot(s=>{clearTimeout(timer);daily=s.docs.map(d=>d.data()).filter(Boolean);fresh={};daily.forEach(d=>(d.items||[]).forEach(i=>{if(i.topic)(fresh[i.topic]=fresh[i.topic]||[]).push({...i,date:d.date})}));
    const h=location.hash;if(h==="#daily"||h.startsWith("#t-"))render()},()=>{clearTimeout(timer);fail("The daily drop couldn't be read right now. Reopen the page to try again.")});
})();

// ---- v4: focus mode, path page, phase-aware home
function setFocus(f){focus=f;store.set(K+".focus",f);const b=$("#focusBtn");if(b)b.setAttribute("aria-pressed",f);render()}
(()=>{const strip=document.querySelector(".strip");const b=document.createElement("button");b.id="focusBtn";b.className="focusbtn";b.textContent="Focus";b.title="Show only your current phase";b.setAttribute("aria-pressed",focus);b.onclick=()=>setFocus(!focus);strip.insertBefore(b,$("#modeSeg").previousElementSibling)})();
const capFor=i=>(CONFIG.capstones||[]).filter(c=>c.phase===i);
function phaseStats(i){const ids=ORDER.filter(id=>T[id].ph===i);const dn=ids.filter(id=>done[id]).length;return{ids,dn,mins:ids.filter(id=>!done[id]).reduce((s,id)=>s+T[id].mins,0)}}
function pathPage(){
  const n=nextCore(),cp=curPhase();
  let h=`<p class="eyebrow">One path, in order</p><h1>My path</h1><p class="lede" style="max-width:64ch">${esc(CONFIG.pathLede)}</p>`;
  h+=`<ol class="phases">`+PH.map((p,i)=>{const s=phaseStats(i);const state=p.optional?"opt":PAR.has(i)?"now":s.dn===s.ids.length?"done":i===cp?"now":i<cp?"done":"later";
    const chs=DATA.chapters.map((c,ci)=>({c,ci})).filter(x=>x.c.phase===i);
    return `<li class="phase ${state}" id="ph-${i}"><div class="ph-hd"><span class="ph-n">${p.badge?esc(p.badge):p.optional?"E":PAR.has(i)?"∥":pad(i+1)}</span><div class="ph-t"><b>${esc(p.title)}</b><span>${esc(p.goal)}</span></div><span class="ph-s">${s.dn}/${s.ids.length} · ${hrs(s.mins)} left</span></div>
    <div class="bar"><i style="width:${s.ids.length?Math.round(100*s.dn/s.ids.length):0}%"></i></div>${(p.teacher||p.amal)?`<p class="ph-note">${p.teacher?`<span><b>With a teacher</b>${esc(p.teacher)}</span>`:""}${p.amal?`<span><b>Amal</b>${esc(p.amal)}</span>`:""}</p>`:""}${p.tt?`<details class="tt-det"><summary>Daily timetable · ${esc(p.tt.total)}</summary>${ttHtml(p)}</details>`:""}
    <details class="ph-det"${state==="now"?" open":""}><summary>${state==="now"?"Topics in this phase":"Show "+s.ids.length+" topics"}</summary><ol class="ph-topics">${chs.flatMap(({c})=>c.topics.map(t=>{const st=done[t.id]?"ok":(t.id===n||(PAR.has(T[t.id].ph)&&t.id===nextParOf(T[t.id].ph)))?"cur":"";return `<li class="${st}"><a href="#t-${t.id}"><span class="pn">${T[t.id].num}</span><span>${esc(t.title)}</span><span class="pt">${st==="ok"?"✓":st==="cur"?"You are here":hrs(t.mins)}</span></a></li>`})).join("")}</ol></details>
    ${capFor(i).map(c=>`<div class="milestone"><span>${esc(L.milestone)}</span><b>${esc(c.n)}</b><a href="#projects">See the steps →</a></div>`).join("")}</li>`}).join("")+`</ol>`;
  return{crumb:`<a href="#">${esc(CONFIG.short)}</a> / My path`,wide:false,toc:[],html:h,after(){const el=document.getElementById("ph-"+cp);if(el&&location.hash==="#path")el.scrollIntoView({block:"start"})}};
}
const _home=home;
home=function(){
  const v=_home();const n=nextCore(),cp=curPhase();
  const bars=PH.map((p,i)=>{if(p.optional||PAR.has(i))return"";const s=phaseStats(i);return `<a class="seg2 ${i===cp?"now":""}" href="#path" title="Phase ${i+1}: ${esc(p.title)} (${s.dn}/${s.ids.length})"><i style="height:${s.ids.length?Math.round(100*s.dn/s.ids.length):0}%"></i><span>${i+1}</span></a>`}).join("");
  const cont=n?`<div class="continue"><span class="eyebrow" style="margin:0">Continue · Phase ${cp+1}: ${esc(PH[cp].title)}</span><a href="#t-${n}"><b>${T[n].num} ${esc(T[n].title)}</b><span>${esc(T[n].why)}</span></a><span class="muted">about ${hrs(T[n].mins)} · then ${(()=>{const i=CORE.indexOf(n);return CORE.slice(i+1,i+3).map(x=>esc(T[x].short)).join(", ")})()}</span></div>`:`<div class="continue"><b>You've finished the core path.</b></div>`;
  const par=[...PAR].filter(parVisible).map(i=>{const np=nextParOf(i);return np?`<div class="continue alongside"><span class="eyebrow" style="margin:0">Alongside · ${esc(PH[i].title)}</span><a href="#t-${np}"><b>${T[np].num} ${esc(T[np].title)}</b><span>${esc(T[np].why)}</span></a></div>`:""}).join("");
  v.html=v.html.replace('<h2 id="next">',`<div class="phasebar" aria-label="Progress by phase">${bars}</div>${cont}${par}<h2 id="next">`);
  return v;
};

render();

function sectionsPage(){
  const by={};ORDER.forEach(id=>{const k=T[id].section;if(k)(by[k]=by[k]||[]).push(id)});
  const toc=CONFIG.sections.filter(x=>by[x.id]).map(x=>[ "sec-"+x.id,x.title]);
  let h=`<p class="eyebrow">Every topic, by subject</p><h1>Sections</h1><p class="lede" style="max-width:64ch">The same topics as the path, grouped by discipline. Use this to see a whole subject at a glance; use My path to decide what to study next.</p>`;
  h+=CONFIG.sections.filter(x=>by[x.id]).map((x,i)=>{const ids=by[x.id];const dn=ids.filter(id=>done[id]).length;
    return `<h2 id="sec-${x.id}"><span class="sn">${pad(i+1)}</span>${esc(x.title)}</h2><p class="empty" style="margin-top:-6px">${esc(x.desc)} · ${dn}/${ids.length} done</p><ol class="ph-topics" style="margin-left:0">${ids.map(id=>`<li class="${done[id]?"ok":""}"><a href="#t-${id}"><span class="pn">${T[id].num}</span><span>${esc(T[id].title)}</span><span class="pt">${done[id]?"✓":esc(PH[T[id].ph].short)}</span></a></li>`).join("")}</ol>`}).join("");
  return{crumb:`<a href="#">${esc(CONFIG.short)}</a> / Sections`,wide:false,toc,html:h,after(){document.querySelectorAll("aside.toc a").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.to)?.scrollIntoView({behavior:"smooth"})})}};
}

function plList(a){return `<ul class="list">${a.map(x=>`<li><a href="${esc(x.u)}" target="_blank" rel="noopener"><span class="t" dir="auto">${esc(x.t)}</span><span class="b">${esc(x.by)}${x.text?` · explains <i>${esc(x.text)}</i>`:""}${x.note?`<br>${esc(x.note)}`:""}</span><span class="d"><span class="lang ${esc(x.lang)}">${esc(LANG[x.lang]||x.lang)}</span>${x.eps?` · ${x.eps} videos`:""}${x.level?` · ${esc(x.level)}`:""}</span></a></li>`).join("")}</ul>`}
function playlistsPage(){
  const secs=(CONFIG.sections||[]).filter(sx=>PL.some(x=>x.section===sx.id));
  const list=PL.filter(x=>(plLang==="all"||x.lang===plLang)&&(plSec==="all"||x.section===plSec));
  const nEn=PL.filter(x=>x.lang==="en").length,nAr=PL.filter(x=>x.lang==="ar").length;
  let h=`<p class="eyebrow">Complete, free series on YouTube</p><h1>Courses & playlists</h1><p class="lede" style="max-width:64ch">${PL.length} full lecture series you can follow from the first video to the last: ${nEn} in English and ${nAr} in Arabic. Pick one per subject and finish it; do not collect them.</p>
  <div class="filter" id="plLang">${[["all","All languages"],["en","English"],["ar","Arabic"]].map(([k,l])=>`<button data-k="${k}" aria-pressed="${plLang===k}">${l}</button>`).join("")}</div>
  <div class="filter" id="plSec" style="margin-top:8px"><button data-k="all" aria-pressed="${plSec==="all"}">All subjects</button>${secs.map(sx=>`<button data-k="${sx.id}" aria-pressed="${plSec===sx.id}">${esc(sx.title)}</button>`).join("")}</div>`;
  const groups=secs.filter(sx=>list.some(x=>x.section===sx.id));
  h+=groups.length?groups.map((sx,i)=>`<h2 id="pl-${sx.id}"><span class="sn">${pad(i+1)}</span>${esc(sx.title)}</h2>${plList(list.filter(x=>x.section===sx.id))}`).join(""):`<p class="empty">No courses match these filters.</p>`;
  return{crumb:`<a href="#">${esc(CONFIG.short)}</a> / Courses & playlists`,wide:false,toc:[],html:h,after(){$("#plLang").onclick=e=>{const b=e.target.closest("button");if(b){plLang=b.dataset.k;render()}};$("#plSec").onclick=e=>{const b=e.target.closest("button");if(b){plSec=b.dataset.k;render()}}}};
}
function hubPage(hb){
  const ids=ORDER.filter(id=>T[id].section===hb.section);const pls=PL.filter(x=>x.section===hb.section);
  const notes=[];const seen=new Set();ids.forEach(id=>T[id].reads.concat(T[id].papers).forEach(r=>{if(!seen.has(r.u)){seen.add(r.u);notes.push({...r,by:r.by+" · "+T[id].num})}}));
  const tools=[];const st=new Set();ids.forEach(id=>T[id].repos.forEach(r=>{const u=r.u||r.r;if(!st.has(u)){st.add(u);tools.push(r)}}));
  const toc=[["hub-levels","Levels"],...(pls.length?[["hub-courses","Courses"]]:[]),["hub-notes","Notes & books"],...(tools.length?[["hub-tools","Tools"]]:[])];
  let h=`<p class="eyebrow">${esc(hb.eyebrow||"")}</p><h1>${esc(hb.title)}</h1><p class="lede" style="max-width:64ch">${esc(hb.lede)}</p>`;
  h+=`<h2 id="hub-levels"><span class="sn">01</span>Levels, in order</h2><ol class="ph-topics" style="margin-left:0">${ids.map(id=>`<li class="${done[id]?"ok":""}"><a href="#t-${id}"><span class="pn">${T[id].num}</span><span>${esc(T[id].title)}</span><span class="pt">${done[id]?"✓":hrs(T[id].mins)}</span></a></li>`).join("")}</ol>`;
  if(pls.length)h+=`<h2 id="hub-courses"><span class="sn">02</span>Courses & playlists</h2>${plList(pls)}`;
  h+=`<h2 id="hub-notes"><span class="sn">${pls.length?"03":"02"}</span>Notes, workbooks & books</h2>${resList(notes)}`;
  if(tools.length)h+=`<h2 id="hub-tools"><span class="sn">${pls.length?"04":"03"}</span>Tools</h2>${repoList(tools)}`;
  return{crumb:`<a href="#">${esc(CONFIG.short)}</a> / ${esc(hb.title)}`,wide:false,toc,html:h};
}

function ttHtml(p){const t=p.tt;const sum=t.blocks.reduce((a,b)=>a+b[1],0);
 return `<table class="tt"><thead><tr><th>When</th><th>Min</th><th>What to do</th></tr></thead><tbody>${t.blocks.map(b=>`<tr><td>${esc(b[0])}</td><td class="n">${b[1]}</td><td>${esc(b[2])}</td></tr>`).join("")}<tr class="tot"><td>Total</td><td class="n">${sum}</td><td>${esc(t.total)} including the tracks that run alongside</td></tr></tbody></table>${t.week&&t.week.length?`<p class="tt-wk-h">Each week</p><ul class="tt-wk">${t.week.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}`}
function timetablePage(){
  const cp=curPhase();
  let h=`<p class="eyebrow">How to spend each day</p><h1>Daily timetable</h1><p class="lede" style="max-width:64ch">A realistic plan for every phase, built on the principle of a little every day: short classical texts read slowly, with the Qurʾān and Arabic kept daily. Adjust the clock times to your prayers and work; keep the order and the minutes.</p>`;
  h+=PH.map((p,i)=>p.tt?`<h2 id="tt-${i}"><span class="sn">${p.badge?esc(p.badge):pad(i+1)}</span>${esc(p.title)}${i===cp?' <span class="lang ar">You are here</span>':""}</h2><p class="empty" style="margin-top:-6px">${esc(p.tt.total)} · ${esc(p.goal)}</p>${ttHtml(p)}`:"").join("");
  const toc=PH.map((p,i)=>p.tt?["tt-"+i,p.short]:null).filter(Boolean);
  return{crumb:`<a href="#">${esc(CONFIG.short)}</a> / Daily timetable`,wide:false,toc,html:h,after(){const el=document.getElementById("tt-"+cp);if(el&&location.hash==="#timetable")el.scrollIntoView({block:"start"})}};
}
