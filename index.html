<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Islamic Studies Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet reader. Left index (grouped, numbered), one reading column (~68ch), right "on this page" at wide widths. Hairlines, no cards. */
:root{
  --bg:#fafaf8; --fg:#24262b; --muted:#6c707a; --faint:#a3a7ae; --line:#e6e6e1; --hover:#f0f0ec; --accent:#2e6a4c; --accent-weak:#e2eee6; --done:#3d7a4f;
  --serif:"Literata","Amiri",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans","Amiri",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#8cc4a3;--accent-weak:#1d2b23;--done:#7fb88e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#8cc4a3;--accent-weak:#1d2b23;--done:#7fb88e;color-scheme:dark}
/* Reader's own choice wins over system */
:root[data-read="light"]{--bg:#fafaf8;--fg:#24262b;--muted:#6c707a;--faint:#a3a7ae;--line:#e6e6e1;--hover:#f0f0ec;--accent:#2e6a4c;--accent-weak:#e2eee6;--done:#3d7a4f;color-scheme:light}
:root[data-read="paper"]{--bg:#f3ead8;--fg:#3a3126;--muted:#7a6a55;--faint:#ad9d86;--line:#e0d4bd;--hover:#ece0c8;--accent:#8a5a2b;--accent-weak:#eadbc0;--done:#5b7a3a;color-scheme:light}
:root[data-read="night"]{--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#8cc4a3;--accent-weak:#1d2b23;--done:#7fb88e;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
/* index */
.index{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:22px 14px 40px max(18px,env(safe-area-inset-left,0px));font-size:13.5px}
.logo{display:flex;align-items:baseline;gap:8px;font:600 15px var(--sans);letter-spacing:-.01em;padding:0 8px 14px}
.logo small{font:400 11px var(--mono);color:var(--muted)}
.find{width:100%;font:13.5px var(--sans);padding:7px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;margin-bottom:14px}
.find::placeholder{color:var(--faint)}
.navtop a,.part a{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:5px;color:var(--muted)}
.navtop a:hover,.part a:hover{background:var(--hover);color:var(--fg)}
.navtop a[aria-current="page"],.part a[aria-current="page"]{color:var(--fg);background:var(--hover);font-weight:500}
.navtop{margin-bottom:16px}
.part{margin-bottom:14px}
.part h3{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 4px;padding:0 8px;display:flex;justify-content:space-between}
.part ol{list-style:none;margin:0;padding:0}
.part .n{font:400 11px var(--mono);color:var(--faint);min-width:26px}
.part .tick{margin-left:auto;color:var(--done);font-size:11px}
/* top strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--muted)}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a:hover{color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg)}
.menu{display:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
/* reading column */
.page{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:48px;padding-block:44px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1080px}
.page.wide{grid-template-columns:minmax(0,1fr)}
article{max-width:68ch;min-width:0}
.page.wide article{max-width:none}
.eyebrow{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
h1{font:600 clamp(28px,4vw,38px)/1.15 var(--sans);letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
.lede{font:400 calc(var(--fs) + 1px)/1.65 var(--serif);color:var(--muted);margin:0 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12.5px var(--mono);color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px;align-items:center}
.meta label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--fg)}
.meta input{accent-color:var(--done);width:15px;height:15px}
h2{font:600 19px/1.3 var(--sans);letter-spacing:-.01em;margin:44px 0 14px;scroll-margin-top:70px;display:flex;gap:12px;align-items:baseline}
h2 .sn{font:400 12px var(--mono);color:var(--faint)}
.prose{font:400 var(--fs)/1.75 var(--serif)}
.prose p{margin:0 0 1em}
.ideas{margin:0;padding:0;list-style:none;counter-reset:i}
.ideas li{counter-increment:i;display:grid;grid-template-columns:30px 1fr;padding:8px 0;border-top:1px solid var(--line)}
.ideas li:first-child{border-top:0}
.ideas li::before{content:counter(i,decimal-leading-zero);font:400 12px/2.2 var(--mono);color:var(--faint)}
.note{border-left:2px solid var(--accent);padding:4px 0 4px 16px;margin:20px 0 0;font:400 calc(var(--fs) - 1px)/1.7 var(--serif)}
.note b{display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:2px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 4px;align-items:baseline}
.list a:hover{background:var(--hover)}
.list .t{font:500 15px/1.4 var(--sans)}
.list a:hover .t{color:var(--accent)}
.list .b{grid-column:1;font-size:13px;color:var(--muted)}
.list .d{grid-row:1/span 2;grid-column:2;font:400 11px var(--mono);color:var(--faint);align-self:center}
.proj{display:grid;gap:0}
.proj div{border-top:1px solid var(--line);padding:12px 4px}
.proj div:last-child{border-bottom:1px solid var(--line)}
.proj h4{margin:0 0 3px;font:500 15px var(--sans);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.proj p{margin:0;font:400 calc(var(--fs) - 1.5px)/1.65 var(--serif);color:var(--muted)}
.proj a.from{font:400 12px var(--mono);color:var(--accent)}
.lv{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.fits{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;font-size:13.5px}
.fits .col{display:grid;gap:6px;min-width:0}
.fits .col.mid{justify-items:center}
.fits .hd{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.fits a,.fits span.me{border:1px solid var(--line);border-radius:5px;padding:5px 9px;display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fits a:hover{border-color:var(--accent);color:var(--accent)}
.fits span.me{border-color:var(--fg);font-weight:500;text-align:center}
.fits .arr{color:var(--faint)}
.fits .none{color:var(--faint);font-size:12.5px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;border-top:1px solid var(--line);padding-top:18px}
.pager a{display:grid;gap:2px;padding:6px 0}
.pager a span{font:400 11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.pager a b{font-weight:500}
.pager a:hover b{color:var(--accent)}
.pager .next{text-align:right}
aside.toc{position:sticky;top:76px;align-self:start;font-size:12.5px}
aside.toc h5{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 8px}
aside.toc a{display:block;padding:3px 0 3px 10px;border-left:1px solid var(--line);color:var(--muted)}
aside.toc a:hover,aside.toc a.on{color:var(--fg);border-left-color:var(--fg)}
/* map */
.mapwrap{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 8px}
.map{display:block}
.map .edge{fill:none;stroke:var(--line);stroke-width:1.2}
.map .edge.hot{stroke:var(--accent);stroke-width:1.8}
.map .node rect{fill:var(--bg);stroke:var(--faint);stroke-width:1}
.map .node text{fill:var(--fg);font:500 12px var(--sans)}
.map .node .cn{fill:var(--faint);font:400 9.5px var(--mono)}
.map .node.done rect{fill:var(--accent-weak);stroke:var(--done)}
.map .node.hot rect{stroke:var(--accent);stroke-width:1.8}
.map .node.dim{opacity:.35}
.map .node{cursor:pointer}
.map .tier{fill:var(--faint);font:400 10px var(--mono)}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--faint);border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend i.d{background:var(--accent-weak);border-color:var(--done)}
.chapters{list-style:none;margin:0;padding:0;counter-reset:c}
.chapters li{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:baseline}
.chapters li:last-child{border-bottom:1px solid var(--line)}
.chapters .n{font:400 12px var(--mono);color:var(--faint)}
.chapters b{font:500 16px var(--sans)}
.chapters b a:hover{color:var(--accent)}
.chapters p{grid-column:2;margin:0;font:400 calc(var(--fs) - 2px)/1.6 var(--serif);color:var(--muted)}
.chapters .pc{font:400 12px var(--mono);color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;font:400 12px var(--mono);color:var(--muted);margin:6px 0 4px}
.stats b{display:block;font:500 22px var(--sans);color:var(--fg);letter-spacing:-.02em}
.day{margin-top:36px}
.day h2{margin-top:0}
.empty{color:var(--muted);font:400 var(--fs)/1.7 var(--serif)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.filter button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.filter button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start;margin-top:14px}
.mapgrid .mapwrap{margin:0}
.map .node.sel rect{stroke:var(--fg);stroke-width:2}
.legend i.s{border-color:var(--accent);border-width:2px}
.pathpanel{position:sticky;top:70px;border-left:1px solid var(--line);padding-left:20px;font-size:13.5px;max-height:calc(100vh - 100px);overflow:auto}
.pathpanel h5{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 6px}
.pp-title{display:block;font:600 16px/1.3 var(--sans);margin-bottom:4px}
.pp-sum,.pp-empty{color:var(--muted);margin:0 0 12px;font:400 calc(var(--fs) - 3px)/1.6 var(--serif)}
.pp{list-style:none;margin:0;padding:0;position:relative}
.pp::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;border-left:1px dashed var(--line)}
.pp a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:4px 0;align-items:baseline;position:relative}
.pp a:hover span:nth-child(2){color:var(--accent)}
.pp .pn{font:400 10.5px var(--mono);color:var(--faint);background:var(--bg);text-align:center}
.pp .pt{font:400 10.5px var(--mono);color:var(--faint)}
.pp li.ok span:nth-child(2){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.pp li.ok .pt{color:var(--done)}
.pp li.target a{font-weight:600}
.pp-next{display:flex;flex-wrap:wrap;gap:6px}
.pp-next a{border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12.5px}
.pp-next a:hover{border-color:var(--accent);color:var(--accent)}
.pp-open{display:inline-block;margin-top:16px;color:var(--accent);font-weight:500}
.fitnote{margin:12px 0 0;font:400 calc(var(--fs) - 2px)/1.6 var(--serif);color:var(--muted)}
.fitnote a{color:var(--accent)}
.studyfirst{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.caps .steps{margin:8px 0 6px;padding-left:20px;font:400 calc(var(--fs) - 2px)/1.6 var(--serif)}
.caps .uses{font:400 12px var(--mono)!important;color:var(--faint)!important}
.caps .uses a{color:var(--accent)}
@media (max-width:1180px){.mapgrid{grid-template-columns:1fr}.pathpanel{order:-1;position:static;border-left:0;border-top:1px solid var(--line);padding:16px 0 0;max-height:none}}
.phasehd{font:600 11px var(--sans);color:var(--fg);margin:18px 8px 8px;padding-top:12px;border-top:1px solid var(--line)}
.phasehd:first-of-type{border-top:0;padding-top:0}
.focusnote{margin:0 8px 10px;font-size:12.5px;color:var(--muted)}
.focusnote button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:12.5px}
.focusbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.focusbtn[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.map .node.ctx rect{stroke-dasharray:3 3;fill:transparent}
.map .node.ctx text{fill:var(--muted)}
.legend i.c{border-style:dashed}
.phasebar{display:flex;gap:6px;margin:26px 0 18px;align-items:flex-end}
.seg2{flex:1;height:44px;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.seg2 i{position:absolute;left:0;right:0;bottom:0;background:var(--accent-weak)}
.seg2 span{position:relative;font:400 11px var(--mono);color:var(--muted);padding-bottom:4px}
.seg2.now{border-color:var(--fg)}
.seg2.now span{color:var(--fg);font-weight:500}
.continue{border-left:2px solid var(--accent);padding:6px 0 6px 18px;display:grid;gap:6px;max-width:68ch}
.continue a{display:grid;gap:2px}
.continue a b{font:600 20px/1.3 var(--sans);letter-spacing:-.01em}
.continue a:hover b{color:var(--accent)}
.continue a span{font:400 calc(var(--fs) - 1px)/1.6 var(--serif);color:var(--muted)}
.continue .muted{font:400 12px var(--mono);color:var(--faint)}
.phases{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:30px}
.phase .ph-hd{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:baseline}
.ph-n{font:500 13px var(--mono);color:var(--faint)}
.phase.now .ph-n{color:var(--accent)}
.ph-t b{display:block;font:600 18px/1.3 var(--sans)}
.ph-t span{font:400 calc(var(--fs) - 2px)/1.55 var(--serif);color:var(--muted)}
.ph-s{font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.phase .bar{height:3px;background:var(--line);margin:10px 0 6px 52px;border-radius:2px;overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--done)}
.ph-topics{list-style:none;margin:0 0 0 52px;padding:0}
.ph-topics a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:14px}
.ph-topics a:hover span:nth-child(2){color:var(--accent)}
.ph-topics .pn,.ph-topics .pt{font:400 11px var(--mono);color:var(--faint)}
.ph-topics li.ok span:nth-child(2){color:var(--muted)}
.ph-topics li.ok .pt{color:var(--done)}
.ph-topics li.cur a{font-weight:600}
.ph-topics li.cur .pt{color:var(--accent)}
.phase.later .ph-topics,.phase.done .ph-topics{display:none}
.phase.later .ph-hd,.phase.opt .ph-hd{opacity:.75}
.phase.later:hover .ph-topics,.phase.done:hover .ph-topics{display:block}
.milestone{margin:10px 0 0 52px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13.5px}
.milestone span{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.milestone a{color:var(--accent)}
@media (max-width:860px){.phase .bar,.ph-topics,.milestone{margin-left:0}.phase .ph-hd{grid-template-columns:32px minmax(0,1fr)}.ph-s{grid-column:2}}
.continue.alongside{margin-top:14px;border-left-color:var(--faint)}
.method h3{font:600 16px var(--sans);margin:28px 0 8px}
.method ul,.method ol{font:400 var(--fs)/1.7 var(--serif);padding-left:22px}
.method li{margin:3px 0}
.method .warn li::marker{content:"✕  ";color:var(--faint)}
.secchip{color:var(--accent)}
.lang{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.lang.ar{color:var(--accent);border-color:var(--accent)}
.ph-note{margin:6px 0 4px 52px;display:grid;gap:4px;font:400 calc(var(--fs) - 3px)/1.55 var(--serif);color:var(--muted)}
.ph-note b{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-right:8px}
@media (max-width:860px){.ph-note{margin-left:0}}
.tt-det{margin:8px 0 0 52px}.tt-det summary{cursor:pointer;font:500 12px var(--mono);color:var(--accent);padding:4px 0}
.tt{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 4px}
.tt th{text-align:left;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.tt td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top;font:400 calc(var(--fs) - 2.5px)/1.55 var(--serif)}
.tt td:first-child{font:500 12.5px var(--sans);white-space:nowrap;color:var(--fg)}
.tt td.n{font:400 12px var(--mono);color:var(--muted);text-align:right;width:44px}
.tt tr.tot td{color:var(--muted);border-bottom:0}
.tt-wk-h{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:12px 0 4px}
.tt-wk{margin:0;padding-left:20px;font:400 calc(var(--fs) - 2.5px)/1.6 var(--serif);color:var(--muted)}
@media (max-width:860px){.tt-det{margin-left:0}.tt td:first-child{white-space:normal}}
.scrim{display:none}
@media (max-width:1100px){.page{grid-template-columns:minmax(0,1fr)}aside.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .index{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:40;background:var(--bg);transform:translateX(-105%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}

"al-Ṭuruq al-Ḥukmiyyah (Ibn al-Qayyim)","note":"Commentary on Ibn al-Qayyim's work on judicial procedure and governance."},{"t":"شرح الطرق الحكمية لابن القيم","u":"https://www.youtube.com/playlist?list=PLjS8vUSnFM1cZi-jVsn5LWGm2NEB13r7A","by":"ʿAbd al-Muḥsin al-ʿUbaykān (قناة معالي الشيخ عبدالمحسن بن ناصر العبيكان)","lang":"ar","section":"fiqh","topics":["f_siyasa"],"level":"Advanced","eps":47,"text":"al-Ṭuruq al-Ḥukmiyyah (Ibn al-Qayyim)","note":"A former judge explains Ibn al-Qayyim's book on judicial method."},{"t":"دروس التاريخ الاسلامي","u":"https://www.youtube.com/playlist?list=PLb63v947e97gSgjv5X8aABL3l7AwvEukQ","by":"ʿAbd al-Hādī al-ʿAjmī (ا. د عبدالهادي العجمي Alajmi)","lang":"ar","section":"history","topics":["h_rashidun","h_umayyad"],"level":"Beginner","eps":27,"text":null,"note":"Islamic history lessons by a Kuwait University history professor."},{"t":"محاضرات في التاريخ","u":"https://www.youtube.com/playlist?list=PL_Jhbl9xiz5BXgq7fl3RLsG_beMkuF2zj","by":"Jāsim al-Jazzāʿ (د.جاسم الجزاع)","lang":"ar","section":"history","topics":["h_abbasid"],"level":"Intermediate","eps":42,"text":null,"note":"Lectures on Islamic history by a Kuwaiti historian."},{"t":"الحروب الصليبية | الجزء الأول | راغب السرجاني","u":"https://www.youtube.com/playlist?list=PL4aBqnO2MtcHiQoMfmAKouzmMPb-1tKQv","by":"Rāghib al-Sirjānī (أرشيف الشيخ راغب السرجاني)","lang":"ar","section":"history","topics":["h_crusades"],"level":"Beginner","eps":30,"text":null,"note":"Part one of a series on the Crusades."},{"t":"التتار من البداية إلى عين جالوت | الطويلة | راغب السرجاني","u":"https://www.youtube.com/playlist?list=PL4aBqnO2MtcEnRD23aRpJlHftgj4ELcwZ","by":"Rāghib al-Sirjānī (أرشيف الشيخ راغب السرجاني)","lang":"ar","section":"history","topics":["h_crusades","h_mamluk"],"level":"Beginner","eps":12,"text":null,"note":"The Mongols from their rise to ʿAyn Jālūt."},{"t":"شرح رسالة العواصم من القواصم ـ الشيخ أحمد نبيل","u":"https://www.youtube.com/playlist?list=PLCm4BtzsiNtk","by":"Aḥmad Nabīl (القناة الرسمية للشيخ أحمد نبيل)","lang":"ar","section":"history","topics":["h_rashidun","pr_sahabah"],"level":"Intermediate","eps":10,"text":"al-ʿAwāṣim min al-Qawāṣim (Ibn al-ʿArabī)","note":"Commentary on Ibn al-ʿArabī's defence of the Companions in the fitnah."},{"t":"أبجديات الثقافة الإسلامية للجيل الصاعد | زمن الخلفاء الراشدين (مكتمل)","u":"https://www.youtube.com/playlist?list=PLZmiPrHYOIsTP-651thcJpso1vEyPNO7l","by":"Aḥmad al-Sayyid (أحمد السيد)","lang":"ar","section":"history","topics":["h_rashidun"],"level":"Beginner","eps":12,"text":null,"note":"A short complete course on the era of the Rightly Guided Caliphs, aimed at young learners."},{"t":"سلسلة مجموعة طالب العلم وآداب العالم والمتعلم | لمعالي الشيخ صالح آل الشيخ","u":"https://www.youtube.com/playlist?list=PLwGGPf452JoJTe4enes123hjYQbdTlE-Z","by":"Ṣāliḥ Āl al-Shaykh (تراث الشيخ صالح آل الشيخ)","lang":"ar","section":"method","topics":["adab_talib","ilm"],"level":"Beginner","eps":25,"text":null,"note":"A series of talks on the student of knowledge and the manners of teacher and learner."},{"t":"سلسلة شرح رسالة آداب المعلمين والمتعلمين | الشيخ الدكتورعبدالله بن عبدالرحيم البخاري","u":"https://www.youtube.com/playlist?list=PL7ki-jrMCgAB7_Dp4GvNP2_0IgK-p9OuN","by":"ʿAbd Allāh al-Bukhārī (قناة ميراث الأنبياء المرئية)","lang":"ar","section":"method","topics":["adab_talib"],"level":"Beginner","eps":11,"text":"Ādāb al-Muʿallimīn","note":"A short commentary on a classic epistle on the manners of teachers and students."}],"chapters":[{"id":"fard","title":"Farḍ ʿayn: what every Muslim must know","level":"Intermediate","intro":"Basic creed, purification, prayer, fasting, the fiqh of women, ḥalāl and ḥarām, and the Prophet ﷺ. Learn these before the sciences.","phase":0,"optional":false,"topics":[{"id":"fa_aqidah","title":"Basic creed: the six pillars of īmān","short":"Six pillars of īmān","level":"Beginner","section":"aqidah","why":"The six pillars of faith are the minimum creed every Muslim must hold with conviction, and a short primer text teaches them in an ordered, memorable way.","mins":900,"pre":[],"ideas":["The six pillars come from the Ḥadīth of Jibrīl (Muslim 8): belief in Allah, His angels, His books, His messengers, the Last Day, and qadar, its good and its bad. The same ḥadīth separates islām (outward submission), īmān (inward belief) and iḥsān (worshipping Allah as though you see Him).","Sunni schools define īmān differently. Māturīdīs and most Ḥanafīs define it as assent of the heart (with affirmation by the tongue), so deeds are its fruit and its essence does not increase or decrease; Ashʿarīs also centre it on assent but many accept that it grows stronger or weaker; Atharīs and most ḥadīth scholars define it as belief, speech and action that increases and decreases. All three agree that a Muslim who commits a major sin does not leave Islam, against the Khawārij and the Muʿtazilah.","Classical primers frame the same content in different ways. al-Nasafī's ʿAqāʾid (Māturīdī) and the Ashʿarī poems ʿAqīdat al-ʿAwāmm and al-Kharīdah al-Bahiyyah list what is necessary, impossible and possible for Allah and for the messengers; al-Uṣūl al-Thalāthah of Muḥammad ibn ʿAbd al-Wahhāb (Atharī) is built on the three questions of the grave and stresses tawḥīd in worship.","Farḍ ʿayn creed means knowing and firmly believing the content of these pillars, not mastering kalām. Later Ashʿarī manuals debate the faith of the muqallid, who believes without knowing a proof; the prevailing view among them is that such faith is valid, though some held that a capable person who neglects reflection is sinful."],"callout":["Method","Learn one primer thoroughly with a teacher from your community, memorizing its key lines. Then read a primer from another Sunni school and note how much of the content is shared before looking at where they differ."],"lectures":[{"t":"Lessons in Divine Unity: An Explanation of Muslim Creed","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5EjWDYiUp1xKu3Ckaf3SgOH","by":"Omar Popal (SeekersGuidance)"},{"t":"Aqeedah, Semester 1 (Zad Academy English)","u":"https://www.youtube.com/playlist?list=PLDOc9rkFwfwAiQZnIqJ6hPrOjjd0Bwcah","by":"Ibrahim Zidan (Zad Academy)"},{"t":"Sharḥ al-Kharīdah al-Bahiyyah (Arabic, 43 lessons)","u":"https://www.youtube.com/playlist?list=PLGrJQVLFsooCng6LMQvgn9DYphUMNI23t","by":"Mukhtār Muḥsin (AzharTv)"}],"papers":[{"t":"The Ḥadīth of Jibrīl (Forty Ḥadīth, no. 2)","u":"https://sunnah.com/nawawi40:2","by":"al-Nawawī (sunnah.com)"},{"t":"A Commentary on the Creed of Islam: al-Taftāzānī on the creed of al-Nasafī (library loan)","u":"https://archive.org/details/commentaryoncree0000masd","by":"al-Nasafī and al-Taftāzānī (trans. Earl Edgar Elder, 1950)"},{"t":"The Foundations of the Articles of Faith (Iḥyāʾ, Book 2), an Ashʿarī creed","u":"https://ghazali.org/works/gz-faith.htm","by":"al-Ghazālī (trans. Nabih Amin Faris)"},{"t":"The Three Fundamental Principles of Islam and Their Proofs (al-Uṣūl al-Thalāthah)","u":"https://d1.islamhouse.com/data/en/ih_books/single3/en-three-fundamental-principles.pdf","by":"Muḥammad ibn ʿAbd al-Wahhāb (IslamHouse, free distribution)"}],"reads":[{"t":"The Muslim Creed: Its Genesis and Historical Development","u":"https://archive.org/details/WensinckMc1932","by":"A. J. Wensinck (1932)"},{"t":"Faith & Certainty (In Pursuit of Conviction I)","u":"https://yaqeeninstitute.org/read/paper/in-pursuit-of-conviction-i-faith-certainty","by":"Zohair Abdul-Rahman (Yaqeen Institute)"}],"projects":[{"n":"Six-pillar evidence table","l":"Beginner","d":"Make a table with one row per pillar: a Qurʾān verse, a ḥadīth, and one sentence on what the pillar requires you to believe. Keep it as a memorization sheet."},{"n":"Three primers compared","l":"Beginner","d":"Copy how al-Nasafī, al-Ghazālī's Foundations and al-Uṣūl al-Thalāthah define or present īmān, with page references. Write half a page listing what they share and where their framing differs."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read the Ḥadīth of Jibrīl and the Book of Faith in Bukhārī and Muslim."}]},{"id":"b_worship","title":"Fiqh of worship: purification & prayer","short":"Purity & prayer","level":"Beginner","why":"Purification and the five daily prayers are personal obligations, and learning them from one madhhab's primer is the traditional first step in fiqh.","mins":1500,"pre":[],"ideas":["Jurists grade actions as obligatory, recommended, permitted, disliked or forbidden. Ḥanafīs further separate farḍ (established by decisive proof) from wājib (established by probable proof): in prayer, missing a farḍ invalidates it, while forgetting a wājib is repaired by the prostration of forgetfulness (sujūd al-sahw).","The integrals of wuḍūʾ differ by school. Ḥanafīs count four (washing the face, the arms to the elbows, wiping a quarter of the head, washing the feet); Shāfiʿīs count six by adding intention and correct order; Mālikīs count seven (adding intention, rubbing (dalk) and continuity); Ḥanbalīs count six (adding order and continuity, with intention as a condition).","Conditions of prayer (shurūṭ) are met before and throughout it: purity, covering the ʿawrah, entry of the time, facing the qiblah and (for Ḥanafīs and Ḥanbalīs) intention; Shāfiʿīs and Mālikīs count intention among the integrals. Integrals (arkān) are acts within the prayer, such as standing, recitation, bowing and prostration. Knowing which category a mistake belongs to tells you whether a prayer must be repeated.","Beginners study one school's short manual rather than comparing all opinions at once. Common choices are Nūr al-Īḍāḥ by al-Shurunbulālī (d. 1069/1659) for Ḥanafīs, Safīnat al-Najā or Matn Abī Shujāʿ for Shāfiʿīs, Mukhtaṣar al-Akhḍarī for Mālikīs, and ʿUmdat al-Fiqh of Ibn Qudāmah for Ḥanbalīs."],"callout":["Pitfall","Do not mix rulings from different schools while learning the basics. Finish one primer in one madhhab, then learn where others differ and why. Al-Ghazālī's books on purity and prayer explain the inner meaning of worship and follow Shāfiʿī rulings, so read them after your primer, not as one."],"lectures":[{"t":"Shurunbulālī's Nūr al-Īḍāḥ Explained (00a: Introduction; series continues on the channel)","u":"https://www.youtube.com/watch?v=gZN7JcaBJXE","by":"Faraz Rabbani (SeekersGuidance), Ḥanafī"},{"t":"Ship of Salvation: Ḥaḍramī's Primer on the Shāfiʿī School (Safīnat al-Najā)","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5GAZ0arhiAL5DhebSIVcj4Q","by":"Irshaad Sedick (SeekersGuidance), Shāfiʿī"},{"t":"Mālikī fiqh of al-Akhḍarī: full explanation of the beginner's text","u":"https://www.youtube.com/watch?v=bfQwoJYw4c8","by":"Rami Nsour (The Light Alliance), Mālikī"}],"papers":[{"t":"Ḥanafī: The Light of Clarification (Nūr al-Īḍāḥ) in English","u":"https://imamghazali.co/products/the-light-of-clarification-nur-al-idah","by":"al-Shurunbulālī (trans. Bilal Brown), Imam Ghazali Publishing (print)"},{"t":"Shāfiʿī: The Ultimate Conspectus (Matn Abī Shujāʿ) in English with the Arabic","u":"https://islamosaic.com/publications/the-ultimate-conspectus/","by":"Abū Shujāʿ al-Iṣfahānī (trans. Musa Furber), Islamosaic (print and ebook)"},{"t":"Mālikī: The Abridgment of al-Akhḍarī, student workbook (free, CC BY-NC-ND)","u":"https://archive.org/details/alhamra-institute-the-abridgment-of-al-akhdari-student-workbook","by":"ʿAbd al-Raḥmān al-Akhḍarī (Alhamra Institute)"},{"t":"Ḥanbalī: Commentary on ʿUmdat al-Fiqh, purification to funerals (free English PDF)","u":"https://islamcontent.com/en/content/61085","by":"Ibn Qudāmah, explained by Hatem al-Haj (IslamContent)"}],"reads":[{"t":"Worship in Islam: The Book of the Secrets of Prayer (Iḥyāʾ, Book 4), the inner dimensions of prayer, after your primer","u":"https://ghazali.org/books/worship.pdf","by":"Abū Ḥāmid al-Ghazālī (trans. E. E. Calverley)"},{"t":"The Mysteries of Purity (Iḥyāʾ ʿUlūm al-Dīn, Book 3), the inner dimensions of purity, after your primer","u":"https://ghazali.org/books/purity.pdf","by":"Abū Ḥāmid al-Ghazālī (trans. N. A. Faris)"},{"t":"Why Does God Ask for Worship?","u":"https://yaqeeninstitute.org/read/paper/why-does-god-ask-for-worship","by":"Mohammad Elshinawy (Yaqeen Institute)"}],"projects":[{"n":"Prayer rulings table","l":"Beginner","d":"Build a table of every act of prayer in your chosen madhhab, marking each as condition, integral, necessary or sunnah, with the consequence of omitting it."},{"n":"Two-school wuḍūʾ comparison","l":"Intermediate","d":"After finishing your primer, write a one-page comparison of wuḍūʾ (integrals and nullifiers) in your school and one other school, citing the text and chapter for each point."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Arabic and English texts of the major ḥadīth collections, searchable by collection, book and number."}],"section":"fiqh"},{"id":"fa_women","title":"Fiqh of women: ḥayḍ, nifās and istiḥāḍah","short":"Ḥayḍ & nifās","level":"Beginner","section":"fiqh","why":"The validity of a woman's prayer, fasting and ṭawāf depends on telling menstrual, postnatal and irregular bleeding apart, so this is personally obligatory knowledge for women and needed by anyone who teaches or advises them.","mins":600,"pre":["b_worship"],"ideas":["Ḥayḍ is blood from the womb at its regular times in a woman of age, nifās is bleeding after childbirth, and istiḥāḍah is bleeding outside the limits of both, treated as an ailment. The Prophet ﷺ told Fāṭimah bint Abī Ḥubaysh that istiḥāḍah is 'a vein, not menstruation', so a woman with it still prays and fasts (Bukhārī).","During ḥayḍ and nifās prayer is not performed and not made up, fasting is suspended and made up later (ʿĀʾishah, Muslim 335), and intercourse and ṭawāf are forbidden (2:222). Reciting the Qurʾān is forbidden in the Ḥanafī, Shāfiʿī and Ḥanbalī schools, while the relied Mālikī view allows a menstruating woman to recite from memory.","The schools set different limits. Ḥanafīs: ḥayḍ lasts 3 to 10 days; Shāfiʿīs and Ḥanbalīs: a day and night up to 15 days; Mālikīs: no minimum for acts of worship and a 15-day maximum. The minimum purity between two periods is 15 days for three schools and 13 for the Ḥanbalīs; the maximum nifās is 40 days for Ḥanafīs and Ḥanbalīs and 60 for Shāfiʿīs and Mālikīs. Ibn Taymiyyah and some later scholars held there are no fixed limits.","For istiḥāḍah the schools rely in different orders on a woman's habit (ʿādah) and on distinguishing the blood by colour and strength (tamyīz). A woman with continuous bleeding performs wuḍūʾ for each prayer time (Ḥanafī, Ḥanbalī) or each obligatory prayer (Shāfiʿī), while Mālikīs hold such bleeding does not necessarily break wuḍūʾ."],"callout":["Pitfall","Mixing numbers from different schools gives contradictory results, for example a Ḥanafī maximum with a Shāfiʿī purity rule. Follow one school's system consistently, keep a written record, and take unclear cases to a qualified teacher."],"lectures":[{"t":"Fiqh of Menstruation Series (Ḥanafī, 10 short lessons)","u":"https://www.youtube.com/playlist?list=PLDZRFIBdj3geigfIMsZR7GmJekyQuy7ee","by":"Naielah Ackbarali (Muslima Coaching)"},{"t":"Fiqh for Muslim Women (seminar and Q&A)","u":"https://www.youtube.com/playlist?list=PL1ABUur57Rl4boz8-zft3ulwTJdlvfZVg","by":"Haifaa Younis (Jannah Institute)"},{"t":"Fiqh of Worship: ʿUmdat al-Fiqh (Ḥanbalī, includes the chapter on ḥayḍ)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqRZce0XPksZ3kvGGkUbsGFA","by":"Hatem al-Haj"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Menstrual Periods (Kitāb al-Ḥayḍ)","u":"https://sunnah.com/bukhari/6","by":"al-Bukhārī (sunnah.com)"},{"t":"Dhukhr al-Mutaʾahhilīn with Ibn ʿĀbidīn's commentary Manhal al-Wāridīn (Arabic, Ḥanafī)","u":"https://shamela.ws/book/151169","by":"al-Birgivī and Ibn ʿĀbidīn (al-Maktabah al-Shāmilah)"},{"t":"The Abridgment of al-Akhḍarī: student workbook (Mālikī; CC BY-NC-ND)","u":"https://archive.org/details/alhamra-institute-the-abridgment-of-al-akhdari-student-workbook","by":"al-Akhḍarī (Alhamra Institute)"},{"t":"al-Fiqh ʿalā al-Madhāhib al-Arbaʿah, chapter on ḥayḍ (Arabic, comparative)","u":"https://shamela.ws/book/9849","by":"ʿAbd al-Raḥmān al-Jazīrī (al-Maktabah al-Shāmilah)"}],"reads":[{"t":"What Is the Difference Between Menstruation and Istihada? (Shāfiʿī)","u":"https://islamqa.org/shafii/seekersguidance-shafii/169957/what-is-the-difference-between-menstruation-and-istihada/","by":"Shazia Ahmad (SeekersGuidance, via IslamQA.org)"},{"t":"Istihada: What Is It? And Examples (Ḥanafī)","u":"https://islamqa.org/hanafi/muslimacoaching/158047/istihada-what-is-it-and-examples/","by":"Naielah Ackbarali (Muslima Coaching, via IslamQA.org)"},{"t":"What is a Madhhab? Exploring the Role of Islamic Schools of Law","u":"https://yaqeeninstitute.org/read/paper/what-is-a-madhhab-exploring-the-role-of-islamic-schools-of-law","by":"Emad Hamdeh (Yaqeen Institute)"}],"projects":[{"n":"Four-school limits table","l":"Beginner","d":"Build a table of the four schools' minimum and maximum ḥayḍ, minimum purity, maximum nifās and the ruling on Qurʾān recitation, citing a source for each cell. Have a teacher review it."},{"n":"Record-keeping template","l":"Beginner","d":"Design a private cycle log (start, end, colour, habit) for the school you follow. Next to each field, note which rule of that school it serves."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read the Books of Menstruation in Bukhārī and Muslim with chapter headings."}]},{"id":"fa_salah2","title":"Jumuʿah, travel prayer and funerals (janāʾiz)","short":"Jumuʿah, travel, janāʾiz","level":"Beginner","section":"fiqh","why":"The Friday prayer, the traveller's concessions and the funeral rites are acts every Muslim meets regularly, and most of their details differ by school.","mins":720,"pre":["b_worship"],"ideas":["Jumuʿah is an individual obligation on adult, sane, free, resident men without excuse (62:9) and replaces ẓuhr; women and travellers are not obliged but their prayer is valid if they attend. Its conditions include the khuṭbah and a congregation, whose minimum differs: forty residents for Shāfiʿīs and Ḥanbalīs, twelve besides the imam for Mālikīs, and three besides the imam for Ḥanafīs.","A traveller shortens four-unit prayers to two (4:101). Most Mālikīs, Shāfiʿīs and Ḥanbalīs set the distance at four burud, roughly 80–89 km, and Ḥanafīs at three days' travel; Ibn Taymiyyah tied it to what custom calls travel. Ḥanafīs make shortening obligatory, while the other schools treat it as a concession. Intending to stay 15 days ends travel status for Ḥanafīs, and four days (excluding arrival and departure) for Mālikīs and Shāfiʿīs.","Combining ẓuhr with ʿaṣr and maghrib with ʿishāʾ while travelling is allowed by Shāfiʿīs, Ḥanbalīs and, with conditions, Mālikīs. Ḥanafīs allow real combining only at ʿArafah and Muzdalifah and otherwise only praying one prayer at the end of its time and the next at the start of its time.","Washing, shrouding, praying over and burying a Muslim are communal obligations (farḍ kifāyah). The funeral prayer has four takbīrs with no bowing or prostration: after the first, Shāfiʿīs and Ḥanbalīs recite al-Fātiḥah, Ḥanafīs a praise (thanāʾ) and Mālikīs supplication. Shāfiʿīs and Ḥanbalīs allow the prayer over an absent person, which Ḥanafīs and Mālikīs generally do not. Grief and tears are permitted; wailing is forbidden."],"callout":["Method","Learn these chapters first from your own school's manual (Safīnat al-Najā, ʿUmdat al-Fiqh, Nūr al-Īḍāḥ or al-Akhḍarī). Then read the same chapters of Ibn Rushd's Bidāyat al-Mujtahid to see which texts each school relied on."],"lectures":[{"t":"Fiqh of Worship: ʿUmdat al-Fiqh (Ḥanbalī; chapters on Jumuʿah, travel and funerals)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqRZce0XPksZ3kvGGkUbsGFA","by":"Hatem al-Haj"},{"t":"Ship of Salvation: Ḥaḍramī's Primer on the Shāfiʿī School (Safīnat al-Najā)","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5GAZ0arhiAL5DhebSIVcj4Q","by":"Irshaad Sedick (SeekersGuidance)"},{"t":"Janaazah Workshop","u":"https://www.youtube.com/watch?v=1wR6D-f97zQ","by":"Hatem al-Haj"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Friday Prayer (Kitāb al-Jumuʿah)","u":"https://sunnah.com/bukhari/11","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Shortening the Prayers (Abwāb Taqṣīr al-Ṣalāh)","u":"https://sunnah.com/bukhari/18","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Funerals (Kitāb al-Janāʾiz)","u":"https://sunnah.com/bukhari/23","by":"al-Bukhārī (sunnah.com)"},{"t":"Bidāyat al-Mujtahid wa Nihāyat al-Muqtaṣid (Arabic; comparative chapters on these prayers)","u":"https://shamela.ws/book/21739","by":"Ibn Rushd (al-Maktabah al-Shāmilah)"}],"reads":[{"t":"The Definition of 'Travel' (safar) According to Islamic Law, Part 1","u":"https://muslimmatters.org/2011/07/01/yasir-qadhi-the-definition-of-%e2%80%98travel%e2%80%99-safar-according-to-islamic-law-part-1/","by":"Yasir Qadhi (MuslimMatters)"},{"t":"The Definition of 'Travel' (safar) According to Islamic Law, Part 3 (length of stay)","u":"https://muslimmatters.org/2011/07/22/yasir-qadhi-the-definition-of-%e2%80%98travel%e2%80%99-safar-according-to-islamic-law-part-3/","by":"Yasir Qadhi (MuslimMatters)"},{"t":"Coping with Grief: A Spiritual and Psychological Guide","u":"https://yaqeeninstitute.org/read/paper/coping-with-grief-a-spiritual-and-psychological-guide","by":"Sarah Sultan and Najwa Awad (Yaqeen Institute)"}],"projects":[{"n":"Traveller and Jumuʿah chart","l":"Beginner","d":"Chart the four schools on travel distance, length of stay, combining and the Jumuʿah congregation minimum, with one source per cell. Have a teacher check it."},{"n":"Funeral prayer checklist","l":"Beginner","d":"Write a step-by-step checklist of the funeral prayer in your school, noting the evidence or manual reference beside each step. Add one line on how the other schools differ at each takbīr."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read the Bukhārī and Muslim chapters on Jumuʿah, travel and funerals."}]},{"id":"b_pillars","title":"Zakāh, fasting and ḥajj: the basics","short":"Zakāh, fast, ḥajj","level":"Beginner","section":"fiqh","why":"Zakāh, fasting and ḥajj are three of the five pillars, and every Muslim needs their basic rulings before studying them in depth.","mins":1200,"pre":["b_worship"],"ideas":["Zakāh is due from a Muslim who owns wealth reaching the niṣāb (commonly given as 85 g of gold or 595 g of silver) for a full lunar year (ḥawl). On cash, gold, silver and trade goods it is one fortieth (2.5%), and it is paid to the eight categories named in 9:60. Zakāt al-fiṭr is a separate, small charity due at the end of Ramaḍān.","Fasting Ramaḍān means abstaining from food, drink and intercourse from true dawn to sunset with an intention. The schools differ on details: Shāfiʿīs require the intention each night, while Ḥanafīs accept it before midday for Ramaḍān fasts.","Missed fasts are made up (qaḍāʾ). Deliberate intercourse in a Ramaḍān day also requires expiation (kaffārah) in all four schools, and Ḥanafīs and Mālikīs extend it to deliberate eating. The traveller and the sick may break the fast and make it up, and those permanently unable pay a fidyah.","Ḥajj is obligatory once in a lifetime on an adult, sane Muslim who is able (3:97). Its core includes iḥrām, standing at ʿArafah on 9 Dhū al-Ḥijjah and the ṭawāf al-ifāḍah, with saʿy counted as a pillar by most schools and as wājib by the Ḥanafīs. It can be performed as ifrād, qirān or tamattuʿ."],"callout":["Method","Learn these from one madhhab's manual first and note where your school differs from others only after the basics are secure. Ask a scholar before calculating your own zakāh or planning ḥajj."],"lectures":[{"t":"The Fiqh of Worship for Youth, Level 2: Rules for Fasting and Zakat","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5EMLR93kGR0Fivb8LiC9rXt","by":"Yama Niazi (SeekersGuidance)"},{"t":"The Fiqh of Zakat (Part 1)","u":"https://www.youtube.com/watch?v=HafU0_6DZFU","by":"Yasir Qadhi"},{"t":"The Fiqh of Hajj and Practical Advice for Hajj, Part 1 of 9","u":"https://www.youtube.com/watch?v=TD9FHmBCz5k","by":"Yasir Qadhi (Memphis Islamic Center)"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Zakāh","u":"https://sunnah.com/bukhari/24","by":"al-Bukhārī"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Fasting","u":"https://sunnah.com/bukhari/30","by":"al-Bukhārī"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Ḥajj","u":"https://sunnah.com/bukhari/25","by":"al-Bukhārī"}],"reads":[{"t":"The Fiqh of Fasting According to the Ḥanafī School (PDF)","u":"https://seekersguidance.org/wp-content/uploads/2026/02/The-Fiqh-of-Fasting-According-to-Hanafi-School-SeekersGuidance_2026.pdf","by":"SeekersGuidance"},{"t":"The Fiqh of Fasting According to the Shāfiʿī School (PDF)","u":"https://seekersguidance.org/wp-content/uploads/2026/02/The-Fiqh-of-Fasting-According-to-Shafi-School-SeekersGuidance_2026.pdf","by":"SeekersGuidance"},{"t":"The Rites of Hajj in Detail","u":"https://www.dar-alifta.org/en/article/details/102/the-rites-of-hajj-in-detail","by":"Dar al-Iftaa al-Misriyyah"}],"projects":[{"n":"Zakāh worksheet","l":"Beginner","d":"Build a one-page zakāh worksheet listing zakatable assets, deductible debts, the niṣāb threshold and the 2.5% calculation, with a source note for each line in your madhhab."},{"n":"Ḥajj day plan","l":"Beginner","d":"Write a day-by-day plan for 8 to 13 Dhū al-Ḥijjah marking each rite as pillar, wājib or sunnah, and note what happens if it is missed."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"National Zakat Foundation: Knowledge","u":"https://nzf.org.uk/knowledge","d":"Short explanations of zakāh rules, niṣāb and eligible recipients."}]},{"id":"fa_halal","title":"Ḥalāl and ḥarām in daily life: food, dress and earnings","short":"Ḥalāl & ḥarām","level":"Beginner","section":"fiqh","why":"What a Muslim eats, wears and earns is governed by clear rules and by a body of disputed questions, and knowing which is which protects both one's religion and one's relations with other Muslims.","mins":720,"pre":["b_worship"],"ideas":["The default rule for foods, objects and customs is permissibility, and only Allah declares something forbidden (5:87, 16:116). The Prophet ﷺ said the ḥalāl is clear, the ḥarām is clear, and between them are doubtful matters that the careful avoid (Forty Ḥadīth no. 6).","The Qurʾān forbids carrion, blood, pork, what is dedicated to other than Allah (5:3) and intoxicants (5:90), and permits the food of the People of the Book (5:5). The schools differ on details: pronouncing Allah's name at slaughter is a condition for Ḥanafīs, Mālikīs and Ḥanbalīs (when not forgotten) but a sunnah for Shāfiʿīs; Ḥanafīs allow only fish from the sea while the other schools allow most sea creatures; and modern stunning and machine slaughter are debated.","Dress: the majority hold a man's ʿawrah is from navel to knee and a woman's before unrelated men is all but the face and hands, while a strand in the Shāfiʿī and Ḥanbalī schools requires covering the face too. Silk and gold are forbidden for men by ḥadīth. Dress worn out of pride, and imitating the other sex, are blamed in the Sunnah.","Earnings must be free of ribā (2:275), gambling, fraud, bribery and excessive uncertainty (gharar), since 'Allah is good and accepts only what is good' (Muslim). In Kitāb al-Ḥalāl wa-l-Ḥarām al-Ghazālī separates the legal minimum from higher degrees of scrupulousness (waraʿ), and warns that obsessive suspicion is itself a fault."],"callout":["Pitfall","Do not present a disputed question, such as a particular meat supply or a modern contract, as clearly ḥalāl or clearly ḥarām. Sort each question into agreed or disputed before forming a view, and ask a qualified scholar for personal cases."],"lectures":[{"t":"Fiqh of Foods and Drinks: ʿUmdat al-Fiqh (Ḥanbalī)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqQaVuW0QdXZnqVzilYvzxtK","by":"Hatem al-Haj"},{"t":"Fiqh of Transactions: ʿUmdat al-Fiqh (Ḥanbalī)","u":"https://www.youtube.com/playlist?list=PLERXZaggdbqTS0dYgVeoslet3Bb-JxDk-","by":"Hatem al-Haj"}],"papers":[{"t":"Kitāb al-Ḥalāl wa-l-Ḥarām, Book 14 of the Iḥyāʾ (Arabic)","u":"https://shamela.ws/book/9472/448","by":"al-Ghazālī (al-Maktabah al-Shāmilah)"},{"t":"The ḥalāl is clear and the ḥarām is clear (Forty Ḥadīth, no. 6)","u":"https://sunnah.com/nawawi40:6","by":"al-Nawawī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Hunting and Slaughtering","u":"https://sunnah.com/bukhari/72","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Dress (Kitāb al-Libās)","u":"https://sunnah.com/bukhari/77","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"The Lawful and the Prohibited in Islam (library loan; a modern survey, some of its rulings are disputed)","u":"https://archive.org/details/lawfulprohibited0000qara","by":"Yūsuf al-Qaraḍāwī (American Trust Publications)"},{"t":"Shafi'i Position on Meat of People of the Book (Ahl al-Kitab) in the West","u":"https://islamqa.org/shafii/qibla-shafii/34063/shafii-position-on-meat-of-people-of-the-book-ahl-al-kitab-in-the-west/","by":"Hamza Karamali (Qibla, via IslamQA.org)"},{"t":"Is Hijab Religious or Cultural? How Islamic Rulings Are Formed","u":"https://yaqeeninstitute.org/read/paper/is-hijab-religious-or-cultural-how-islamic-rulings-are-formed","by":"Tesneem Alkiek (Yaqeen Institute)"}],"projects":[{"n":"Agreed or disputed?","l":"Beginner","d":"List ten everyday foods, garments or transactions and sort each into agreed ḥalāl, agreed ḥarām or disputed, with the evidence and a source for each position. A teacher reviews the sorting; no rulings are issued."},{"n":"Degrees of waraʿ","l":"Beginner","d":"Summarize al-Ghazālī's degrees of scrupulousness from Kitāb al-Ḥalāl wa-l-Ḥarām in your own words, with one everyday example for each degree."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com","d":"Read the books on food, slaughter, drinks, dress and sales in Bukhārī and Muslim."}]},{"id":"b_seerah","title":"Sīrah: the life of the Prophet ﷺ","short":"Sīrah","level":"Beginner","why":"The Prophet's ﷺ life is the context for the Qurʾān and the Sunnah, and its chronology is assumed in every other Islamic science.","mins":3000,"pre":[],"ideas":["Sīrah draws on the Qurʾān, the ḥadīth collections and early biographical works, chiefly Ibn Isḥāq (d. c. 150/767) as edited by Ibn Hishām (d. 218/833) and the maghāzī of al-Wāqidī. Scholars traditionally accepted more lenient chains for narrative detail than for legal rulings, so a reader should ask where each report comes from.","The Makkan period (c. 610 to 622) centres on tawḥīd, persecution, the migrations to Abyssinia, the Year of Sorrow, the journey to al-Ṭāʾif and the Night Journey. The Hijrah of 622 begins the Islamic calendar.","The Madinan period builds a community: the brotherhood of the Muhājirūn and Anṣār, the Ṣaḥīfah (often called the 'Constitution of Madinah'), Badr (2 AH), Uḥud (3 AH), the Trench (5 AH), the Treaty of al-Ḥudaybiyah (6 AH), the conquest of Makkah (8 AH) and the Farewell Pilgrimage (10 AH), before his death in 11 AH / 632.","Shamāʾil literature, such as al-Tirmidhī's al-Shamāʾil al-Muḥammadiyyah, records the Prophet's ﷺ appearance, manners and daily habits. It complements the event-based sīrah and is the classical basis for love and imitation of him."],"callout":["Method","Keep a timeline while you study, and for each major event note which Qurʾānic passages relate to it. This links sīrah to tafsīr from the start."],"lectures":[{"t":"Seerah of Prophet Muhammad ﷺ (full series)","u":"https://www.youtube.com/playlist?list=PLAEA99D24CA2F9A8F","by":"Yasir Qadhi"},{"t":"Sira of Surprises (Sira Series)","u":"https://www.youtube.com/watch?v=5aKuzEAczUI","by":"Abdal Hakim Murad (Cambridge Central Mosque)"}],"papers":[{"t":"The Sealed Nectar (al-Raḥīq al-Makhtūm)","u":"https://darussalam.uk/products/the-sealed-nectar-ar-raheeq-al-makhtoum","by":"Ṣafī al-Raḥmān al-Mubārakpūrī (Darussalam, print)"},{"t":"al-Shamāʾil al-Muḥammadiyyah","u":"https://sunnah.com/shamail","by":"al-Tirmidhī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Military Expeditions (Kitāb al-Maghāzī)","u":"https://sunnah.com/bukhari/64","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"The 'Constitution' of Medina: Translation, Commentary, and Meaning Today","u":"https://yaqeeninstitute.org/read/paper/the-constitution-of-medina-translation-commentary-and-meaning-today","by":"Ovamir Anjum (Yaqeen Institute)"},{"t":"Muhammad: His Life Based on the Earliest Sources","u":"https://its.org.uk/catalogue/muhammad-his-life-based-on-the-earliest-sources/","by":"Martin Lings (Islamic Texts Society, print)"}],"projects":[{"n":"Annotated timeline","l":"Beginner","d":"Make a year-by-year timeline from 570 to 632 with at least 30 events, each tagged with its source (Qurʾān, Bukhārī, Ibn Hishām or a modern work)."},{"n":"Battle source comparison","l":"Intermediate","d":"Choose Badr or al-Ḥudaybiyah and write a two-page account comparing what the Qurʾān, Ṣaḥīḥ al-Bukhārī and al-Raḥīq al-Makhtūm each say."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Arabic and English texts of the major ḥadīth collections, searchable by collection, book and number."}],"section":"prophet"},{"id":"b_forty","title":"The Forty Ḥadīth of al-Nawawī","short":"Nawawī's Forty","level":"Beginner","why":"al-Nawawī's Forty gathers short ḥadīth on which the religion turns, and it is the traditional first ḥadīth text to memorise and study with commentary.","mins":1800,"pre":[],"ideas":["Ibn al-Ṣalāḥ dictated 26 'comprehensive' ḥadīth (jawāmiʿ al-kalim). al-Nawawī (d. 676/1277) expanded this to 42, and Ibn Rajab (d. 795/1393) added eight more to make fifty in his commentary Jāmiʿ al-ʿUlūm wa al-Ḥikam.","The first ḥadīth, 'Actions are only by intentions', was described by early scholars such as al-Shāfiʿī and Aḥmad as a third of knowledge, because intention governs the validity and reward of every act.","The Ḥadīth of Jibrīl (No. 2) defines islām, īmān and iḥsān. Classical scholars read it as a map of the religion: outward practice (fiqh), belief (ʿaqīdah) and inner excellence (tazkiyah).","Most of the collection comes from al-Bukhārī and Muslim, but not all of it. Ibn Rajab himself discusses weakness in a few chains, such as No. 41, which shows that commentaries also teach how to assess a report."],"callout":["Method","Memorise each ḥadīth in Arabic with its narrator and source before reading the commentary, then write down one legal and one spiritual lesson from it."],"lectures":[{"t":"Imam Nawawī's Forty Ḥadīth: The Axis of Faith","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5FAiK4TEjNXPTQzj8p352hs","by":"Abdullah Anik Misra (SeekersGuidance)"},{"t":"40 Hadith of Imam Nawawi","u":"https://www.youtube.com/playlist?list=PLgcTs9YAg998D_pQSLPWwJt6nsNI1mN2o","by":"Muhammad al-Yaqoubi"}],"papers":[{"t":"al-Arbaʿūn al-Nawawiyyah (Arabic and English)","u":"https://sunnah.com/nawawi40","by":"al-Nawawī (sunnah.com)"},{"t":"Jāmiʿ al-ʿUlūm wa al-Ḥikam (Arabic)","u":"https://shamela.ws/book/10443","by":"Ibn Rajab al-Ḥanbalī (al-Maktabah al-Shāmilah)"},{"t":"The Compendium of Knowledge and Wisdom","u":"https://darussalam.com/the-compendium-of-knowledge-and-wisdom","by":"Ibn Rajab al-Ḥanbalī (trans. Abdassamad Clarke, Turath, print)"}],"reads":[{"t":"Islām, Īmān, Iḥsān: Climbing the Spiritual Mountain","u":"https://yaqeeninstitute.org/read/paper/islam-iman-ihsan-climbing-the-spiritual-mountain","by":"Yaqeen Institute"},{"t":"Authenticating Hadith and the History of Hadith Criticism","u":"https://yaqeeninstitute.org/read/paper/authenticating-hadith-and-the-history-of-hadith-criticism","by":"Jonathan A.C. Brown (Yaqeen Institute)"},{"t":"Can We Trust Hadith Literature? Understanding the Processes of Transmission and Preservation","u":"https://yaqeeninstitute.org/read/paper/can-we-trust-hadith-literature-understanding-the-process-of-transmission-and-preservation","by":"Muntasir Zaman (Yaqeen Institute)"}],"projects":[{"n":"Ḥadīth notebook","l":"Beginner","d":"For each ḥadīth, record the Arabic text, the Companion who narrated it, its source collection, and two lessons drawn from Ibn Rajab or a lecture."},{"n":"Theme map","l":"Intermediate","d":"Group the 42 ḥadīth under the headings islām, īmān, iḥsān and social conduct, and write a short paragraph explaining each grouping."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Arabic and English texts of the major ḥadīth collections, searchable by collection, book and number."}],"section":"hadith"},{"id":"b_heart","title":"Purification of the heart: the basics","short":"Heart basics","level":"Beginner","why":"Tazkiyah is the discipline of purifying the heart of blameworthy traits, and it gives worship and learning their sincerity and purpose.","mins":1800,"pre":["b_forty"],"ideas":["The Qurʾān says 'He has succeeded who purifies it, and he has failed who corrupts it' (91:9–10), and the Prophet ﷺ said that the whole body is sound when the heart (qalb) is sound (Nawawī No. 6). The heart here means the seat of intention, belief and moral choice, not only the physical organ.","Imam Mawlūd's poem Maṭharat al-Qulūb, translated by Hamza Yusuf as Purification of the Heart, treats diseases such as envy, ostentation (riyāʾ), arrogance and love of the world. Each is defined, its causes named, and a cure given that combines knowledge with practice.","Repentance (tawbah) is the first station. Scholars list its conditions as stopping the sin, regretting it and resolving not to return, plus restoring others' rights where a person was wronged.","Hope (rajāʾ) and fear (khawf) must be held together. Too much fear leads to despair and too much hope to complacency, so classical authors such as al-Ghazālī treat balance between them as a sign of a healthy heart."],"callout":["Pitfall","Use these texts to examine yourself, not to diagnose others. The classical authors warn that judging other people's hearts is itself a disease of the heart."],"lectures":[{"t":"Purification of the Heart for Youth: Diseases of the Heart and Their Cure","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5FoVFf14FS6QTnrGGyPbFYY","by":"Yama Niazi (SeekersGuidance)"}],"papers":[{"t":"Purification of the Heart: Signs, Symptoms and Cures of the Spiritual Diseases of the Heart","u":"https://www.islamicbookstore.com/b8118.html","by":"Imam Mawlūd (trans. and comm. Hamza Yusuf, Sandala, print)"},{"t":"Riyāḍ al-Ṣāliḥīn","u":"https://sunnah.com/riyadussalihin","by":"al-Nawawī (sunnah.com)"},{"t":"The Marvels of the Heart (Iḥyāʾ ʿUlūm al-Dīn, Book 21)","u":"http://www.ghazali.org/books/skillie.pdf","by":"Abū Ḥāmid al-Ghazālī (trans. W. J. Skellie, PhD thesis)"}],"reads":[{"t":"The Spiritual Psychology of Worship","u":"https://yaqeeninstitute.org/read/paper/the-spiritual-psychology-of-worship","by":"Zohair Abdul-Rahman (Yaqeen Institute)"},{"t":"Repentance as a Way of Life: Islam, Spirituality, & Practice","u":"https://yaqeeninstitute.org/read/paper/repentance-as-a-way-of-life-islam-spirituality-practice","by":"Roohi Tahir (Yaqeen Institute)"}],"projects":[{"n":"Disease and cure table","l":"Beginner","d":"Make a table of ten diseases from Purification of the Heart, giving for each its definition, one root cause, and the cure the text recommends."},{"n":"Riyāḍ al-Ṣāliḥīn journal","l":"Beginner","d":"Read the first chapters of Riyāḍ al-Ṣāliḥīn (sincerity, repentance, patience) and write a weekly half-page on one ḥadīth and how you will act on it."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Arabic and English texts of the major ḥadīth collections, searchable by collection, book and number."}],"section":"tazkiyah"},{"id":"b_adhkar","title":"Daily dhikr and duʿāʾ: al-Adhkār and Ḥiṣn al-Muslim","short":"Dhikr and duʿāʾ","level":"Beginner","section":"tazkiyah","why":"The transmitted remembrances and supplications give shape to the believer's day and are the most practical part of the sunnah to adopt early.","mins":600,"pre":["b_heart"],"ideas":["al-Nawawī's (d. 676 AH) al-Adhkār arranges the Prophet's ﷺ remembrances by occasion, from waking and purification to travel, illness and death, with notes on their sources and rulings. It closes with a long section on guarding the tongue, which shows that dhikr includes avoiding harmful speech.","Ḥiṣn al-Muslim by Saʿīd ibn ʿAlī ibn Wahf al-Qaḥṭānī is a short modern selection from the Qurʾān and sunnah arranged in the same way. It is widely used as a pocket manual and app, and its references let you check each supplication.","Scholars distinguish dhikr tied to a time or occasion (muqayyad), such as the morning and evening adhkār or those after prayer, from general dhikr (muṭlaq) that can be done at any time. al-Nawawī states that a prescribed spoken dhikr counts only when the tongue pronounces it, at least audibly to oneself.","The etiquette of duʿāʾ includes praising Allah, sending ṣalāh on the Prophet ﷺ, asking with certainty and persistence, and not being impatient: the Prophet ﷺ said one is answered as long as he does not say, 'I prayed but was not answered' (al-Bukhārī)."],"callout":["Method","Start with a small fixed set, such as the morning and evening adhkār and the remembrances after prayer, and learn their meanings before adding more."],"lectures":[{"t":"The Book of Remembrances (Kitāb al-Adhkār)","u":"https://www.youtube.com/watch?v=u6-wwVtNrZI","by":"Hassan Ali (Turath Publishing)"},{"t":"Shield: Explanation of the Morning and Evening Athkaar","u":"https://www.youtube.com/playlist?list=PLFyO0Qx1e9fvQ9gxRhY9epOAs10NDcQ-m","by":"Abu Bakr Zoud"}],"papers":[{"t":"al-Adhkār (Arabic, ed. ʿAbd al-Qādir al-Arnaʾūṭ)","u":"https://shamela.ws/book/1956","by":"al-Nawawī"},{"t":"Ḥiṣn al-Muslim (Fortress of the Muslim)","u":"https://sunnah.com/hisn","by":"Saʿīd ibn ʿAlī ibn Wahf al-Qaḥṭānī"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Invocations (Kitāb al-Daʿawāt)","u":"https://sunnah.com/bukhari/80","by":"al-Bukhārī"}],"reads":[{"t":"Words of Remembrance for Morning and Evening (Ḥiṣn al-Muslim, English)","u":"https://hisnmuslim.com/i/en/1","by":"hisnmuslim.com"},{"t":"What to Say Before Sleeping (Ḥiṣn al-Muslim, English)","u":"https://hisnmuslim.com/i/en/0","by":"hisnmuslim.com"}],"projects":[{"n":"Personal adhkār card","l":"Beginner","d":"Make a one-page card of the morning and evening adhkār with Arabic, translation and the ḥadīth reference for each, and use it for thirty days."},{"n":"Occasion index","l":"Beginner","d":"Choose ten daily occasions (waking, leaving home, entering the mosque and so on) and record the supplication for each from Ḥiṣn al-Muslim with its source and grading."}],"repos":[{"r":"Ḥiṣn al-Muslim online","u":"https://hisnmuslim.com/","d":"Browse the supplications by occasion in Arabic and English."},{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."}]}]},{"id":"quranx","title":"Qurʾān: recitation, ḥifẓ and reflection","level":"Intermediate","intro":"Runs alongside every year: correct recitation, steady memorization, and reading a translation with reflection.","phase":1,"optional":false,"topics":[{"id":"b_tajweed","title":"Reading the Qurʾān: tajwīd basics","short":"Tajwīd basics","level":"Beginner","why":"Tajwīd is the transmitted discipline of pronouncing the Qurʾān as it was taught, and correct recitation is needed for prayer and for all later Qurʾānic study.","mins":1200,"pre":[],"ideas":["Tajwīd means giving each letter its due: its point of articulation (makhraj) and its inherent qualities (ṣifāt). Scholars call errors that alter a letter or vowel 'clear error' (laḥn jalī) and errors in finer rules 'hidden error' (laḥn khafī).","Ibn al-Jazarī's widely followed scheme places the letters in five regions: the empty space of the mouth and throat (jawf, origin of the long vowels), the throat (ḥalq), tongue, lips and nasal passage (khayshūm). Letters are also heavy (mufakhkham) or light (muraqqaq), which is why ṣ and s, or ṭ and t, are never interchangeable.","A nūn with sukūn or tanwīn follows four rules: clear pronunciation (iẓhār) before the six throat letters, merging (idghām) into the letters of 'yarmalūn', conversion to mīm (iqlāb) before bāʾ, and concealment (ikhfāʾ) before the remaining fifteen letters.","Natural lengthening (madd ṭabīʿī) lasts two counts. Secondary lengthening is caused by a following hamzah or sukūn, so its length depends on what comes after the vowel letter, up to six counts for the obligatory madd lāzim."],"callout":["Method","Tajwīd is learned orally (talaqqī). Use the texts to name what you hear, but have a qualified teacher correct your recitation of al-Fātiḥah before moving on."],"lectures":[{"t":"Learn Tajweed Easily (Beginner)","u":"https://www.youtube.com/playlist?list=PL6TlMIZ5ylgqM4Uuu7iAhIeuSdF0v9yxo","by":"Arabic 101"},{"t":"Learn Tajweed: The Easy Way (3-minute series, adults)","u":"https://www.youtube.com/playlist?list=PL62RQxDpIL7UAWIf4ZHOH5aJIt3YHc7rg","by":"Understand Al-Quran Academy"}],"papers":[{"t":"Tuḥfat al-Aṭfāl, with translation and commentary (Murshid al-Qāriʾ, Part 2)","u":"https://duai.org.za/wp-content/uploads/2023/02/Murshid-al-Qari-Part-2-Commentary-of-the-Tu%E1%B8%A5fah-al-A%E1%B9%ADfal-by-Jamzuri.pdf","by":"Sulaymān al-Jamzūrī (trans. and comm. Dār al-ʿUlūm al-ʿArabiyyah al-Islāmiyyah)"},{"t":"al-Muqaddimah al-Jazariyyah, with commentary (Murshid al-Qāriʾ, Part 3)","u":"https://duai.org.za/wp-content/uploads/2023/02/Murshid-al-Qari-Part-3-Commentary-of-the-Jazariyyah.pdf","by":"Ibn al-Jazarī (trans. and comm. Dār al-ʿUlūm al-ʿArabiyyah al-Islāmiyyah)"},{"t":"Sūrat al-Fātiḥah: text, audio and word-by-word","u":"https://quran.com/1","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Murshid al-Qāriʾ, Part 1: Simplifying the Rules of Tajwīd","u":"https://duai.org.za/wp-content/uploads/2023/02/Murshid-al-Qari-Part-1-Simplifying-the-rules-of-Tajweed.pdf","by":"Dār al-ʿUlūm al-ʿArabiyyah al-Islāmiyyah"},{"t":"Can the Qurʾān Be Recited in Different Ways? The Meaning and Wisdom of Qirāʾāt","u":"https://yaqeeninstitute.org/read/paper/can-the-quran-be-recited-in-different-ways-the-meaning-and-wisdom-of-qiraat","by":"Yousef Wahb (Yaqeen Institute)"}],"projects":[{"n":"Makhārij chart","l":"Beginner","d":"Draw a labelled diagram of the five articulation regions and place all 28 letters on it, adding one Qurʾānic example word for each letter."},{"n":"Fātiḥah recording log","l":"Beginner","d":"Record al-Fātiḥah once a week for six weeks and keep a written log of the rules you hear yourself break, with the verse and word for each correction."}],"repos":[{"r":"quran.com","u":"https://quran.com/","d":"Muṣḥaf text with word-by-word translation and audio from many reciters."}],"section":"quran"},{"id":"q_amma","title":"Tafsīr of Juzʾ ʿAmma and the sūrahs you pray","short":"Tafsīr Juzʾ ʿAmma","level":"Beginner","section":"quran","why":"The last juzʾ holds the sūrahs most Muslims recite daily in prayer, so understanding them is the quickest way to pray with presence of heart.","mins":2400,"pre":["b_tajweed"],"ideas":["Juzʾ ʿAmma contains the thirty-seven sūrahs from al-Nabaʾ (78) to al-Nās (114). Most are Makkan, and their themes are the core of the early message: tawḥīd, the Resurrection and Judgement, accountability, and the truth of the Prophet's ﷺ mission. A few, such as al-Naṣr and (on the stronger view) al-Bayyinah, are Madanī, and the classification of some others is debated.","Many of these sūrahs open with oaths (qasam), such as 'By the dawn' (89) and 'By the sun' (91). Tafsīr asks what is sworn by, what the oath answers (jawāb al-qasam), and why the two fit; this habit of reading slowly is a good first lesson in tafsīr method.","Some sūrahs have known occasions of revelation that change how they are read. ʿAbasa (80) was revealed when the Prophet ﷺ turned from the blind Companion Ibn Umm Maktūm while speaking to Quraysh leaders; al-Masad (111) concerns Abū Lahab; al-Ikhlāṣ (112) was described by the Prophet ﷺ as equal to a third of the Qurʾān (al-Bukhārī 5013). Learn these reports with their grading, since some popular stories are weak.","Three free tafsīrs suit a beginner and complement each other. Ibn Kathīr (d. 774 AH) explains verses by other verses, ḥadīth and the words of the early generations; al-Saʿdī (d. 1376 AH) is short and draws out guidance and character lessons; Tafsīr al-Jalālayn (al-Maḥallī and al-Suyūṭī) gives brief linguistic glosses, available in English on altafsir.com."],"callout":["Method","Study one sūrah at a time in the order you pray them. Read the translation, then Ibn Kathīr and al-Saʿdī on it, then listen to the matching lecture, and recite that sūrah in your next prayers with its meaning in mind."],"lectures":[{"t":"Seekers of Knowledge: Tafsīr of al-Fātiḥah and Juzʾ ʿAmma, al-Nās to al-Nabaʾ (60 lessons)","u":"https://www.youtube.com/playlist?list=PLdUDkYS6dU26E-xE2_CPWt--Gi8UvHV2o","by":"Muhammad Tim Humble (official channel)"},{"t":"Tafsīr Juzʾ ʿAmma Series, al-Nabaʾ to al-Nās (93 lessons)","u":"https://www.youtube.com/playlist?list=PLFyO0Qx1e9fumqJB9FW4hUfx7-TQV0C6n","by":"Abu Bakr Zoud (official channel)"}],"papers":[{"t":"Tafsīr Ibn Kathīr on Sūrat al-Nabaʾ and the rest of Juzʾ ʿAmma","u":"https://quran.com/78:1/tafsirs/en-tafisr-ibn-kathir","by":"Ibn Kathīr (abridged English, Quran.com)"},{"t":"Tafsīr al-Saʿdī (Taysīr al-Karīm al-Raḥmān) on Juzʾ ʿAmma (Arabic)","u":"https://quran.com/78:1/tafsirs/ar-tafseer-al-saddi","by":"ʿAbd al-Raḥmān al-Saʿdī (Quran.com)"},{"t":"Tafsīr al-Jalālayn on Sūrat al-Nabaʾ (English)","u":"https://www.altafsir.com/Tafasir.asp?tMadhNo=0&tTafsirNo=74&tSoraNo=78&tAyahNo=1&tDisplay=yes&LanguageId=2","by":"Jalāl al-Dīn al-Maḥallī and Jalāl al-Dīn al-Suyūṭī (tr. Feras Hamza), altafsir.com"}],"reads":[{"t":"Tafsīr, taʾwīl, and tadabbur","u":"https://www.akramnadwi.com/?p=4986","by":"Mohammad Akram Nadwi"},{"t":"Tafsir of Surah al-Ikhlas","u":"https://akramnadwi.com/?p=5169","by":"Mohammad Akram Nadwi"}],"projects":[{"n":"Prayer sūrah notebook","l":"Beginner","d":"For the ten sūrahs you recite most, write a one-page sheet each: main theme, key words with their roots, one point from Ibn Kathīr, one from al-Saʿdī, and any occasion of revelation with its source."},{"n":"Oaths of Juzʾ ʿAmma","l":"Intermediate","d":"Make a table of every oath that opens a sūrah in the juzʾ, listing what is sworn by, the answer to the oath, and the link a classical tafsīr gives between them."}],"repos":[{"r":"Quran.com","u":"https://quran.com","d":"Read each verse with translation, Ibn Kathīr (English) and al-Saʿdī (Arabic)."},{"r":"altafsir.com","u":"https://www.altafsir.com","d":"Read Tafsīr al-Jalālayn in English and compare classical Arabic tafsīrs."}]},{"id":"q_hifz","section":"quran","title":"Memorizing the Qurʾān (ḥifẓ) and revision","short":"Ḥifẓ & revision","level":"Beginner","why":"The Qurʾān has been transmitted above all by memory, every Muslim needs some of it for prayer, and memorizing more of it is among the most valued acts of worship, provided it is done with sound recitation and steady revision.","mins":600,"pre":["b_tajweed"],"ideas":["Allah says He has made the Qurʾān easy to remember (Q 54:17), and the Prophet ﷺ said 'the best of you are those who learn the Qurʾān and teach it' (al-Bukhārī 5027). Memorizing the whole Qurʾān is a communal obligation (farḍ kifāyah): the community must always have ḥuffāẓ. Each individual needs enough for prayer, al-Fātiḥah and some further verses, with the details of what is obligatory set out in the books of each madhhab.","Learn correct recitation before speed. Most teachers have a student memorize from one printed muṣḥaf layout (often the 15-line Madinah page) so the visual memory stays stable, and recite each new portion to a qualified teacher, since mistakes learned by heart are hard to remove.","A sound programme has three parts every day: new memorization, revision of the recent portion, and rotating revision of everything older. In South Asian schools these are called sabaq, sabqī and manzil. The Prophet ﷺ warned that the Qurʾān slips away faster than a hobbled camel unless it is kept up (al-Bukhārī 5033), so revision time usually grows to exceed new memorization.","Al-Nawawī's al-Tibyān fī Ādāb Ḥamalat al-Qurʾān sets out the manners of the one who carries the Qurʾān: sincerity, not using it for worldly status, reciting with reflection, and humility with teachers and students. Scholars differed on how blameworthy it is to forget what one memorized, and several narrations used in this discussion are weak, so the safer teaching is to keep up revision without despair."],"callout":["Method","Keep a fixed daily slot, a single muṣḥaf and a written log of new and revised pages. Recite to a teacher weekly; a short portion revised every day beats a long one revised rarely."],"lectures":[{"t":"Etiquettes with the Quran (al-Nawawī's al-Tibyān), Ramadan 2026 (32 episodes)","u":"https://www.youtube.com/playlist?list=PLMcp7trDZKJx2zSR1Mv6YBeVgnleq0uLX","by":"Shaykh Yahya Rhodus (Al-Maqasid)"}],"papers":[{"t":"al-Tibyān fī Ādāb Ḥamalat al-Qurʾān (Arabic)","u":"https://shamela.ws/book/1969","by":"al-Nawawī"},{"t":"Etiquette with the Quran (English translation of al-Tibyān)","u":"https://islamosaic.com/publications/etiquette-with-the-quran/","by":"al-Nawawī (trans. Musa Furber), Islamosaic (print/ebook)"},{"t":"Ṣaḥīḥ al-Bukhārī 5033: keep refreshing your memory of the Qurʾān","u":"https://sunnah.com/bukhari:5033","by":"al-Bukhārī (sunnah.com)"},{"t":"Ṣaḥīḥ al-Bukhārī 5027: the best of you learn the Qurʾān and teach it","u":"https://sunnah.com/bukhari:5027","by":"al-Bukhārī (sunnah.com)"}],"reads":[{"t":"Re-Evaluating Early Memorization of the Qurʾān in Medieval Muslim Cultures","u":"https://qspace.qu.edu.qa/handle/10576/27545","by":"Essam Ayyad (Religions 13/2, 2022, open access)"},{"t":"How to Become a Hafiz: Inspiration to Memorize Qur'an","u":"https://yaqeeninstitute.org/read/post/how-to-become-a-hafiz-inspiration-to-memorize-quran-blog","by":"Yaqeen Institute"}],"projects":[{"n":"Ḥifẓ log","l":"Beginner","d":"Set up a notebook table with columns for date, new lines, recent revision, old revision and teacher's corrections, and keep it for eight weeks; at the end, chart how your revision time compares with new memorization."},{"n":"Juzʾ ʿAmma plan","l":"Beginner","d":"Write a realistic plan to memorize Juzʾ ʿAmma (Q 78–114) from the end backwards, listing daily targets and a weekly revision cycle, and record each sūrah you recite to a teacher."}],"repos":[{"r":"Quran.com","u":"https://quran.com/","d":"Listen to a single reciter repeatedly while memorizing, and check meanings with a translation."},{"r":"Tanzil","u":"https://tanzil.net/","d":"Read a clean Uthmānī text and check the exact wording of each verse you are revising."}]}]},{"id":"arabicA","title":"Arabic · Levels 0–3: reading and the Madinah books","level":"Intermediate","intro":"Runs alongside every year, Level 0 to Level 8. Recognition first, then reading.","phase":2,"optional":false,"topics":[{"id":"ar_alphabet","section":"arabic","title":"Level 0: The alphabet, vowels and reading fluency","short":"Alphabet & vowels","level":"Beginner","why":"Every later level assumes you can read fully vowelled Arabic aloud accurately and without hesitation, so the script and its vowel signs are learned first and drilled until they are automatic.","mins":900,"pre":[],"ideas":["Arabic is written right to left with 28 letters that are all consonants or long-vowel carriers. Most letters join to the letters on both sides and change shape by position, but six (ا د ذ ر ز و) never join to the letter after them, which is why words break into separate pieces.","Short vowels are written as small marks: fatḥah (a) above, kasrah (i) below and ḍammah (u) above. Sukūn marks a consonant with no vowel, shaddah doubles a consonant, and tanwīn (-an, -in, -un) marks an indefinite noun. Long vowels are written with alif, wāw and yāʾ.","Several sounds have no English equivalent and change meaning: the throat letters ʿayn, ḥāʾ, khāʾ and ghayn, the emphatic letters ṣād, ḍād, ṭāʾ and ẓāʾ, and qāf. Confusing them merges different words, for example qalb (heart) and kalb (dog).","A few spelling rules recur in every text: tāʾ marbūṭah (ة) is read -ah at a pause and -at when joined; the l of al- is assimilated before the fourteen sun letters (al-shams) but pronounced before the moon letters (al-qamar); and the hamzat al-waṣl at the start of al- and some verbs drops out when the word is joined to what precedes it."],"callout":["Method","Read aloud for fifteen minutes a day from fully vowelled text, first slowly letter by letter and then at normal speed. Fluency comes from daily repetition, not from more theory."],"lectures":[{"t":"How to READ anything in Arabic: Arabic literacy (9 lessons)","u":"https://www.youtube.com/playlist?list=PL6TlMIZ5ylgpLYKU_z1YxdAAw7wrTWvcQ","by":"Arabic 101"},{"t":"In just 8 lessons, you can learn to read and write Arabic","u":"https://www.youtube.com/playlist?list=PLWl0zRDk50wKgPaMbjzzF4MhDWIi5YRRc","by":"Imran Alawiye (author of Gateway to Arabic)"},{"t":"Arabic from the Beginning (20 lessons)","u":"https://www.youtube.com/playlist?list=PLWl0zRDk50wKM4WZAZEx_gwUDFKwe2ObX","by":"Imran Alawiye"}],"papers":[{"t":"Madinah reading side book, level 1 (free PDF): a graded alphabet and reading primer","u":"http://www.lqtoronto.com/madinareading.html","by":"LQ Toronto, based on Dr. V. Abdur Rahim's course"},{"t":"Gateway to Arabic, Book 1 (print)","u":"https://www.gatewaytoarabic.com/products/gateway-to-arabic-book-1","by":"Imran Alawiye (Anglo-Arabic Graphics)"},{"t":"Sūrat al-Fātiḥah (Q 1), vowelled text with audio and word-by-word translation","u":"https://quran.com/1","by":"The Qurʾān (quran.com)"},{"t":"Sūrat al-Ikhlāṣ (Q 112), a short practice text","u":"https://quran.com/112","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Quranic Arabic Corpus: phonetic transcription of the letters and vowel signs","u":"https://corpus.quran.com/documentation/phonetic.jsp","by":"Quranic Arabic Corpus (University of Leeds), after Alan Jones, Arabic through the Qurʾān"},{"t":"A Grammar of the Arabic Language, vol. 1 (reference for later levels; the opening section on the script and vowel signs)","u":"https://archive.org/details/grammarofarabicl01caspuoft","by":"W. Wright, from the German of C. P. Caspari (3rd ed., public domain)"}],"projects":[{"n":"Letter chart","l":"Beginner","d":"Make a one-page table of all 28 letters in their isolated, initial, medial and final forms, marking the six non-connectors and the sun letters. Check it against a printed muṣḥaf."},{"n":"Reading log","l":"Beginner","d":"Record yourself reading Sūrat al-Fātiḥah and the last ten sūrahs once a week for a month. Note each error you hear and the date it disappears."}],"repos":[{"r":"Quranic Arabic Corpus: word by word","u":"https://corpus.quran.com/wordbyword.jsp","d":"Check how each Qurʾānic word is read, with transliteration and translation."},{"r":"Lexilogos Arabic keyboard","u":"https://www.lexilogos.com/keyboard/arabic.htm","d":"Type Arabic with vowel marks in the browser while you learn the keyboard."}]},{"id":"ar_m1","section":"arabic","title":"Level 1: Madinah Book 1","short":"Madinah Book 1","level":"Beginner","why":"Book 1 of Dr. V. Abdur Rahim's Durūs al-Lughah al-ʿArabiyyah, written for the Islamic University of Madinah, builds the nominal sentence and the core noun grammar that every classical text uses.","mins":3600,"pre":["ar_alphabet"],"ideas":["The course teaches grammar through Arabic examples rather than English explanation. Each lesson presents a few model sentences, then drills them, so the learner absorbs patterns such as hādhā kitābun (this is a book) before naming the rule.","The nominal sentence (jumlah ismiyyah) has a subject (mubtadaʾ)
