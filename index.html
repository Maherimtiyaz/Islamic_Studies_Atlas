 and a predicate (khabar), both normally nominative, with no verb for is. Hādhā al-kitābu (this book) is a phrase, while hādhā kitābun (this is a book) is a full sentence; the definite article decides which.","Book 1 introduces the three cases through use: nominative after nothing, genitive after a preposition (fī al-bayti) and after the first noun of an iḍāfah (kitābu Muḥammadin, Muhammad's book). The first noun of an iḍāfah never takes al- or tanwīn.","An adjective (naʿt) follows its noun and agrees with it in definiteness, case, gender and number, except that non-human plurals take a feminine singular adjective. Later lessons add pronouns, sound and broken plurals and the past-tense verb with its subject endings."],"callout":["Method","Do every exercise in writing, then check it against the free answer key the same day. Read each lesson's model sentences aloud until you can say them without the book."],"lectures":[{"t":"Madinah Book 1 Arabic Course by Abdul Adheem","u":"https://www.youtube.com/playlist?list=PL9iyXJL3iMAmd0x4CHxjyAXxGidY_DrWF","by":"Abdul Adheem (Madinah Arabic Course videos; playlist by Learn Quranic Arabic)"},{"t":"Arabic Grammar: Madina Book 1","u":"https://www.youtube.com/playlist?list=PLD12AB760427DD567","by":"LearnQuranicArabic"},{"t":"Madina Arabic Book 1 (English)","u":"https://www.youtube.com/playlist?list=PL0igoq7HFDfBqY7QT0pGfCBpSTlw3nkQD","by":"Arabic Online"}],"papers":[{"t":"Durūs al-Lughah al-ʿArabiyyah li-Ghayr al-Nāṭiqīn bihā, Book 1 (PDF)","u":"https://archive.org/details/book1_20191110","by":"Dr. V. Abdur Rahim (Islamic University of Madinah; free copy linked by LQ Toronto)"},{"t":"Madinah Books: Arabic text with English key","u":"http://www.lqtoronto.com/madinaarabic.html","by":"Dr. V. Abdur Rahim (LQ Toronto)"}],"reads":[{"t":"Madinah Books: solutions to the exercises, Books 1 to 3 (answer key)","u":"http://www.lqtoronto.com/madinasolutions.html","by":"LQ Toronto"},{"t":"Sharḥ Madeenah: lesson-by-lesson English notes","u":"http://www.lqtoronto.com/sharhmadeenah.html","by":"LQ Toronto"},{"t":"Madina Grammar Notes 1 and 2","u":"http://www.lqtoronto.com/madinagrammar.html","by":"LQ Toronto"}],"projects":[{"n":"Sentence bank","l":"Beginner","d":"For each of the 23 lessons write five new sentences that use only that lesson's grammar and vocabulary, and mark the case ending on every noun."},{"n":"Iḍāfah and adjective drill","l":"Beginner","d":"Write twenty phrases that combine an iḍāfah with an adjective, such as the big house of the teacher, and explain in one line why each adjective is definite or indefinite."}],"repos":[{"r":"LQ Toronto: Br. Asif Meherali's Madinah DVD lessons (free download)","u":"http://www.lqtoronto.com/videodl.html","d":"Full video classes on Books 1 to 3 by Asif Meherali, hosted free on archive.org."},{"r":"LQ Toronto: Madinah Books audio","u":"http://www.lqtoronto.com/audio.html","d":"Native recordings of the lesson texts for listening and shadowing."}]},{"id":"ar_m2","section":"arabic","title":"Level 2: Madinah Book 2","short":"Madinah Book 2","level":"Beginner","why":"Book 2 moves from the noun to the verb and to the particles that change case, which is the step that makes ordinary prose and short ḥadīth readable.","mins":4200,"pre":["ar_m1"],"ideas":["Inna and its sisters (anna, lākinna, laʿalla, kaʾanna, layta) enter a nominal sentence and make the subject accusative while the predicate stays nominative: inna al-dīna yusrun. The particle adds emphasis or another nuance without changing the core meaning.","Kāna and its sisters, including laysa and aṣbaḥa, do the reverse: the subject stays nominative and the predicate becomes accusative, as in kāna al-jawwu bāridan. Knowing which family a word belongs to tells you which noun to mark.","The present tense (muḍāriʿ) is built by adding prefixes (a-, ta-, ya-, na-) to the root, and its mood shows in the ending. The imperative is formed from the present by removing the prefix, and the verbal sentence has its own agreement rule: a verb before its subject stays singular.","Book 2 also introduces patterns that recur everywhere: the elative afʿal (akbar, bigger or biggest), diptotes (mamnūʿ min al-ṣarf), which take no tanwīn and use fatḥah for the genitive unless they have al- or are in iḍāfah (fī al-masājidi), and the numbers, whose gender agreement is famously reversed for three to ten."],"callout":["Pitfall","Learners often memorise the lists of sisters without practice. After each lesson, take five sentences from Book 1, insert inna or kāna, and rewrite every ending that changes."],"lectures":[{"t":"Arabic Lessons: Madinah Book 2 Series","u":"https://www.youtube.com/playlist?list=PL6yio5bdKg5QtuQ9b1GO616DMYnjxPf-j","by":"Abu Kenzah Jamal (DUS Dawah)"},{"t":"Arabic Grammar: Madina Book 2","u":"https://www.youtube.com/playlist?list=PLB1D9085A7F9E9914","by":"LearnQuranicArabic"}],"papers":[{"t":"Durūs al-Lughah al-ʿArabiyyah li-Ghayr al-Nāṭiqīn bihā, Book 2 (PDF)","u":"https://archive.org/details/book2_201911","by":"Dr. V. Abdur Rahim (Islamic University of Madinah; free copy linked by LQ Toronto)"},{"t":"Madinah Books: Arabic text with English key","u":"http://www.lqtoronto.com/madinaarabic.html","by":"Dr. V. Abdur Rahim (LQ Toronto)"}],"reads":[{"t":"Madinah side books: expressions, levels 1 and 2","u":"http://www.lqtoronto.com/madinaexpressions.html","by":"LQ Toronto"},{"t":"Madinah conversation drills (book)","u":"http://www.lqtoronto.com/convoBook.html","by":"LQ Toronto"},{"t":"Madinah Books: solutions to the exercises (answer key)","u":"http://www.lqtoronto.com/madinasolutions.html","by":"LQ Toronto"}],"projects":[{"n":"Conjugation tables","l":"Beginner","d":"Fill in a blank conjugation sheet for five sound verbs in the past, present and imperative, then check each form against the book."},{"n":"Ḥadīth parsing","l":"Intermediate","d":"Take three short ḥadīth from al-Nawawī's Forty and underline every inna, kāna, present-tense verb and diptote, labelling the case or mood it causes."}],"repos":[{"r":"LQ Toronto: blank verb conjugation sheet","u":"http://www.lqtoronto.com/BVC.html","d":"Printable grid for drilling verb paradigms by hand."},{"r":"LQ Toronto: Madinah DVD lessons (free download)","u":"http://www.lqtoronto.com/videodl.html","d":"Asif Meherali's full Book 2 classes, if you prefer one teacher across all three books."}]},{"id":"ar_vocab","title":"Level 2: Qurʾānic vocabulary","short":"Qurʾān vocab","level":"Beginner","why":"A few hundred frequent words and particles make up most of the Qurʾān's running text, so learning them early makes recitation and tafsīr far more understandable.","mins":1800,"pre":["ar_alphabet"],"ideas":["The Qurʾān has roughly 77,000 words, but many are repeats. Word-frequency lists, such as Abdulazeez Abdulraheem's '80% of Qurʾānic Words', show that a few hundred high-frequency items cover most of the text.","The most frequent items are particles and pronouns (min, fī, ʿalā, inna, alladhī, huwa) and core nouns and verbs (Allāh, rabb, qāla, kāna, āmana). These come first because they appear in almost every verse.","Most Arabic words grow from a three-letter root carrying a core meaning. Learning ʿ-l-m once helps with ʿalima (to know), ʿilm (knowledge), ʿālim (scholar) and maʿlūm (known).","Many Qurʾānic words have several senses depending on context. Classical works on al-wujūh wa al-naẓāʾir study these, which is why a word-by-word gloss is a starting point, not a final translation."],"callout":["Method","Learn words from the passages you already recite in prayer (al-Fātiḥah and the short sūrahs of Juzʾ ʿAmma), and review them with spaced repetition."],"lectures":[{"t":"Read & Understand Quranic Arabic from 0% to 50% (Stage One)","u":"https://www.youtube.com/playlist?list=PL6TlMIZ5ylgrYBl5c2LGoc1iwTPyYMMYH","by":"Arabic 101"},{"t":"100 Most Frequent Words in the Quran (series)","u":"https://www.youtube.com/playlist?list=PLgm4qYHzsKTwGtsJl7IrC-0d4YHzf0bLY","by":"ArabicFluency"}],"papers":[{"t":"Sūrat al-Nabaʾ (opening of Juzʾ ʿAmma) with word-by-word translation","u":"https://quran.com/78","by":"The Qurʾān (quran.com)"},{"t":"Quranic Arabic Corpus: Qurʾān dictionary by root","u":"https://corpus.quran.com/qurandictionary.jsp","by":"Kais Dukes et al. (University of Leeds)"}],"reads":[{"t":"Understand Qurʾān: 80% of Qurʾānic Words and related courses","u":"https://understandquran.com/","by":"Abdulazeez Abdulraheem (Understand Quran Academy)"},{"t":"Madina Books Glossary","u":"http://www.lqtoronto.com/madinaglossary.html","by":"LQ Toronto"}],"projects":[{"n":"Prayer vocabulary list","l":"Beginner","d":"List every distinct word in al-Fātiḥah and the last ten sūrahs with its root and meaning, and count how often each appears in the whole Qurʾān using the corpus dictionary."},{"n":"Root family cards","l":"Beginner","d":"Make 30 root cards, each listing the root's core meaning and three to five Qurʾānic words built from it, with one verse reference for each."}],"repos":[{"r":"quran.com","u":"https://quran.com/","d":"Muṣḥaf text with word-by-word translation and audio from many reciters."},{"r":"Quranic Arabic Corpus dictionary","u":"https://corpus.quran.com/qurandictionary.jsp","d":"Look up any root and see every Qurʾānic occurrence with frequency counts."}],"section":"arabic"},{"id":"ar_m3","section":"arabic","title":"Level 3: Madinah Book 3","short":"Madinah Book 3","level":"Intermediate","why":"Book 3 completes the Madinah course with derived verb forms, weak verbs and the accusative constructions that fill classical prose, preparing the learner for a formal grammar text.","mins":5400,"pre":["ar_m2"],"ideas":["Most Arabic verbs are built from three-letter roots placed into fixed patterns. Beyond the base form (faʿala), the derived forms such as faʿʿala, fāʿala, afʿala, tafaʿʿala, infaʿala, iftaʿala and istafʿala add meanings like causation, reciprocity, reflexivity and seeking.","Weak verbs contain wāw, yāʾ or hamzah in the root, and these letters change or disappear in conjugation: qāla, yaqūlu, qul from q-w-l. Recognising the hidden root is the key to finding such words in a dictionary.","Each verb pattern has predictable derived nouns: the active participle (fāʿil, doer), the passive participle (mafʿūl, done to) and the verbal noun (maṣdar). The passive voice changes the vowels of the verb (kutiba, it was written) and makes the object the grammatical subject.","Book 3 also covers accusatives that classical texts use constantly: the ḥāl (circumstance), the tamyīz (specification), the absolute object (mafʿūl muṭlaq), the object of purpose and the exception with illā. Spotting the reason for each accusative is the core skill of iʿrāb."],"callout":["Method","Keep a root notebook: for every new verb write its root, form number, present tense, maṣdar and participles. This turns ṣarf from memorisation into a reference you can search."],"lectures":[{"t":"Arabic Lessons: Madinah Book 3 Series","u":"https://www.youtube.com/playlist?list=PL6yio5bdKg5TlqhQONfdx5BGx2utgPR-U","by":"Abu Kenzah Jamal (DUS Dawah)"},{"t":"Arabic Grammar: Madina Book 3","u":"https://www.youtube.com/playlist?list=PLIY5DwaQvSihkImP_EOUrzGd0VrD3arPM","by":"LearnQuranicArabic"}],"papers":[{"t":"Durūs al-Lughah al-ʿArabiyyah, Book 3, part A (PDF)","u":"https://archive.org/details/book3a","by":"Dr. V. Abdur Rahim (Islamic University of Madinah; free copy linked by LQ Toronto)"},{"t":"Durūs al-Lughah al-ʿArabiyyah, Book 3, part B (PDF)","u":"https://archive.org/details/book3b_201909","by":"Dr. V. Abdur Rahim (Islamic University of Madinah; free copy linked by LQ Toronto)"}],"reads":[{"t":"Madinah Books: solutions to the exercises, including the 140-page Book 3 key","u":"http://www.lqtoronto.com/madinasolutions.html","by":"LQ Toronto"},{"t":"Madina Books handouts: Books 2 and 3","u":"https://archive.org/details/MadinaBooksHandouts","by":"LQ Toronto (archive.org)"},{"t":"A Grammar of the Arabic Language, vol. 1 (orthography, phonology and morphology)","u":"https://archive.org/details/grammarofarabicl01caspuoft","by":"W. Wright, from the German of C. P. Caspari (3rd ed., public domain)"}],"projects":[{"n":"Ten-form chart","l":"Intermediate","d":"Build a chart of forms I to X for three roots (ʿ-l-m, kh-r-j, ṣ-l-ḥ) with past, present, maṣdar and participles, and find one Qurʾānic example for each form that exists."},{"n":"Accusative hunt","l":"Intermediate","d":"Read one page of Book 3's texts and list every accusative noun, naming its function (object, ḥāl, tamyīz, mafʿūl muṭlaq, after inna and so on)."}],"repos":[{"r":"Quranic Arabic Corpus: verb forms","u":"https://corpus.quran.com/documentation/verbforms.jsp","d":"See forms I to XII with Qurʾānic examples and counts."},{"r":"LQ Toronto: Arabic talking books","u":"http://www.lqtoronto.com/talkingarabic.html","d":"Graded readers in PDF with audio for reading practice after Book 3."}]}]},{"id":"arabicB","title":"Arabic · Levels 4–7: grammar and morphology","level":"Intermediate","intro":"Runs alongside every year, Level 0 to Level 8. Recognition first, then reading.","phase":2,"optional":false,"topics":[{"id":"ar_nahw","title":"Level 4: Grammar (naḥw): al-Ājurrūmiyyah","short":"Naḥw","level":"Intermediate","why":"Naḥw explains how word endings and positions create meaning, and al-Ājurrūmiyyah is the classical first text that teachers use to introduce it.","mins":2400,"pre":["ar_alphabet"],"ideas":["Ibn Ājurrūm (d. 723/1323) of Fez opens by defining speech (kalām) as an utterance that is composed and meaningful by convention. Its parts are three: the noun (ism), the verb (fiʿl) and the particle (ḥarf), each with recognisable signs.","Iʿrāb is the change at the end of a word caused by the governing words (ʿawāmil) that enter on it. Its states are rafʿ, naṣb, khafḍ (jarr) and jazm. Nouns cannot take jazm, and verbs cannot take khafḍ.","Each state has original signs (ḍammah, fatḥah, kasrah, sukūn) and substitute signs. For example, sound masculine plurals show rafʿ with wāw (al-muslimūna) and naṣb and jarr with yāʾ (al-muslimīna).","Words are either declinable (muʿrab), whose endings change, or indeclinable (mabnī), which keep a fixed ending, such as most particles, pronouns and the past-tense verb. The text then lists the positions that take each case, such as the doer (fāʿil), subject (mubtadaʾ) and predicate (khabar) in rafʿ."],"callout":["Method","Memorise the short Arabic text section by section, and parse (iʿrāb) one verse of al-Fātiḥah or Juzʾ ʿAmma each day using the new rule."],"lectures":[{"t":"Explanation of al-Ājurrūmiyyah","u":"https://www.youtube.com/playlist?list=PL5T-Wg0y2sGpVtp03Ud5egTk3g0CUDXRv","by":"Institute of Quranic Arabic (IQA)"},{"t":"Detailed Explanation of the Ājurrūmiyyah","u":"https://www.youtube.com/playlist?list=PLXJPAz2MwdUDjLx9n4bVxREmJPV0L9hAH","by":"Yusuf Mullan"},{"t":"Dream BIG: 10-Day Live Arabic Intensive","u":"https://www.youtube.com/playlist?list=PLutdSTmJ7bAIApzbo3C9vu1eWsMh2ZyUj","by":"Nouman Ali Khan (Bayyinah)"}],"papers":[{"t":"Al Adjrumiieh: The Arabic Text with the Vowels and an English Translation (1852)","u":"https://archive.org/details/aladjrumiieh_1307_librivox","by":"Ibn Ājurrūm (trans. J. J. S. Perowne)"},{"t":"A Grammar of the Arabic Language, Vol. 2 (syntax)","u":"https://archive.org/details/grammarofarabicl02caspuoft","by":"W. Wright, after C. P. Caspari (3rd ed., Cambridge; a reference grammar to consult after the Ājurrūmiyyah, not a first textbook)"}],"reads":[{"t":"Quranic Grammar (guide to the corpus annotation)","u":"https://corpus.quran.com/documentation/grammar.jsp","by":"Quranic Arabic Corpus (University of Leeds)"},{"t":"Madina Grammar Notes 1 and 2","u":"http://www.lqtoronto.com/madinagrammar.html","by":"LQ Toronto"}],"projects":[{"n":"Iʿrāb signs chart","l":"Intermediate","d":"Make one chart of all original and substitute iʿrāb signs from al-Ājurrūmiyyah, with a Qurʾānic example for each cell."},{"n":"Parsing notebook","l":"Intermediate","d":"Fully parse al-Fātiḥah and Sūrat al-Ikhlāṣ word by word, then check each line against the Quranic Arabic Corpus syntax trees."}],"repos":[{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Word-by-word morphology, roots and syntax trees for every verse."}],"section":"arabic"},{"id":"ar_sarf","title":"Level 4: Morphology (ṣarf): verb forms & patterns","short":"Ṣarf","level":"Intermediate","why":"Ṣarf explains how roots are shaped into words by fixed patterns, which lets you recognise meaning from form and find any word in a dictionary.","mins":2000,"pre":["ar_alphabet"],"ideas":["Arabic grammarians describe patterns with the template f-ʿ-l. So kataba fits faʿala, maktūb fits mafʿūl, and kātib fits fāʿil. The pattern adds a predictable layer of meaning to the root.","Western grammars number the main verb patterns I to X. Common tendencies: II (faʿʿala) is intensive or causative, III (fāʿala) involves another party, IV (afʿala) is causative, V and VI are reflexive or reciprocal, VII (infaʿala) is passive-like, VIII (iftaʿala) is reflexive and X (istafʿala) often means seeking or considering.","Each verb pattern has a fixed set of derived nouns: the verbal noun (maṣdar), active participle, passive participle, and nouns of place and time. Knowing the pattern lets you predict these forms.","Weak roots contain wāw, yāʾ or hamzah, and doubled roots repeat a letter. These letters drop or change in conjugation, as in qāla from q-w-l, which is the main reason learners fail to find words in a root-based dictionary."],"callout":["Method","Conjugate one model verb per pattern in full tables (past, present, command, participles, maṣdar) by hand until you can produce them without looking."],"lectures":[{"t":"Intro Arabic Morphology (ʿIlm al-Ṣarf al-Ibtidāʾī)","u":"https://www.youtube.com/playlist?list=PLbCgzmbaxIJ2jiWHvjfMMDGI41XPNT7_t","by":"Quranic Linguistics & Sciences Institute"},{"t":"Arabic Verb Forms Made Easy (Quranic Grammar Lesson 11)","u":"https://www.youtube.com/watch?v=DxE4c7wW-qc","by":"Arabic 101"},{"t":"Sarf Made Simple, Lesson 6: The Patterns of Basic and Augmented Verbs","u":"https://www.youtube.com/watch?v=quxEs-rCTWY","by":"Institute of Quranic Arabic (IQA)"}],"papers":[{"t":"A Grammar of the Arabic Language, Vol. 1 (orthography and etymology/morphology)","u":"https://archive.org/details/grammarofarabicl01caspuoft","by":"W. Wright, after C. P. Caspari (3rd ed., Cambridge, 1896; a reference grammar: use its tables of verb forms alongside your teaching text)"}],"reads":[{"t":"Quranic Grammar: Verb Forms","u":"https://corpus.quran.com/documentation/verbforms.jsp","by":"Quranic Arabic Corpus (University of Leeds)"},{"t":"Madina Grammar Notes 1 and 2","u":"http://www.lqtoronto.com/madinagrammar.html","by":"LQ Toronto"}],"projects":[{"n":"Ten-form table","l":"Intermediate","d":"Build a table of Forms I to X for one sound root (such as f-ʿ-l or q-t-l) showing past, present, maṣdar and both participles, with a Qurʾānic example where one exists."},{"n":"Weak verb drill","l":"Intermediate","d":"Choose ten weak or doubled verbs from Juzʾ ʿAmma, identify each root and pattern, and verify your answers in the Quranic Arabic Corpus."}],"repos":[{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Word-by-word morphology, roots and syntax trees for every verse."}],"section":"arabic"},{"id":"ar_qatr","section":"arabic","title":"Level 5: Intermediate grammar: Mulḥat al-Iʿrāb and Qaṭr al-Nadā","short":"Mulḥah & Qaṭr","level":"Intermediate","why":"After al-Ājurrūmiyyah, these two classical texts give the full intermediate map of naḥw that commentaries and fiqh books assume, and they are the usual bridge to Ibn ʿAqīl and the Alfiyyah.","mins":6000,"pre":["ar_m3","ar_nahw"],"ideas":["Mulḥat al-Iʿrāb is a teaching poem (urjūzah) of a few hundred verses by al-Qāsim al-Ḥarīrī of Basra (d. 516/1122), author of the Maqāmāt, who also wrote a prose commentary on it. Its verses are easy to memorise and cover the chapters of naḥw a little beyond al-Ājurrūmiyyah.","Qaṭr al-Nadā wa Ball al-Ṣadā is a short prose text by Ibn Hishām al-Anṣārī (d. 761/1360) of Cairo, with his own commentary, Sharḥ Qaṭr al-Nadā. It treats built (mabnī) and declined (muʿrab) words in detail before the nominatives, accusatives, genitives and followers (tawābiʿ).","Qaṭr adds topics al-Ājurrūmiyyah leaves out: verbal nouns and participles that govern like verbs, verbs of praise and blame, the exclamation (taʿajjub), the numbers, ishtighāl and tanāzuʿ. It also states rules with Qurʾānic verses and poetry, so the student meets the shawāhid tradition.","Ibn Hishām wrote Shudhūr al-Dhahab and Awḍaḥ al-Masālik as the next steps, and Mughnī al-Labīb as an advanced reference on particles and sentence structure. Knowing his works in order lets a student move from Qaṭr straight into the Alfiyyah commentaries."],"callout":["Method","Memorise the Mulḥah or the Qaṭr text in small portions, then read Ibn Hishām's own commentary on each section and write out the iʿrāb of every example sentence before listening to the lesson."],"lectures":[{"t":"Qaṭr An-Nada (English explanation)","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpdtENtwoREkv4fA4S4yZXUf-","by":"Al-Qalam Institute"},{"t":"Naḥw 7: Mulḥat al-Iʿrāb li-l-Ḥarīrī bi-sharḥ al-Fākihī (Arabic)","u":"https://www.youtube.com/playlist?list=PLED4Dj-T43rOyZkoqiZy_vsFe6tIZIRCL","by":"ʿAlī Hānī al-ʿAqrabāwī"},{"t":"Naḥw 9: Sharḥ Ibn Hishām li-l-Qaṭr (Arabic)","u":"https://www.youtube.com/playlist?list=PLED4Dj-T43rN1ytwD0UEJFnvCrL10_9Ej","by":"ʿAlī Hānī al-ʿAqrabāwī"}],"papers":[{"t":"Mulḥat al-Iʿrāb (Arabic text)","u":"https://shamela.ws/book/7840","by":"al-Qāsim ibn ʿAlī al-Ḥarīrī (al-Maktabah al-Shāmilah)"},{"t":"Matn Qaṭr al-Nadā wa Ball al-Ṣadā (Arabic text)","u":"https://shamela.ws/book/11376","by":"Ibn Hishām al-Anṣārī (al-Maktabah al-Shāmilah)"},{"t":"Sharḥ Qaṭr al-Nadā wa Ball al-Ṣadā, ed. Muḥammad Muḥyī al-Dīn ʿAbd al-Ḥamīd (Arabic)","u":"https://shamela.ws/book/6970","by":"Ibn Hishām al-Anṣārī (al-Maktabah al-Shāmilah)"},{"t":"Drops of Dew and Wetting a Parched Throat (Qaṭr al-Nadā in English, free PDF)","u":"https://rissc.jo/wp-content/uploads/2024/09/Qatr-Al-Nada.pdf","by":"Ibn Hishām al-Anṣārī (trans. Moustafa Mounir Elqabbany), Royal Islamic Strategic Studies Centre"}],"reads":[{"t":"Ibn Hishām al-Anṣārī (708–761 AH): life, teachers and works","u":"https://www.hanbalidisciples.com/scholars/ibn-hish%C4%81m-al-an%E1%B9%A3%C4%81r%C4%AB","by":"Hanbali Disciples"},{"t":"A Grammar of the Arabic Language, vol. 2 (syntax and prosody)","u":"https://archive.org/details/grammarofarabicl02caspuoft","by":"W. Wright, from the German of C. P. Caspari (3rd ed., public domain)"}],"projects":[{"n":"Chapter map","l":"Intermediate","d":"Make a table with the chapters of al-Ājurrūmiyyah, the Mulḥah and Qaṭr side by side, marking which topics each text adds. Use it to plan your revision."},{"n":"Shāhid notebook","l":"Intermediate","d":"For each chapter of Qaṭr copy one Qurʾānic verse or line of poetry that Ibn Hishām cites, give its full iʿrāb and state in one sentence what rule it proves."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Search the matn, Ibn Hishām's sharḥ and later glosses as plain text."},{"r":"Quranic Arabic Corpus: syntactic treebank","u":"https://corpus.quran.com/treebank.jsp","d":"Check your own iʿrāb of Qurʾānic examples against a dependency analysis."}]},{"id":"ar_dict","title":"Level 6: Dictionary skills: Hans Wehr & Lane's Lexicon","short":"Dictionaries","level":"Intermediate","why":"Root-based Arabic dictionaries are the main tool for reading primary texts independently, and Lane's Lexicon gives access to the classical Arabic lexicographers in English.","mins":900,"pre":["ar_sarf"],"ideas":["Arabic dictionaries are ordered by root, not by spelling. To look up mustaqīm you remove the pattern letters to reach q-w-m, then find the Form X entry under that root.","Hans Wehr's Dictionary of Modern Written Arabic, edited by J. Milton Cowan, lists each root's verb forms with Roman numerals and then its nouns. It is compact and quick, but it describes modern written Arabic, so check classical senses before applying them to the Qurʾān.","Edward William Lane (d. 1876) compiled his Arabic-English Lexicon mainly from classical Arabic dictionaries such as Tāj al-ʿArūs, al-Qāmūs and Lisān al-ʿArab, quoting their definitions and evidence. He completed five volumes, and Stanley Lane-Poole issued the later parts (1877–1893) from his notes, so the final letters are much thinner.","For Qurʾānic words, specialised works such as al-Rāghib al-Iṣfahānī's al-Mufradāt fī Gharīb al-Qurʾān explain meanings from Qurʾānic usage. Students usually check a root in Wehr for speed, then in Lane for classical depth."],"callout":["Pitfall","Do not pick the first English gloss that seems to fit. Read the whole entry, note which sense the lexicographers attach to your context, and confirm it with a tafsīr where possible."],"lectures":[{"t":"How to Properly Use the Hans Wehr Dictionary","u":"https://www.youtube.com/watch?v=9HefvykF1Vg","by":"LearnQuranicArabic"},{"t":"Hans Wehr: Looking Up Doubled Verbs (Muḍaʿʿaf)","u":"https://www.youtube.com/watch?v=mweu4wOZuFA","by":"Grammica Institute for Classical Arabic"},{"t":"Edward Lane and His Arabic-English Lexicon","u":"https://www.youtube.com/watch?v=V8unXrfVFFs","by":"Paul Starkey (ASTENE)"}],"papers":[{"t":"An Arabic-English Lexicon, Derived from the Best and the Most Copious Eastern Sources (8 vols.)","u":"https://archive.org/details/ArabicEnglishLexicon.CopiousEasternSources.EnlargedSuppl.Kamoos.Lane.Poole.1863","by":"Edward William Lane and Stanley Lane-Poole (1863–1893)"},{"t":"The Hans Wehr Dictionary of Modern Written Arabic","u":"https://bookstore.zaytuna.edu/products/arabic-english-dictionary-the-hans-wehr-dictionary-of-modern-written-arabic","by":"Hans Wehr, ed. J. Milton Cowan (print)"}],"reads":[{"t":"Review of Hans Wehr, A Dictionary of Modern Written Arabic, 4th ed.","u":"https://www.cambridge.org/core/journals/bulletin-of-the-school-of-oriental-and-african-studies/article/hans-wehr-a-dictionary-of-modern-written-arabic-arabicenglish-fourth-edition-considerably-enlarged-and-amended-by-the-author-edited-by-j-miltoncowan-xvii-1301-pp-wiesbaden-otto-harrassowitz-1979-dm-198/7FCF61748376D3CFAAFD0CF92B43FA8D","by":"J. A. Abu-Haidar (Bulletin of SOAS)"},{"t":"Lane's Preface to the Lexicon: his sources, method and abbreviations (page images)","u":"https://tmcdaniel.palmerseminary.edu/Lane-Intro.htm","by":"E. W. Lane (1863), Lane's Lexicon Online, Palmer Theological Seminary"}],"projects":[{"n":"Root lookup log","l":"Intermediate","d":"Look up 20 words from Sūrat al-ʿAṣr and Sūrat al-Mulk in both Wehr and Lane, recording the root, form and the sense each dictionary gives."},{"n":"One-root study","l":"Advanced","d":"Write a one-page study of a single root (such as ṣ-l-ḥ or z-k-w) from Lane's entry, listing its senses with the classical evidence he quotes and its Qurʾānic uses."}],"repos":[{"r":"Arabic Almanac (Mawrid Reader)","u":"https://ejtaal.net/aa/","d":"Jump to the right page of Hans Wehr, Lane and other dictionaries by typing a root."},{"r":"Quranic Arabic Corpus dictionary","u":"https://corpus.quran.com/qurandictionary.jsp","d":"See every Qurʾānic word from a root before reading its dictionary entry."}],"section":"arabic"},{"id":"ar_quranic","section":"arabic","title":"Level 6: Qurʾānic Arabic: iʿrāb of the Qurʾān","short":"Qurʾānic iʿrāb","level":"Intermediate","why":"Iʿrāb, the analysis of each word's grammatical role and ending, is how tafsīr explains what a verse means, so learning to parse the Qurʾān joins the grammar course to the study of revelation.","mins":3600,"pre":["ar_m2","ar_nahw","ar_vocab"],"ideas":["Iʿrāb means stating for each word whether it is declined or built, its function (subject, object, ḥāl and so on) and the sign of its case or mood. Classical iʿrāb books proceed verse by verse and often give more than one possible analysis.","Case endings can decide meaning. In innamā yakhshā Allāha min ʿibādihi al-ʿulamāʾu (Q 35:28), Allāha is accusative and al-ʿulamāʾu nominative, so it is the scholars who fear God. In anna Allāha barīʾun min al-mushrikīna wa rasūluhu (Q 9:3), rasūluhu is nominative, so the Messenger too is free of them.","The main reference works differ in scope. Al-ʿUkbarī (d. 616/1219) in al-Tibyān fī Iʿrāb al-Qurʾān treats only difficult words, al-Samīn al-Ḥalabī's al-Durr al-Maṣūn is exhaustive, and Muḥyī al-Dīn al-Darwīsh's modern Iʿrāb al-Qurʾān wa Bayānuh parses every word and adds notes on rhetoric.","Some readings (qirāʾāt) differ in a case ending, and the grammarians explain each accepted reading rather than choosing one against the transmitted text. Iʿrāb therefore serves the Qurʾān as it was read; it does not correct it."],"callout":["Method","Parse a short sūrah yourself before opening any iʿrāb book, then compare. Start with Juzʾ ʿAmma, where the sentences are short and the commentaries are many."],"lectures":[{"t":"Naḥw 6: Iʿrāb Juzʾ ʿAmma maʿa laṭāʾif balāghiyyah wa ṣarfiyyah (Arabic)","u":"https://www.youtube.com/playlist?list=PLED4Dj-T43rP87tQRw1doYWVbLiSRzgjN","by":"ʿAlī Hānī al-ʿAqrabāwī"},{"t":"Learn Arabic Grammar: the easy way, Unit 1 (English)","u":"https://www.youtube.com/playlist?list=PL62RQxDpIL7VwCLawtQLdzDXg_cv0mnAB","by":"Understand Al-Qurʾān Academy (official)"},{"t":"Quranic Grammar MADE EASY","u":"https://www.youtube.com/playlist?list=PL6TlMIZ5ylgrIX1jOhl5a67QAb4AQvTIa","by":"Arabic 101"}],"papers":[{"t":"al-Tibyān fī Iʿrāb al-Qurʾān, ed. ʿAlī Muḥammad al-Bajāwī (Arabic)","u":"https://shamela.ws/book/22928","by":"Abū al-Baqāʾ al-ʿUkbarī (al-Maktabah al-Shāmilah)"},{"t":"Iʿrāb al-Qurʾān wa Bayānuh (Arabic, 10 vols.)","u":"https://shamela.ws/book/2163","by":"Muḥyī al-Dīn al-Darwīsh (al-Maktabah al-Shāmilah)"},{"t":"Selections from the Glorious Qurʾān (graded Qurʾānic reader)","u":"http://www.lqtoronto.com/sfgq.html","by":"Dr. V. Abdur Rahim (LQ Toronto)"},{"t":"Sūrat al-Ḥujurāt: a grammatical reader","u":"http://www.lqtoronto.com/hujurat.html","by":"Dr. V. Abdur Rahim (LQ Toronto)"}],"reads":[{"t":"Arabic Gems: short linguistic notes on Qurʾānic verses","u":"https://arabicgems.wordpress.com/","by":"Arabic Gems"},{"t":"Quranic Arabic Corpus: Qurʾānic grammar guide","u":"https://corpus.quran.com/documentation/grammar.jsp","by":"University of Leeds"}],"projects":[{"n":"Sūrah parsing","l":"Intermediate","d":"Write a full word-by-word iʿrāb of Sūrat al-ʿAṣr and Sūrat al-Kawthar, then compare it with al-Darwīsh and list every point where you disagreed."},{"n":"Meaning from endings","l":"Advanced","d":"Collect five verses where a case ending decides who does what (such as Q 35:28 and Q 9:3) and write a short note on each explaining the meaning that the ending fixes."}],"repos":[{"r":"Quranic Arabic Corpus: syntactic treebank","u":"https://corpus.quran.com/treebank.jsp","d":"Dependency graphs of Qurʾānic verses to check your own parsing."},{"r":"Quran.com","u":"https://quran.com/49","d":"Read the verse with several translations and tafsīr while parsing."}]},{"id":"ar_alfiyya","section":"arabic","title":"Level 7: Advanced grammar — the Alfiyyah of Ibn Mālik with Ibn ʿAqīl","short":"Alfiyyah","level":"Advanced","why":"The Alfiyyah is the standard advanced syllabus of Arabic grammar and morphology, and its commentaries give the vocabulary and reasoning used in every classical tafsīr, ḥadīth commentary and work of uṣūl.","mins":9000,"pre":["ar_qatr","ar_sarf"],"ideas":["Jamāl al-Dīn Muḥammad ibn ʿAbd Allāh Ibn Mālik al-Ṭāʾī (600–672 AH / 1203–1274 CE), born in Jaén in al-Andalus and teaching in Damascus, wrote al-Khulāṣah, known as the Alfiyyah, about a thousand lines of rajaz that abridge his longer al-Kāfiyah al-Shāfiyah. It covers syntax (naḥw) and morphology (ṣarf) in an order from the parts of speech and iʿrāb through nominal and verbal sentences, governed forms, and on to plurals, the diminutive and assimilation.","Bahāʾ al-Dīn ʿAbd Allāh Ibn ʿAqīl (698–769 AH / 1298–1367 CE), a Shāfiʿī judge in Cairo, wrote the most widely taught commentary: it explains each line briefly, supplies examples and evidence verses (shawāhid), and notes disagreements. The usual edition is by Muḥammad Muḥyī al-Dīn ʿAbd al-Ḥamīd with his notes Minḥat al-Jalīl, and al-Khuḍarī's Ḥāshiyah is the standard gloss on it.","Jamāl al-Dīn Ibn Hishām al-Anṣārī (708–761 AH / 1309–1360 CE) wrote Awḍaḥ al-Masālik ilā Alfiyyat Ibn Mālik, which recasts the Alfiyyah's content in clear prose, gives fuller evidence and states the Baṣran and Kūfan positions; Khālid al-Azharī's al-Taṣrīḥ is its main commentary. Ibn Khaldūn reported hearing in the Maghrib that a scholar had appeared in Egypt, Ibn Hishām, more learned in Arabic than Sībawayh.","Reading the Alfiyyah well means memorising the lines in sections, then using Ibn ʿAqīl for the meaning of each line and the Awḍaḥ for fuller argument. Track the technical terms (for example the nawāsikh, ishtighāl, tanāzuʿ and tamyīz) and parse every shāhid fully, noting where Ibn Mālik follows the Kūfans or his own judgement rather than the Baṣran majority."],"callout":["Method","Study one chapter at a time in three passes: the lines of the Alfiyyah, then Ibn ʿAqīl's commentary with a teacher or lecture, then the same chapter in Awḍaḥ al-Masālik. Do not start before finishing Qaṭr al-Nadā or a similar intermediate text."],"lectures":[{"t":"Sharḥ Ibn ʿAqīl ʿalā Alfiyyat Ibn Mālik (complete, 156 lessons, Arabic)","u":"https://www.youtube.com/playlist?list=PL1B4LPaEGJi6BvU97tCrwo2NUCrlT_vao","by":"Shaykh Sālim al-Qaḥṭānī (official channel)"},{"t":"Sharḥ Awḍaḥ al-Masālik ilā Alfiyyat Ibn Mālik (28 lessons, Arabic)","u":"https://www.youtube.com/playlist?list=PL8S7WK9TPug666ji8MwJC3H7IL26OMDkv","by":"Prof. Muḥammad Ḥasan ʿUthmān (al-Jāmiʿ al-Azhar)"},{"t":"Alfiyyah Ibn Malik (23 lessons, English)","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpduSul-bqG90obObbZF2-xLZ","by":"Al-Qalam Institute"}],"papers":[{"t":"Sharḥ Ibn ʿAqīl ʿalā Alfiyyat Ibn Mālik (Arabic text)","u":"https://shamela.ws/book/9904","by":"Ibn ʿAqīl (al-Maktabah al-Shāmilah)"},{"t":"Awḍaḥ al-Masālik ilā Alfiyyat Ibn Mālik (Arabic text)","u":"https://shamela.ws/book/11825","by":"Ibn Hishām al-Anṣārī (al-Maktabah al-Shāmilah)"},{"t":"Alfiyya, ou la quintessence de la grammaire arabe (Arabic text with French notes)","u":"https://archive.org/details/alfiyyaoulaquint00muamuoft","by":"Ibn Mālik (ed. A. I. Silvestre de Sacy, 1833, public domain)"},{"t":"Sharḥ Ibn ʿAqīl (Būlāq print, 1252 AH)","u":"https://archive.org/details/residefendi-908","by":"Ibn ʿAqīl"}],"reads":[{"t":"Alfiya","u":"https://en.wikipedia.org/wiki/Alfiya","by":"Wikipedia"},{"t":"Ibn Hisham al-Ansari","u":"https://en.wikipedia.org/wiki/Ibn_Hisham_al-Ansari","by":"Wikipedia"},{"t":"Sharḥ Ibn ʿAqīl ʿalā Alfiyyat Ibn Mālik (searchable text with English interface)","u":"https://usul.ai/t/sharh-ibn-aqil-ala-alfiyyat-ibn-malik/20","by":"Usul.ai"}],"projects":[{"n":"Chapter notebook","l":"Advanced","d":"For each chapter, copy the Alfiyyah lines, write Ibn ʿAqīl's explanation in your own words in Arabic or English, and fully parse two of the shawāhid; finish the chapters on kāna, inna and ẓanna first."},{"n":"Ibn ʿAqīl vs Awḍaḥ comparison","l":"Advanced","d":"Pick five topics (for example ishtighāl or tanāzuʿ) and write a half-page note on each comparing how Ibn ʿAqīl and Ibn Hishām present the rule, the evidence and any Baṣran–Kūfan disagreement."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read and search the Alfiyyah commentaries and their glosses."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com/","d":"Check your parsing of Qurʾānic shawāhid word by word."}]}]},{"id":"arabicC","title":"Arabic · Level 8: rhetoric and reading the sources","level":"Intermediate","intro":"Runs alongside every year, Level 0 to Level 8. Recognition first, then reading.","phase":2,"optional":false,"topics":[{"id":"ar_balagha","title":"Level 8: Rhetoric (balāghah)","short":"Balāghah","section":"arabic","level":"Advanced","why":"Balāghah explains why a sentence is shaped the way it is, and it is the tool that advanced tafsīr, iʿjāz studies and close legal reading rely on.","mins":2000,"pre":["ar_alfiyya","ar_nahw","ar_sarf"],"ideas":["In the definition that al-Qazwīnī (d. 739/1338) made standard in Talkhīṣ al-Miftāḥ, balāghah is speech that fits the requirements of its situation (muṭābaqat al-kalām li-muqtaḍā al-ḥāl) while being clear and correct (faṣīḥ). It is not decoration but fitness of expression to listener and context.","The later tradition divides the field into three sciences. ʿIlm al-maʿānī studies sentence structure against context (statement and request, fronting and delay, omission, restriction, joining and separating, brevity and length); ʿilm al-bayān studies ways of expressing one meaning with different clarity (simile, metaphor, metonymy); ʿilm al-badīʿ studies ornament such as antithesis and wordplay.","The line of key works runs from ʿAbd al-Qāhir al-Jurjānī (d. 471/1078), whose Dalāʾil al-Iʿjāz argued that eloquence lies in the arrangement of meanings (naẓm), through al-Sakkākī's Miftāḥ al-ʿUlūm, to al-Qazwīnī's Talkhīṣ and al-Taftāzānī's commentaries. Modern students often begin with al-Balāghah al-Wāḍiḥah by ʿAlī al-Jārim and Muṣṭafā Amīn, an Egyptian school textbook with many exercises.","Al-Qazwīnī's Talkhīṣ became the standard teaching text, read with al-Taftāzānī's two commentaries, al-Muṭawwal and the shorter Mukhtaṣar al-Maʿānī, and later ḥāshiyahs such as al-Dasūqī's. A typical path is al-Balāghah al-Wāḍiḥah, then the Talkhīṣ with the Mukhtaṣar, then al-Jurjānī's two books read for their arguments rather than as rule lists."],"callout":["Pitfall","Do not start the Talkhīṣ without a teacher or a recorded class. It is compressed on purpose, and reading it alone tends to produce memorised terms without the ability to explain a verse's wording."],"lectures":[{"t":"Arabic Rhetoric: al-Balāghah","u":"https://www.youtube.com/playlist?list=PLeCp9pA-cLK3MX9aNCfID4DLtkziT7KBv","by":"Sulayman Van Ael, Karima Foundation"},{"t":"First Steps to Understanding Balāghah","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpduDfGlrbMhAWg2lNzdd7OA1","by":"Al-Qalam Institute"}],"papers":[{"t":"Talkhīṣ al-Miftāḥ (Arabic, 1318 AH printing)","u":"https://archive.org/details/AAlexandrina-053202","by":"al-Khaṭīb al-Qazwīnī, Internet Archive"},{"t":"Mukhtaṣar al-Maʿānī (Arabic, 1277/1860 copy)","u":"https://ediscovery.qnl.qa/islandora/object/QNL:00022597","by":"Saʿd al-Dīn al-Taftāzānī, Qatar National Library"},{"t":"Dalāʾil al-Iʿjāz (Arabic)","u":"https://shamela.ws/book/22664","by":"ʿAbd al-Qāhir al-Jurjānī, al-Maktabah al-Shāmilah"},{"t":"Asrār al-Balāghah (Arabic)","u":"https://shamela.ws/book/8187","by":"ʿAbd al-Qāhir al-Jurjānī (ed. Maḥmūd Shākir), al-Maktabah al-Shāmilah"}],"reads":[{"t":"Divine Speech: Exploring the Qurʾān as Literature","u":"https://www.bayyinah.com/divine-speech","by":"Nouman Ali Khan and Sharif Randhawa, Bayyinah Institute (print)"},{"t":"The Legacy of ʿAbd al-Qāhir al-Jurjānī in the Arabic East before al-Qazwīnī's Talkhīṣ al-Miftāḥ","u":"https://doi.org/10.1163/22142371-12340036","by":"Avigail Noy, Journal of Abbasid Studies 5 (2018), Brill"}],"projects":[{"n":"Balāghah notebook on one sūrah","l":"Advanced","d":"Take a short sūrah such as al-Ḍuḥā and list every case of fronting, omission, restriction or metaphor you can find, naming the device and explaining its effect in one sentence each."},{"n":"Talkhīṣ device cards","l":"Intermediate","d":"For one chapter of the Talkhīṣ (for example qaṣr, restriction), write each definition, al-Taftāzānī's explanation from the Mukhtaṣar in English, and two Qurʾānic examples of the device with a sentence on its effect."}],"repos":[{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws","d":"Read the Talkhīṣ commentaries and search for every place a verse is discussed in balāghah works."},{"r":"Quranic Arabic Corpus","u":"https://corpus.quran.com","d":"Check the grammatical analysis of a verse before asking rhetorical questions about it."}]},{"id":"ar_listening","section":"arabic","title":"Level 8: Listening: following lectures in Arabic","short":"Arabic listening","level":"Intermediate","why":"Most classical texts are still taught orally in Arabic, so a student who can follow a sharḥ lesson gains access to teachers and recorded courses that have no English equivalent.","mins":2400,"pre":["ar_m3","ar_nahw"],"ideas":["A traditional lesson follows a fixed pattern: a student reads a line of the matn, the teacher explains its words linguistically (lughatan) and technically (iṣṭilāḥan), gives examples and the evidence, and then notes disagreements. Knowing the pattern lets you predict what comes next.","Teachers often stop on words and drop the final vowel (the pausal form), and they use set phrases such as qāla al-muṣannif raḥimahu Allāh (the author said), ay (that is) and yaʿnī (meaning). These are signposts, not content, and should be learned as fixed chunks.","Comprehension grows fastest from material whose content you already know. Listening to an Arabic explanation of al-Ājurrūmiyyah after studying it in English lets you focus on the language, because the ideas are familiar.","Many lecturers mix formal Arabic with their regional dialect, changing for example qāf to a glottal stop or g. Learn a few of these shifts for the teachers you follow rather than avoiding them, since dialect asides are common in live teaching."],"callout":["Method","Listen to one short lesson three times: first without text, then with the matn in front of you, then once more writing down every phrase you missed. Keep the transcript of key phrases in your notebook."],"lectures":[{"t":"Sharḥ al-Ājurrūmiyyah li-l-mubtadiʾīn (Arabic)","u":"https://www.youtube.com/playlist?list=PLIkVd_x0tRkWCgkwQ6RqW8IkN7coA6WW9","by":"Sulaymān al-ʿUyūnī (Durūs al-Taʾṣīl al-ʿIlmī)"},{"t":"Sharḥ al-Ājurrūmiyyah fī ʿilm al-naḥw (155 short clips, Arabic)","u":"https://www.youtube.com/playlist?list=PLXS0usquloW8B1Pn4_RlfmBwsDFe0e_W4","by":"Muḥammad ibn Ṣāliḥ al-ʿUthaymīn (official channel)"},{"t":"Intermediate Arabic Conversation and Comprehension Course","u":"https://www.youtube.com/playlist?list=PLEvKHjeZ8kaEeF2QnS3YKgYsn3OFHqL6Q","by":"Learn Modern Standard Arabic"}],"papers":[{"t":"al-Ājurrūmiyyah: Arabic text with an English translation (LibriVox audio and text)","u":"https://archive.org/details/aladjrumiieh_1307_librivox","by":"Ibn Ājurrūm al-Ṣanhājī (trans. J. J. S. Perowne, 1852; public domain)"},{"t":"al-Arbaʿūn al-Nawawiyyah: Arabic with English","u":"https://sunnah.com/nawawi40","by":"al-Nawawī (sunnah.com)"}],"reads":[{"t":"Arabic talking books (PDF with audio)","u":"http://www.lqtoronto.com/talkingarabic.html","by":"LQ Toronto"},{"t":"The Discursive Tradition of Commentaries (shurūḥ): Lessons from Matn Abī Shujāʿ","u":"https://islamiclaw.blog/2022/09/08/the-discursive-tradition-of-commentaries-shuruh%cc%a3-lessons-from-matn-abi-shuja%ca%bf/","by":"Felicitas Opwis, Islamic Law Blog (Harvard Law School Program in Islamic Law)"},{"t":"Pausal Forms","u":"https://linguistics.stonybrook.edu/faculty/robert.hoberman/files/publications/Hoberman%202007%20Pausal%20forms%20proofs%20with%20corrections_0.pdf","by":"Robert D. Hoberman, Encyclopedia of Arabic Language and Linguistics (author's proofs, Stony Brook University)"}],"projects":[{"n":"Phrase list","l":"Intermediate","d":"While following ten lessons of an Arabic sharḥ, collect fifty recurring teaching phrases with their meaning and one example sentence each."},{"n":"Lesson summary","l":"Intermediate","d":"After each Arabic lesson write a five-sentence summary in Arabic, then check it against the matn and correct the grammar."}],"repos":[{"r":"Al Jazeera Learning Arabic","u":"https://learning.aljazeera.net/","d":"Graded, fully vowelled news texts with audio from beginner to advanced."},{"r":"Madinah Book 1 audio (archive.org)","u":"https://archive.org/details/Maa_bk1-MadinaArabicAudio-Book1","d":"Audio of the Madinah lessons for extensive listening at a known level."}]},{"id":"ar_writing","section":"arabic","title":"Level 8: Writing, translation and an Arabic notebook","short":"Writing & notebook","level":"Intermediate","why":"Writing by hand, translating in both directions and keeping a well-organised notebook turn passive recognition into knowledge you can retrieve when reading a real text.","mins":2400,"pre":["ar_m1","ar_dict"],"ideas":["Printed books use the Naskh style, while most people write by hand in Ruqʿah, which is faster and drops some dots and curves. Learning Ruqʿah early makes your notes quick to write and lets you read other people's handwriting.","Hamzah spelling (imlāʾ) follows the strongest neighbouring vowel: kasrah needs a yāʾ seat, ḍammah a wāw seat, fatḥah an alif seat, as in suʾila, suʾāl and saʾala. Other common rules distinguish tāʾ marbūṭah from open tāʾ and alif maqṣūrah from yāʾ.","Translation from Arabic is checked by back-translation: translate a passage into English, put it away, translate it back into Arabic, and compare. The gaps show which structures you understood only vaguely.","A notebook works when it can be searched. Index vocabulary by root, record each new word with the sentence where you met it and its source, and move the hardest items into a spaced-repetition deck."],"callout":["Pitfall","Do not write isolated word lists with English glosses only. A word recorded inside its original sentence, with the root and the source noted, is remembered and found again far more easily."],"lectures":[{"t":"Dawrat taʿlīm khaṭṭ al-Ruqʿah (Ruqʿah handwriting course, Arabic)","u":"https://www.youtube.com/playlist?list=PL-KFdr9Gumi_ucaBcUwPkyJWeUzDJwRbB","by":"Muḥammad Abū al-Layl"},{"t":"Beginner's Guide to Arabic Writing","u":"https://www.youtube.com/playlist?list=PL1M2O2sAd6vkFk2UI45xzpAvPQon8-otW","by":"Arabic Khatawaat"},{"t":"In just 8 lessons, you can learn to read and write Arabic","u":"https://www.youtube.com/playlist?list=PLWl0zRDk50wKgPaMbjzzF4MhDWIi5YRRc","by":"Imran Alawiye"}],"papers":[{"t":"al-Arbaʿūn al-Nawawiyyah: Arabic with English (translation practice)","u":"https://sunnah.com/nawawi40","by":"al-Nawawī (sunnah.com)"}],"reads":[{"t":"Ruqʿah script","u":"https://en.wikipedia.org/wiki/Ruq%CA%BFah_script","by":"Wikipedia"},{"t":"A Grammar of the Arabic Language, vol. 1 (reference: the rules for writing hamzah and the other orthographic signs)","u":"https://archive.org/details/grammarofarabicl01caspuoft","by":"W. Wright, from the German of C. P. Caspari (3rd ed., public domain)"},{"t":"Madinah conversation drills (book)","u":"http://www.lqtoronto.com/convoBook.html","by":"LQ Toronto"}],"projects":[{"n":"Back-translation log","l":"Intermediate","d":"Translate one ḥadīth from al-Nawawī's Forty into English each week, translate it back into Arabic a week later, and record every difference with a note on its cause."},{"n":"Root notebook","l":"Beginner","d":"Set up a notebook indexed by root and enter every new word from your current Madinah book with its sentence and source; after a month move the 100 hardest words into Anki."}],"repos":[{"r":"Anki","u":"https://apps.ankiweb.net/","d":"Spaced-repetition flashcards for sentences and roots from your notebook."},{"r":"Yamli","u":"https://www.yamli.com/","d":"Type Arabic from Latin letters when you are away from an Arabic keyboard."}]},{"id":"ar_classical","title":"Level 8: Reading classical texts with translation","short":"Classical reading","section":"arabic","level":"Intermediate","why":"Reading an Arabic text slowly against a trusted translation is the bridge between knowing grammar and using the primary sources yourself.","mins":2400,"pre":["ar_nahw","ar_sarf","ar_dict"],"ideas":["Classical prose (fuṣḥā) is the language of the Qurʾān, ḥadīth and the scholarly tradition, and its grammar has changed very little in fourteen centuries. Once you can read a ḥadīth collection, you can in principle read a fiqh manual or a commentary, though each genre has its own vocabulary.","Reading with a translation is a method, not a crutch. You read the Arabic first, parse each sentence (iʿrāb), guess the meaning, and only then check the translation, noting every place where your reading and the translator's differ.","Most difficulty comes from a few features: long sentences joined by fa- and thumma, omitted subjects and pronouns whose referent you must track, technical terms (iṣṭilāḥ) that differ from their ordinary meaning, and old texts printed without vowels or punctuation.","Wright's A Grammar of the Arabic Language (third edition, revised by W. Robertson Smith and M.J. de Goeje, 1896–98) is the standard English reference grammar for classical Arabic. Thackston's Introduction to Koranic and Classical Arabic is a gentler course whose exercises come mostly from the Qurʾān and ḥadīth."],"callout":["Method","Keep a reading notebook with three columns: the Arabic sentence, your own literal translation, and the published translation. Twenty short ḥadīth done this way teach more than a hundred pages read quickly."],"lectures":[{"t":"Qiṣaṣ al-Nabiyyīn: guided reading class","u":"https://www.youtube.com/playlist?list=PLzn0qdi6JpduA_Vp7eglKKs8eDGjqYdd3","by":"Hashim Mohamed, Al-Qalam Institute"},{"t":"Arabic for Upper Intermediate (course)","u":"https://www.youtube.com/playlist?list=PL4mTEQpP9b5FsXkQXmk0aVJixe7PgIBmJ","by":"Abdulkader Tabbash, SeekersGuidance"},{"t":"Dream BIG: 10-Day Live Arabic Intensive","u":"https://www.youtube.com/playlist?list=PLutdSTmJ7bAIApzbo3C9vu1eWsMh2ZyUj","by":"Nouman Ali Khan, Bayyinah Institute (official)"}],"papers":[{"t":"al-Arbaʿūn al-Nawawiyyah (Arabic and English)","u":"https://sunnah.com/nawawi40","by":"al-Nawawī, sunnah.com"},{"t":"Riyāḍ al-Ṣāliḥīn (Arabic and English)","u":"https://sunnah.com/riyadussalihin","by":"al-Nawawī, sunnah.com"},{"t":"al-Muwaṭṭaʾ (Arabic and English)","u":"https://sunnah.com/malik","by":"Mālik ibn Anas, sunnah.com"}],"reads":[{"t":"A Grammar of the Arabic Language, vol. 1 (3rd ed., 1896)","u":"https://archive.org/details/grammarofarabicl01caspuoft","by":"W. Wright (after C.P. Caspari), rev. W. Robertson Smith and M.J. de Goeje, Internet Archive"},{"t":"A Grammar of the Arabic Language, vol. 2 (syntax and prosody)","u":"https://archive.org/details/grammarofarabic02casp","by":"W. Wright, rev. W. Robertson Smith and M.J. de Goeje, Internet Archive"},{"t":"An Introduction to Koranic and Classical Arabic","u":"https://ibexpub.com/index.php?main_page=pubs_product_book_info&products_id=95","by":"W.M. Thackston, Ibex Publishers (print)"}],"projects":[{"n":"Parallel reading log","l":"Intermediate","d":"Read ten ḥadīth of al-Nawawī's Forty in Arabic first, write your own literal translation, then compare with the sunnah.com translation and list every difference with a one-line explanation."},{"n":"Parsed paragraph","l":"Intermediate","d":"Choose one chapter heading and its first ḥadīth from Riyāḍ al-Ṣāliḥīn and write a full iʿrāb of every word, checking unknown words in Lane or Hans Wehr."}],"repos":[{"r":"ejtaal.net (Lane, Hans Wehr and other dictionaries)","u":"https://ejtaal.net/aa/","d":"Look up roots in Lane's Lexicon and Hans Wehr side by side while reading."},{"r":"Arabic Collections Online (NYU)","u":"https://dlib.nyu.edu/aco/","d":"Free scanned Arabic books in the public domain for further reading practice."}]}]},{"id":"prophet","title":"The Prophet ﷺ and the prophets","level":"Beginner","intro":"This chapter studies the earlier prophets, the life of the Prophet Muḥammad ﷺ in Makkah and Madinah, his character, family and Companions, and the sources the sīrah comes from. It runs alongside Year 1.","phase":3,"optional":false,"topics":[{"id":"pr_anbiya","title":"Stories of the prophets (Qaṣaṣ al-Anbiyāʾ)","short":"Qaṣaṣ al-Anbiyāʾ","level":"Beginner","section":"prophet","why":"The Qurʾān tells the stories of earlier prophets at length, and knowing them is necessary for understanding both the Qurʾān and the mission of the Prophet ﷺ.","mins":1800,"pre":[],"ideas":["Twenty-five prophets are named in the Qurʾān, from Ādam to Muḥammad ﷺ, but the Qurʾān says that others were sent whose stories were not told (40:78). Belief in all of them without distinction in faith is part of īmān (2:285).","Many scholars distinguish a rasūl (messenger), sent with a message or law to a people who reject it, from a nabī (prophet), who may follow an earlier law; every rasūl is a nabī but not the reverse. Five are called ulū al-ʿazm (people of resolve), drawn from 46:35 and 33:7: Nūḥ, Ibrāhīm, Mūsā, ʿĪsā and Muḥammad ﷺ.","Sunni scholars agree that prophets are protected (maʿṣūm) from lying, from error in conveying revelation and from major sins. They differ over minor slips, and passages such as Ādam's eating from the tree are read in light of this principle and the prophets' repentance.","Ibn Kathīr's Qaṣaṣ al-Anbiyāʾ is the prophets section of his history al-Bidāyah wa-l-Nihāyah, later printed as a separate book. He uses the Qurʾān and ḥadīth first, and treats Jewish and Christian reports (Isrāʾīliyyāt) in three classes: those confirmed by revelation, those it contradicts, and those on which one neither affirms nor denies."],"callout":["Method","Read each prophet's story in the Qurʾān first, gathering every passage where he appears, and only then read Ibn Kathīr. Note which details come from the Qurʾān, which from ḥadīth and which from Isrāʾīliyyāt."],"lectures":[{"t":"The Stories of the Prophets (full series)","u":"https://www.youtube.com/playlist?list=PLYZxc42QNctXcCQZyZs48hAN90YJgnOnJ","by":"Yasir Qadhi"},{"t":"The Stories of the Prophets, 1: Introduction: The Need of Sending Prophets","u":"https://www.youtube.com/watch?v=6qN0lj-JIIU","by":"Yasir Qadhi"}],"papers":[{"t":"Qaṣaṣ al-Anbiyāʾ (Arabic, ed. Muṣṭafā ʿAbd al-Wāḥid)","u":"https://shamela.ws/book/932","by":"Ibn Kathīr"},{"t":"Stories of the Prophets (English translation, borrowable)","u":"https://archive.org/details/storiesofprophet0000ibnk","by":"Ibn Kathīr (Internet Archive lending library)"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Prophets (Kitāb Aḥādīth al-Anbiyāʾ)","u":"https://sunnah.com/bukhari/60","by":"al-Bukhārī"},{"t":"Sūrat Yūsuf: the Qurʾān's longest single narrative","u":"https://quran.com/12","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"The Unique Storytelling Style of the Qurʾān","u":"https://yaqeeninstitute.org/read/paper/the-unique-storytelling-style-of-the-quran","by":"Mohammad Elshinawy (Yaqeen Institute)"},{"t":"How Do We Understand the Stories of the Prophets in the Qurʾān from an Educational Perspective?","u":"https://seekersguidance.org/answers/education/how-do-we-understand-the-stories-of-the-prophets-in-the-quran-from-an-educational-perspective/","by":"SeekersGuidance"},{"t":"What Is the Concept of Infallibility (ʿIṣmah) for Prophets?","u":"https://seekersguidance.org/answers/islamic-belief/what-is-the-concept-of-infallibility-isma-for-prophets/","by":"SeekersGuidance"}],"projects":[{"n":"Prophet concordance","l":"Beginner","d":"For five prophets, list every Qurʾānic passage that mentions them (use quran.com search), then write a one-page timeline of each story from the Qurʾān alone."},{"n":"Sources audit","l":"Intermediate","d":"Take one chapter of Ibn Kathīr (for example Mūsā and al-Khiḍr) and tag each paragraph as Qurʾān, ṣaḥīḥ ḥadīth, other report or Isrāʾīliyyāt, with a short note on how Ibn Kathīr judges each."}],"repos":[{"r":"quran.com","u":"https://quran.com/","d":"Read the Qurʾānic passages with several translations and classical tafsīr."},{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."}]},{"id":"pr_makkah","title":"Sīrah I: Makkah, from birth to the Hijrah","short":"Sīrah: Makkah","level":"Beginner","section":"prophet","why":"The Makkan years show how the message began, how belief was built under persecution, and why the Hijrah happened.","mins":2400,"pre":["b_seerah"],"ideas":["The Prophet ﷺ was born in Makkah in the Year of the Elephant (around 570 CE) into Banū Hāshim of Quraysh. His father ʿAbd Allāh died before his birth, his mother Āminah when he was about six, and his grandfather ʿAbd al-Muṭṭalib two years later, after which his uncle Abū Ṭālib raised and protected him.","Revelation began around 610 CE, when he was forty, in the cave of Ḥirāʾ with the first verses of Sūrat al-ʿAlaq (96:1–5). Khadījah, Abū Bakr, ʿAlī and Zayd ibn Ḥārithah were among the first believers, and the call was largely private for about three years before it became public.","Persecution grew as the call spread: the weak among the believers, such as Bilāl and the family of Yāsir, were tortured, and groups emigrated to Abyssinia under the Christian king (the Najāshī). Quraysh then boycotted Banū Hāshim for about three years, and soon after it ended Khadījah and Abū Ṭālib died, a period later called the Year of Sorrow.","After rejection at al-Ṭāʾif, the Isrāʾ and Miʿrāj, and two pledges at ʿAqabah with people of Yathrib, the Muslims emigrated to Madinah. The Prophet ﷺ left last with Abū Bakr, hid in the cave of Thawr, and reached Qubāʾ in 622 CE, the event from which the Hijri calendar is counted."],"callout":["Method","Keep a dated timeline as you study, and mark for each event whether it is reported in the Qurʾān, in the ṣaḥīḥ collections or only in the sīrah books. This prepares you for the source-critical work in pr_sources."],"lectures":[{"t":"Seerah of Prophet Muhammed 3: Why Study the Seerah? and Pre-Islamic Arabia","u":"https://www.youtube.com/watch?v=4F5qzMI2IKs","by":"Yasir Qadhi"},{"t":"Seerah of Prophet Muhammed 10: Zayd b. Ḥārithah and the Beginning of Revelation","u":"https://www.youtube.com/watch?v=nIpG-3Fvk4c","by":"Yasir Qadhi"},{"t":"Seerah of Prophet Muhammed 27: The Hijrah, Emigration to Madinah","u":"https://www.youtube.com/watch?v=utKZzIWZ0I4","by":"Yasir Qadhi"}],"papers":[{"t":"The Life of Muhammad: a translation of Ibn Isḥāq's Sīrat Rasūl Allāh (borrowable)","u":"https://archive.org/details/lifeofmuhammadtr0000ibnh","by":"Ibn Isḥāq, recension of Ibn Hishām (trans. A. Guillaume)"},{"t":"al-Sīrah al-Nabawiyyah (Arabic, ed. al-Saqqā et al.)","u":"https://shamela.ws/book/23833","by":"Ibn Hishām"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Merits of the Anṣār (includes the Hijrah)","u":"https://sunnah.com/bukhari/63","by":"al-Bukhārī"},{"t":"Sūrat al-ʿAlaq: the first revelation","u":"https://quran.com/96","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Muhammad: His Life Based on the Earliest Sources (borrowable)","u":"https://archive.org/details/muhammadhislifeb0000ling","by":"Martin Lings (Internet Archive lending library)"},{"t":"An Overview of the Hijrah","u":"https://www.akramnadwi.com/an-overview-of-the-hijrah-7954/","by":"Mohammad Akram Nadwi"},{"t":"A Biography of the Prophet of Islam in the Light of the Original Sources (print)","u":"https://darussalamus.com/products/a-biography-of-the-prophet-of-islam-in-the-light-of-the-original-sources-an-analytical-study-2-volumes-by-dr-mahdi-rizqullah-ahmad","by":"Mahdi Rizqullah Ahmad (trans. Syed Iqbal Zaheer)"}],"projects":[{"n":"Makkan timeline","l":"Beginner","d":"Build a table of 20 Makkan events with approximate year of prophethood, place, people involved and a source reference (Qurʾān verse, Bukhārī number or Ibn Hishām page)."},{"n":"Qurʾān and sīrah","l":"Intermediate","d":"Choose three Makkan sūrahs (for example al-Muddaththir, al-Masad and al-Ḍuḥā) and write a page on what each reveals about the circumstances of the early call."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"Internet Archive","u":"https://archive.org/","d":"Borrow the Guillaume and Lings volumes through the free lending library."}]},{"id":"pr_madinah","title":"Sīrah II: Madinah, from the Hijrah to the Farewell Pilgrimage (1–11 AH)","short":"Sīrah: Madinah","level":"Beginner","section":"prophet","why":"The Madinan decade is when the community, its laws and its institutions took shape, so it is the setting for most of fiqh and ḥadīth.","mins":3000,"pre":["pr_makkah"],"ideas":["On arrival the Prophet ﷺ built the mosque, joined Muhājirūn and Anṣār in brotherhood (muʾākhāh), and set out a written compact for the city's groups, known as the Ṣaḥīfah or Constitution of Madinah. About sixteen or seventeen months later the qiblah was changed from Jerusalem to the Kaʿbah (2:142–150).","The main campaigns give the decade its shape: Badr (Ramaḍān 2 AH), Uḥud (3 AH), the Trench (al-Khandaq, 5 AH in the common dating), the Treaty of al-Ḥudaybiyah (6 AH), Khaybar (7 AH), the conquest of Makkah (Ramaḍān 8 AH), Ḥunayn (8 AH) and Tabūk (9 AH). Sources differ on some dates, so note which authority a date comes from.","Much legislation came in stages during these years: fasting and zakāh were made obligatory around 2 AH, and the prohibition of wine was completed after Uḥud. Reading the Madinan sūrahs (al-Baqarah, Āl ʿImrān, al-Anfāl, al-Aḥzāb, al-Fatḥ) beside the events shows why many rulings were revealed.","The ninth year is called the Year of Delegations, when tribes across Arabia came to accept Islam. In 10 AH the Prophet ﷺ performed his only ḥajj, the Farewell Pilgrimage, and he died in Madinah in Rabīʿ al-Awwal 11 AH."],"callout":["Pitfall","Do not read the campaigns only as military history. For each one, ask what the Qurʾān says about it, what rulings it produced and how the Companions behaved, which is how the classical maghāzī literature was used."],"lectures":[{"t":"Seerah of Prophet Muhammed 29: Introduction to the Madani Phase","u":"https://www.youtube.com/watch?v=j41qC7kVfCc","by":"Yasir Qadhi"},{"t":"Seerah of Prophet Muhammed 36: The Battle of Badr 1","u":"https://www.youtube.com/watch?v=q7P58swk9MM","by":"Yasir Qadhi"},{"t":"Seerah of Prophet Muhammad 100: The Farewell Hajj","u":"https://www.youtube.com/watch?v=P_AePuWstbY","by":"Yasir Qadhi"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of Military Expeditions (Kitāb al-Maghāzī)","u":"https://sunnah.com/bukhari/64","by":"al-Bukhārī"},{"t":"Kitāb al-Maghāzī (Arabic, ed. A. von Kremer, Calcutta 1856, partial)","u":"https://archive.org/details/in.ernet.dli.2015.398726","by":"al-Wāqidī"},{"t":"The Life of Muhammad: al-Wāqidī's Kitāb al-Maghāzī (print)","u":"https://www.routledge.com/The-Life-of-Muhammad-Al-Waqidis-Kitab-al-Maghazi/Faizer/p/book/9780415864855","by":"al-Wāqidī (trans. Rizwi Faizer, ed.)"},{"t":"Sūrat al-Anfāl: the Qurʾān on Badr","u":"https://quran.com/8","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Madinan Society at the Time of the Prophet (borrowable)","u":"https://archive.org/details/madinansocietyat0000akra","by":"Akram Ḍiyāʾ al-ʿUmarī (Internet Archive lending library)"},{"t":"Lessons from the Battles of Badr and Uḥud","u":"https://akramnadwi.com/?p=4938","by":"Mohammad Akram Nadwi"},{"t":"The 'Constitution' of Medina: Translation, Commentary, and Meaning Today","u":"https://yaqeeninstitute.org/read/paper/the-constitution-of-medina-translation-commentary-and-meaning-today","by":"Yaqeen Institute"}],"projects":[{"n":"Campaign cards","l":"Beginner","d":"Make one card per major campaign (Badr to Tabūk) with date, numbers, outcome, related Qurʾānic passage and one ruling or lesson drawn from it by scholars."},{"n":"Revelation and events","l":"Intermediate","d":"Pick one Madinan sūrah and write a two-page table pairing groups of verses with the events they were revealed about, citing the asbāb al-nuzūl reports you used."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"quran.com","u":"https://quran.com/","d":"Read the Qurʾānic passages with several translations and classical tafsīr."}]},{"id":"pr_shamail","title":"Shamāʾil: the Prophet's ﷺ character and description","short":"Shamāʾil","level":"Beginner","section":"prophet","why":"The shamāʾil literature preserves how the Prophet ﷺ looked, lived and behaved, and it is the classical basis for knowing and loving him.","mins":1200,"pre":["b_seerah"],"ideas":["Shamāʾil (sing. shimāl, natural disposition) is a genre distinct from sīrah: it describes the Prophet ﷺ himself rather than events. Scholars divide it into his physical form (khalq) and his character (khuluq), which the Qurʾān praises as 'tremendous' (68:4).","al-Tirmidhī's (d. 279 AH) al-Shamāʾil al-Muḥammadiyyah gathers about four hundred reports in some fifty-six chapters: his appearance, hair, seal of prophethood, clothing, food, speech, laughter, worship, humility, names and death. Each report has an isnād, and their gradings vary, so commentators such as al-Bājūrī discuss weak narrations.","Qāḍī ʿIyāḍ's (d. 544 AH) al-Shifāʾ bi-Taʿrīf Ḥuqūq al-Muṣṭafā is organized in four parts: Allah's praise of the Prophet ﷺ and his qualities, the rights owed to him (belief, obedience, love, ṣalāh upon him), what may and may not be ascribed to him as a human prophet, and the ruling on one who disparages him.","Character reports carry legal and spiritual weight: many sunnahs of eating, dress, sleep and manners are taken from the shamāʾil, and the reports of his gentleness, generosity and worship were meant by the early scholars as a model to imitate, not only to admire."],"callout":["Method","Read one chapter of al-Tirmidhī at a time with a commentary or a teacher, and copy one ḥadīth per chapter into a notebook with its narrator and the practice it implies."],"lectures":[{"t":"Shamāʾil of Imam Tirmidhī: The Sublime Characteristics of the Prophet ﷺ","u":"https://www.youtube.com/playlist?list=PLTgDm4XwxaRLhfvntu9Ku0WlmSkkeKFHR","by":"Abdur-Rahman ibn Yusuf (ZamZam Academy)"},{"t":"01: Introduction, Tirmidhī's Shamāʾil Muḥammadiyya","u":"https://www.youtube.com/watch?v=EmQg0xK4HaE","by":"Irshaad Sedick (SeekersGuidance)"},{"t":"Meeting Muhammad ﷺ (Ramadan series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhHvZ02LKQVeey8H-2XBKMGb","by":"Omar Suleiman (Yaqeen Institute)"}],"papers":[{"t":"al-Shamāʾil al-Muḥammadiyyah","u":"https://sunnah.com/shamail","by":"al-Tirmidhī"},{"t":"al-Shifāʾ bi-Taʿrīf Ḥuqūq al-Muṣṭafā (Arabic, with al-Shumunnī's gloss)","u":"https://shamela.ws/book/1753","by":"Qāḍī ʿIyāḍ"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Virtues of the Prophet ﷺ (Kitāb al-Manāqib)","u":"https://sunnah.com/bukhari/61","by":"al-Bukhārī"}],"reads":[{"t":"The Character of Prophet Muhammad ﷺ","u":"https://yaqeeninstitute.org/read/paper/the-character-of-prophet-muhammad","by":"Mohammad Elshinawy (Yaqeen Institute)"},{"t":"Muhammad: His Life Based on the Earliest Sources (publisher page)","u":"https://its.org.uk/catalogue/muhammad-his-life-based-on-the-earliest-sources/","by":"Martin Lings (Islamic Texts Society)"}],"projects":[{"n":"Shamāʾil notebook","l":"Beginner","d":"Copy one ḥadīth from each chapter of al-Tirmidhī's Shamāʾil with its sunnah.com reference, and add one line on a practice you can adopt from it."},{"n":"Character study","l":"Intermediate","d":"Choose one trait (for example forbearance or humility) and write a two-page essay gathering reports from the Shamāʾil, al-Bukhārī and al-Shifāʾ, noting the grading of each report."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic originals of the classical works cited here."}]},{"id":"pr_dalail","title":"Proofs of prophethood (dalāʾil al-nubuwwah)","short":"Dalāʾil","level":"Intermediate","section":"prophet","why":"This topic explains how Muslims know that Muḥammad ﷺ is a prophet, gathering the classical evidence from the Qurʾān, miracles, prophecies and character.","mins":900,"pre":["pr_makkah"],"ideas":["Dalāʾil al-nubuwwah (signs or proofs of prophethood) is a genre that collects evidence for the Prophet's ﷺ claim. Major works include al-Bayhaqī's (d. 458 AH) Dalāʾil al-Nubuwwah and Abū Nuʿaym al-Iṣbahānī's work of the same name, both arranged largely along the sīrah.","The chief proof in the classical account is the Qurʾān itself: it challenges its hearers to produce a sūrah like it (2:23–24, 10:38, 17:88), and scholars argue that the failure of the eloquent Arabs to meet the challenge shows its divine origin.","Sensory miracles are also reported, such as water flowing from his fingers, the multiplication of food, the weeping of the palm trunk and the splitting of the moon (54:1). Ḥadīth scholars hold that several of these reach the level of tawātur in meaning, because many Companions reported them in different settings.","Kalām theologians often defined a miracle (muʿjizah) as an extraordinary event joined to a prophet's challenge. Other scholars, such as Ibn Taymiyyah in his Kitāb al-Nubuwwāt, preferred the Qurʾānic term āyāt (signs) and stressed the cumulative weight of character, message, prophecies and results alongside miracles."],"callout":["Pitfall","Do not rest the case on a single miracle report or on weak narrations. Classical scholars argued from the combined weight of many independent proofs, and they graded the individual reports."],"lectures":[{"t":"Proofs of Prophethood (series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhF2OG4GEdWPxQO72WauTwaO","by":"Mohammad Elshinawy (Yaqeen Institute)"},{"t":"Proofs of Prophethood: Yaqeen in NY","u":"https://www.youtube.com/watch?v=XDtktsk1SJ0","by":"Mohammad Elshinawy (Yaqeen Institute)"}],"papers":[{"t":"Dalāʾil al-Nubuwwah (Arabic)","u":"https://shamela.ws/book/7478","by":"al-Bayhaqī"},{"t":"Muʿjizāt al-Nabī ﷺ, from al-Bidāyah wa-l-Nihāyah (Arabic)","u":"https://shamela.ws/book/23678","by":"Ibn Kathīr"},{"t":"Ṣaḥīḥ al-Bukhārī, Book of Virtues (chapter on the signs of prophethood)","u":"https://sunnah.com/bukhari/61","by":"al-Bukhārī"},{"t":"The Qurʾānic challenge (2:23–24)","u":"https://quran.com/2/23-24","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"An Ethical and Historical Necessity: The Proofs of Prophethood Series","u":"https://yaqeeninstitute.org/read/paper/an-ethical-and-historical-necessity-the-proofs-of-prophethood-series","by":"Mohammad Elshinawy (Yaqeen Institute)"},{"t":"The Physical Miracles of Prophet Muhammad ﷺ","u":"https://yaqeeninstitute.org/read/paper/the-physical-miracles-of-prophet-muhammad","by":"Mohammad Elshinawy and Nazir Khan (Yaqeen Institute)"}],"projects":[{"n":"Map of proofs","l":"Intermediate","d":"Make a table of the classical kinds of proof (Qurʾān, sensory miracles, prophecies, character, earlier scriptures) with two sourced examples of each and a note on the strength of the reports."},{"n":"One miracle traced","l":"Intermediate","d":"Trace the report of water flowing from the Prophet's ﷺ fingers through al-Bukhārī and al-Bayhaqī, listing the Companions who narrated it and writing a paragraph on why scholars called it mass-transmitted in meaning."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic originals of the classical works cited here."}]},{"id":"pr_family","title":"The Prophet's ﷺ family: Ahl al-Bayt and the Mothers of the Believers","short":"Prophet's family","level":"Beginner","section":"prophet","why":"The Prophet's ﷺ wives and household transmitted much of his private sunnah, and the respect owed to them is part of Sunni belief.","mins":900,"pre":["pr_madinah"],"ideas":["The Qurʾān calls the Prophet's ﷺ wives 'mothers of the believers' (33:6) and forbade marrying them after him (33:53). Those usually listed are Khadījah, Sawdah, ʿĀʾishah, Ḥafṣah, Zaynab bint Khuzaymah, Umm Salamah, Zaynab bint Jaḥsh, Juwayriyah, Umm Ḥabībah, Ṣafiyyah and Maymūnah; Māriyah al-Qibṭiyyah bore him his son Ibrāhīm.","His children were al-Qāsim, Zaynab, Ruqayyah, Umm Kulthūm, Fāṭimah and ʿAbd Allāh from Khadījah, and Ibrāhīm from Māriyah. All died before him except Fāṭimah, whose sons al-Ḥasan and al-Ḥusayn are the source of the Prophet's ﷺ descendants.","Sunni scholars include the wives in Ahl al-Bayt because of the context of 33:33, and include ʿAlī, Fāṭimah, al-Ḥasan and al-Ḥusayn on the basis of the ḥadīth of the cloak (ḥadīth al-kisāʾ) in Ṣaḥīḥ Muslim. In the law of zakāh, the term covers Banū Hāshim (and, for Shāfiʿīs and in one report from Aḥmad, Banū al-Muṭṭalib), to whom zakāh may not be given.","In Ṣaḥīḥ Muslim the Prophet ﷺ said at Ghadīr Khumm: 'I remind you of Allah concerning my Ahl al-Bayt,' and the Ṭaḥāwī creed counts speaking well of the Companions, the Prophet's ﷺ wives and his descendants as a sign of freedom from hypocrisy. ʿĀʾishah and Umm Salamah were also among the most important transmitters of ḥadīth and law."],"callout":["Method","Study each Mother of the Believers as a person: her background, when and why she married the Prophet ﷺ, what she narrated and her life after him. Ibn Saʿd's volume on women is the classical starting point."],"lectures":[{"t":"Mothers of the Believers (series)","u":"https://www.youtube.com/playlist?list=PLYOnU0Yk8VGbOh28v_Cx1Lx0MgpIhM-TY","by":"Yasir Qadhi (Memphis Islamic Center)"},{"t":"Khadījah (ra): His First Love, Our First Mother","u":"https://www.youtube.com/watch?v=gRBTQKlfC78","by":"Omar Suleiman (Yaqeen Institute)"}],"papers":[{"t":"Ṣaḥīḥ Muslim, Book of the Merits of the Companions (includes Ahl al-Bayt and the wives)","u":"https://sunnah.com/muslim/44","by":"Muslim ibn al-Ḥajjāj"},{"t":"Sūrat al-Aḥzāb 33:28–34: address to the Prophet's ﷺ wives","u":"https://quran.com/33/28-34","by":"The Qurʾān (quran.com)"},{"t":"al-Ṭabaqāt al-Kubrā (Arabic, al-Khānjī edition; women in the final volume)","u":"https://shamela.ws/book/146","by":"Ibn Saʿd"}],"reads":[{"t":"Our Liege Lady Fāṭimah the Resplendent","u":"https://muwasala.org/wp-content/uploads/2017/03/The-Resplendent.pdf","by":"Muḥammad ibn ʿAbd al-Raḥmān al-Saqqāf (trans. Muhammad Jawad Bagha), Muwasala"},{"t":"Understanding Aisha's Age: An Interdisciplinary Approach","u":"https://yaqeeninstitute.org/read/paper/understanding-aishas-age-an-interdisciplinary-approach","by":"Asadullah Ali al-Andalusi and Jonathan A.C. Brown (Yaqeen Institute)"}],"projects":[{"n":"Household chart","l":"Beginner","d":"Draw a family chart of the Prophet ﷺ: parents, wives with marriage dates, children and grandchildren, with one source reference per entry."},{"n":"Narrator profile","l":"Intermediate","d":"Write a two-page profile of ʿĀʾishah or Umm Salamah as a scholar, listing five legal or ḥadīth reports she transmitted (with sunnah.com references) and what each shows about her role."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"quran.com","u":"https://quran.com/","d":"Read the Qurʾānic passages with several translations and classical tafsīr."}]},{"id":"pr_sahabah","title":"The Companions (ṣaḥābah): lives and status","short":"The Companions","level":"Beginner","section":"prophet","why":"The Companions transmitted the Qurʾān and the sunnah, so their lives, ranks and reliability underlie the whole religious tradition.","mins":1500,"pre":["pr_madinah"],"ideas":["A ṣaḥābī, in the definition Ibn Ḥajar adopts in al-Iṣābah, is one who met the Prophet ﷺ while believing in him and died as a Muslim. The definition is broad, so it includes the blind Ibn Umm Maktūm and those who met him only briefly.","The Qurʾān praises the early Muhājirūn and Anṣār and those who follow them (9:100) and distinguishes those who spent and fought before the conquest from those after it (57:10). Scholars therefore rank them: the earliest converts, the ten promised Paradise, the people of Badr and of the Pledge of Riḍwān.","Sunni scholars hold that all Companions are ʿudūl (upright in transmission), so a narration from an unnamed Companion is accepted. This is not a claim of infallibility: individual Companions erred, and the doctrine concerns their truthfulness in reporting the Prophet ﷺ.","On the civil conflicts after ʿUthmān, the Sunni position is restraint: the participants are regarded as mujtahids who sought the right, some correct and some mistaken. The main biographical dictionaries are Ibn Saʿd's Ṭabaqāt, Ibn ʿAbd al-Barr's al-Istīʿāb, Ibn al-Athīr's Usd al-Ghābah and Ibn Ḥajar's al-Iṣābah."],"callout":["Method","Study Companions in clusters (the first converts, the people of Badr, the scholars among them such as Ibn Masʿūd, Ibn ʿAbbās and Muʿādh) rather than at random, and link each to the ḥadīth or rulings they transmitted."],"lectures":[{"t":"The Firsts: The Forerunners of Islam (series)","u":"https://www.youtube.com/playlist?list=PLQ02IYL5pmhHFl7j6wPcFTZmlQvRhsejp","by":"Omar Suleiman (Yaqeen Institute)"},{"t":"Lives of the Sahaba (series)","u":"https://www.youtube.com/playlist?list=PLYOnU0Yk8VGYcnIPK6fo1Bke7k_geYCfA","by":"Yasir Qadhi (Memphis Islamic Center)"}],"papers":[{"t":"Ṣaḥīḥ al-Bukhārī, Book of the Companions of the Prophet ﷺ (Faḍāʾil al-Ṣaḥābah)","u":"https://sunnah.com/bukhari/62","by":"al-Bukhārī"},{"t":"Ṣaḥīḥ Muslim, Book of the Merits of the Companions","u":"https://sunnah.com/muslim/44","by":"Muslim ibn al-Ḥajjāj"},{"t":"al-Ṭabaqāt al-Kubrā (Arabic, al-Khānjī edition)","u":"https://shamela.ws/book/146","by":"Ibn Saʿd"},{"t":"The forerunners among the Muhājirūn and Anṣār (9:100)","u":"https://quran.com/9/100","by":"The Qurʾān (quran.com)"}],"reads":[{"t":"Who Is a Ṣaḥābī? Who Is Referred to When Allah Says 'Allah Is Pleased with Them'?","u":"https://islamqa.org/shafii/seekersguidance-shafii/168876/who-is-a-sahabi-who-is-referred-to-when-allah-says-allah-is-pleased-with-them/","by":"SeekersGuidance (via IslamQA.org)"},{"t":"Why Are All the Companions the Most Virtuous After the Prophets?","u":"https://islamqa.org/shafii/seekersguidance-shafii/168944/why-are-all-the-companions-the-most-virtuous-after-the-prophets/","by":"SeekersGuidance (via IslamQA.org)"},{"t":"Are All the Companions Upright and Just?","u":"https://seekersguidance.org/answers/islamic-belief/are-all-the-companions-upright-and-just-shaykh-irshaad-sedick/","by":"Irshaad Sedick (SeekersGuidance)"}],"projects":[{"n":"Twelve Companions","l":"Beginner","d":"Write a half-page profile of twelve Companions (including at least four women) with conversion, key events, death date and one ḥadīth each narrated, cited from sunnah.com."},{"n":"Ṭabaqāt reading","l":"Advanced","d":"Read one entry in Ibn Saʿd (Arabic) for a Companion of Badr, translate its first page, and list the sources (isnāds) Ibn Saʿd uses."}],"repos":[{"r":"sunnah.com","u":"https://sunnah.com/","d":"Read the ḥadīth collections in Arabic and English with chapter headings and gradings."},{"r":"al-Maktabah al-Shāmilah","u":"https://shamela.ws/","d":"Read the Arabic originals of the classical works cited here."}]},{"id":"pr_sources","title":"Sources of the Sīrah: Ibn Isḥāq, al-Wāqidī, Ibn Saʿd and critical method","short":"Sīrah sources","level":"Intermediate","section":"prophet","why":"Knowing how the sīrah was compiled and transmitted lets you judge reports, read the classical books well and understand modern academic debates.","mins":900,"pre":["pr_madinah"],"ideas":["The maghāzī tradition began with Madinan scholars such as ʿUrwah ibn al-Zubayr (d. 94 AH) and al-Zuhrī (d. 124 AH), followed by Mūsā ibn ʿUqbah (d. 141 AH). Ibn Isḥāq (d. c. 150 AH) wrote the most influential full biography, which survives mainly in the edited recension of Ibn Hishām (d. 218 AH) and in quotations by al-Ṭabarī and others.","al-Wāqidī (d. 207 AH) wrote Kitāb al-Maghāzī, valued for its chronology and geography of the campaigns, but ḥadīth critics judged him very weak as a narrator. His secretary Ibn Saʿd (d. 230 AH) arranged t
